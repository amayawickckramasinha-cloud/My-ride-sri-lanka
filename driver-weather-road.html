
<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<title>MY RIDE - Weather & Road</title>

<style>
*{
box-sizing:border-box;
}
body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}
main{
max-width:650px;
margin:auto;
padding:16px;
}
h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}
.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}
h2{
text-align:center;
line-height:1.7;
}
h3{
color:#FFD600;
line-height:1.7;
}
.weatherIcon{
width:90px;
height:90px;
background:#FFD600;
color:#111;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:20px auto;
}
.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}
.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.8;
}
.row span{
color:#CCC;
}
.row strong{
text-align:right;
max-width:60%;
overflow-wrap:anywhere;
}
.stats{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}
.stat{
background:#292929;
border:1px solid #555;
border-radius:12px;
padding:18px 8px;
text-align:center;
}
.stat strong{
display:block;
font-size:23px;
color:#FFD600;
margin-bottom:10px;
overflow-wrap:anywhere;
}
.stat span{
font-size:13px;
line-height:1.8;
}
.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}
.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}
.green{
color:#4ADE80!important;
}
.red{
color:#FF6464!important;
}
.yellow{
color:#FFD600!important;
}
.blue{
color:#60A5FA!important;
}
.note{
font-size:13px;
color:#BBB;
line-height:1.9;
}
.notice{
background:#302C17;
border:1px solid #FFD600;
border-radius:10px;
padding:14px;
line-height:1.9;
margin:15px 0;
}
.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:14px;
line-height:1.9;
margin:15px 0;
}
.tableWrap{
overflow-x:auto;
}
table{
width:100%;
border-collapse:collapse;
font-size:13px;
}
th,td{
border:1px solid #555;
padding:12px 7px;
text-align:center;
}
th{
background:#FFD600;
color:#111;
}
td{
background:#292929;
}
#status,
#weatherStatus,
#fareStatus,
#gpsStatus{
text-align:center;
line-height:1.8;
color:#FFD600;
overflow-wrap:anywhere;
}
button:disabled{
opacity:.5;
cursor:not-allowed;
}
footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}
[hidden]{
display:none!important;
}
</style>
</head>

</div>

</div>

<section class="panel">

<section class="panel">

<section class="panel">

<h3 data-t="roadDetails"></h3>

</div>

<div class="row">
<span data-t="roadSurface"></span>

</div>

</div>

<section class="panel">

<h3 data-t="serviceTime"></h3>

<div class="row">
<span data-t="sriLankaTime"></span>
<strong id="sriLankaTime">—</strong>
</div>

<div class="row">
<span data-t="currentPeriod"></span>
<strong id="currentPeriod"

</div>

<div class="row">
<span data-t="day"></span>
<strong id="dayHours">—</strong>
</div>

<div class="row">
<span data-t="night"></span>
<strong id="nightHours">—</strong>
</div>

</section>

<section class="panel">

<h3 data-t="applicableFares"></h3>

<div class="row">
<span data-t="baseRate"></span>
<strong id="baseRate">—</strong>
</div>

<div class="row">
<span data-t="rainCharge"></span>
<strong id="rainCharge">—</strong>
</div>

<div class="row">
<span data-t="roadCharge"></span>
<strong id="roadCharge">—</strong>

<span data-t="currentRate"></span>

</div>

<div class="row">
<span data-t="minimumFare"></span>
<strong id="minimumFare">—</strong>
</div>

<div class="row">
<span data-t="commissionRate"></span>
<strong id="commissionRate">—</strong>
</div>

<div class="row">
<span data-t="fareVersion"></span>
<strong id="fareVersion">—</strong>
</div>

<p id="fareStatus"

</section>

<section class="panel">

<h3 data-t="distanceDiscount"></h3>

<div class="tableWrap">

<table>
<thead>
<tr>
<th data-t="distance"></th>
<th data-t="day"></th>
<th data-t="night"></th>
<th data-t="discount"></th>

</thead>

<tbody id="fareTable"></tbody>

</table>

</div>

<p class="note"
data-t="discountNote"></p>

<a id="fareChartLink"
class="action secondary"
data-t="fareChart"></a>

</section>

<section class="panel">

<h3 data-t="updateDetails"></h3>

<div class="row">
<span data-t="automaticUpdate"></span>
<strong>5 min</strong>

<div class="row">
<span data-t="lastUpdate"></span>
<strong id="lastUpdate">—</strong>
</div>

<button id="refreshButton"

<section class="panel">

<a id="helpLink"

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA

</main>

// SECURITY VALIDATION

function validSession(){

return authorized
&&uid!==null
&&auth?.currentUser?.uid===uid
&&navigator.onLine;

}

function validId(value){

return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,min,max){

return typeof value==="string"
&&value.trim().length>=min
&&value.length<=max;

}

function validNumber(value,min,max){

return typeof value==="number"
&&Number.isFinite(value)
&&value>=min
&&value<=max;

}

function validTime(value){

return validNumber(
value,
1,
8640000000000000
);

}

function validMoney(value){

return validNumber(value,0,1000000)
&&Math.abs(
value*100-Math.round(value*100)
)<0.001;

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(
functions,name
)(data);

if(!validSession()
||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncServerTime(){

const currentGeneration=generation;

const start=Date.now();

const result=await serverCall(
"getDriverServerTime"
);

const end=Date.now();

if(currentGeneration!==generation)return;

if(!validTime(result?.serverTimeMs)
||end-start>10000){

throw new Error("Invalid server time");

}

serverOffset=
result.serverTimeMs-(start+end)/2;

serverSyncAt=end;

}

function serverNow(){

if(serverOffset===null
||Date.now()-serverSyncAt>120000){

return null;

}

return Date.now()+serverOffset;

}

function formatDate(ms){

if(!validTime(ms))return "—";

return new Intl.DateTimeFormat(
lang==="si"?"si-LK":
lang==="ta"?"ta-LK":"en-LK",
{
timeZone:"Asia/Colombo",
dateStyle:"medium",
timeStyle:"medium"
}
).format(new Date(ms));

}

function money(value){

if(!validMoney(value))return "—";

return "LKR "+
new Intl.NumberFormat("en-LK",{
minimumFractionDigits:2,
maximumFractionDigits:2
}).format(value);

}

function sriLankaMinutes(ms){

const date=new Date(ms+330*60000);

return date.getUTCHours()*60
+date.getUTCMinutes();

}

function formatMinutes(minutes){

const hours=Math.floor(minutes/60);

const mins=minutes%60;

return String(hours).padStart(2,"0")
+":"+
String(mins).padStart(2,"0");

}

function getPeriod(){

const now=serverNow();

if(now===null||!fareSettings)return null;

const minutes=sriLankaMinutes(now);

const start=fareSettings.dayStartMinutes;
const end=fareSettings.nightStartMinutes;

const isDay=start<end
?minutes>=start&&minutes<end
:minutes>=start||minutes<end;

return isDay?"day":"night";

}

function renderClock(){

const now=serverNow();

$("sriLankaTime").textContent=
now===null?"—":formatDate(now);

const period=getPeriod();

$("currentPeriod").textContent=
period?t[period]:"—";

}

// GPS VALIDATION

function insideServiceArea(lat,lon){

return lat>=5.85
&&lat<=9.9
&&lon>=79.5
&&lon<=82;

}

function freshLocation(location){

return location
&&validNumber(location.lat,-90,90)
&&validNumber(location.lon,-180,180)
&&validNumber(
location.accuracy,
0,
GPS_MAX_ACCURACY
)
&&validTime(location.capturedAtMs)
&&Date.now()-location.capturedAtMs
<=GPS_MAX_AGE
&&location.capturedAtMs<=Date.now()+5000
&&insideServiceArea(
location.lat,
location.lon
);

}

function parsePosition(position){

const c=position.coords;

if(!validNumber(c.latitude,-90,90)
||!validNumber(c.longitude,-180,180)){

throw new Error("gpsError");

}

if(!insideServiceArea(
c.latitude,
c.longitude
)){

throw new Error("outsideArea");

}

if(!validNumber(
c.accuracy,
0,
GPS_MAX_ACCURACY
)){

throw new Error("gpsAccuracyError");

}

const location={
lat:c.latitude,
lon:c.longitude,
accuracy:c.accuracy,
capturedAtMs:position.timestamp
};

if(!freshLocation(location)){

throw new Error("gpsError");

}

return location;

}

$("gpsConnection").textContent=

$("serverGpsUpdate").textContent=

}

// SEND GPS TO BACKEND

async function sendGps(location){

if(!validSession()
||!driver
||driver.documentsValid!==true
||!["online","busy"].includes(
driver.availability
)
||!freshLocation(location)
||gpsSending
||Date.now()-lastGpsSent
<GPS_UPDATE_INTERVAL){

return;

}

const currentGeneration=generation;

gpsSending=true;
lastGpsSent=Date.now();

try{

const result=await serverCall(
"updateDriverLocation",
location
);

if(currentGeneration!==generation)return;

if(result?.accepted!==true){

throw new Error("GPS rejected");

}

lastServerGpsAt=serverNow()||Date.now();

renderLocation();

}catch(e){

if(currentGeneration===generation){

$("gpsStatus").textContent=t.error;

}

}finally{

if(currentGeneration===generation){

gpsSending=false;

}

}

}

// GPS WATCH

function startGps(){

if(gpsWatch!==null
||!navigator.geolocation
||!validSession())return;

const currentGeneration=generation;

gpsWatch=navigator.geolocation.watchPosition(

position=>{

if(currentGeneration!==generation
||!validSession()
||!driver
||!["online","busy"].includes(
driver.availability
))return;

try{

currentLocation=parsePosition(position);

$("gpsStatus").textContent="";

renderLocation();

sendGps(currentLocation);

}catch(e){

$("gpsStatus").textContent=
t[e.message]||t.gpsError;

}

},

error=>{

if(currentGeneration!==generation)return;

$("gpsStatus").textContent=
error.code===1
?t.gpsPermission
:t.gpsError;

},

{
enableHighAccuracy:true,
maximumAge:5000,
timeout:15000
}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// MANUAL GPS REQUEST

function getLocation(){

return new Promise((resolve,reject)=>{

if(!navigator.geolocation){

reject(new Error("gpsError"));

return;

}

navigator.geolocation.getCurrentPosition(

position=>{

try{

resolve(parsePosition(position));

}catch(e){

reject(e);

}

},

error=>{

reject(
new Error(
error.code===1
?"gpsPermission":"gpsError"
)
);

},

{
enableHighAccuracy:true,
maximumAge:5000,
timeout:15000
}

);

});

}

// ADMIN FARE SETTINGS

function validFareSettings(data){

if(!data
||data.published!==true
||!validId(data.version)
||!Number.isInteger(data.dayStartMinutes)
||!Number.isInteger(data.nightStartMinutes)
||!validNumber(data.dayStartMinutes,0,1439)
||!validNumber(data.nightStartMinutes,0,1439)
||data.dayStartMinutes===data.nightStartMinutes
||!validNumber(data.commissionRate,0,100)
||!validMoney(data.rainSurchargePerKm)
||!validMoney(data.difficultRoadSurchargePerKm)
||!data.vehicles){

return false;

}

const limits=[10,25,50,100,null];

return ["bike","tuk","car","van"].every(type=>{

const vehicle=data.vehicles[type];

if(!vehicle
||!validMoney(vehicle.minimumFare)
||!Array.isArray(vehicle.bands)
||vehicle.bands.length!==5){

return false;

}

const first=vehicle.bands[0];

return vehicle.bands.every((band,index)=>{

return band
&&band.upToKm===limits[index]
&&validMoney(band.dayRate)
&&validMoney(band.nightRate)
&&validMoney(band.discountPerKm)
&&band.dayRate+band.discountPerKm
===first.dayRate
&&band.nightRate+band.discountPerKm
===first.nightRate;

});

});

}

function subscribeFareSettings(){

if(fareUnsubscribe){

fareUnsubscribe();

fareUnsubscribe=null;

}

const currentGeneration=generation;

fareUnsubscribe=onSnapshot(

doc(db,"publicSettings","fares"),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation
||!validSession())return;

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites
||!snapshot.exists()
||!validFareSettings(snapshot.data())){

fareSettings=null;

renderFares();

return;

}

fareSettings=snapshot.data();

renderFares();

},

()=>{

if(currentGeneration!==generation)return;

fareSettings=null;

renderFares();

}

);

}

// WEATHER AND ROAD VALIDATION

function validWeather(data){

return data
&&validNumber(data.temperature,-50,70)
&&validNumber(data.precipitationMm,0,1000)
&&validNumber(data.humidity,0,100)
&&validNumber(data.windSpeedKmh,0,500)
&&[
"clear","cloudy","fog",
"drizzle","rain","storm","unknown"
].includes(data.condition)
&&["rain","dry","unknown"]
.includes(data.rainStatus)
&&typeof data.verified==="boolean"
&&validText(data.source,1,150)
&&validTime(data.observedAtMs)
&&validTime(data.validUntilMs)
&&data.validUntilMs>data.observedAtMs;

}

function validRoad(data){

return data
&&["normal","difficult","unknown"]
.includes(data.condition)
&&[
"paved","concrete","gravel",
"dirt","sand","unknown"
].includes(data.surface)
&&typeof data.verified==="boolean"
&&validText(data.source,1,150)
&&validTime(data.observedAtMs)
&&validTime(data.validUntilMs)
&&data.validUntilMs>data.observedAtMs;

}

function freshWeather(){

const now=serverNow();

return now!==null
&&validWeather(weatherData)
&&weatherData.observedAtMs<=now+60000
&&now-weatherData.observedAtMs
<=WEATHER_MAX_AGE
&&now<=weatherData.validUntilMs;

}

function freshRoad(){

const now=serverNow();

return now!==null
&&validRoad(roadData)
&&roadData.observedAtMs<=now+60000
&&now-roadData.observedAtMs
<=ROAD_MAX_AGE
&&now<=roadData.validUntilMs;

}

// FARE DISPLAY

function clearFares(){

[
"baseRate",
"rainCharge",
"roadCharge",
"currentRate",
"minimumFare",
"commissionRate",
"fareVersion",
"dayHours",
"nightHours"
].forEach(id=>{

$(id).textContent="—";

});

$("fareTable").replaceChildren();

}

function renderFareTable(vehicle){

const table=$("fareTable");

table.replaceChildren();

const ranges=[
"0–10",
"10–25",
"25–50",
"50–100",
"100+"
];

vehicle.bands.forEach((band,index)=>{

const row=document.createElement("tr");

[
ranges[index],
money(band.dayRate),
money(band.nightRate),
money(band.discountPerKm)
].forEach(value=>{

const cell=document.createElement("td");

cell.textContent=value;

row.appendChild(cell);

});

table.appendChild(row);

});

}

function renderFares(){

if(!fareSettings
||!driver
||!validFareSettings(fareSettings)){

clearFares();

$("fareStatus").textContent=
t.fareUnavailable;

return;

}

const vehicle=
fareSettings.vehicles[driver.vehicleType];

if(!vehicle){

clearFares();

$("fareStatus").textContent=
t.fareUnavailable;

return;

}

$("minimumFare").textContent=
money(vehicle.minimumFare);

$("commissionRate").textContent=
fareSettings.commissionRate+"%";

$("fareVersion").textContent=
fareSettings.version;

$("dayHours").textContent=
formatMinutes(fareSettings.dayStartMinutes)
+" – "+
formatMinutes(fareSettings.nightStartMinutes);

$("nightHours").textContent=
formatMinutes(fareSettings.nightStartMinutes)
+" – "+
formatMinutes(fareSettings.dayStartMinutes);

renderFareTable(vehicle);

const period=getPeriod();

if(!period){

[
"baseRate",
"rainCharge",
"roadCharge",
"currentRate"
].forEach(id=>{

$(id).textContent="—";

});

$("fareStatus").textContent=t.stale;

return;

}

const firstBand=vehicle.bands[0];

const baseRate=period==="day"
?firstBand.dayRate
:firstBand.nightRate;

const rainVerified=
freshWeather()
&&weatherData.verified
&&weatherData.rainStatus==="rain";

const difficultVerified=
freshRoad()
&&roadData.verified
&&roadData.condition==="difficult";

const rainCharge=rainVerified
?fareSettings.rainSurchargePerKm
:0;

const roadCharge=difficultVerified
?fareSettings.difficultRoadSurchargePerKm
:0;

const totalRate=Math.round(
(baseRate+rainCharge+roadCharge)*100
)/100;

$("baseRate").textContent=money(baseRate);

$("rainCharge").textContent=
money(rainCharge);

$("roadCharge").textContent=
money(roadCharge);

$("currentRate").textContent=
money(totalRate);

const weatherKnown=
freshWeather()
&&weatherData.verified
&&weatherData.rainStatus!=="unknown";

const roadKnown=
freshRoad()
&&roadData.verified
&&roadData.condition!=="unknown";

$("fareStatus").textContent=
weatherKnown&&roadKnown
?"":t.unverified;

}

// REFRESH ENVIRONMENT

async function refreshEnvironment(
requestNewLocation=true
){

if(!validSession()
||!driver
||refreshing)return;

const currentGeneration=generation;

const requestGeneration=++refreshGeneration;

refreshing=true;

updateControls();

$("weatherStatus").textContent=t.loading;

try{

await syncServerTime();

if(currentGeneration!==generation)return;

if(requestNewLocation
||!freshLocation(currentLocation)){

const location=await getLocation();

if(currentGeneration!==generation)return;

currentLocation=location;

}

if(!freshLocation(currentLocation)){

throw new Error("gpsError");

}

const requestedLocation={
...currentLocation
};

renderLocation();

await sendGps(requestedLocation);

if(currentGeneration!==generation)return;

const result=await serverCall(
"getDriverWeatherRoad",
{
location:requestedLocation
}
);

if(currentGeneration!==generation
||requestGeneration!==refreshGeneration
||!driver)return;

if(result?.success!==true
||result.driverUid!==uid
||!validTime(result.generatedAtMs)
||!(
result.weather===null
||validWeather(result.weather)
)
||!(
result.road===null
||validRoad(result.road)
)){

throw new Error("Invalid environment data");

}

const now=serverNow();

if(now===null
||result.generatedAtMs>now+60000
||now-result.generatedAtMs>300000){

throw new Error("Expired response");

}

weatherData=result.weather;
roadData=result.road;

environmentLocation=requestedLocation;

lastRefreshAt=result.generatedAtMs;

$("lastUpdate").textContent=
formatDate(lastRefreshAt);

renderWeather();

renderRoad();

renderFares();

}catch(e){

if(currentGeneration!==generation
||requestGeneration!==refreshGeneration){

return;

}

weatherData=null;
roadData=null;
environmentLocation=null;

lastRefreshAt=null;

$("lastUpdate").textContent="—";

renderWeather();
renderRoad();
renderFares();

$("weatherStatus").textContent=
t[e.message]||t.error;

}finally{

if(currentGeneration===generation
&&requestGeneration===refreshGeneration){

refreshing=false;

updateControls();

}

}

}

$("refreshButton").onclick=()=>{

refreshEnvironment(true);

};

// LOCATION CHANGE VALIDATION

let environmentLocation=null;

function distanceBetween(a,b){

const radians=value=>value*Math.PI/180;

const dLat=radians(b.lat-a.lat);

const dLon=radians(b.lon-a.lon);

const x=
Math.sin(dLat/2)**2
+Math.cos(radians(a.lat))
*Math.cos(radians(b.lat))
*Math.sin(dLon/2)**2;

return 6371000*2*Math.asin(
Math.sqrt(Math.min(1,Math.max(0,x)))
);

}

function checkLocationChange(){

if(!environmentLocation
||!freshLocation(currentLocation)){

return;

}

const distance=distanceBetween(
environmentLocation,
currentLocation
);

if(distance>250){

roadData=null;

renderRoad();

renderFares();

}

if(distance>2000){

weatherData=null;

renderWeather();

renderFares();

}

}

// CONTROL SECURITY

function updateControls(){

const enabled=
validSession()&&driver!==null;

$("locationButton").disabled=
!enabled
||refreshing
||locationRequestActive;

$("refreshButton").disabled=
!enabled
||refreshing
||locationRequestActive;

}

// CLEAR PRIVATE DATA

function clearEnvironment(){

refreshGeneration++;

weatherData=null;
roadData=null;
fareSettings=null;

currentLocation=null;
environmentLocation=null;

lastRefreshAt=null;
lastServerGpsAt=null;

refreshing=false;
locationRequestActive=false;

renderLocation();
renderWeather();
renderRoad();
clearFares();

$("lastUpdate").textContent="—";

$("sriLankaTime").textContent="—";

$("currentPeriod").textContent="—";

$("gpsStatus").textContent="";

$("weatherStatus").textContent="";

$("fareStatus").textContent="";

}

function disconnect(){

generation++;

authorized=false;

uid=null;

driver=null;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

if(fareUnsubscribe){

fareUnsubscribe();

fareUnsubscribe=null;

}

stopGps();

gpsSending=false;
lastGpsSent=0;

serverOffset=null;
serverSyncAt=0;

checkingSession=false;

clearEnvironment();

$("driverName").textContent="—";

$("driverId").textContent="—";

$("vehicleType").textContent="—";

$("availability").textContent="—";

$("content").hidden=true;

$("accessPanel").hidden=true;

updateControls();

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// DRIVER ACCOUNT MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation
||!validSession())return;

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites){

driver=null;

stopGps();

if(fareUnsubscribe){

fareUnsubscribe();

fareUnsubscribe=null;

}

clearEnvironment();

$("content").hidden=true;

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()
||data.uid!==uid
||data.status!=="approved"
||data.activationComplete!==true
||data.documentsValid!==true
||!validText(data.fullName,1,150)
||!validId(data.driverId)
||!["bike","tuk","car","van"]
.includes(data.vehicleType)
||!["online","offline","busy"]
.includes(data.availability)){

denyAccess();

return;

}

const firstLoad=driver===null;

driver=data;

$("driverName").textContent=
data.fullName;

$("driverId").textContent=
data.driverId;

$("vehicleType").textContent=
t[data.vehicleType];

$("availability").textContent=
t[data.availability];

$("availability").className=
data.availability==="online"
?"green"
:data.availability==="busy"
?"yellow":"red";

$("content").hidden=false;

$("accessPanel").hidden=true;

if(["online","busy"].includes(
data.availability
)){

startGps();

}else{

stopGps();

}

if(firstLoad){

subscribeFareSettings();

refreshEnvironment(true);

}

renderFares();

status("");

updateControls();

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// APPROVED DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!db||!functions){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.connectionLost);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true
||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(
functions,
"verifyDriverSession"
)({});

if(currentGeneration!==generation
||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true
||account.uid!==user.uid
||account.status!=="approved"
||account.activationComplete!==true
||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// AUTOMATIC CLOCK AND DATA EXPIRY

setInterval(()=>{

if(!validSession()||!driver)return;

renderClock();

renderLocation();

checkLocationChange();

if(!refreshing){

renderWeather();
renderRoad();
renderFares();

}

},1000);

// AUTOMATIC WEATHER UPDATE

setInterval(()=>{

if(!validSession()
||!driver
||refreshing
||locationRequestActive
||document.hidden)return;

refreshEnvironment(true);

},300000);

// AUTOMATIC SESSION VERIFICATION

setInterval(async()=>{

if(!validSession()
||!driver
||checkingSession)return;

const currentGeneration=generation;

checkingSession=true;

try{

const result=await serverCall(
"verifyDriverSession"
);

if(currentGeneration!==generation)return;

if(result?.authorized!==true
||result.uid!==uid
||result.status!=="approved"
||result.activationComplete!==true
||result.documentsValid!==true){

denyAccess();

return;

}

try{

await syncServerTime();

}catch(e){

serverOffset=null;

}

if(currentGeneration!==generation)return;

renderClock();
renderWeather();
renderRoad();
renderFares();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

if(currentGeneration===generation){

checkingSession=false;

}

}

},60000);

// INTERNET CONNECTION MONITORING

window.addEventListener("offline",()=>{

disconnect();

status(t.connectionLost);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE VISIBILITY

document.addEventListener(
"visibilitychange",
()=>{

if(document.hidden
||!validSession()
||!driver
||refreshing
||locationRequestActive){

return;

}

const now=serverNow();

if(now===null
||lastRefreshAt===null
||now-lastRefreshAt>=300000){

refreshEnvironment(true);

}

}

);

// PAGE LIFECYCLE

window.addEventListener(
"pagehide",
disconnect
);

window.addEventListener(
"pageshow",
event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}
);

updateControls();

</script>

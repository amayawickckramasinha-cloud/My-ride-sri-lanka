<style>
* {

}

body {

.container {

    font-size: 36px;

}

    letter-spacing: 5px;
    margin: 8px 0 20px;
}

.service-button {
    display: flex;

    max-width: 380px;

    padding: 16px;
    margin: 7px 0;

    border-radius: 12px;
    text-decoration: none;
    text-align: left;
    font-size: 17px;
    font-weight: bold;
    touch-action: manipulation;
}

.service-button:hover {
    background: #E6C200;
}

.service-button:focus-visible,
.back-button:focus-visible {

    outline-offset: 4px;
}

.service-icon {
    font-size: 25px;
    flex-shrink: 0;
}

.service-text {
    flex: 1;
    overflow-wrap: anywhere;
}

.arrow {
    font-size: 24px;
}

.back-button {
    color: #FFD600;
    text-decoration: none;
    padding: 15px;
    margin-top: 20px;
}

footer {
    color: #AAAAAA;
    font-size: 12px;
    margin-top: 20px;
}

</style>
</head>

<script>

"use strict";

const LANGUAGE_KEY = "myride_language";

const allowedLanguages = [
    "si",
    "en",
    "ta"
];

// THREE LANGUAGE TRANSLATIONS

const translations = {

    si: {

        title: "MY RIDE - පාරිභෝගික සේවා",

        heading: "පාරිභෝගික සේවා",

        booking: "හයර් එකක් ලබා ගැනීම",

        tracking: "රියදුරු එන මාර්ගය",

        active: "දැනට ගමන් කරන හයර් එක",

        payment: "මගේ ගෙවීම්",

        feedback: "අදහස් සහ පැමිණිලි",

        language: "භාෂාව වෙනස් කිරීම",

        back: "← ආපසු"

    },

    en: {

        title: "MY RIDE - Customer Services",

        heading: "Customer Services",

        booking: "Ride Booking",

        tracking: "Track Driver",

        active: "Active Ride",

        payment: "My Payments",

        feedback: "Feedback & Complaints",

        language: "Change Language",

        back: "← Back"

    },

    ta: {

        title: "MY RIDE - வாடிக்கையாளர் சேவைகள்",

        heading: "வாடிக்கையாளர் சேவைகள்",

        booking: "பயண முன்பதிவு",

        tracking: "ஓட்டுநரைக் கண்காணித்தல்",

        active: "தற்போதைய பயணம்",

        payment: "எனது கொடுப்பனவுகள்",

        feedback: "கருத்துகள் மற்றும் புகார்கள்",

        language: "மொழியை மாற்றவும்",

        back: "← பின்செல்"

    }

};

// AUTO GET LANGUAGE

function getLanguage() {

    const params = new URLSearchParams(
        window.location.search
    );

    const urlLanguage = params.get("lang");

    if (allowedLanguages.includes(urlLanguage)) {

        return urlLanguage;

    }

    try {

        const savedLanguage =
            localStorage.getItem(LANGUAGE_KEY);

        if (
            allowedLanguages.includes(
                savedLanguage
            )
        ) {

            return savedLanguage;

        }

    } catch (error) {

        console.warn(
            "Language storage unavailable."
        );

    }

    return null;

}

// AUTO SAVE LANGUAGE

function saveLanguage(language) {

    try {

        localStorage.setItem(
            LANGUAGE_KEY,
            language
        );

    } catch (error) {

        console.warn(
            "Language passed through URL."
        );

    }

}

// AUTO TRANSLATE CONTENT

function applyLanguage(language) {

    const text = translations[language];

    document.documentElement.lang = language;

    document.title = text.title;

    const fields = {

        heading: text.heading,

        bookingText: text.booking,

        trackingText: text.tracking,

        activeText: text.active,

        paymentText: text.payment,

        feedbackText: text.feedback,

        languageText: text.language,

        backButton: text.back

    };

    Object.entries(fields).forEach(
        function(entry) {

            document.getElementById(
                entry[0]
            ).textContent = entry[1];

        }
    );

}

// AUTO CONNECT SERVICE PAGES

function connectPage(
    buttonId,
    fileName,
    language
) {

    const nextPage = new URL(
        fileName,
        window.location.href
    );

    nextPage.searchParams.set(
        "lang",
        language
    );

    document.getElementById(
        buttonId
    ).href = nextPage.href;

}

// INITIALIZE CUSTOMER DASHBOARD

function initializeCustomer() {

    const language = getLanguage();

    if (!language) {

        window.location.replace(
            "./language.html"
        );

        return;

    }

    saveLanguage(language);

    applyLanguage(language);

    const pages = {

        bookingButton: "./booking.html",

        trackingButton: "./tracking.html",

        activeButton: "./active-ride.html",

        paymentButton: "./payments.html",

        feedbackButton: "./feedback.html",

        languageButton: "./language.html",

        backButton: "./menu.html"

    };

    Object.entries(pages).forEach(
        function(entry) {

            connectPage(
                entry[0],
                entry[1],
                language
            );

        }
    );

}

initializeCustomer();

window.addEventListener(
    "pageshow",
    initializeCustomer
);

</script>

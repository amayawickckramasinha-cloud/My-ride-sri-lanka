<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="robots"
content="noindex,nofollow,noarchive">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Payment Management</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:90px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:20px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.bad{
color:#FF7777;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
line-height:1.8;
text-align:center;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Payment Management
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>
<button data-lang="en">English</button>
<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"
class="message"
role="status"
aria-live="polite">
Checking security...
</p>

<section id="accessPanel"
class="panel" hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="overview" class="grid"></div>

<p id="lastUpdate" class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="income"></h3>

<div id="incomeSummary"
class="grid"></div>

<p class="note"
data-t="incomeNotice"></p>

</section>

<section class="panel">

<h3 data-t="payments"></h3>

<label for="search"
data-t="search"></label>

<input id="search"
type="search"
maxlength="100"
autocomplete="off">

<label for="paymentStatus"
data-t="paymentStatus"></label>

<select id="paymentStatus">

<option value="all"
data-t="all"></option>

<option value="paid"
data-t="paid"></option>

<option value="unpaid"
data-t="unpaid"></option>

<option value="pending"
data-t="pending"></option>

<option value="partial"
data-t="partial"></option>

<option value="rejected"
data-t="rejected"></option>

</select>

<label for="paymentMethod"
data-t="method"></label>

<select id="paymentMethod">

<option value="all"
data-t="all"></option>

<option value="cash"
data-t="cash"></option>

<option value="bank"
data-t="bank"></option>

</select>

<label for="fromDate"
data-t="fromDate"></label>

<input id="fromDate" type="date">

<label for="toDate"
data-t="toDate"></label>

<input id="toDate" type="date">

<button id="searchButton"
data-t="searchButton"></button>

<p id="listResult"
class="message"
role="status"></p>

<div id="paymentList"></div>

<button id="morePayments"
data-t="more"
hidden></button>

</section>

<section id="detailsPanel"
class="panel"
hidden>

<h3 data-t="details"></h3>

<div id="paymentDetails"></div>

<h4 data-t="transactions"></h4>

<div id="transactionList"></div>

<button id="moreTransactions"
data-t="more"
hidden></button>

<button id="closeDetails"
class="back"
data-t="close"></button>

</section>

<section id="reviewPanel"
class="panel"
hidden>

<h3 data-t="review"></h3>

<div id="reviewDetails"></div>

<p class="warning"
data-t="reviewNotice"></p>

<label for="decision"
data-t="decision"></label>

<select id="decision">

<option value=""
data-t="choose"></option>

<option value="approved"
data-t="approved"></option>

<option value="rejected"
data-t="rejected"></option>

</select>

<label for="verifiedReference"
data-t="verifiedReference"></label>

<input id="verifiedReference"
maxlength="150"
autocomplete="off">

<label for="reviewReason"
data-t="reason"></label>

<textarea id="reviewReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="reviewConsent"
type="checkbox">

<span data-t="confirmReview"></span>

</label>

<button id="submitReview"
data-t="confirm"
disabled></button>

<button id="closeReview"
class="back"
data-t="close"></button>

<p id="reviewResult"
class="message"
role="status"></p>

</section>

<section class="panel">

<h3 data-t="bankSettings"></h3>

<div id="currentBank"
class="record"></div>

<label for="bankName"
data-t="bankName"></label>

<input id="bankName"
maxlength="100"
autocomplete="off">

<label for="accountName"
data-t="accountName"></label>

<input id="accountName"
maxlength="150"
autocomplete="off">

<label for="accountNumber"
data-t="accountNumber"></label>

<input id="accountNumber"
inputmode="numeric"
maxlength="30"
autocomplete="off">

<label for="branch"
data-t="branch"></label>

<input id="branch"
maxlength="100"
autocomplete="off">

<label class="checkRow">

<input id="cashEnabled"
type="checkbox">

<span data-t="cashEnabled"></span>

</label>

<label class="checkRow">

<input id="bankEnabled"
type="checkbox">

<span data-t="bankEnabled"></span>

</label>

<p class="note"
data-t="bankNotice"></p>

<label for="settingsReason"
data-t="reason"></label>

<textarea id="settingsReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="settingsConsent"
type="checkbox">

<span data-t="confirmSettings"></span>

</label>

<button id="saveSettings"
data-t="save"
disabled></button>

<p id="settingsResult"
class="message"
role="status"></p>

</section>

<section class="panel">

<h3 data-t="history"></h3>

<button id="loadHistory"
data-t="loadHistory"></button>

<div id="historyList"></div>

<button id="moreHistory"
data-t="more"
hidden></button>

</section>

<a id="commissionLink"
class="action"
data-t="commissionPage"></a>

<p id="result"
class="message"
role="status"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

&&auth?.currentUser?.uid===ownerUid
&&navigator.onLine;

function validOwner(data,uid){

return data?.authorized===true
&&data.uid===uid
&&data.role==="owner"
&&data.ownerUidVerified===true
&&data.sessionValid===true;

}

function validId(value){

return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,max=500){

return typeof value==="string"
&&value.length<=max;

}

function validCount(value){

return Number.isSafeInteger(value)
&&value>=0;

}

function validAmount(value){

return Number.isSafeInteger(value)
&&value>=0
&&value<=1000000000000;

}

function validTime(value){

return Number.isFinite(value)
&&value>0
&&value<=8640000000000000;

}

function validCursor(value){

return value===null
||validText(value,4000);

}

function validDate(value){

if(!/^\d{4}-\d{2}-\d{2}$/.test(value)){

return false;

}

const date=new Date(value+"T00:00:00Z");

return Number.isFinite(date.getTime())
&&date.toISOString().slice(0,10)===value;

}

if(!validAmount(cents))return "—";

return new Intl.NumberFormat("en-LK",{

}

}

).format(new Date(value));

async function serverCall(name,data={}){

if(!isOwner()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,
name,
{timeout:30000}

)(data);

if(currentGeneration!==generation
||!isOwner()){

throw new Error("Session changed");

}

return response.data;

}

function requireSuccess(response){

if(response?.success!==true
||response.ownerUid!==ownerUid){

throw new Error("Invalid server response");

}

return response;

}

function validOverview(data){

return data

&&[

"totalFareCents",
"totalPaidCents",
"totalUnpaidCents",
"cashPaidCents",
"bankPaidCents",
"todayPaidCents",
"weekPaidCents",
"monthPaidCents"

].every(key=>validAmount(data[key]))

&&data.totalFareCents===

data.totalPaidCents+data.totalUnpaidCents

&&data.totalPaidCents===

data.cashPaidCents+data.bankPaidCents

&&validCount(data.pendingCount);

}

function validSettings(data){

return data

&&validCount(data.version)

&&validText(data.bankName,100)

&&validText(data.accountName,150)

&&validText(data.accountNumber,30)

&&validText(data.branch,100)

&&typeof data.cashEnabled==="boolean"

&&typeof data.bankEnabled==="boolean"

&&(data.cashEnabled||data.bankEnabled)

&&(!data.bankEnabled||

(

data.bankName.trim().length>=2

&&data.accountName.trim().length>=2

&&/^\d{5,30}$/.test(data.accountNumber)

&&data.branch.trim().length>=2

)

);

}

if(currentGeneration===generation){

message(resultId,"");

}

}catch(e){

if(currentGeneration===generation){

message(resultId,"error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

}

addLine(container,"driverId",record.driverId||"—");

addLine(container,"finalFare",

money(record.finalFareCents));

addLine(container,"paidAmount",

money(record.paidAmountCents));

addLine(container,"balance",

money(record.balanceCents));

addLine(container,"method",methodName(record.method));

addLine(container,"paymentStatus",t(record.status));

addLine(container,"updated",

formatDate(record.updatedAtMs));

}

function renderPayments(){

const container=$("paymentList");

container.replaceChildren();

$("morePayments").hidden=paymentCursor===null;

if(!isOwner()||!paymentQuery)return;

if(!payments.length){

container.textContent=t("noRecords");

return;

}

payments.forEach(record=>{

const panel=recordBox();

paymentLines(panel,record);

panel.appendChild(

createButton(

"viewDetails",

()=>openPayment(record.bookingId)

)

);

container.appendChild(panel);

});

}

async function loadPayments(reset=true){

if(reset){

const fromDate=$("fromDate").value;

const toDate=$("toDate").value;

if(

(fromDate&&!validDate(fromDate))

||(toDate&&!validDate(toDate))

||(fromDate&&toDate&&fromDate>toDate)

){

message("listResult","invalid");

return;

}

}

await runRead(async()=>{

if(reset){

paymentQuery={

search:$("search").value.trim(),

status:$("paymentStatus").value,

method:$("paymentMethod").value,

fromDate:$("fromDate").value||null,

toDate:$("toDate").value||null

};

payments=[];

paymentCursor=null;

renderPayments();

}

const response=requireSuccess(

await serverCall("getAdminCustomerPayments",{

...paymentQuery,

limit:30,

cursor:reset?null:paymentCursor

})

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validPayment)

||!validCursor(response.nextCursor)){

throw new Error("Invalid payments");

}

payments=mergeRecords(

payments,

response.records,

"bookingId"

);

paymentCursor=response.nextCursor;

renderPayments();

},"listResult");

}

$("searchButton").onclick=()=>loadPayments(true);

$("morePayments").onclick=()=>{

if(paymentCursor!==null){

loadPayments(false);

}

};

function validTransaction(record){

return record

&&validId(record.transactionId)

&&validId(record.bookingId)

&&validAmount(record.amountCents)

&&record.amountCents>0

&&["cash","bank"].includes(record.method)

&&["pending","approved","rejected"]

.includes(record.status)

&&validText(record.reference,150)

&&validCount(record.revision)

&&validTime(record.createdAtMs)

&&(record.receiptId===null

||validId(record.receiptId))

&&(record.status!=="approved"

||validId(record.receiptId));

}

function transactionLines(container,record){

addLine(container,"transactionId",

record.transactionId);

addLine(container,"bookingId",

record.bookingId);

addLine(container,"amount",

money(record.amountCents));

addLine(container,"method",

t(record.method));

addLine(container,"reference",

record.reference||"—");

addLine(container,"paymentStatus",

t(record.status));

addLine(container,"date",

formatDate(record.createdAtMs));

if(record.receiptId){

addLine(container,"receipt",record.receiptId);

}

}

function renderDetails(){

const container=$("paymentDetails");

const list=$("transactionList");

container.replaceChildren();

list.replaceChildren();

$("detailsPanel").hidden=

!selectedPayment||!isOwner();

$("moreTransactions").hidden=

transactionCursor===null;

if(!selectedPayment||!isOwner())return;

paymentLines(container,selectedPayment);

if(!transactions.length){

list.textContent=t("noRecords");

}

transactions.forEach(record=>{

const panel=recordBox();

transactionLines(panel,record);

if(record.status==="pending"){

panel.appendChild(

createButton(

"reviewButton",

()=>openReview(record)

)

);

}

list.appendChild(panel);

});

}

async function loadPaymentDetails(bookingId,reset=true){

const response=requireSuccess(

await serverCall(

"getAdminCustomerPaymentDetails",

{

bookingId,

limit:30,

cursor:reset?null:transactionCursor

}

)

);

if(!validPayment(response.payment)

||response.payment.bookingId!==bookingId

||!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(record=>

validTransaction(record)

&&record.bookingId===bookingId

)

||!validCursor(response.nextCursor)){

throw new Error("Invalid details");

}

selectedPayment=response.payment;

transactions=mergeRecords(

reset?[]:transactions,

response.records,

"transactionId"

);

transactionCursor=response.nextCursor;

renderDetails();

}

function openPayment(bookingId){

runRead(async()=>{

closeReview();

selectedPayment=null;

transactions=[];

transactionCursor=null;

renderDetails();

await loadPaymentDetails(bookingId,true);

$("detailsPanel").scrollIntoView({

behavior:"smooth"

});

});

}

$("moreTransactions").onclick=()=>{

if(!selectedPayment

||transactionCursor===null)return;

const bookingId=selectedPayment.bookingId;

runRead(()=>loadPaymentDetails(bookingId,false));

};

$("closeDetails").onclick=()=>{

if(busy||mutationBusy)return;

closeReview();

selectedPayment=null;

transactions=[];

transactionCursor=null;

renderDetails();

updateControls();

};

function renderReview(){

const container=$("reviewDetails");

container.replaceChildren();

$("reviewPanel").hidden=

!selectedTransaction||!isOwner();

if(!selectedTransaction||!isOwner())return;

transactionLines(container,selectedTransaction);

if(selectedPayment){

addLine(container,"balance",

money(selectedPayment.balanceCents));

}

}

function openReview(record){

if(!isOwner()

||busy

||mutationBusy

||record.status!=="pending"

||!selectedPayment

||record.bookingId!==selectedPayment.bookingId)return;

selectedTransaction=record;

$("decision").value="";

$("verifiedReference").value="";

$("reviewReason").value="";

$("reviewConsent").checked=false;

message("reviewResult","");

renderReview();

updateControls();

$("reviewPanel").scrollIntoView({

behavior:"smooth"

});

}

function closeReview(){

selectedTransaction=null;

$("decision").value="";

$("verifiedReference").value="";

$("reviewReason").value="";

$("reviewConsent").checked=false;

renderReview();

updateControls();

}

$("closeReview").onclick=()=>{

if(!busy&&!mutationBusy){

closeReview();

}

};

async function freshOwnerAuthentication(){

if(!isOwner()){

throw new Error("Unauthorized");

}

const user=auth.currentUser;

const uid=user.uid;

const provider=new GoogleAuthProvider();

provider.setCustomParameters({

prompt:"select_account"

});

const credential=await reauthenticateWithPopup(

user,

provider

);

if(credential.user.uid!==uid

||auth.currentUser?.uid!==uid

||!isOwner()){

throw new Error("Owner changed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Invalid owner");

}

const response=await serverCall("verifyOwnerAdmin");

if(!validOwner(response,uid)){

throw new Error("Owner verification failed");

}

}

async function runMutation(

name,

payload,

onSuccess,

resultId

){

if(!isOwner()||busy||mutationBusy)return;

const currentGeneration=generation;

const fingerprint=JSON.stringify([name,payload]);

if(pendingMutation

&&pendingMutation.fingerprint!==fingerprint){

message(resultId,"saveError");

return;

}

if(!pendingMutation){

pendingMutation={

fingerprint,

requestId:crypto.randomUUID()

};

}

const requestId=pendingMutation.requestId;

mutationBusy=true;

updateControls();

message(resultId,"saving");

try{

await freshOwnerAuthentication();

const response=requireSuccess(

await serverCall(name,{

...payload,

requestId

})

);

await onSuccess(response);

if(currentGeneration!==generation)return;

pendingMutation=null;

message(resultId,"saved");

}catch(e){

if(currentGeneration===generation){

message(resultId,"saveError");

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

}

}

}

$("submitReview").onclick=()=>{

if(!selectedPayment

||!selectedTransaction

||selectedTransaction.status!=="pending"

||!$("reviewConsent").checked)return;

const decision=$("decision").value;

const reason=$("reviewReason").value.trim();

const bankApproval=

decision==="approved"

&&selectedTransaction.method==="bank";

const verifiedReference=

bankApproval

?$("verifiedReference").value.trim()

:null;

if(!["approved","rejected"].includes(decision)

||reason.length<10

||reason.length>500

||(bankApproval

&&(!verifiedReference

||verifiedReference.length<3

||verifiedReference.length>150))

||(decision==="approved"

&&selectedTransaction.amountCents>

selectedPayment.balanceCents)){

message("reviewResult","invalid");

return;

}

const bookingId=selectedPayment.bookingId;

const transactionId=

selectedTransaction.transactionId;

const expectedPaymentRevision=

selectedPayment.revision;

const expectedTransactionRevision=

selectedTransaction.revision;

runMutation(

"reviewAdminCustomerPayment",

{

bookingId,

transactionId,

decision,

reason,

verifiedReference,

expectedPaymentRevision,

expectedTransactionRevision

},

async response=>{

if(!validPayment(response.payment)

||response.payment.bookingId!==bookingId

||response.payment.revision<=expectedPaymentRevision

||!validTransaction(response.transaction)

||response.transaction.transactionId!==transactionId

||response.transaction.bookingId!==bookingId

||response.transaction.status!==decision

||response.transaction.revision<=

expectedTransactionRevision){

throw new Error("Review not confirmed");

}

selectedPayment=response.payment;

transactions=transactions.map(record=>

record.transactionId===transactionId

?response.transaction

:record

);

payments=payments.map(record=>

record.bookingId===bookingId

?response.payment

:record

);

if(paymentQuery?.status!=="all"){

payments=payments.filter(record=>

record.status===paymentQuery?.status

);

}

closeReview();

renderDetails();

renderPayments();

overview=null;

renderOverview();

message("result","saved");

try{

await loadOverview(true);

}catch(e){

message("result","error");

}

},

"reviewResult"

);

};

const bankFields=[

"bankName",
"accountName",
"accountNumber",
"branch",
"cashEnabled",
"bankEnabled"

];

function readSettings(){

return {

bankName:$("bankName").value.trim(),

accountName:$("accountName").value.trim(),

accountNumber:$("accountNumber").value.trim(),

branch:$("branch").value.trim(),

cashEnabled:$("cashEnabled").checked,

bankEnabled:$("bankEnabled").checked

};

}

function settingsFingerprint(data){

return JSON.stringify([

data.bankName,
data.accountName,
data.accountNumber,
data.branch,
data.cashEnabled,
data.bankEnabled

]);

}

bankFields.forEach(id=>{

$(id).addEventListener("input",()=>{

dirty=!!settings

&&settingsFingerprint(readSettings())

!==settingsFingerprint(settings);

$("settingsConsent").checked=false;

message("settingsResult","");

updateControls();

});

});

[

"settingsReason",
"settingsConsent",
"decision",
"verifiedReference",
"reviewReason",
"reviewConsent"

].forEach(id=>{

$(id).addEventListener("input",updateControls);

});

$("saveSettings").onclick=()=>{

if(!settings

||!dirty

||!$("settingsConsent").checked)return;

const data=readSettings();

const reason=$("settingsReason").value.trim();

if(!validSettings({

...data,

version:settings.version

})

||reason.length<10

||reason.length>500){

message("settingsResult","invalid");

return;

}

const expectedVersion=settings.version;

runMutation(

"saveAdminCustomerPaymentSettings",

{

settings:data,

reason,

expectedVersion,

applyTo:"future_confirmed_bookings"

},

async response=>{

if(!validSettings(response.settings)

||response.settings.version<=expectedVersion

||settingsFingerprint(response.settings)

!==settingsFingerprint(data)){

throw new Error("Save not confirmed");

}

settings=response.settings;

populateSettings();

},

"settingsResult"

);

};

function validHistory(record){

return record

&&validId(record.recordId)

&&["paymentReview","settingsChange"]

.includes(record.action)

&&validText(record.reason,500)

&&validTime(record.createdAtMs)

&&(record.bookingId===null

||validId(record.bookingId))

&&(record.transactionId===null

||validId(record.transactionId))

&&(record.amountCents===null

||validAmount(record.amountCents))

&&(record.version===null

||validCount(record.version));

}

function renderHistory(){

const container=$("historyList");

container.replaceChildren();

$("moreHistory").hidden=historyCursor===null;

if(!isOwner())return;

historyRecords.forEach(record=>{

const panel=recordBox();

addLine(panel,"action",t(record.action));

addLine(panel,"date",formatDate(record.createdAtMs));

addLine(panel,"reason",record.reason);

if(record.bookingId){

addLine(panel,"bookingId",record.bookingId);

}

if(record.transactionId){

addLine(panel,"transactionId",record.transactionId);

}

if(record.amountCents!==null){

addLine(panel,"amount",money(record.amountCents));

}

if(record.version!==null){

addLine(panel,"version",record.version);

}

container.appendChild(panel);

});

}

async function loadHistory(reset=true){

await runRead(async()=>{

if(reset){

historyRecords=[];

historyCursor=null;

renderHistory();

}

const response=requireSuccess(

await serverCall(

"getAdminCustomerPaymentHistory",

{

limit:30,

cursor:reset?null:historyCursor

}

)

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validHistory)

||!validCursor(response.nextCursor)){

throw new Error("Invalid history");

}

historyRecords=mergeRecords(

historyRecords,

response.records,

"recordId"

);

historyCursor=response.nextCursor;

renderHistory();

if(!historyRecords.length){

$("historyList").textContent=t("noRecords");

}

});

}

$("loadHistory").onclick=()=>loadHistory(true);

$("moreHistory").onclick=()=>{

if(historyCursor!==null){

loadHistory(false);

}

};

function updateControls(){

const locked=busy||mutationBusy||!isOwner();

[

"refreshButton",
"search",
"paymentStatus",
"paymentMethod",
"fromDate",
"toDate",
"searchButton",
"morePayments",
"moreTransactions",
"closeDetails",
"decision",
"reviewReason",
"reviewConsent",
"closeReview",
"loadHistory",
"moreHistory"

].forEach(id=>{

$(id).disabled=locked;

});

document.querySelectorAll("[data-dynamic]")

.forEach(button=>{

button.disabled=locked;

});

bankFields.forEach(id=>{

$(id).disabled=locked||!settings;

});

$("settingsReason").disabled=locked||!settings;

$("settingsConsent").disabled=locked||!settings;

const validDraft=

!!settings&&validSettings({

...readSettings(),

version:settings.version

});

$("saveSettings").disabled=

locked

||!settings

||!dirty

||!validDraft

||!$("settingsConsent").checked

||$("settingsReason").value.trim().length<10;

const decision=$("decision").value;

const bankApproval=

decision==="approved"

&&selectedTransaction?.method==="bank";

$("verifiedReference").disabled=

locked||!bankApproval;

$("submitReview").disabled=

locked

||!selectedPayment

||!selectedTransaction

||selectedTransaction.status!=="pending"

||!["approved","rejected"].includes(decision)

||!$("reviewConsent").checked

||$("reviewReason").value.trim().length<10

||(bankApproval

&&$("verifiedReference").value.trim().length<3)

||(decision==="approved"

&&selectedTransaction.amountCents>

selectedPayment.balanceCents);

}

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

overview=null;

settings=null;

lastSync=null;

payments=[];

transactions=[];

historyRecords=[];

paymentCursor=null;

transactionCursor=null;

historyCursor=null;

paymentQuery=null;

selectedPayment=null;

selectedTransaction=null;

pendingMutation=null;

dirty=false;

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("detailsPanel").hidden=true;

$("reviewPanel").hidden=true;

[

"search",
"fromDate",
"toDate",
"bankName",
"accountName",
"accountNumber",
"branch",
"settingsReason",
"verifiedReference",
"reviewReason"

].forEach(id=>{

$(id).value="";

});

[

"cashEnabled",
"bankEnabled",
"settingsConsent",
"reviewConsent"

].forEach(id=>{

$(id).checked=false;

});

$("decision").value="";

$("paymentStatus").value="all";

$("paymentMethod").value="all";

[

"result",
"listResult",
"reviewResult",
"settingsResult"

].forEach(id=>{

message(id,"");

});

renderOverview();

renderPayments();

renderDetails();

renderReview();

renderBankSettings();

renderHistory();

updateControls();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

message("status","denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

message("status","offline");

return;

}

message("status","checking");

try{

const appToken=await getToken(appCheck,false);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

message("status","verified");

await runRead(()=>loadOverview(false));

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

let checking=false;

setInterval(async()=>{

if(!isOwner()||checking||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await serverCall(

"verifyOwnerAdmin"

);

if(!validOwner(response,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||document.hidden)return;

runRead(()=>loadOverview(true));

},60000);

window.addEventListener("offline",()=>{

clearSession();

message("status","offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(dirty||mutationBusy||pendingMutation){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderLanguage();

updateControls();

initializeSecurity();

</script>

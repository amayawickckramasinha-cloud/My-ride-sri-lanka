
<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Driver Ride History</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:700px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#292929;
border:1px solid #444;
border-radius:10px;
padding:14px;
}

.statValue{
color:#FFD600;
font-size:22px;
font-weight:bold;
margin-top:10px;
overflow-wrap:anywhere;
}

.label{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.yellow{color:#FFD600}
.green{color:#4ADE80}
.red{color:#FF6464}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:14px;
padding:12px 0;
border-bottom:1px solid #444;
font-size:14px;
}

.row strong{
text-align:right;
overflow-wrap:anywhere;
max-width:60%;
}

label{
display:block;
margin-top:14px;
margin-bottom:8px;
font-size:14px;
font-weight:bold;
}

input,select{
width:100%;
padding:13px;
border:1px solid #555;
border-radius:8px;
background:#292929;
color:#fff;
font-size:16px;
color-scheme:dark;
}

input:focus,select:focus{
outline:2px solid #FFD600;
}

.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.tabs{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin:15px 0;
}

.tabs button{
background:#292929;
color:#FFD600;
border:1px solid #FFD600;
border-radius:8px;
padding:12px 3px;
font-size:12px;
cursor:pointer;
}

.tabs button.selected{
background:#FFD600;
color:#111;
}

.rideCard{
background:#202020;
border:1px solid #555;
border-radius:12px;
margin:14px 0;
overflow:hidden;
}

.rideCard summary{
padding:16px;
cursor:pointer;
line-height:1.8;
overflow-wrap:anywhere;
}

.rideDetails{
padding:0 16px 16px;
}

.rideId{
color:#FFD600;
font-weight:bold;
}

.badge{
display:inline-block;
padding:6px 10px;
border-radius:6px;
font-size:12px;
font-weight:bold;
margin:8px 0;
}

.completed{
background:#163322;
color:#4ADE80;
}

.cancelled{
background:#421818;
color:#FF6464;
}

.pending{
background:#39320D;
color:#FFD600;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.8;
}

#status{
color:#FFD600;
text-align:center;
line-height:1.8;
}

#historyStatus{
text-align:center;
color:#CCC;
line-height:1.8;
}

#periodText{
text-align:center;
color:#CCC;
font-size:14px;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading"></h2>

<p id="status"
role="status"
aria-live="polite"></p>

<section id="accessPanel"
class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="content" hidden>

<section class="panel">

<div class="row">

<span data-t="driverName"></span>

<strong id="driverName">—</strong>

</div>

<div class="row">

<span>Driver ID</span>

<strong id="driverId">—</strong>

</div>

</section>

<div class="tabs">

<button data-period="day"
data-t="today"></button>

<button data-period="week"
data-t="week"></button>

<button data-period="month"
data-t="month"></button>

<button data-period="all"
data-t="all"></button>

</div>

<p id="periodText">—</p>

<section class="grid">

<div class="stat">

<div class="label"
data-t="completedRides"></div>

<div id="totalRides"
class="statValue">—</div>

</div>

<div class="stat">

<div class="label"
data-t="totalDistance"></div>

<div id="totalDistance"
class="statValue">—</div>

</div>

<div class="stat">

<div class="label"
data-t="grossIncome"></div>

<div id="totalGross"
class="statValue">—</div>

</div>

<div class="stat">

<div class="label"
data-t="commission"></div>

<div id="totalCommission"
class="statValue red">—</div>

</div>

<div class="stat">

<div class="label"
data-t="netIncome"></div>

<div id="totalNet"
class="statValue green">—</div>

</div>

<div class="stat">

<div class="label"
data-t="totalDuration"></div>

<div id="totalDuration"
class="statValue">—</div>

</div>

</section>

<section class="panel">

<h3 data-t="searchHistory"></h3>

<form id="searchForm">

<label for="bookingId"
data-t="bookingId"></label>

<input
id="bookingId"
type="text"
maxlength="128"
autocomplete="off">

<div class="grid">

<div>

<label for="fromDate"
data-t="fromDate"></label>

<input
id="fromDate"
type="date">

</div>

<div>

<label for="toDate"
data-t="toDate"></label>

<input
id="toDate"
type="date">

</div>

</div>

<label for="vehicleFilter"
data-t="vehicle"></label>

<select id="vehicleFilter">

<option value=""
data-t="allVehicles"></option>

<option value="bike"
data-t="bike"></option>

<option value="tuk"
data-t="tuk"></option>

<option value="car"
data-t="car"></option>

<option value="van"
data-t="van"></option>

</select>

<label for="paymentFilter"
data-t="paymentMethod"></label>

<select id="paymentFilter">

<option value=""
data-t="allPayments"></option>

<option value="cash"
data-t="cash"></option>

<option value="bank"
data-t="bank"></option>

</select>

<button
id="searchButton"
type="submit"
class="action"
data-t="search"></button>

<button
id="clearButton"
type="button"
class="action secondary"
data-t="clear"></button>

</form>

</section>

<h3 data-t="rideHistory"></h3>

<p id="historyStatus"
role="status"
aria-live="polite"></p>

<div id="rideList"></div>

<button id="loadMoreButton"
class="action secondary"
data-t="loadMore" hidden></button>

<p id="updatedAt"
class="note"></p>

<a id="incomeLink"
class="action"
data-t="income"></a>

<a id="commissionLink"
class="action secondary"
data-t="commissionReport"></a>

<button id="refreshButton"
class="action secondary"
data-t="refresh"></button>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function number(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,max=300){

return typeof value==="string"

&&value.trim().length>0

&&value.length<=max;

}

function money(value){

return number(value)

?"Rs. "+value.toLocaleString(

"en-LK",

{

minimumFractionDigits:2,

maximumFractionDigits:2

}

)

:"—";

}

function duration(seconds){

if(!number(seconds))return "—";

const h=Math.floor(seconds/3600);

const m=Math.floor((seconds%3600)/60);

const s=Math.floor(seconds%60);

return h+"h "+m+"m "+s+"s";

}

function formatDate(ms){

if(!Number.isFinite(ms)

||ms<=0)return "—";

return new Intl.DateTimeFormat(

"en-GB",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(ms));

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncClock(){

const started=Date.now();

const result=await serverCall(

"getDriverServerTime"

);

const ended=Date.now();

if(!Number.isFinite(result?.serverTimeMs)

||ended-started>10000){

throw new Error("Server time unavailable");

}

serverOffset=

result.serverTimeMs-(started+ended)/2;

clockCheckedAt=ended;

$("fromDate").max=sriLankaToday();

$("toDate").max=sriLankaToday();

}

function serverNow(){

return Date.now()+serverOffset;

}

function clockValid(){

return clockCheckedAt>0

&&Date.now()-clockCheckedAt<120000;

}

function sriLankaToday(){

return new Date(

serverNow()+330*60000

).toISOString().slice(0,10);

}

function dateKey(date){

return date.toISOString().slice(0,10);

}

function validDate(value){

if(!/^\d{4}-\d{2}-\d{2}$/.test(value)){

return false;

}

const date=new Date(value+"T00:00:00Z");

return Number.isFinite(date.getTime())

&&dateKey(date)===value;

}

// REPORT PERIODS

function periodInfo(){

const now=new Date(

serverNow()+330*60000

);

const day=new Date(Date.UTC(

now.getUTCFullYear(),

now.getUTCMonth(),

now.getUTCDate()

));

if(selectedPeriod==="day"){

const key=dateKey(day);

return{

fromDate:key,

toDate:key,

label:key

};

}

if(selectedPeriod==="week"){

const monday=new Date(day);

monday.setUTCDate(

monday.getUTCDate()

-(monday.getUTCDay()+6)%7

);

return{

fromDate:dateKey(monday),

toDate:dateKey(day),

label:dateKey(monday)+" — "+dateKey(day)

};

}

if(selectedPeriod==="month"){

const first=new Date(Date.UTC(

day.getUTCFullYear(),

day.getUTCMonth(),

1

));

return{

fromDate:dateKey(first),

toDate:dateKey(day),

label:dateKey(first)+" — "+dateKey(day)

};

}

return{

fromDate:null,

toDate:null,

label:t.allTime

};

}

function startGps(){

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const c=position.coords;

if(!validSession()

||!driver

||!["online","busy"].includes(

driver.availability

)

||!Number.isFinite(c.latitude)

||!Number.isFinite(c.longitude)

||!number(c.accuracy)

||c.accuracy>100

||c.latitude<5.85

||c.latitude>9.9

||c.longitude<79.5

||c.longitude>82

||Date.now()-position.timestamp>30000

||position.timestamp>Date.now()+5000

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

{

lat:c.latitude,

lon:c.longitude,

accuracy:c.accuracy,

capturedAtMs:position.timestamp

}

);

}catch(e){

// Backend must expire stale GPS data.

}finally{

gpsSending=false;

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// RIDE RECORD VALIDATION

function validRecord(data){

if(!data

||data.driverUid!==uid

||!validId(data.bookingId)

||data.status!=="completed"){

return false;

}

if(!validText(data.pickupName)

||!validText(data.destinationName)){

return false;

}

if(!["bike","tuk","car","van"]

.includes(data.vehicle)){

return false;

}

if(!Number.isInteger(data.passengers)

||data.passengers<1

||data.passengers>10){

return false;

}

const fields=[

"startedAtMs",

"completedAtMs",

"distanceMeters",

"durationSeconds",

"baseRate",

"rainCharge",

"roadCharge",

"distanceDiscount",

"minimumFare",

"tollParking",

"grossIncome",

"finalFare",

"commissionRate",

"commission",

"netIncome"

];

if(!fields.every(key=>number(data[key]))){

return false;

}

if(data.startedAtMs<=0

||data.completedAtMs<data.startedAtMs

||data.completedAtMs>serverNow()+30000

||data.commissionRate>100){

return false;

}

if(Math.abs(

data.grossIncome

+data.tollParking

-data.finalFare

)>0.02){

return false;

}

if(Math.abs(

data.grossIncome

-data.commission

-data.netIncome

)>0.02){

return false;

}

if(Math.abs(

Math.round(

data.grossIncome

*data.commissionRate

)/100

-data.commission

)>0.02){

return false;

}

if(!["day","night","mixed","unknown"]

.includes(data.period)){

return false;

}

if(!["rain","dry","mixed","unknown"]

.includes(data.weatherStatus)){

return false;

}

if(!["normal","difficult","mixed","unknown"]

.includes(data.roadStatus)){

return false;

}

if(!["cash","bank","unknown"]

.includes(data.paymentMethod)){

return false;

}

if(![

"paid",

"unpaid",

"pending",

"partial",

"rejected"

].includes(data.paymentStatus)){

return false;

}

return true;

}

// SERVER HISTORY PAGINATION

async function loadHistory(){

if(!validSession()

||!driver

||!activeFilters

||!clockValid()

||loading)return;

loading=true;

$("loadMoreButton").disabled=true;

$("searchButton").disabled=true;

$("historyStatus").textContent=t.loading;

const currentGeneration=generation;

const currentHistoryGeneration=

historyGeneration;

const requestedCursor=cursor;

try{

const result=await serverCall(

"getDriverRideHistory",

{

filters:activeFilters,

limit:PAGE_SIZE,

cursor:requestedCursor

}

);

if(currentGeneration!==generation

||currentHistoryGeneration!==historyGeneration){

return;

}

if(result?.success!==true

||result.driverUid!==uid

||!Array.isArray(result.records)

||result.records.length>PAGE_SIZE

||!result.records.every(validRecord)

||!validSummary(result.summary)){

throw new Error("Invalid history response");

}

const next=result.nextCursor;

if(next!==null

&&(

typeof next!=="string"

||next.length===0

||next.length>2048

||next===requestedCursor

)){

throw new Error("Invalid pagination cursor");

}

result.records.forEach(record=>{

records.set(

record.bookingId,

record

);

});

cursor=next;

displaySummary(result.summary);

renderHistory();

$("loadMoreButton").hidden=

cursor===null;

$("updatedAt").textContent=

t.updated+": "+formatDate(serverNow());

status("");

}catch(e){

if(currentGeneration!==generation

||currentHistoryGeneration!==historyGeneration){

return;

}

$("historyStatus").textContent=t.error;

$("loadMoreButton").hidden=false;

}finally{

if(currentGeneration===generation

&&currentHistoryGeneration===historyGeneration){

loading=false;

$("loadMoreButton").disabled=false;

$("searchButton").disabled=false;

}

}

}

}

if(vehicle

&&!["bike","tuk","car","van"]

.includes(vehicle)){

return;

}

if(paymentMethod

&&!["cash","bank"].includes(paymentMethod)){

return;

}

selectedPeriod="custom";

updateTabs();

startHistory(

{

bookingId:bookingId||null,

fromDate:fromDate||null,

toDate:toDate||null,

vehicle:vehicle||null,

paymentMethod:paymentMethod||null

},

t.custom

);

};

$("clearButton").onclick=()=>{

if(!validSession()||!driver)return;

selectedPeriod="all";

updateTabs();

loadPeriod();

};

// DRIVER STATUS MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

driver=null;

clearHistory();

stopGps();

$("content").hidden=true;

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true){

denyAccess();

return;

}

driver=data;

$("driverName").textContent=

typeof data.fullName==="string"

?data.fullName:"—";

$("driverId").textContent=

typeof data.driverId==="string"

?data.driverId:"—";

$("content").hidden=false;

$("accessPanel").hidden=true;

if(["online","busy"].includes(

data.availability

)){

startGps();

}else{

stopGps();

}

if(!activeFilters){

if(selectedPeriod==="custom"){

selectedPeriod="day";

updateTabs();

}

loadPeriod();

}

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!functions||!db){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true

||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

await syncClock();

if(currentGeneration!==generation)return;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// AUTOMATIC SERVER TIME UPDATE

setInterval(async()=>{

if(!validSession()||!driver)return;

const currentGeneration=generation;

try{

await syncClock();

if(currentGeneration!==generation

||!validSession())return;

if(selectedPeriod!=="custom"

&&activeFilters

&&!loading){

const period=periodInfo();

if(

activeFilters.fromDate!==period.fromDate

||activeFilters.toDate!==period.toDate

){

loadPeriod();

}

}

}catch(e){

if(currentGeneration!==generation)return;

clockCheckedAt=0;

status(t.error);

}

},60000);

// REFRESH HISTORY

$("refreshButton").onclick=async()=>{

if(!validSession()||!driver){

if(auth){

verifyDriver(auth.currentUser);

}

return;

}

const currentGeneration=generation;

try{

await syncClock();

if(currentGeneration!==generation)return;

if(selectedPeriod==="custom"

&&activeFilters){

const filters={...activeFilters};

startHistory(filters,t.custom);

}else{

loadPeriod();

}

}catch(e){

if(currentGeneration!==generation)return;

status(t.error);

}

};

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

</body>
</html>

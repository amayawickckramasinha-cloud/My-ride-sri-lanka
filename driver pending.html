// FORMAT REGISTRATION DATE

function formatDate(value){

const date=value?.toDate?.();

if(!(date instanceof Date)

||Number.isNaN(date.getTime())){

return "—";

}

return date.toLocaleString(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

year:"numeric",

month:"short",

day:"numeric",

hour:"2-digit",

minute:"2-digit"

}

);

}

}

if(!Object.hasOwn(statusSettings,state)){

connection(t.unknown);

return;

}

if(state==="activated"

&&data.activationComplete!==true){

connection(t.unknown);

return;

}

const settings=statusSettings[state];

$("statusIcon").textContent=settings.icon;

$("statusIcon").style.color=settings.color;

$("statusTitle").textContent=settings.title;

$("statusTitle").style.color=settings.color;

$("statusMessage").textContent=settings.message;

$("driverId").textContent=

typeof data.driverId==="string"

?data.driverId:"—";

$("driverName").textContent=

typeof data.fullName==="string"

?data.fullName:"—";

$("registeredDate").textContent=

formatDate(data.createdAt);

$("vehicle").textContent=

["bike","tuk","car","van"].includes(data.vehicleType)

?t[data.vehicleType]:"—";

$("driverStatus").textContent=

state.toUpperCase();

$("driverStatus").style.color=settings.color;


// ADMIN REASON

if(["rejected","suspended","blocked"].includes(state)

&&typeof data.statusReason==="string"

&&data.statusReason.trim()){

$("reasonText").textContent=data.statusReason;

$("reasonPanel").hidden=false;

}


// APPROVED DRIVER

if(state==="approved"){

$("approvalNote").textContent=t.activationNote;

$("approvalNote").hidden=false;

}


// ACTIVATED DRIVER

if(state==="activated"){

$("loginButton").hidden=false;

}

$("statusPanel").hidden=false;

connection(t.connected);

}


// DISCONNECT

function disconnect(){

generation++;

if(unsubscribe){

unsubscribe();

unsubscribe=null;

}

clearStatus();

}


// SECURE REAL-TIME STATUS

function connect(){

disconnect();

if(!auth||!db){

connection(t.error);

return;

}

if(!navigator.onLine){

connection(t.offline);

return;

}

if(!currentUser

||!currentUser.phoneNumber){

connection(t.auth);

$("registerButton").hidden=false;

return;

}

connection(t.connecting);

const currentGeneration=generation;

const uid=currentUser.uid;

const driverRef=doc(

db,

"drivers",

uid

);

unsubscribe=onSnapshot(

driverRef,

{

includeMetadataChanges:true

},

snapshot=>{

if(currentGeneration!==generation)return;

if(auth.currentUser?.uid!==uid){

disconnect();

connection(t.denied);

return;

}

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

clearStatus();

connection(t.connecting);

return;

}

if(!snapshot.exists()){

clearStatus();

connection(t.missing);

$("registerButton").hidden=false;

return;

}

displayStatus(snapshot.data());

},

error=>{

if(currentGeneration!==generation)return;

disconnect();

connection(

error.code==="permission-denied"

?t.denied:t.error

);

}

);

}


// AUTHENTICATION

if(auth&&db){

onAuthStateChanged(

auth,

user=>{

currentUser=user;

connect();

},

()=>{

currentUser=null;

disconnect();

connection(t.auth);

}

);

}


// REFRESH STATUS

$("refreshButton").onclick=connect;


// INTERNET CONNECTION

window.addEventListener(

"offline",

()=>{

disconnect();

connection(t.offline);

}

);

window.addEventListener(

"online",

connect

);

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted){

connect();

}

}

);

</script>

</body>
</html>

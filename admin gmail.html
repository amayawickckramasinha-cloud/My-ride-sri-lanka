
<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">
<title>MY RIDE - Gmail Management</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}
main{
max-width:850px;
margin:auto;
padding:16px;
}
h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}
.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}
h2{text-align:center}
h3{color:#FFD600}
.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}
button,.action{
display:block;
width:100%;
padding:14px;
margin:12px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-weight:bold;
font-size:15px;
text-align:center;
text-decoration:none;
cursor:pointer;
}
button:disabled{opacity:.45}
.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}
.languages button{padding:12px 4px}
.check{
display:flex;
align-items:center;
gap:12px;
background:#292929;
padding:14px;
margin:10px 0;
border-radius:8px;
line-height:1.7;
}
.check input{
width:22px;
height:22px;
flex-shrink:0;
accent-color:#FFD600;
}
select{
width:100%;
padding:13px;
background:#292929;
color:#fff;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}
.note{
color:#CCC;
font-size:14px;
line-height:1.8;
}
#status,#result{
color:#FFD600;
text-align:center;
line-height:1.8;
}
#email{
overflow-wrap:anywhere;
background:#292929;
padding:15px;
border-radius:8px;
}
.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}
.stat{
background:#292929;
padding:15px;
border-radius:9px;
}
.stat strong{
display:block;
font-size:26px;
color:#FFD600;
margin-top:10px;
}
.record{
background:#292929;
border:1px solid #555;
border-radius:9px;
padding:15px;
margin:12px 0;
line-height:1.8;
overflow-wrap:anywhere;
}
.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}
footer{
text-align:center;
color:#AAA;
padding:20px;
font-size:12px;
}
[hidden]{display:none!important}
</style>
</head>

<body>
<main>

<h1>MY RIDE</h1>
<div class="country">SRI LANKA</div>

<h2 data-t="heading">Gmail Management</h2>

<div class="languages">
<button data-lang="si">සිංහල</button>
<button data-lang="en">English</button>
<button data-lang="ta">தமிழ்</button>
</div>

<p id="status" role="status" aria-live="polite">
Checking security...
</p>

<section id="accessPanel" class="panel" hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink" class="action">
Admin Login
</a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="account"></h3>

<p data-t="recipient"></p>

<div id="email">—</div>

<p id="providerStatus" class="note"></p>

<p class="note" data-t="privacy"></p>

<label class="check">
<input id="autoEnabled" type="checkbox">
<span data-t="automatic"></span>
</label>

</section>

<section class="panel">

<h3 data-t="statistics"></h3>

<div id="statistics" class="grid"></div>

</section>

<section class="panel">

<h3 data-t="notifications"></h3>

<div id="notificationOptions"></div>

<button id="saveSettings"
data-t="save"></button>

</section>

<section class="panel">

<h3 data-t="testHeading"></h3>

<p class="note" data-t="testNote"></p>

<button id="testEmail"
data-t="test"></button>

</section>

<section class="panel">

<h3 data-t="history"></h3>

<select id="historyFilter">
<option value="all" data-t="all"></option>
<option value="queued" data-t="queued"></option>
<option value="sent" data-t="sent"></option>
<option value="failed" data-t="failed"></option>
</select>

<button id="refreshHistory"
data-t="refresh"></button>

<div id="history"></div>

<button id="loadMore"
data-t="more" hidden></button>

</section>

<p id="result"
role="status"
aria-live="polite"></p>

<button id="refreshButton"
data-t="refresh"></button>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>© MY RIDE SRI LANKA</footer>

</main>

&&ownerUid!==null

function validOwner(data,uid){

return data?.authorized===true
&&data.uid===uid
&&data.role==="owner"
&&data.ownerUidVerified===true
&&data.sessionValid===true;

}

function validId(value){

return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validCount(value){

return Number.isSafeInteger(value)&&value>=0;

}

async function serverCall(name,data={}){

if(!isOwner())throw new Error("Unauthorized");

const currentGeneration=generation;

const response=await httpsCallable(
functions,
name,
{timeout:25000}
)(data);

if(currentGeneration!==generation||!isOwner()){

throw new Error("Session changed");

}

return response.data;

}

function requestId(name,payload){

const signature=JSON.stringify([name,payload]);

if(pendingRequest?.signature!==signature){

pendingRequest={
signature,
id:crypto.randomUUID()
};

}

return pendingRequest.id;

}

async function reauthenticate(){

if(!isOwner())throw new Error("Unauthorized");

const currentGeneration=generation;

const user=auth.currentUser;

const provider=new GoogleAuthProvider();

provider.setCustomParameters({
prompt:"select_account"
});

const credential=await reauthenticateWithPopup(
user,
provider
);

if(credential.user.uid!==ownerUid
||currentGeneration!==generation
||!isOwner()){

throw new Error("Owner mismatch");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true
||token.claims.email_verified!==true
||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await serverCall("verifyOwnerAdmin");

if(!validOwner(response,ownerUid)){

throw new Error("Access denied");

}

}

function subscribeStatistics(){

if(unsubscribe)unsubscribe();

const currentGeneration=generation;

unsubscribe=onSnapshot(

doc(db,"adminDashboard","gmail"),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation||!isOwner())return;

const data=snapshot.data();

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites
||!snapshot.exists()
||!["totalMessages",...deliveryStatuses]
.every(key=>validCount(data[key]))
||deliveryStatuses.reduce(
(sum,key)=>sum+data[key],0
)!==data.totalMessages){

statistics=null;

}else{

statistics=data;

}

renderStatistics();

},

()=>{

if(currentGeneration!==generation)return;

statistics=null;

renderStatistics();

});

}

function validSettings(data){

return data
&&Number.isSafeInteger(data.version)
&&data.version>0
&&typeof data.recipientEmail==="string"
&&data.recipientEmail.length<=254
&&data.recipientEmail.toLowerCase()
===auth.currentUser.email?.toLowerCase()
&&typeof data.autoEnabled==="boolean"
&&typeof data.providerConnected==="boolean"
&&data.notifications
&&notificationTypes.every(type=>
typeof data.notifications[type]==="boolean"
);

}

function validRecord(item){

return item
&&validId(item.messageId)
&&[...notificationTypes,"testMessage"]
.includes(item.type)
&&deliveryStatuses.includes(item.status)
&&typeof item.recipientMasked==="string"
&&item.recipientMasked.length<=254
&&Number.isFinite(item.createdAtMs)
&&item.createdAtMs>0
&&item.createdAtMs<=8640000000000000
&&typeof item.retryAllowed==="boolean"
&&(item.failureReason===null
||typeof item.failureReason==="string");

}

function addLine(container,label,value){

function renderHistory(){

dateStyle:"medium",
timeStyle:"short"
}

).format(new Date(item.createdAtMs));

if(item.status==="failed"){

addLine(panel,"reason",item.failureReason);

if(item.retryAllowed){

const button=document.createElement("button");

button.textContent=t("retry");

button.disabled=busy
||!isOwner()
||!settings?.providerConnected;

button.onclick=()=>retryEmail(item);

panel.appendChild(button);

}

}

container.appendChild(panel);

});

$("loadMore").hidden=cursor===null;

}

async function loadHistory(reset=true){

const response=await serverCall(

"getAdminGmailHistory",

{
status:filter,
limit:30,
cursor:reset?null:cursor
}

);

if(response?.success!==true
||response.ownerUid!==ownerUid
||!Array.isArray(response.records)
||response.records.length>30
||!response.records.every(validRecord)
||!(response.nextCursor===null
||typeof response.nextCursor==="string")
||(filter!=="all"
&&response.records.some(item=>item.status!==filter))){

throw new Error("Invalid history");

}

const unique=new Map(

(reset?[]:records)
.map(item=>[item.messageId,item])

);

response.records.forEach(item=>{

unique.set(item.messageId,item);

});

records=[...unique.values()];

cursor=response.nextCursor;

renderHistory();

if(!records.length){

$("history").textContent=t("noRecords");

}

}

throw new Error("Invalid filter");

}

records=[];
cursor=null;

renderHistory();

}

await loadHistory(reset);

result("");

}catch(e){

if(currentGeneration===generation){

result("error");

}

}finally{

if(currentGeneration===generation){

setBusy(false);

}

}

}

generation++;

authorized=false;
ownerUid=null;
statistics=null;
records=[];
cursor=null;
filter="all";
pendingRequest=null;

$("accessPanel").hidden=true;

$("historyFilter").value="all";

result("");

renderStatistics();

renderHistory();

setBusy(false);

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

status("denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

status("offline");

return;

}

status("checking");

try{

const appToken=await getToken(appCheck,false);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true
||token.claims.email_verified!==true
||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,
"verifyOwnerAdmin",
{timeout:15000}

)({});

if(currentGeneration!==generation
||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Access denied");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

status("verified");

subscribeStatistics();

setBusy(true);

try{

await loadSettings();

await loadHistory(true);

}catch(e){

if(currentGeneration===generation){

result("error");

}

}finally{

if(currentGeneration===generation){

setBusy(false);

}

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

db=getFirestore(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

let checking=false;

setInterval(async()=>{

if(!isOwner()||busy||checking)return;

const currentGeneration=generation;

checking=true;

try{

const response=await serverCall(
"verifyOwnerAdmin"
);

if(!validOwner(response,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

window.addEventListener("offline",()=>{

clearSession();

status("offline");

});

window.addEventListener("online",()=>{

if(auth)verifyOwner(auth.currentUser);

});

window.addEventListener("pagehide",clearSession);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderLanguage();

setBusy(false);

initializeSecurity();

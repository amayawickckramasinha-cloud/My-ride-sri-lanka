
<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">

<title>MY RIDE - Driver Commission</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
text-align:center;
color:#FFD600;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.highlight{
border-color:#FFD600;
text-align:center;
}

.label{
color:#CCC;
font-size:14px;
line-height:1.8;
}

.amount{
font-size:32px;
font-weight:bold;
margin:12px 0;
overflow-wrap:anywhere;
}

.yellow{color:#FFD600}
.green{color:#4ADE80}
.red{color:#FF6464}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
}

.row strong{
text-align:right;
overflow-wrap:anywhere;
}

.tabs{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin:15px 0;
}

.tabs button{
background:#292929;
color:#FFD600;
border:1px solid #FFD600;
border-radius:8px;
padding:13px 4px;
font-size:13px;
cursor:pointer;
}

.tabs button.selected{
background:#FFD600;
color:#111;
}

.action{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border:0;
border-radius:10px;
background:#FFD600;
color:#111;
font-size:16px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:15px;
color:#FFB4B4;
line-height:1.8;
margin:15px 0;
}

.success{
background:#163322;
border:1px solid #4ADE80;
border-radius:10px;
padding:15px;
color:#4ADE80;
line-height:1.8;
}

.note{
color:#BBB;
font-size:13px;
line-height:1.8;
}

#status{
text-align:center;
color:#FFD600;
line-height:1.8;
}

#periodText{
text-align:center;
color:#CCC;
font-size:14px;
}

.rideCard{
background:#292929;
border:1px solid #444;
border-radius:12px;
padding:14px;
margin:12px 0;
}

.rideId{
color:#FFD600;
font-weight:bold;
overflow-wrap:anywhere;
}

.badge{
display:inline-block;
border-radius:6px;
padding:7px 10px;
font-size:12px;
font-weight:bold;
margin:10px 0;
}

.paid{
background:#163322;
color:#4ADE80;
}

.unpaid{
background:#39320D;
color:#FFD600;
}

.overdue{
background:#421818;
color:#FF6464;
}

.progress{
height:12px;
background:#444;
border-radius:10px;
overflow:hidden;
margin:20px 0;
}

#paidBar{
height:100%;
width:0;
background:#22C55E;
}

hr{
border:0;
border-top:1px solid #444;
margin:18px 0;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading"></h2>

<p id="status"
role="status"

class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="content" hidden>

<section class="panel">

<div class="row">

<span data-t="driverName"></span>

<strong id="driverName">—</strong>

</div>

<div class="row">

<span>Driver ID</span>

<strong id="driverId">—</strong>

</div>

<div class="row">

<span data-t="commissionRate"></span>

<strong id="commissionRate"

</div>

<div class="row">

<span data-t="paymentDeadline"></span>

<strong id="paymentDeadline"
class="yellow">—</strong>

</div>

</section>

<section class="panel highlight">

<div class="label"

<div id="outstandingBalance"

<hr>

<div class="label"
data-t="overdueAmount"></div>

<div id="overdueAmount"
class="amount red">—</div>

<hr>

<div class="label"

<div id="nextPaymentDate"
class="yellow">—</div>

class="note"></p>

</section>

<div id="overdueWarning"

<strong data-t="warningTitle"></strong>

<p data-t="warningText"></p>

</div>

<div id="clearMessage"
class="success" hidden
data-t="allPaid"></div>

<a id="payButton"
class="action"
data-t="payNow" hidden></a>

<h3 data-t="commissionReport"></h3>

<div class="tabs">

<button data-period="day"
data-t="today"></button>

<button data-period="week"
data-t="week"></button>

<button data-period="month"
data-t="month"></button>

<button data-period="all"
data-t="all"></button>

</div>

<p id="periodText">—</p>

<section class="panel">

<div class="row">

<span data-t="completedRides"></span>

<strong id="completedRides">—</strong>

</div>

<div class="row">

<span data-t="grossIncome"></span>

<strong id="grossIncome"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="totalCommission"></span>

<strong id="totalCommission"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="paidCommission"></span>

<strong id="paidCommission"
class="green">—</strong>

</div>

<div class="row">

<span data-t="unpaidCommission"></span>

<strong id="unpaidCommission"
class="red">—</strong>

</div>

<div class="row">

<span data-t="netIncome"></span>

<strong id="netIncome"
class="green">—</strong>

</div>

<div class="progress">

<div id="paidBar"></div>

</div>

<p id="paymentProgress"
class="note"></p>

<p id="reportUpdated"
class="note"></p>

</section>

<section class="panel">

<h3 data-t="rideCommission"></h3>

<p id="ledgerStatus"
class="note"></p>

<div id="commissionList"></div>

<button id="loadMoreButton"
class="action secondary"
data-t="loadMore" hidden></button>

</section>

<section class="panel">

<h3 data-t="rules"></h3>

<p data-t="rule1"></p>

<p data-t="rule2"></p>

<p data-t="rule3"></p>

<p data-t="rule4"></p>

<p data-t="rule5"></p>

</section>

<a id="paymentHistoryLink"
class="action"
data-t="paymentHistory"></a>

<a id="incomeLink"
class="action secondary"
data-t="income"></a>

<button id="refreshButton"
class="action secondary"
data-t="refresh"></button>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function number(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function money(value){

return number(value)

?"Rs. "+value.toLocaleString(

"en-LK",

{

minimumFractionDigits:2,

maximumFractionDigits:2

}

)

:"—";

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||generation!==currentGeneration){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncClock(){

const started=Date.now();

const result=await serverCall(

"getDriverServerTime"

);

const ended=Date.now();

if(!Number.isFinite(result?.serverTimeMs)

||ended-started>10000){

throw new Error("Server time unavailable");

}

serverOffset=

result.serverTimeMs-(started+ended)/2;

clockCheckedAt=ended;

}

function serverNow(){

return Date.now()+serverOffset;

}

function clockValid(){

return clockCheckedAt>0

&&Date.now()-clockCheckedAt<120000;

}

function formatDate(value){

if(!Number.isFinite(value))return "—";

return new Intl.DateTimeFormat(

"en-GB",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(value));

}

function timestamp(value){

const ms=value?.toMillis?.();

return Number.isFinite(ms)?ms:null;

}

// SRI LANKA REPORT PERIODS

function dateKey(date){

return date.toISOString().slice(0,10);

}

function periodInfo(){

const now=new Date(

serverNow()+330*60000

);

const day=new Date(Date.UTC(

now.getUTCFullYear(),

now.getUTCMonth(),

now.getUTCDate()

));

if(selectedPeriod==="day"){

const key=dateKey(day);

return{

id:"day_"+key,

label:key

};

}

if(selectedPeriod==="week"){

const monday=new Date(day);

monday.setUTCDate(

monday.getUTCDate()

-(monday.getUTCDay()+6)%7

);

const sunday=new Date(monday);

sunday.setUTCDate(

sunday.getUTCDate()+6

);

return{

id:"week_"+dateKey(monday),

label:dateKey(monday)

+" — "+dateKey(sunday)

};

}

if(selectedPeriod==="month"){

const key=dateKey(day).slice(0,7);

return{

id:"month_"+key,

label:key

};

}

return{

id:"all",

label:t.allTime

};

}

// GPS CONTINUITY

function validPosition(position){

const c=position.coords;

return Number.isFinite(c.latitude)

&&Number.isFinite(c.longitude)

&&number(c.accuracy)

&&c.accuracy<=100

&&c.latitude>=5.85

&&c.latitude<=9.9

&&c.longitude>=79.5

&&c.longitude<=82

&&Date.now()-position.timestamp<30000

&&position.timestamp<=Date.now()+5000;

}

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

if(!validSession()

||!driver

||!["online","busy"].includes(

driver.availability

)

||!validPosition(position)

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

{

lat:position.coords.latitude,

lon:position.coords.longitude,

accuracy:position.coords.accuracy,

capturedAtMs:position.timestamp

}

);

}catch(e){

// Backend must expire stale GPS data.

}finally{

gpsSending=false;

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// COMMISSION BALANCE VALIDATION

function validBalance(data){

if(!data||data.driverUid!==uid){

return false;

}

const fields=[

"currentCommissionRate",

"paymentDeadlineDays",

"totalCommission",

"paidCommission",

"outstandingCommission",

"overdueCommission"

];

if(!fields.every(key=>number(data[key]))){

return false;

}

if(data.currentCommissionRate>100

||!Number.isInteger(data.paymentDeadlineDays)

||data.paymentDeadlineDays<1){

return false;

}

if(Math.abs(

data.totalCommission

-data.paidCommission

-data.outstandingCommission

)>0.02){

return false;

}

if(data.overdueCommission

>data.outstandingCommission+0.02){

return false;

}

if(data.outstandingCommission>0

&&timestamp(data.nextDueAt)===null){

return false;

}

const updated=timestamp(data.updatedAt);

return updated!==null

&&updated<=serverNow()+30000;

}

// PAYMENT DEADLINE COUNTDOWN

function updateCountdown(){

if(!balance||!clockValid()){

$("countdown").textContent="—";

return;

}

if(balance.outstandingCommission<=0){

$("countdown").textContent="";

return;

}

const dueAt=timestamp(balance.nextDueAt);

if(dueAt===null){

$("countdown").textContent="—";

return;

}

const remaining=dueAt-serverNow();

if(remaining<=0){

$("countdown").textContent=

t.deadlinePassed;

$("countdown").className="red";

$("overdueWarning").hidden=false;

return;

}

const totalMinutes=

Math.ceil(remaining/60000);

const days=Math.floor(

totalMinutes/1440

);

const hours=Math.floor(

(totalMinutes%1440)/60

);

const minutes=totalMinutes%60;

$("countdown").textContent=

t.remaining+": "

+days+" "+t.days+" "

+hours+" "+t.hours+" "

+minutes+" "+t.minutes;

$("countdown").className="note";

}

data.outstandingCommission>0;

data.outstandingCommission<=0;

}

function validRecord(record){

if(!record

||record.driverUid!==uid

||!validId(record.bookingId)){

return false;

}

const fields=[

"grossIncome",

"commissionRate",

"commission",

"paidCommission",

"outstandingCommission",

"completedAtMs",

"dueAtMs"

];

if(!fields.every(key=>number(record[key]))){

return false;

}

if(record.commissionRate>100

||record.dueAtMs<record.completedAtMs

||record.completedAtMs>serverNow()+30000){

return false;

}

if(Math.abs(

record.commission

-record.paidCommission

-record.outstandingCommission

)>0.02){

return false;

}

return true;

}

// SERVER PAGINATION

async function loadLedger(){

if(!validSession()

||!driver

||!activePeriodKey

||ledgerLoading)return;

ledgerLoading=true;

$("loadMoreButton").disabled=true;

$("ledgerStatus").textContent=t.loading;

const currentGeneration=generation;

const currentReportGeneration=

reportGeneration;

const key=activePeriodKey;

try{

const result=await serverCall(

"getDriverCommissionLedger",

{

periodKey:key,

limit:20,

cursor:ledgerCursor

}

);

if(currentGeneration!==generation

||currentReportGeneration!==reportGeneration){

return;

}

if(result?.success!==true

||result.driverUid!==uid

||result.periodKey!==key

||!Array.isArray(result.records)

||result.records.length>20

||!result.records.every(validRecord)){

throw new Error("Invalid ledger");

}

const next=result.nextCursor;

if(next!==null

&&(

typeof next!=="string"

||next.length>2048

||next===ledgerCursor

)){

throw new Error("Invalid cursor");

}

result.records.forEach(record=>{

ledgerRecords.set(

record.bookingId,

record

);

});

ledgerCursor=next;

renderLedger();

$("loadMoreButton").hidden=

ledgerCursor===null;

}catch(e){

if(currentGeneration!==generation

||currentReportGeneration!==reportGeneration){

return;

}

$("ledgerStatus").textContent=t.error;

$("loadMoreButton").hidden=false;

}finally{

if(currentGeneration===generation

&&currentReportGeneration===reportGeneration){

ledgerLoading=false;

$("loadMoreButton").disabled=false;

}

}

}

$("loadMoreButton").onclick=loadLedger;

}

// DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!functions||!db){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true

||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

await syncClock();

if(currentGeneration!==generation)return;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// AUTOMATIC DEADLINE UPDATE

setInterval(()=>{

if(validSession()&&driver){

updateCountdown();

}

},1000);

// AUTOMATIC SERVER TIME SYNC

setInterval(async()=>{

if(!validSession()||!driver)return;

const currentGeneration=generation;

try{

await syncClock();

if(currentGeneration!==generation

||!validSession())return;

const period=periodInfo();

if(activePeriodKey!==period.id

||!reportUnsubscribe){

subscribeReport();

}

updateCountdown();

renderLedger();

}catch(e){

if(currentGeneration!==generation)return;

clockCheckedAt=0;

$("countdown").textContent="—";

$("payButton").hidden=true;

status(t.error);

}

},60000);

// REFRESH

$("refreshButton").onclick=()=>{

if(auth){

verifyDriver(auth.currentUser);

}

};

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

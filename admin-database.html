<title>MY RIDE - Database Management</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:#fff;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:24px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.bad{
color:#FF7777;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
overflow-wrap:anywhere;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Database Management
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>
<button data-lang="en">English</button>
<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"
class="message"
role="status"
aria-live="polite">
Checking security...
</p>

<section id="accessPanel"
class="panel"
hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="databaseStatus"></div>

<p id="lastUpdate"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="dataRecords"></h3>

<div id="recordCounts"
class="grid"></div>

<p class="note"
data-t="countNotice"></p>

</section>

<section class="panel">

<h3 data-t="storage"></h3>

<div id="storageInfo"></div>

</section>

<section class="panel">

<h3 data-t="backupSettings"></h3>

<p id="settingsVersion"
class="note"></p>

<label class="checkRow">

<input id="autoBackup"
type="checkbox">

<span data-t="autoBackup"></span>

</label>

<label for="backupFrequency"
data-t="backupFrequency"></label>

<select id="backupFrequency">

<option value="daily"
data-t="daily"></option>

<option value="weekly"
data-t="weekly"></option>

</select>

<label for="backupTime"
data-t="backupTime"></label>

<input id="backupTime"
type="time">

<label for="backupRetention"
data-t="backupRetention"></label>

<select id="backupRetention">

<option value="7">7 Days</option>
<option value="14">14 Days</option>
<option value="30">30 Days</option>
<option value="60">60 Days</option>
<option value="90">90 Days</option>

</select>

<label for="backupReason"
data-t="reason"></label>

<textarea id="backupReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="confirmBackupSettings"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="saveBackupSettings"
data-t="saveSettings"></button>

</section>

<section class="panel">

<h3 data-t="manualBackup"></h3>

<div id="backupSummary"></div>

<p class="note"
data-t="backupNotice"></p>

<label for="manualReason"
data-t="reason"></label>

<textarea id="manualReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="confirmManualBackup"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="createBackup"
data-t="createBackup"></button>

<p id="backupResult"
class="message"
role="status"></p>

</section>

<section class="panel">

<h3 data-t="backupHistory"></h3>

<label for="backupFilter"
data-t="currentStatus"></label>

<select id="backupFilter">

<option value="all"
data-t="all"></option>

<option value="queued"
data-t="queued"></option>

<option value="running"
data-t="running"></option>

<option value="completed"
data-t="completed"></option>

<option value="failed"
data-t="failed"></option>

<option value="expired"
data-t="expired"></option>

</select>

<button id="loadBackups"
data-t="search"></button>

<div id="backupList"></div>

<button id="moreBackups"
data-t="more"
hidden></button>

</section>

<section id="restorePanel"
class="panel"
hidden>

<h3 data-t="restoreTest"></h3>

<div id="selectedBackupInfo"></div>

<p class="warning"
data-t="restoreNotice"></p>

<label for="restoreReason"
data-t="reason"></label>

<textarea id="restoreReason"
maxlength="500"></textarea>

<label for="restoreConfirmation"
data-t="restoreConfirmation"></label>

<input id="restoreConfirmation"
maxlength="20"
autocomplete="off">

<label class="checkRow">

<input id="confirmRestore"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="requestRestore"
data-t="requestRestore"></button>

<button id="closeRestore"
class="back"
data-t="close"></button>

<p id="restoreResult"
class="message"
role="status"></p>

</section>

<section class="panel">

<h3 data-t="restoreHistory"></h3>

<button id="loadRestores"
data-t="viewHistory"></button>

<div id="restoreList"></div>

<button id="moreRestores"
data-t="more"
hidden></button>

</section>

<section class="panel">

<h3 data-t="integrityCheck"></h3>

<p class="note"
data-t="integrityNotice"></p>

<div id="integritySummary"></div>

<button id="runIntegrity"
data-t="runIntegrity"></button>

<button id="loadIntegrity"
data-t="refresh"></button>

<div id="integrityList"></div>

<p id="integrityResult"
class="message"
role="status"></p>

</section>

<section class="panel">

<h3 data-t="retentionSettings"></h3>

<p class="note"
data-t="retentionNotice"></p>

<p id="retentionVersion"
class="note"></p>

<label for="gpsRetention"
data-t="gpsRetention"></label>

<select id="gpsRetention">

<option value="7">7 Days</option>
<option value="14">14 Days</option>
<option value="30">30 Days</option>
<option value="60">60 Days</option>
<option value="90">90 Days</option>

</select>

<label for="loginRetention"
data-t="loginRetention"></label>

<select id="loginRetention">

<option value="30">30 Days</option>
<option value="90">90 Days</option>
<option value="180">180 Days</option>
<option value="365">365 Days</option>

</select>

<label for="notificationRetention"
data-t="notificationRetention"></label>

<select id="notificationRetention">

<option value="30">30 Days</option>
<option value="60">60 Days</option>
<option value="90">90 Days</option>
<option value="180">180 Days</option>

</select>

<label for="retentionReason"
data-t="reason"></label>

<textarea id="retentionReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="confirmRetention"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="saveRetention"
data-t="saveSettings"></button>

</section>

<section class="panel">

<h3 data-t="auditHistory"></h3>

<button id="loadAudit"
data-t="viewHistory"></button>

<div id="auditList"></div>

<button id="moreAudit"
data-t="more"
hidden></button>

</section>

<section class="panel">

<h3 data-t="relatedPages"></h3>

<a id="securityLink"
class="action"
data-t="securityPage"></a>

<a id="settingsLink"
class="action"
data-t="settingsPage"></a>

<a id="accountLink"
class="action"
data-t="accountPage"></a>

</section>

<p id="result"
class="message"
role="status"
aria-live="polite"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

let restoreCursor=null;
let auditCursor=null;

let backupQuery=null;
let selectedBackup=null;

let integrityReport=null;

let pendingMutation=null;

const messages={

status:"checking",
result:"",
backupResult:"",
restoreResult:"",
integrityResult:""

};

function message(id,key){

messages[id]=key;

$(id).textContent=key?t(key):"";

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,max){

return typeof value==="string"

&&value.length<=max;

}

function validCount(value){

return Number.isSafeInteger(value)

&&value>=0;

}

function nullableCount(value){

return value===null||validCount(value);

}

function validTime(value){

return Number.isFinite(value)

&&value>0

&&value<=8640000000000000;

}

function nullableTime(value){

return value===null||validTime(value);

}

function validCursor(value){

return value===null

||validText(value,4000);

}

function validClock(value){

return typeof value==="string"

&&/^([01]\d|2[0-3]):[0-5]\d$/.test(value);

}

function formatDate(value){

if(!validTime(value))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(value));

}

function formatBytes(value){

if(!validCount(value))return "—";

if(value===0)return "0 B";

const units=["B","KB","MB","GB","TB"];

const index=Math.min(

Math.floor(Math.log(value)/Math.log(1024)),

units.length-1

);

return (

value/Math.pow(1024,index)

).toFixed(index===0?0:2)

+" "+units[index];

}

function pageLink(page){

return "./"+page+"?lang="+encodeURIComponent(lang);

}

function isOwner(){

return authorized

&&ownerUid!==null

&&auth?.currentUser?.uid===ownerUid

&&navigator.onLine;

}

function validOwner(data,uid){

return data?.authorized===true

&&data.uid===uid

&&data.role==="owner"

&&data.ownerUidVerified===true

&&data.sessionValid===true;

}

function addLine(container,label,value){

const line=document.createElement("div");

line.textContent=

t(label)+": "+String(value??"—");

container.appendChild(line);

}

function makeRecord(){

const box=document.createElement("div");

box.className="record";

return box;

}

function makeButton(label,callback){

const button=document.createElement("button");

button.textContent=t(label);

button.dataset.dynamic="true";

button.onclick=callback;

button.disabled=

busy||mutationBusy||!isOwner()

||!!pendingMutation;

return button;

}

function mergeRecords(previous,next,key){

const map=new Map(

previous.map(record=>[record[key],record])

);

next.forEach(record=>{

map.set(record[key],record);

});

return [...map.values()];

}

async function serverCall(name,data={}){

if(!isOwner()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,

name,

{timeout:30000}

)(data);

if(currentGeneration!==generation

||!isOwner()){

throw new Error("Session changed");

}

if(response.data?.success!==true

||response.data.ownerUid!==ownerUid){

throw new Error("Invalid response");

}

return response.data;

}

async function freshOwnerAuthentication(){

if(!isOwner()){

throw new Error("Unauthorized");

}

const user=auth.currentUser;

const uid=user.uid;

const provider=new GoogleAuthProvider();

provider.setCustomParameters({

prompt:"select_account"

});

const credential=await reauthenticateWithPopup(

user,

provider

);

if(credential.user.uid!==uid

||auth.currentUser?.uid!==uid

||!isOwner()){

throw new Error("Owner changed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Invalid owner");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(!validOwner(response.data,uid)

||!isOwner()){

throw new Error("Owner verification failed");

}

}

function validOverview(data){

return data

&&data.projectId==="my-ride-sri-lanka"

&&["connected","disconnected","unknown"]

.includes(data.connection)

&&validText(data.region,100)

&&validTime(data.serverTimeMs)

&&data.counts

&&countKeys.every(key=>

nullableCount(data.counts[key]))

&&data.storage

&&nullableCount(data.storage.databaseBytes)

&&nullableCount(data.storage.backupBytes)

&&nullableCount(data.storage.readsToday)

&&nullableCount(data.storage.writesToday)

&&nullableCount(data.storage.deletesToday)

&&nullableTime(data.lastBackupMs)

&&nullableTime(data.nextBackupMs);

}

storage.replaceChildren();

addLine(

addLine(

storage,

addLine(

addLine(

addLine(

async function loadOverview(){

try{

const response=await serverCall(

"getAdminDatabaseOverview"

);

if(!validOverview(response.overview)){

throw new Error("Invalid overview");

}

overview=response.overview;

renderOverview();

}catch(e){

overview=null;

renderOverview();

throw e;

}

}

function validBackupSettings(data){

return data

&&validCount(data.version)

&&typeof data.autoEnabled==="boolean"

&&["daily","weekly"].includes(data.frequency)

&&validClock(data.time)

&&[7,14,30,60,90].includes(data.retentionDays)

&&data.timeZone==="Asia/Colombo";

}

function validRetentionSettings(data){

return data

&&validCount(data.version)

&&[7,14,30,60,90].includes(data.gpsDays)

&&[30,90,180,365].includes(data.loginDays)

&&[30,60,90,180].includes(data.notificationDays);

}

function renderSettings(){

$("settingsVersion").textContent=

backupSettings

?t("version")+": "+backupSettings.version

:"—";

$("retentionVersion").textContent=

retentionSettings

?t("version")+": "+retentionSettings.version

:"—";

if(!backupDirty){

$("autoBackup").checked=

backupSettings?.autoEnabled===true;

$("backupFrequency").value=

backupSettings?.frequency||"";

$("backupTime").value=

backupSettings?.time||"";

$("backupRetention").value=

backupSettings

?String(backupSettings.retentionDays)

:"";

}

if(!retentionDirty){

$("gpsRetention").value=

retentionSettings

?String(retentionSettings.gpsDays)

:"";

$("loginRetention").value=

retentionSettings

?String(retentionSettings.loginDays)

:"";

$("notificationRetention").value=

retentionSettings

?String(retentionSettings.notificationDays)

:"";

}

}

async function loadSettings(){

const response=await serverCall(

"getAdminDatabaseSettings"

);

if(!validBackupSettings(response.backupSettings)

||!validRetentionSettings(response.retentionSettings)){

throw new Error("Invalid settings");

}

if(!backupDirty){

backupSettings=response.backupSettings;

}

if(!retentionDirty){

retentionSettings=response.retentionSettings;

}

renderSettings();

}

async function runRead(callback){

if(!isOwner()

||busy

||mutationBusy

||pendingMutation)return;

const currentGeneration=generation;

busy=true;

updateControls();

message("result","loading");

try{

await callback();

if(currentGeneration===generation){

message("result","");

}

}catch(e){

if(currentGeneration===generation){

message("result","error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

}

async function runMutation(

name,

payload,

validate,

onSuccess,

resultId="result"

){

if(!isOwner()||busy||mutationBusy)return;

const fingerprint=JSON.stringify({

name,payload

});

if(pendingMutation

&&pendingMutation.fingerprint!==fingerprint){

message(resultId,"saveError");

return;

}

if(!pendingMutation){

pendingMutation={

fingerprint,

name,

requestId:crypto.randomUUID()

};

}

const currentGeneration=generation;

mutationBusy=true;

updateControls();

message(resultId,"saving");

try{

await freshOwnerAuthentication();

if(currentGeneration!==generation

||!isOwner())return;

const response=await serverCall(

name,

{

...payload,

requestId:pendingMutation.requestId

}

);

if(!validate(response)){

throw new Error("Action not confirmed");

}

pendingMutation=null;

await onSuccess(response);

}catch(e){

if(currentGeneration===generation){

message(resultId,"saveError");

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

}

}

}

const backupInputs=[

"autoBackup",
"backupFrequency",
"backupTime",
"backupRetention",
"backupReason"

];

backupInputs.forEach(id=>{

$(id).addEventListener("input",()=>{

backupDirty=true;

$("confirmBackupSettings").checked=false;

updateControls();

});

});

function readBackupSettings(){

if(!backupSettings

||!backupDirty

||!$("confirmBackupSettings").checked)return null;

const settings={

autoEnabled:$("autoBackup").checked,

frequency:$("backupFrequency").value,

time:$("backupTime").value,

retentionDays:Number($("backupRetention").value),

timeZone:"Asia/Colombo"

};

const reason=$("backupReason").value.trim();

if(!validBackupSettings({

...settings,

version:backupSettings.version

})

||reason.length<10

||reason.length>500)return null;

return {

settings,

expectedVersion:backupSettings.version,

reason

};

}

$("saveBackupSettings").onclick=()=>{

const payload=readBackupSettings();

if(!payload){

message("result","invalid");

return;

}

runMutation(

"saveAdminDatabaseBackupSettings",

payload,

response=>

validBackupSettings(response.settings)

&&response.settings.version>payload.expectedVersion

&&Object.keys(payload.settings).every(key=>

response.settings[key]===payload.settings[key]),

async response=>{

backupSettings=response.settings;

backupDirty=false;

$("backupReason").value="";

$("confirmBackupSettings").checked=false;

renderSettings();

message("result","saved");

}

);

};

function readManualBackup(){

const reason=$("manualReason").value.trim();

if(reason.length<10

||reason.length>500

||!$("confirmManualBackup").checked){

return null;

}

return {reason};

}

$("createBackup").onclick=()=>{

const payload=readManualBackup();

if(!payload){

message("backupResult","invalid");

return;

}

runMutation(

"requestAdminDatabaseBackup",

payload,

response=>

response.accepted===true

&&validId(response.backupId),

async()=>{

$("manualReason").value="";

$("confirmManualBackup").checked=false;

message("backupResult","accepted");

try{

await loadOverview();

if(backupQuery){

await loadBackups(true);

}

}catch(e){

message("result","error");

}

},

"backupResult"

);

};

function validBackup(record){

return record

&&validId(record.backupId)

&&["automatic","manual"].includes(record.type)

&&backupStatuses.includes(record.status)

&&validTime(record.createdAtMs)

&&nullableTime(record.completedAtMs)

&&nullableTime(record.expiresAtMs)

&&nullableCount(record.sizeBytes)

&&typeof record.canTestRestore==="boolean"

&&(record.status!=="completed"

||validTime(record.completedAtMs));

}

function backupLines(container,record){

addLine(container,"backupId",record.backupId);

addLine(container,"backupType",t(record.type));

addLine(container,"currentStatus",t(record.status));

addLine(container,"created",formatDate(record.createdAtMs));

addLine(container,"finished",formatDate(record.completedAtMs));

addLine(container,"expires",formatDate(record.expiresAtMs));

addLine(container,"size",formatBytes(record.sizeBytes));

}

function renderBackups(){

const container=$("backupList");

container.replaceChildren();

$("moreBackups").hidden=backupCursor===null;

if(!backupQuery||!isOwner())return;

if(!backupRecords.length){

container.textContent=t("noRecords");

return;

}

backupRecords.forEach(record=>{

const box=makeRecord();

backupLines(box,record);

if(record.status==="completed"

&&record.canTestRestore){

box.appendChild(

makeButton(

"restoreTest",

()=>selectBackup(record)

)

);

}

container.appendChild(box);

});

}

async function loadBackups(reset=true){

if(!backupQuery)return;

const response=await serverCall(

"getAdminDatabaseBackups",

{

status:backupQuery,

limit:30,

cursor:reset?null:backupCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validBackup)

||!validCursor(response.nextCursor)){

throw new Error("Invalid backup records");

}

if(backupQuery!=="all"

&&response.records.some(record=>

record.status!==backupQuery)){

throw new Error("Invalid backup filter");

}

backupRecords=mergeRecords(

reset?[]:backupRecords,

response.records,

"backupId"

);

backupCursor=response.nextCursor;

renderBackups();

}

$("loadBackups").onclick=()=>{

const status=$("backupFilter").value;

if(!["all",...backupStatuses].includes(status)){

message("result","invalid");

return;

}

runRead(async()=>{

backupQuery=status;

backupRecords=[];

backupCursor=null;

renderBackups();

await loadBackups(true);

});

};

$("moreBackups").onclick=()=>{

if(backupCursor!==null){

runRead(()=>loadBackups(false));

}

};

function selectBackup(record){

if(!isOwner()

||busy

||mutationBusy

||pendingMutation

||record.status!=="completed"

||!record.canTestRestore)return;

if($("restoreReason").value.trim()

&&!window.confirm(t("discard")))return;

selectedBackup=record;

$("restoreReason").value="";

$("restoreConfirmation").value="";

$("confirmRestore").checked=false;

message("restoreResult","");

renderSelectedBackup();

updateControls();

$("restorePanel").scrollIntoView({

behavior:"smooth"

});

}

function renderSelectedBackup(){

const container=$("selectedBackupInfo");

container.replaceChildren();

$("restorePanel").hidden=

!selectedBackup||!isOwner();

if(selectedBackup&&isOwner()){

backupLines(container,selectedBackup);

}

}

$("closeRestore").onclick=()=>{

if(busy||mutationBusy||pendingMutation)return;

if($("restoreReason").value.trim()

&&!window.confirm(t("discard")))return;

selectedBackup=null;

$("restoreReason").value="";

$("restoreConfirmation").value="";

$("confirmRestore").checked=false;

renderSelectedBackup();

updateControls();

};

function readRestore(){

if(!selectedBackup

||selectedBackup.status!=="completed"

||!selectedBackup.canTestRestore

||!$("confirmRestore").checked)return null;

const reason=$("restoreReason").value.trim();

const confirmation=

$("restoreConfirmation").value.trim();

if(reason.length<10

||reason.length>500

||confirmation!=="TEST RESTORE"){

return null;

}

return {

backupId:selectedBackup.backupId,

target:"isolated_test_database",

reason

};

}

$("requestRestore").onclick=()=>{

const payload=readRestore();

if(!payload){

message("restoreResult","invalid");

return;

}

runMutation(

"requestAdminDatabaseRestoreTest",

payload,

response=>

response.accepted===true

&&validId(response.testId)

&&response.target==="isolated_test_database",

async()=>{

$("restoreReason").value="";

$("restoreConfirmation").value="";

$("confirmRestore").checked=false;

message("restoreResult","accepted");

try{

await loadRestores(true);

}catch(e){

message("result","error");

}

},

"restoreResult"

);

};

function validRestore(record){

return record

&&validId(record.testId)

&&validId(record.backupId)

&&jobStatuses.includes(record.status)

&&record.target==="isolated_test_database"

&&validTime(record.createdAtMs)

&&nullableTime(record.completedAtMs);

}

container.replaceChildren();

$("moreRestores").hidden=restoreCursor===null;

addLine(box,"testId",record.testId);

$("loadRestores").onclick=()=>{

runRead(()=>loadRestores(true));

};

$("moreRestores").onclick=()=>{

if(restoreCursor!==null){

runRead(()=>loadRestores(false));

}

};

function validIntegrity(report){

return report

&&validId(report.testId)

&&jobStatuses.includes(report.status)

&&validTime(report.createdAtMs)

&&nullableTime(report.completedAtMs)

&&(

report.status==="completed"

?report.counts

&&integrityKeys.every(key=>

validCount(report.counts[key]))

:report.counts===null

);

}

function renderIntegrity(){

const summary=$("integritySummary");

const container=$("integrityList");

summary.replaceChildren();

container.replaceChildren();

if(!integrityReport){

summary.textContent=t("unknown");

return;

}

addLine(summary,"testId",integrityReport.testId);

addLine(

summary,

"currentStatus",

t(integrityReport.status)

);

addLine(

summary,

"created",

formatDate(integrityReport.createdAtMs)

);

addLine(

summary,

"finished",

formatDate(integrityReport.completedAtMs)

);

if(integrityReport.status!=="completed")return;

integrityKeys.forEach(key=>{

const box=makeRecord();

addLine(

box,

key,

integrityReport.counts[key]

);

box.classList.add(

integrityReport.counts[key]>0

?"warning":"good"

);

container.appendChild(box);

});

}

async function loadIntegrity(){

try{

const response=await serverCall(

"getAdminDatabaseIntegrityReport"

);

if(response.report!==null

&&!validIntegrity(response.report)){

}

integrityReport=response.report;

renderIntegrity();

}catch(e){

integrityReport=null;

renderIntegrity();

throw e;

}

}

runMutation(

"requestAdminDatabaseIntegrityCheck",

{mode:"read_only"},

response=>

response.accepted===true

&&validId(response.testId),

async()=>{

try{

await loadIntegrity();

}catch(e){

message("result","error");

}

},

"integrityResult"

);

};

$("loadIntegrity").onclick=()=>{

runRead(loadIntegrity);

};

"notificationRetention",
"retentionReason"

retentionInputs.forEach(id=>{

retentionDirty=true;

function readRetention(){

if(!retentionSettings

||!retentionDirty

||!$("confirmRetention").checked)return null;

loginDays:Number($("loginRetention").value),

reason,

runMutation(

payload,

&&response.settings.version>payload.expectedVersion

&&Object.keys(payload.settings).every(key=>

retentionDirty=false;

$("confirmRetention").checked=false;

const mutationInputs=[

...backupInputs,

"confirmBackupSettings",

"manualReason",
"confirmManualBackup",

"restoreReason",
"restoreConfirmation",
"confirmRestore",

...retentionInputs,

"confirmRetention"

];

mutationInputs.forEach(id=>{

$(id).addEventListener("input",updateControls);

$(id).addEventListener("change",updateControls);

});

[

["manualReason","confirmManualBackup"],

["restoreReason","confirmRestore"],

["restoreConfirmation","confirmRestore"]

].forEach(([id,confirmId])=>{

$(id).addEventListener("input",()=>{

$(confirmId).checked=false;

updateControls();

});

});

function updateControls(){

const locked=

busy||mutationBusy||!isOwner();

const pending=!!pendingMutation;

[

"refreshButton",
"backupFilter",
"loadBackups",
"moreBackups",
"closeRestore",
"loadRestores",
"moreRestores",
"loadIntegrity",
"loadAudit",
"moreAudit"

].forEach(id=>{

$(id).disabled=locked||pending;

});

document.querySelectorAll("[data-dynamic]")

.forEach(button=>{

button.disabled=locked||pending;

});

mutationInputs.forEach(id=>{

$(id).disabled=locked||pending;

});

backupInputs.forEach(id=>{

$(id).disabled=

locked||pending||!backupSettings;

});

$("confirmBackupSettings").disabled=

locked||pending||!backupSettings;

retentionInputs.forEach(id=>{

$(id).disabled=

locked||pending||!retentionSettings;

});

$("confirmRetention").disabled=

locked||pending||!retentionSettings;

function mutationAllowed(name){

return !locked

&&(!pendingMutation

||pendingMutation.name===name);

}

$("saveBackupSettings").disabled=

!mutationAllowed("saveAdminDatabaseBackupSettings")

||!readBackupSettings();

$("createBackup").disabled=

!mutationAllowed("requestAdminDatabaseBackup")

||!readManualBackup();

$("requestRestore").disabled=

!mutationAllowed("requestAdminDatabaseRestoreTest")

||!readRestore();

$("runIntegrity").disabled=

!mutationAllowed("requestAdminDatabaseIntegrityCheck");

$("saveRetention").disabled=

!mutationAllowed("saveAdminDatabaseRetentionSettings")

||!readRetention();

}

function renderLanguage(){

document.documentElement.lang=lang;

document.querySelectorAll("[data-t]")

.forEach(element=>{

element.textContent=t(element.dataset.t);

});

const links={

loginLink:"admin-login.html",

dashboardLink:"admin-dashboard.html",

backLink:"admin-dashboard.html",

securityLink:"admin-security.html",

settingsLink:"admin-settings.html",

accountLink:"admin-account.html"

};

Object.entries(links).forEach(([id,page])=>{

$(id).href=pageLink(page);

});

Object.keys(messages).forEach(id=>{

message(id,messages[id]);

});

renderOverview();

renderSettings();

renderBackups();

renderSelectedBackup();

renderRestores();

renderIntegrity();

renderAudit();

updateControls();

}

document.querySelectorAll("[data-lang]")

.forEach(button=>{

button.onclick=()=>{

if(!languages.includes(button.dataset.lang))return;

lang=button.dataset.lang;

try{

localStorage.setItem(

"myride_admin_language",

lang

);

const url=new URL(location.href);

url.searchParams.set("lang",lang);

history.replaceState(null,"",url);

}catch(e){}

renderLanguage();

};

});

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

overview=null;

backupSettings=null;

retentionSettings=null;

backupDirty=false;

retentionDirty=false;

backupRecords=[];

restoreRecords=[];

auditRecords=[];

backupCursor=null;

restoreCursor=null;

auditCursor=null;

backupQuery=null;

selectedBackup=null;

integrityReport=null;

pendingMutation=null;

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("restorePanel").hidden=true;

[

"backupReason",
"manualReason",
"restoreReason",
"restoreConfirmation",
"retentionReason"

].forEach(id=>{

$(id).value="";

});

[

"confirmBackupSettings",
"confirmManualBackup",
"confirmRestore",
"confirmRetention"

].forEach(id=>{

$(id).checked=false;

});

$("backupFilter").value="all";

[

"result",
"backupResult",
"restoreResult",
"integrityResult"

].forEach(id=>{

message(id,"");

});

renderLanguage();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

message("status","denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

message("status","offline");

return;

}

message("status","checking");

try{

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

message("status","verified");

updateControls();

await runRead(async()=>{

await loadOverview();

await loadSettings();

backupQuery="all";

await loadBackups(true);

await loadIntegrity();

});

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

setInterval(async()=>{

if(!isOwner()

||checking

||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation)return;

if(!validOwner(response.data,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||pendingMutation

||document.hidden)return;

runRead(async()=>{

await loadOverview();

await loadIntegrity();

if(backupQuery

&&backupCursor===null

&&!selectedBackup){

await loadBackups(true);

}

});

},60000);

window.addEventListener("offline",()=>{

clearSession();

message("status","offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(backupDirty

||retentionDirty

||mutationBusy

||pendingMutation

||$("manualReason").value.trim()

||$("restoreReason").value.trim()){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderLanguage();

updateControls();

initializeSecurity();

</script>

</body>
</html>

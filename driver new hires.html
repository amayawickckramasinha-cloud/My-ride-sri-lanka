h2{

.request{

}

.label{

color:#CCC;
}

.money{

.green{
color:#4ADE80;
}

.red{

}

.actions{

button,.action{

padding:16px;

.accept{

.reject{

#status{

#countdown{

footer{

let bookingUnsubscribe=null;

let gpsWatch=null;
let lastGpsSent=0;
let lastGpsConfirmed=0;
let gpsSending=false;

let generation=0;
let bookingGeneration=0;
let busy=false;

let serverOffset=0;
let clockCheckedAt=0;

let pendingDecision=null;

function status(message){

$("status").textContent=message;

}

try{

const app=initializeApp(firebaseConfig);

initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

db=getFirestore(app);

functions=getFunctions(app);

}catch(e){

status(t.connection);

}

// SESSION SECURITY

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function number(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0;

}

function money(value){

return number(value)

?"Rs. "+value.toLocaleString(

"en-LK",

{maximumFractionDigits:2}

)

:"—";

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const currentUid=uid;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||generation!==currentGeneration

||uid!==currentUid){

throw new Error("Session changed");

}

return response.data;

}

// CLEAR PRIVATE DATA

function hidePanels(){

$("waitingPanel").hidden=true;

$("offlinePanel").hidden=true;

$("requestPanel").hidden=true;

$("acceptedPanel").hidden=true;

}

function clearCustomer(){

bookingGeneration++;

if(bookingUnsubscribe){

bookingUnsubscribe();

bookingUnsubscribe=null;

}

$("acceptedPanel").hidden=true;

$("customerName").textContent="—";

$("customerPhone").textContent="—";

$("customerWhatsApp").textContent="—";

[

"callButton",

"whatsappButton",

"activeButton"

].forEach(id=>{

$(id).hidden=true;

$(id).removeAttribute("href");

});

}

function clearOffer(){

offer=null;

$("requestPanel").hidden=true;

$("acceptButton").disabled=true;

$("rejectButton").disabled=true;

}

// DRIVER GPS

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

lastGpsConfirmed=0;

}

function validPosition(position){

const c=position.coords;

return Number.isFinite(c.latitude)

&&Number.isFinite(c.longitude)

&&Number.isFinite(c.accuracy)

&&c.latitude>=5.85

&&c.latitude<=9.9

&&c.longitude>=79.5

&&c.longitude<=82

&&c.accuracy>=0

&&c.accuracy<=100

&&Date.now()-position.timestamp<30000

&&position.timestamp<=Date.now()+5000;

}

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

if(!validSession()

||!driver

||!["online","busy"].includes(driver.availability)

||!validPosition(position)

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

const result=await serverCall(

"updateDriverLocation",

{

lat:position.coords.latitude,

lon:position.coords.longitude,

accuracy:position.coords.accuracy,

capturedAtMs:position.timestamp

}

);

if(result?.accepted===true){

lastGpsConfirmed=Date.now();

}else{

lastGpsConfirmed=0;

}

}catch(e){

lastGpsConfirmed=0;

}finally{

gpsSending=false;

updateCountdown();

}

},

()=>{

lastGpsConfirmed=0;

updateCountdown();

},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

// DISCONNECT

function disconnect(){

generation++;

authorized=false;

uid=null;

driver=null;

clockCheckedAt=0;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

if(offerUnsubscribe){

offerUnsubscribe();

offerUnsubscribe=null;

}

stopGps();

clearOffer();

clearCustomer();

hidePanels();

}

// SERVER TIME

async function syncClock(){

const started=Date.now();

const result=await serverCall(

"getDriverServerTime"

);

const ended=Date.now();

if(!Number.isFinite(result?.serverTimeMs)

||ended-started>10000){

throw new Error("Clock unavailable");

}

serverOffset=

result.serverTimeMs-(started+ended)/2;

clockCheckedAt=ended;

}

function serverNow(){

return Date.now()+serverOffset;

}

// OFFER VALIDATION

function validOffer(data){

if(!data

||data.driverUid!==uid

||data.status!=="offered"

||!validId(data.offerId)

||!validId(data.bookingId)

||typeof data.pickupName!=="string"

||typeof data.destinationName!=="string"

||typeof data.date!=="string"

||typeof data.time!=="string"

||!["bike","tuk","car","van"]

.includes(data.vehicle)

||!Number.isInteger(data.passengers)

||data.passengers<1

||!number(data.estimatedDistance)

||!number(data.estimatedDuration)

||!number(data.estimatedFare)

||!number(data.commissionRate)

||data.commissionRate>100

||!number(data.estimatedCommission)

||!number(data.estimatedDriverIncome)){

return false;

}

const expiry=data.expiresAt?.toMillis?.();

const created=data.createdAt?.toMillis?.();

if(!Number.isFinite(expiry)

||!Number.isFinite(created)

||expiry<=created){

return false;

}

if(Math.abs(

data.estimatedFare

-data.estimatedCommission

-data.estimatedDriverIncome

)>0.02){

return false;

}

return true;

}

// OFFER DISPLAY

function displayOffer(data){

if(!validOffer(data)){

clearOffer();

return;

}

if(!driver

||driver.availability!=="online"){

clearOffer();

return;

}

offer=data;

hidePanels();

$("bookingId").textContent=

"Booking ID: "+data.bookingId;

$("pickup").textContent=data.pickupName;

$("destination").textContent=data.destinationName;

$("date").textContent=data.date;

$("time").textContent=data.time;

$("passengers").textContent=data.passengers;

$("vehicle").textContent=t[data.vehicle];

$("distance").textContent=

data.estimatedDistance.toFixed(2)+" KM";

$("duration").textContent=

Math.ceil(data.estimatedDuration)

+" "+t.minutes;

$("fare").textContent=

money(data.estimatedFare);

$("commissionLabel").textContent=

t.commission+" "+data.commissionRate+"%";

$("commission").textContent=

money(data.estimatedCommission);

$("income").textContent=

money(data.estimatedDriverIncome);

$("requestPanel").hidden=false;

updateCountdown();

}

// ACCEPT / REJECT COUNTDOWN

function updateCountdown(){

if(!offer){

$("acceptButton").disabled=true;

$("rejectButton").disabled=true;

return;

}

const expiry=offer.expiresAt.toMillis();

const created=offer.createdAt.toMillis();

const clockValid=

clockCheckedAt>0

&&Date.now()-clockCheckedAt<120000;

const remaining=Math.max(

0,

Math.ceil((expiry-serverNow())/1000)

);

$("countdown").textContent=

clockValid?remaining+" s":"—";

const progress=Math.max(

0,

Math.min(

100,

(expiry-serverNow())/(expiry-created)*100

)

);

$("progressBar").style.width=

(clockValid?progress:0)+"%";

const available=

validSession()

&&driver?.availability==="online"

&&clockValid

&&remaining>0

&&!busy;

const gpsFresh=

lastGpsConfirmed>0

&&Date.now()-lastGpsConfirmed<30000;

$("acceptButton").disabled=

!available||!gpsFresh;

$("rejectButton").disabled=

!available;

if(clockValid&&remaining===0){

status(t.expired);

}

}

setInterval(updateCountdown,1000);

// AUTOMATIC OFFER LISTENER

function subscribeOffers(){

if(offerUnsubscribe){

offerUnsubscribe();

offerUnsubscribe=null;

}

if(!validSession())return;

const currentGeneration=generation;

const ref=doc(

db,

"driverOffers",

uid

);

offerUnsubscribe=onSnapshot(

ref,

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

clearOffer();

return;

}

if(!driver

||driver.availability!=="online"){

clearOffer();

return;

}

if(!snapshot.exists()

||snapshot.data().status!=="offered"){

clearOffer();

hidePanels();

$("waitingPanel").hidden=false;

return;

}

displayOffer(snapshot.data());

},

error=>{

if(currentGeneration!==generation)return;

clearOffer();

status(t.connection);

}

);

}

// CUSTOMER PHONE VALIDATION

function normalizePhone(value){

if(typeof value!=="string")return null;

const phone=value.replace(/[\s-]/g,"");

if(!/^(?:\+94|94|0)7\d{8}$/.test(phone)){

return null;

}

return "+94"+phone.slice(-9);

}

// ACCEPTED BOOKING DETAILS

function subscribeAcceptedBooking(bookingId){

clearCustomer();

if(!validSession()

||!validId(bookingId))return;

const currentGeneration=generation;

const currentBookingGeneration=bookingGeneration;

const ref=doc(db,"bookings",bookingId);

bookingUnsubscribe=onSnapshot(

ref,

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||currentBookingGeneration!==bookingGeneration

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

$("acceptedPanel").hidden=true;

return;

}

if(!snapshot.exists()){

clearCustomer();

return;

}

const data=snapshot.data();

if(data.assignedDriver?.uid!==uid

||!["accepted","arrived","active","scheduled"]

.includes(data.status)){

clearCustomer();

return;

}

clearOffer();

hidePanels();

$("customerName").textContent=

typeof data.customerName==="string"

?data.customerName:"—";

const phone=normalizePhone(

data.customerPhone

);

const whatsapp=normalizePhone(

data.customerWhatsApp

);

$("customerPhone").textContent=

phone||"—";

$("customerWhatsApp").textContent=

data.whatsappConsent===true

?whatsapp||"—":"—";

$("callButton").hidden=true;

$("whatsappButton").hidden=true;

if(phone){

$("callButton").href="tel:"+phone;

$("callButton").hidden=false;

}

if(whatsapp

&&data.whatsappConsent===true){

const customerLanguage=

languages.includes(data.language)

?data.language:"si";

const driverName=

String(driver?.fullName||"MY RIDE Driver");

const driverPhone=

normalizePhone(driver?.phone)||"";

const trackingUrl=new URL(

"./tracking.html",

location.href

);

trackingUrl.searchParams.set(

"booking",bookingId

);

trackingUrl.searchParams.set(

"lang",customerLanguage

);

const messages={

si:

"ආයුබෝවන්! මම ඔබගේ MY RIDE රියදුරු "+driverName+".\nදුරකථන අංකය: "+driverPhone+"\nBooking ID: "+bookingId+"\nඔබගේ හයර් එක භාරගෙන ඇත.\n"+trackingUrl.href,

en:

"Hello! I am your MY RIDE driver "+driverName+".\nPhone: "+driverPhone+"\nBooking ID: "+bookingId+"\nYour ride has been accepted.\n"+trackingUrl.href,

ta:

"வணக்கம்! நான் உங்கள் MY RIDE சாரதி "+driverName+".\nதொலைபேசி: "+driverPhone+"\nBooking ID: "+bookingId+"\nஉங்கள் பயணம் ஏற்கப்பட்டது.\n"+trackingUrl.href

};

$("whatsappButton").href=

"https://wa.me/"

+whatsapp.replace("+","")

+"?text="

+encodeURIComponent(

messages[customerLanguage]

);

$("whatsappButton").target="_blank";

$("whatsappButton").rel="noopener noreferrer";

$("whatsappButton").hidden=false;

}

const page=data.status==="scheduled"

?"driver-scheduled.html"

:"driver-active-ride.html";

$("activeButton").href=

"./"+page

+"?lang="+lang

+"&booking="+encodeURIComponent(bookingId);

$("activeButton").hidden=false;

$("acceptedPanel").hidden=false;

status("");

},

error=>{

if(currentGeneration!==generation

||currentBookingGeneration!==bookingGeneration)return;

clearCustomer();

status(t.connection);

}

);

}

// DRIVER STATUS LISTENER

function subscribeDriver(){

const currentGeneration=generation;

const ref=doc(db,"drivers",uid);

driverUnsubscribe=onSnapshot(

ref,

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

driver=null;

stopGps();

clearOffer();

clearCustomer();

hidePanels();

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true){

disconnect();

status(t.denied);

return;

}

driver=data;

if(data.availability==="busy"){

clearOffer();

hidePanels();

startGps();

if(offerUnsubscribe){

offerUnsubscribe();

offerUnsubscribe=null;

}

if(validId(data.activeBookingId)){

subscribeAcceptedBooking(

data.activeBookingId

);

}else{

status(t.busy);

}

return;

}

clearCustomer();

if(data.availability!=="online"){

stopGps();

clearOffer();

hidePanels();

if(offerUnsubscribe){

offerUnsubscribe();

offerUnsubscribe=null;

}

$("offlinePanel").hidden=false;

return;

}

startGps();

if(!offer){

hidePanels();

$("waitingPanel").hidden=false;

}

if(!offerUnsubscribe){

subscribeOffers();

}

},

error=>{

if(currentGeneration!==generation)return;

disconnect();

status(t.denied);

}

);

}

// ACCEPT OR REJECT

async function respondToOffer(decision){

if(busy

||!validSession()

||!offer

||driver?.availability!=="online")return;

if(Date.now()-clockCheckedAt>=120000

||serverNow()>=offer.expiresAt.toMillis()){

status(t.expired);

return;

}

if(decision==="accept"

&&(!lastGpsConfirmed

||Date.now()-lastGpsConfirmed>=30000)){

return;

}

if(!confirm(

decision==="accept"

?t.confirmAccept:t.confirmReject

))return;

const selectedOffer=offer;

if(!pendingDecision

||pendingDecision.offerId!==selectedOffer.offerId

||pendingDecision.decision!==decision){

pendingDecision={

offerId:selectedOffer.offerId,

decision,

requestId:crypto.randomUUID()

};

}

busy=true;

updateCountdown();

status(t.processing);

try{

const result=await serverCall(

"respondToDriverOffer",

{

offerId:selectedOffer.offerId,

bookingId:selectedOffer.bookingId,

decision,

requestId:pendingDecision.requestId

}

);

if(result?.success!==true){

throw new Error("Decision failed");

}

if(decision==="accept"){

if(result.status!=="accepted"

||result.bookingId!==selectedOffer.bookingId){

throw new Error("Invalid assignment");

}

clearOffer();

subscribeAcceptedBooking(

result.bookingId

);

}else{

if(result.status!=="rejected"){

throw new Error("Rejection failed");

}

clearOffer();

status(t.rejected);

}

pendingDecision=null;

}catch(e){

status(t.failed);

}finally{

busy=false;

updateCountdown();

}

}

$("acceptButton").onclick=

()=>respondToOffer("accept");

$("rejectButton").onclick=

()=>respondToOffer("reject");

// VERIFY DRIVER ACCOUNT

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!functions||!db){

status(t.denied);

return;

}

if(!navigator.onLine){

status(t.noInternet);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true){

throw new Error("Driver role required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const data=response.data;

if(data?.authorized!==true

||data.uid!==user.uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

await syncClock();

if(currentGeneration!==generation)return;

subscribeDriver();

status("");

}catch(e){

if(currentGeneration!==generation)return;

disconnect();

status(t.denied);

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// REFRESH SERVER CLOCK

setInterval(async()=>{

if(!validSession())return;

try{

await syncClock();

}catch(e){

clockCheckedAt=0;

}

updateCountdown();

},60000);

// REFRESH

$("refreshButton").onclick=()=>{

if(auth&&!busy){

verifyDriver(auth.currentUser);

}

};

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

disconnect();

status(t.noInternet);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

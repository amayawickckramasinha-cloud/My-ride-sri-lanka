
<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="robots"
content="noindex,nofollow,noarchive">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Owner Admin Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111111;
color:#ffffff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

header{
text-align:center;
padding:15px 0;
}

h1{
color:#FFD600;
font-size:38px;
margin:8px 0;
}

.country{
color:#FFD600;
letter-spacing:5px;
font-size:13px;
}

h2{
font-size:22px;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.ownerIcon{
width:80px;
height:80px;
background:#FFD600;
color:#111;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:20px auto;
}

.statsGrid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border:1px solid #444;
border-radius:10px;
padding:15px 10px;
min-height:110px;
}

.stat span{
display:block;
color:#CCC;
font-size:13px;
line-height:1.7;
}

.stat strong{
display:block;
color:#FFD600;
font-size:23px;
margin-top:10px;
overflow-wrap:anywhere;
}

.menuGrid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.menuButton{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
min-height:115px;
background:#FFD600;
color:#111;
border-radius:12px;
padding:14px 8px;
text-decoration:none;
font-weight:bold;
font-size:14px;
line-height:1.7;
}

.menuButton:hover{
background:#FFE44D;
}

.menuIcon{
font-size:29px;
margin-bottom:8px;
}

.menuNumber{
font-size:11px;
opacity:.7;
}

.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-weight:bold;
font-size:14px;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.danger{
background:#A51D2D;
color:#fff;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
border-bottom:1px solid #444;
padding:12px 0;
font-size:14px;
line-height:1.8;
}

.row strong{
max-width:60%;
text-align:right;
overflow-wrap:anywhere;
}

.green{
color:#4ADE80!important;
}

.red{
color:#FF6464!important;
}

.yellow{
color:#FFD600!important;
}

.notice{
background:#302C17;
border:1px solid #FFD600;
border-radius:10px;
padding:14px;
margin:12px 0;
line-height:1.8;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:14px;
margin:12px 0;
line-height:1.8;
}

.note{
color:#BBB;
font-size:13px;
line-height:1.8;
}

.languageGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.languageButton{
background:#292929;
color:#FFD600;
border:1px solid #FFD600;
border-radius:7px;
padding:12px 4px;
cursor:pointer;
}

.languageButton.selected{
background:#FFD600;
color:#111;
}

textarea,input{
width:100%;
background:#292929;
color:#fff;
border:1px solid #666;
border-radius:8px;
padding:12px;
font-size:16px;
margin:8px 0;
font-family:inherit;
}

textarea{
min-height:100px;
resize:vertical;
}

.alertItem{
background:#292929;
border:1px solid #555;
border-radius:9px;
padding:13px;
margin:10px 0;
overflow-wrap:anywhere;
white-space:pre-wrap;
line-height:1.8;
}

.alertItem.urgent{
border-color:#FF6464;
}

#status,#actionStatus{
text-align:center;
line-height:1.8;
overflow-wrap:anywhere;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#999;
font-size:12px;
padding:25px 0;
}

[hidden]{
display:none!important;
}

@media(min-width:700px){

.statsGrid{
grid-template-columns:repeat(4,minmax(0,1fr));
}

.menuGrid{
grid-template-columns:repeat(4,minmax(0,1fr));
}

}

</style>
</head>

<body>

<main>

<header>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<div class="ownerIcon">

<svg width="48" height="48"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.7"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11"/>

<path d="m9 12 2 2 4-4"/>

</svg>

</div>

<h2 data-t="heading">
Owner Admin Dashboard
</h2>

</header>

<div class="languageGrid">

<button class="languageButton"
data-lang="si">සිංහල</button>

<button class="languageButton"
data-lang="en">English</button>

<button class="languageButton"
data-lang="ta">தமிழ்</button>

</div>

<p id="status"
class="yellow"
role="status"
aria-live="polite">
Checking owner authorization...
</p>

<section id="accessPanel"
class="panel" hidden>

<div class="warning"
data-t="accessDenied"></div>

<a id="loginLink"
class="action"
data-t="login"></a>

<button id="retryButton"
class="action secondary"
data-t="refresh"></button>

</section>

<div id="dashboard" hidden>

<section class="panel">

<h3 data-t="ownerAccount"></h3>

<div class="row">

<span data-t="ownerName"></span>

<strong id="ownerName">—</strong>

</div>

<div class="row">

<span data-t="ownerEmail"></span>

<strong id="ownerEmail">—</strong>

</div>

<div class="row">

<span data-t="authorization"></span>

<strong id="ownerAuthorization"
class="green">—</strong>

</div>

<div class="row">

<span data-t="serverTime"></span>

<strong id="serverTime">—</strong>

</div>

<div class="row">

<span data-t="systemStatus"></span>

<strong id="systemStatus">—</strong>

</div>

</section>

<div id="systemWarning"
class="warning" hidden></div>

<section class="panel">

<h3 data-t="todayOverview"></h3>

<p id="reportDate"
class="note">—</p>

<div id="statsGrid"
class="statsGrid"></div>

</section>

<section class="panel">

<h3 data-t="driverOverview"></h3>

<div id="driverStats"
class="statsGrid"></div>

</section>

<section class="panel">

<h3 data-t="financialOverview"></h3>

<div id="financialStats"
class="statsGrid"></div>

</section>

<section class="panel">

<h3 data-t="pendingOverview"></h3>

<div id="pendingStats"
class="statsGrid"></div>

</section>

<section class="panel">

<h3 data-t="mainMenus"></h3>

<div id="menuGrid"
class="menuGrid"></div>

</section>

<section class="panel">

<h3 data-t="securityAlerts"></h3>

<div id="securityAlerts"></div>

<a id="securityLink"
class="action secondary"
data-t="openSecurity"></a>

</section>

<section class="panel">

<h3 data-t="emergencyControl"></h3>

<p class="note"
data-t="emergencyNote"></p>

<div class="row">

<span data-t="emergencyLock"></span>

<strong id="lockStatus">—</strong>

</div>

<button id="lockButton"
class="action danger"
data-t="enableLock"
disabled></button>

<button id="unlockButton"
class="action"
data-t="disableLock"
disabled></button>

<form id="emergencyForm" hidden>

<label for="lockReason"
data-t="reason"></label>

<textarea id="lockReason"
minlength="10"
maxlength="500"
required></textarea>

<p id="confirmationInstruction"
class="note"></p>

<input id="confirmationText"
autocomplete="off"
maxlength="20"
required>

<button id="confirmEmergency"
type="submit"
class="action danger"
data-t="confirm"></button>

<button id="cancelEmergency"
type="button"
class="action secondary"
data-t="cancel"></button>

</form>

<p id="actionStatus"
role="status"
aria-live="polite"></p>

</section>

<section class="panel">

<h3 data-t="connectionDetails"></h3>

<div class="row">

<span data-t="authentication"></span>

<strong id="authStatus">—</strong>

</div>

<div class="row">

<span>Firebase App Check</span>

<strong id="appCheckStatus">—</strong>

</div>

<div class="row">

<span data-t="database"></span>

<strong id="databaseStatus">—</strong>

</div>

<div class="row">

<span data-t="lastUpdated"></span>

<strong id="lastUpdated">—</strong>

</div>

<button id="refreshButton"
class="action"
data-t="refresh"></button>

</section>

<button id="logoutButton"
class="action secondary"
data-t="logout"></button>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// VALIDATION HELPERS

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&appCheckReady

&&navigator.onLine;

}

function validCount(value){

return Number.isSafeInteger(value)

&&value>=0;

}

function validMoney(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0

&&value<=1000000000000

&&Math.abs(

value*100-Math.round(value*100)

)<0.01;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function timestampMs(value){

if(!value
||typeof value.toMillis!=="function"){

return null;

}

const ms=value.toMillis();

return Number.isFinite(ms)

&&ms>0

&&ms<=8640000000000000

?ms:null;

}

function validDate(value){

if(typeof value!=="string"

||!/^\d{4}-\d{2}-\d{2}$/.test(value)){

return false;

}

const date=new Date(value+"T00:00:00Z");

return Number.isFinite(date.getTime())

&&date.toISOString().slice(0,10)===value;

}

function validTranslations(value){

return value

&&LANGUAGES.every(language=>

typeof value[language]==="string"

&&value[language].length<=2000

);

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,

name,

{timeout:20000}

)(data);

if(!validSession()

||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncServerTime(){

const start=Date.now();

const result=await serverCall(
"getOwnerServerTime"
);

const end=Date.now();

if(

typeof result?.serverTimeMs!=="number"

||!Number.isFinite(result.serverTimeMs)

||result.serverTimeMs<=0

||result.serverTimeMs>8640000000000000

||end-start>10000

){

throw new Error("Invalid server time");

}

serverOffset=

result.serverTimeMs-(start+end)/2;

serverSyncAt=end;

renderClock();

}

function serverNow(){

if(serverOffset===null

||Date.now()-serverSyncAt>120000){

return null;

}

return Date.now()+serverOffset;

}

function sriLankaToday(){

const now=serverNow();

if(now===null)return null;

return new Date(now+330*60000)

.toISOString().slice(0,10);

}

function formatDate(ms){

if(typeof ms!=="number"

||!Number.isFinite(ms))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"medium"

}

).format(new Date(ms));

}

function renderClock(){

setValue(

"serverTime",

formatDate(serverNow())

);

}

function formatMoney(value){

if(!validMoney(value))return "—";

return "LKR "+

new Intl.NumberFormat("en-LK",{

minimumFractionDigits:2,

maximumFractionDigits:2

}).format(value);

}

// VALIDATE SERVER DASHBOARD DATA

function validDashboard(data){

if(!data

||!validDate(data.reportDate)

||timestampMs(data.updatedAt)===null

||!validCount(data.revision)){

return false;

}

const countKeys=[

...rideKeys,

...driverKeys,

...pendingKeys

];

if(!countKeys.every(
key=>validCount(data[key])
)){

return false;

}

if(!moneyKeys.every(
key=>validMoney(data[key])
)){

return false;

}

if(

data.overdueCommission>

data.outstandingCommission

||data.approvedDrivers>data.totalDrivers

||data.onlineDrivers+

data.offlineDrivers+

data.busyDrivers>

data.approvedDrivers

||Math.abs(

data.grossIncome-

data.driverIncome-

data.commissionEarned

)>0.02

){

return false;

}

return true;

}

// OWNER AUTHORIZATION

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user||!auth||!functions){

denyAccess();

return;

}

if(!navigator.onLine){

showStatus("offline");

return;

}

showStatus("checking");

try{

const appToken=await getToken(

appCheck,false

);

if(currentGeneration!==generation)return;

if(

typeof appToken?.token!=="string"

||appToken.token.length===0

){

throw new Error("App Check failed");

}

appCheckReady=true;

const token=await user.getIdTokenResult(true);

if(currentGeneration!==generation)return;

if(

token.signInProvider!=="google.com"

||token.claims.email_verified!==true

||token.claims.ownerAdmin!==true

){

throw new Error("Owner claim missing");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(

currentGeneration!==generation

||auth.currentUser?.uid!==user.uid

){

return;

}

const result=response.data;

if(

result?.authorized!==true

||result.uid!==user.uid

||result.role!=="owner"

||result.ownerUidVerified!==true

||result.sessionValid!==true

){

throw new Error("Owner denied");

}

uid=user.uid;

authorized=true;

renderOwner();

showStatus("loading");

subscribeDashboard();

try{

await syncServerTime();

}catch(e){

serverOffset=null;

}

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

function openEmergencyForm(action){

if(!validSession()

||!systemData

||busy)return;

if(

action==="lock"

&&systemData.emergencyLocked

)return;

if(

action==="unlock"

&&!systemData.emergencyLocked

)return;

emergencyAction=action;

pendingEmergency=null;

$("emergencyForm").reset();

$("confirmationInstruction").textContent=

action==="lock"

?t.typeLock:t.typeUnlock;

$("emergencyForm").hidden=false;

$("lockReason").focus();

}

function closeEmergencyForm(){

emergencyAction=null;

$("emergencyForm").reset();

$("emergencyForm").hidden=true;

}

$("lockButton").onclick=()=>

openEmergencyForm("lock");

$("unlockButton").onclick=()=>

openEmergencyForm("unlock");

$("cancelEmergency").onclick=()=>{

if(!busy){

pendingEmergency=null;

closeEmergencyForm();

}

};

$("emergencyForm").onsubmit=async event=>{

event.preventDefault();

if(

!validSession()

||!systemData

||busy

||!["lock","unlock"]
.includes(emergencyAction)

){

return;

}

const reason=

$("lockReason").value.trim();

const expected=

emergencyAction==="lock"

?"LOCK":"UNLOCK";

if(

reason.length<10

||reason.length>500

||$("confirmationText").value.trim()

!==expected

){

$("actionStatus").textContent=

emergencyAction==="lock"

?t.typeLock:t.typeUnlock;

return;

}

const action=emergencyAction;

const expectedRevision=systemData.revision;

const signature=JSON.stringify([

action,reason,expectedRevision

]);

if(

!pendingEmergency

||pendingEmergency.signature!==signature

){

pendingEmergency={

signature,

requestId:crypto.randomUUID()

};

}

const currentGeneration=generation;

const user=auth.currentUser;

busy=true;

updateControls();

$("actionStatus").textContent=t.reauth;

try{

// Fresh Google verification is required.

const provider=new GoogleAuthProvider();

provider.setCustomParameters({

prompt:"select_account"

});

const credential=

await reauthenticateWithPopup(

user,provider

);

if(

currentGeneration!==generation

||credential.user.uid!==uid

||!validSession()

){

throw new Error("Owner changed");

}

const token=

await user.getIdTokenResult(true);

if(

currentGeneration!==generation

||!validSession()

||token.claims.ownerAdmin!==true

||token.signInProvider!=="google.com"

){

throw new Error("Invalid owner");

}

// Backend must independently check fresh auth,
// owner UID, App Check, revision and permissions.

const result=await serverCall(

"setOwnerEmergencyLock",

{

enabled:action==="lock",

reason,

expectedRevision,

requestId:pendingEmergency.requestId

}

);

if(

result?.accepted!==true

||result.ownerUid!==uid

||result.emergencyLocked!==(action==="lock")

||!validCount(result.revision)

||result.revision<=expectedRevision

){

throw new Error("Change not confirmed");

}

pendingEmergency=null;

closeEmergencyForm();

$("actionStatus").textContent=

t.actionSuccess;

// The live server document is authoritative.
// Do not manually change systemData here.

}catch(e){

if(currentGeneration!==generation)return;

$("actionStatus").textContent=

t.actionError;

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

};

result?.authorized!==true

||result.uid!==uid

||result.role!=="owner"

||result.ownerUidVerified!==true

||result.sessionValid!==true

){

throw new Error("Owner access revoked");

}

try{

await syncServerTime();

}catch(e){

serverOffset=null;

}

if(currentGeneration!==generation)return;

const today=sriLankaToday();

if(

today

&&dashboardData

&&dashboardData.reportDate!==today

){

dashboardData=null;

renderStats();

checkDashboardReady();

const refresh=await serverCall(

"refreshOwnerDashboard"

);

if(

refresh?.success!==true

||refresh.ownerUid!==uid

){

throw new Error("Date refresh failed");

}

subscribeDashboard();

}

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

if(currentGeneration===generation){

verifying=false;

}

}

},60000);

setInterval(renderClock,1000);

// CONNECTION MONITORING

window.addEventListener("offline",()=>{

clearSession();

showStatus("offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("pagehide",()=>{

clearSession();

});

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

document.addEventListener(

"visibilitychange",

()=>{

if(

!document.hidden

&&auth?.currentUser

&&!busy

&&!loggingOut

){

verifyOwner(auth.currentUser);

}

}

);

renderLanguage();

initializeSecurity();

</script>

</body>
</html>

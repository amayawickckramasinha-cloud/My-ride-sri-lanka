<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<meta name="robots"
content="noindex,nofollow,noarchive">

<meta name="google" content="notranslate">

<meta name="referrer" content="no-referrer">

<title>MY RIDE - Terms Management</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:#fff;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:120px;
resize:vertical;
line-height:1.8;
}

.termsEditor{
min-height:350px;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:24px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.bad{
color:#FF7777;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
overflow-wrap:anywhere;
}

.documentBody{
white-space:pre-wrap;
overflow-wrap:anywhere;
background:#181818;
border:1px solid #555;
border-radius:9px;
padding:16px;
line-height:1.9;
max-height:650px;
overflow:auto;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Terms & Conditions Management
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>

<button data-lang="en">English</button>

<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"
class="message"
role="status"
aria-live="polite">
Checking security...
</p>

<section id="accessPanel"
class="panel"
hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="overview"
class="grid"></div>

<p id="lastUpdate"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="documentSelection"></h3>

<label for="documentType"
data-t="documentType"></label>

<select id="documentType">

<option value="customerTerms"
data-t="customerTerms"></option>

<option value="driverTerms"
data-t="driverTerms"></option>

<option value="privacyPolicy"
data-t="privacyPolicy"></option>

<option value="gpsConsent"
data-t="gpsConsent"></option>

<option value="whatsappConsent"
data-t="whatsappConsent"></option>

</select>

<button id="loadDocument"
data-t="loadDocument"></button>

</section>

<section id="currentPanel"
class="panel"
hidden>

<h3 data-t="currentDocument"></h3>

<div id="currentInfo"></div>

<label for="viewLanguage"
data-t="documentLanguage"></label>

<select id="viewLanguage">

<option value="si">සිංහල</option>

<option value="en">English</option>

<option value="ta">தமிழ்</option>

</select>

<h4 id="currentTitle"></h4>

<div id="currentBody"
class="documentBody"></div>

<button id="editDocument"
data-t="editDocument"></button>

</section>

<section id="editorPanel"
class="panel"
hidden>

<h3 data-t="editor"></h3>

<p id="editorVersion"
class="note"></p>

<h4>සිංහල</h4>

<label for="titleSi"
data-t="title"></label>

<input id="titleSi"
maxlength="200">

<label for="bodySi"
data-t="documentContent"></label>

<textarea id="bodySi"
class="termsEditor"
maxlength="50000"></textarea>

<h4>English</h4>

<label for="titleEn"
data-t="title"></label>

<input id="titleEn"
maxlength="200">

<label for="bodyEn"
data-t="documentContent"></label>

<textarea id="bodyEn"
class="termsEditor"
maxlength="50000"></textarea>

<h4>தமிழ்</h4>

<label for="titleTa"
data-t="title"></label>

<input id="titleTa"
maxlength="200">

<label for="bodyTa"
data-t="documentContent"></label>

<textarea id="bodyTa"
class="termsEditor"
maxlength="50000"></textarea>

<label for="changeType"
data-t="changeType"></label>

<select id="changeType">

<option value=""
data-t="choose"></option>

<option value="minor"
data-t="minor"></option>

<option value="material"
data-t="material"></option>

</select>

<label class="checkRow">

<input id="requireReaccept"
type="checkbox">

<span data-t="requireReaccept"></span>

</label>

<p class="note"
data-t="reacceptNotice"></p>

<label for="effectiveDate"
data-t="effectiveDate"></label>

<input id="effectiveDate"
type="date">

<label for="effectiveTime"
data-t="effectiveTime"></label>

<input id="effectiveTime"
type="time">

<label for="changeReason"
data-t="changeReason"></label>

<textarea id="changeReason"
maxlength="1000"></textarea>

<label class="checkRow">

<input id="translationConfirmed"
type="checkbox">

<span data-t="translationConfirmed"></span>

</label>

<label class="checkRow">

<input id="legalConfirmed"
type="checkbox">

<span data-t="legalConfirmed"></span>

</label>

<button id="previewButton"
data-t="preview"></button>

<button id="saveDraft"
data-t="saveDraft"></button>

<button id="closeEditor"
class="back"
data-t="close"></button>

<p id="editorResult"
class="message"
role="status"></p>

</section>

<section id="previewPanel"
class="panel"
hidden>

<h3 data-t="preview"></h3>

<label for="previewLanguage"
data-t="documentLanguage"></label>

<select id="previewLanguage">

<option value="si">සිංහල</option>

<option value="en">English</option>

<option value="ta">தமிழ்</option>

</select>

<h4 id="previewTitle"></h4>

<div id="previewBody"
class="documentBody"></div>

<button id="closePreview"
class="back"
data-t="close"></button>

</section>

<section id="draftPanel"
class="panel"
hidden>

<div id="draftInfo"></div>

<option value="ta">தமிழ்</option>

</select>

<button id="editDraft"
data-t="editDraft"></button>

<label for="publishConfirmation"
data-t="publishConfirmation"></label>

<input id="publishConfirmation"
autocomplete="off"
maxlength="20">

<label class="checkRow">

<input id="confirmPublish"
type="checkbox">

<span data-t="confirmPublish"></span>

</label>

<p class="warning"
data-t="publishNotice"></p>

<button id="publishDocument"
data-t="publishDocument"></button>

<p id="publishResult"
class="message"
role="status"></p>

</section>

<section id="scheduledPanel"
class="panel"
hidden>

<h3 data-t="scheduledDocument"></h3>

<div id="scheduledInfo"></div>

<label for="cancelScheduleReason"
data-t="changeReason"></label>

<textarea id="cancelScheduleReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="confirmCancelSchedule"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="cancelSchedule"
data-t="cancelSchedule"></button>

</section>

<section class="panel">

<h3 data-t="acceptanceOverview"></h3>

<div id="acceptanceStats"
class="grid"></div>

<p class="note"
data-t="acceptanceNotice"></p>

<button id="loadAcceptance"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="acceptanceHistory"></h3>

<label for="acceptanceRole"
data-t="role"></label>

<select id="acceptanceRole">

<option value="all"
data-t="all"></option>

<option value="customer"
data-t="customer"></option>

<option value="driver"
data-t="driver"></option>

</select>

<label for="acceptanceStatus"
data-t="currentStatus"></label>

<select id="acceptanceStatus">

<option value="all"
data-t="all"></option>

<option value="accepted"
data-t="accepted"></option>

<option value="pending"
data-t="pending"></option>

<option value="declined"
data-t="declined"></option>

<option value="withdrawn"
data-t="withdrawn"></option>

</select>

<label for="acceptanceSearch"
data-t="accountId"></label>

<input id="acceptanceSearch"
maxlength="128"
autocomplete="off">

<button id="searchAcceptance"
data-t="search"></button>

<div id="acceptanceList"></div>

<button id="moreAcceptance"
data-t="more"
hidden></button>

</section>

<section class="panel">

<h3 data-t="versionHistory"></h3>

<button id="loadVersions"
data-t="viewHistory"></button>

<div id="versionList"></div>

<button id="moreVersions"
data-t="more"
hidden></button>

</section>

<section id="versionDetailsPanel"
class="panel"
hidden>

<h3 data-t="versionDetails"></h3>

<div id="versionDetailsInfo"></div>

<label for="historyLanguage"
data-t="documentLanguage"></label>

<select id="historyLanguage">

<option value="si">සිංහල</option>

<option value="en">English</option>

<option value="ta">தமிழ்</option>

</select>

<h4 id="historyTitle"></h4>

<div id="historyBody"
class="documentBody"></div>

<button id="copyOldVersion"
data-t="copyOldVersion"></button>

<button id="closeVersion"
class="back"
data-t="close"></button>

</section>

<section class="panel">

<h3 data-t="auditHistory"></h3>

<button id="loadAudit"
data-t="viewHistory"></button>

<div id="auditList"></div>

<button id="moreAudit"
data-t="more"
hidden></button>

</section>

<section class="panel">

<h3 data-t="relatedPages"></h3>

<a id="customerLink"
class="action"
data-t="customerManagement"></a>

<a id="driverLink"
class="action"
data-t="driverManagement"></a>

<a id="securityLink"
class="action"
data-t="securityManagement"></a>

<a id="settingsLink"
class="action"
data-t="systemSettings"></a>

</section>

<p id="result"
class="message"
role="status"
aria-live="polite"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

async function runMutation(

fingerprint,

name,

requestId:crypto.randomUUID()

};

}

||!isOwner())return;

const response=await serverCall(

name,

{

requestId:pendingMutation.requestId

}

throw new Error("Action not confirmed");

}

pendingMutation=null;

await onSuccess(response);

}catch(e){

mutationBusy=false;

updateControls();

}

}

}

}catch(e){

message("result","error");

}

},

"publishResult"

);

};

function readCancelSchedule(){

if(!scheduledDocument

||scheduledDocument.effectiveAtMs<=serverNow()

||!$("confirmCancelSchedule").checked){

return null;

}

const reason=

$("cancelScheduleReason").value.trim();

if(reason.length<10||reason.length>500){

return null;

}

return {

documentType:selectedType,

version:scheduledDocument.version,

reason

};

}

$("cancelSchedule").onclick=()=>{

const payload=readCancelSchedule();

if(!payload){

message("result","invalid");

return;

}

runMutation(

"cancelAdminTermsPublication",

payload,

response=>

response.cancelled===true

&&response.documentType===payload.documentType

&&response.version===payload.version,

async()=>{

scheduledDocument=null;

$("cancelScheduleReason").value="";

$("confirmCancelSchedule").checked=false;

renderScheduled();

message("result","cancelSuccess");

try{

await loadOverview();

}catch(e){

message("result","error");

}

}

);

};

function validAcceptanceStats(data){

return data

&&acceptanceKeys.every(key=>

validCount(data[key]))

&&data.acceptedCustomers<=data.eligibleCustomers

&&data.acceptedDrivers<=data.eligibleDrivers;

}

function renderAcceptanceStats(){

renderStats(

"acceptanceStats",

acceptanceKeys,

acceptanceStats

);

}

async function loadAcceptanceStats(){

acceptanceStats=null;

renderAcceptanceStats();

if(!selectedType||!currentDocument)return;

const response=await serverCall(

"getAdminTermsAcceptanceOverview",

{

documentType:selectedType,

version:currentDocument.version

}

);

if(response.documentType!==selectedType

||response.version!==currentDocument.version

||!validAcceptanceStats(response.stats)){

throw new Error("Invalid acceptance stats");

}

acceptanceStats=response.stats;

renderAcceptanceStats();

}

$("loadAcceptance").onclick=()=>{

if(!selectedType){

message("result","selectFirst");

return;

}

runRead(loadAcceptanceStats);

};

const acceptanceStatuses=[

"accepted",
"pending",
"declined",
"withdrawn"

];

function validAcceptance(record){

return record

&&validId(record.recordId)

&&validId(record.accountId)

&&["customer","driver"].includes(record.role)

&&documentTypes.includes(record.documentType)

&&validCount(record.version)

&&record.version>0

&&acceptanceStatuses.includes(record.status)

&&languages.includes(record.language)

&&nullableTime(record.acceptedAtMs)

&&validTime(record.updatedAtMs)

&&(record.status!=="accepted"

||validTime(record.acceptedAtMs));

}

function renderAcceptance(){

const container=$("acceptanceList");

container.replaceChildren();

$("moreAcceptance").hidden=

acceptanceCursor===null;

if(!acceptanceQuery||!isOwner())return;

if(!acceptanceRecords.length){

container.textContent=t("noRecords");

return;

}

acceptanceRecords.forEach(record=>{

const box=makeRecord();

addLine(box,"accountId",record.accountId);

addLine(box,"role",t(record.role));

addLine(box,"documentType",t(record.documentType));

addLine(box,"version",record.version);

addLine(box,"currentStatus",t(record.status));

addLine(box,"documentLanguage",record.language);

addLine(box,"accepted",formatDate(record.acceptedAtMs));

addLine(box,"updated",formatDate(record.updatedAtMs));

container.appendChild(box);

});

}

async function loadAcceptance(reset=true){

if(!acceptanceQuery)return;

const response=await serverCall(

"getAdminTermsAcceptanceRecords",

{

...acceptanceQuery,

limit:30,

cursor:reset?null:acceptanceCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validAcceptance)

||!validCursor(response.nextCursor)){

throw new Error("Invalid acceptance records");

}

if(response.records.some(record=>

record.documentType!==acceptanceQuery.documentType

||record.version!==acceptanceQuery.version

||(acceptanceQuery.role!=="all"

&&record.role!==acceptanceQuery.role)

||(acceptanceQuery.status!=="all"

&&record.status!==acceptanceQuery.status)

||(acceptanceQuery.accountId

&&record.accountId!==acceptanceQuery.accountId)

)){

throw new Error("Invalid filters");

}

acceptanceRecords=mergeRecords(

reset?[]:acceptanceRecords,

response.records,

"recordId"

);

acceptanceCursor=response.nextCursor;

renderAcceptance();

}

$("searchAcceptance").onclick=()=>{

if(!selectedType||!currentDocument){

message("result","selectFirst");

return;

}

const role=$("acceptanceRole").value;

const status=$("acceptanceStatus").value;

const accountId=

$("acceptanceSearch").value.trim();

if(!["all","customer","driver"].includes(role)

||!["all",...acceptanceStatuses].includes(status)

||(accountId&&!validId(accountId))){

message("result","invalid");

return;

}

runRead(async()=>{

acceptanceQuery={

documentType:selectedType,

version:currentDocument.version,

role,

status,

accountId:accountId||null

};

acceptanceRecords=[];

acceptanceCursor=null;

renderAcceptance();

await loadAcceptance(true);

});

};

$("moreAcceptance").onclick=()=>{

if(acceptanceCursor!==null){

runRead(()=>loadAcceptance(false));

}

};

function validVersionSummary(record){

return record

&&documentTypes.includes(record.documentType)

&&validCount(record.version)

&&record.version>0

&&["minor","material"].includes(record.changeType)

&&typeof record.requireReaccept==="boolean"

&&validTime(record.createdAtMs)

&&validTime(record.effectiveAtMs)

&&validText(record.reason,1000)

&&[

"published",
"scheduled",
"superseded",
"cancelled"

].includes(record.status);

}

function renderVersions(){

const container=$("versionList");

container.replaceChildren();

$("moreVersions").hidden=versionCursor===null;

versionRecords.forEach(record=>{

const box=makeRecord();

documentLines(box,record);

box.appendChild(

makeButton(

"viewDetails",

()=>openVersion(record.version)

)

);

container.appendChild(box);

});

}

async function loadVersions(reset=true){

if(!selectedType){

throw new Error("No document selected");

}

const response=await serverCall(

"getAdminTermsVersionHistory",

{

documentType:selectedType,

limit:30,

cursor:reset?null:versionCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validVersionSummary)

||!validCursor(response.nextCursor)

||response.records.some(record=>

record.documentType!==selectedType)){

throw new Error("Invalid version history");

}

versionRecords=mergeRecords(

reset?[]:versionRecords,

response.records,

"version"

);

versionCursor=response.nextCursor;

renderVersions();

if(!versionRecords.length){

$("versionList").textContent=t("noRecords");

}

}

$("loadVersions").onclick=()=>{

if(!selectedType){

message("result","selectFirst");

return;

}

runRead(()=>loadVersions(true));

};

$("moreVersions").onclick=()=>{

if(versionCursor!==null){

runRead(()=>loadVersions(false));

}

};

function renderVersionDetails(){

$("versionDetailsPanel").hidden=

!selectedVersion||!isOwner();

const container=$("versionDetailsInfo");

container.replaceChildren();

if(selectedVersion){

documentLines(container,selectedVersion);

}

showTranslation(

selectedVersion,

$("historyLanguage").value,

"historyTitle",

"historyBody"

);

}

function openVersion(version){

runRead(async()=>{

const response=await serverCall(

"getAdminTermsVersionDetails",

{

documentType:selectedType,

version

}

);

if(!validDocument(response.document)

||response.document.documentType!==selectedType

||response.document.version!==version){

throw new Error("Invalid version");

}

selectedVersion=response.document;

renderVersionDetails();

$("versionDetailsPanel").scrollIntoView({

behavior:"smooth"

});

});

}

$("historyLanguage").onchange=

renderVersionDetails;

$("copyOldVersion").onclick=()=>{

if(!selectedVersion||scheduledDocument)return;

const source={

translations:selectedVersion.translations,

changeType:"material",

requireReaccept:true,

effectiveAtMs:serverNow()+86400000

};

openEditor(source);

};

$("closeVersion").onclick=()=>{

selectedVersion=null;

renderVersionDetails();

updateControls();

};

function validAudit(record){

return record

&&validId(record.recordId)

&&documentTypes.includes(record.documentType)

&&validText(record.action,150)

&&validText(record.reason,1000)

&&validTime(record.createdAtMs)

&&(record.version===null

||validCount(record.version));

}

function renderAudit(){

const container=$("auditList");

container.replaceChildren();

$("moreAudit").hidden=auditCursor===null;

auditRecords.forEach(record=>{

const box=makeRecord();

addLine(box,"action",record.action);

addLine(box,"documentType",t(record.documentType));

addLine(box,"version",record.version);

addLine(box,"changeReason",record.reason);

addLine(box,"created",formatDate(record.createdAtMs));

container.appendChild(box);

});

}

async function loadAudit(reset=true){

const response=await serverCall(

"getAdminTermsAuditHistory",

{

limit:30,

cursor:reset?null:auditCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validAudit)

||!validCursor(response.nextCursor)){

throw new Error("Invalid audit history");

}

auditRecords=mergeRecords(

reset?[]:auditRecords,

response.records,

"recordId"

);

auditCursor=response.nextCursor;

renderAudit();

if(!auditRecords.length){

$("auditList").textContent=t("noRecords");

}

}

$("loadAudit").onclick=()=>{

runRead(()=>loadAudit(true));

};

$("moreAudit").onclick=()=>{

if(auditCursor!==null){

runRead(()=>loadAudit(false));

}

};

$("refreshButton").onclick=()=>{

runRead(async()=>{

await loadOverview();

if(selectedType&&!editorDirty&&!editorOpen){

await loadDocument(selectedType);

await loadAcceptanceStats();

}

});

};

const mutationInputs=[

...editorFields,

"publishConfirmation",

"confirmPublish",

"cancelScheduleReason",

"confirmCancelSchedule"

];

mutationInputs.forEach(id=>{

$(id).addEventListener("input",updateControls);

$(id).addEventListener("change",updateControls);

});

[

["publishConfirmation","confirmPublish"],

["cancelScheduleReason","confirmCancelSchedule"]

].forEach(([id,confirmId])=>{

$(id).addEventListener("input",()=>{

$(confirmId).checked=false;

updateControls();

});

});

function updateControls(){

const locked=

busy||mutationBusy||!isOwner();

const pending=!!pendingMutation;

[

"refreshButton",
"documentType",
"loadDocument",
"editDocument",
"editDraft",
"closeEditor",
"previewButton",
"loadAcceptance",
"acceptanceRole",
"acceptanceStatus",
"acceptanceSearch",
"searchAcceptance",
"moreAcceptance",
"loadVersions",
"moreVersions",
"copyOldVersion",
"closeVersion",
"loadAudit",
"moreAudit"

].forEach(id=>{

$(id).disabled=locked||pending;

});

document.querySelectorAll("[data-dynamic]")

.forEach(button=>{

button.disabled=locked||pending;

});

mutationInputs.forEach(id=>{

$(id).disabled=locked||pending;

});

$("editDocument").disabled=

locked||pending||!selectedType

||!!scheduledDocument;

$("editDraft").disabled=

locked||pending||!savedDraft

||!!scheduledDocument;

$("copyOldVersion").disabled=

locked||pending||!selectedVersion

||!!scheduledDocument;

$("requireReaccept").disabled=

locked||pending

||$("changeType").value==="material";

function mutationAllowed(name){

return !locked

&&(!pendingMutation

||pendingMutation.name===name);

}

$("saveDraft").disabled=

!mutationAllowed("saveAdminTermsDraft")

||!readDraft();

$("publishDocument").disabled=

!mutationAllowed("publishAdminTermsDocument")

||!readPublish();

$("cancelSchedule").disabled=

!mutationAllowed("cancelAdminTermsPublication")

||!readCancelSchedule();

}

function renderLanguage(){

document.documentElement.lang=lang;

document.querySelectorAll("[data-t]")

.forEach(element=>{

element.textContent=t(element.dataset.t);

});

const links={

loginLink:"admin-login.html",

dashboardLink:"admin-dashboard.html",

backLink:"admin-dashboard.html",

customerLink:"admin-customers.html",

driverLink:"admin-drivers.html",

securityLink:"admin-security.html",

settingsLink:"admin-settings.html"

};

Object.entries(links).forEach(([id,page])=>{

$(id).href=pageLink(page);

});

Object.keys(messages).forEach(id=>{

message(id,messages[id]);

});

renderOverview();

renderCurrent();

renderDraft();

renderScheduled();

renderEditorVersion();

renderPreview();

renderAcceptanceStats();

renderAcceptance();

renderVersions();

renderVersionDetails();

renderAudit();

updateControls();

}

document.querySelectorAll("[data-lang]")

.forEach(button=>{

button.onclick=()=>{

if(!languages.includes(button.dataset.lang))return;

lang=button.dataset.lang;

try{

localStorage.setItem(

"myride_admin_language",

lang

);

const url=new URL(location.href);

url.searchParams.set("lang",lang);

history.replaceState(null,"",url);

}catch(e){}

renderLanguage();

};

});

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

overview=null;

clockOffset=0;

selectedType=null;

currentDocument=null;

savedDraft=null;

scheduledDocument=null;

pendingMutation=null;

auditRecords=[];

auditCursor=null;

closeEditor();

clearDocumentRecords();

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("currentPanel").hidden=true;

$("draftPanel").hidden=true;

$("scheduledPanel").hidden=true;

$("versionDetailsPanel").hidden=true;

$("publishConfirmation").value="";

$("confirmPublish").checked=false;

$("cancelScheduleReason").value="";

$("confirmCancelSchedule").checked=false;

$("acceptanceSearch").value="";

$("acceptanceRole").value="all";

$("acceptanceStatus").value="all";

$("documentType").value="customerTerms";

[

"result",
"editorResult",
"publishResult"

].forEach(id=>{

message(id,"");

});

renderLanguage();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

message("status","denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

message("status","offline");

return;

}

message("status","checking");

try{

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

message("status","verified");

updateControls();

await runRead(async()=>{

await loadOverview();

await loadDocument("customerTerms");

await loadAcceptanceStats();

});

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

setInterval(async()=>{

if(!isOwner()

||checking

||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation)return;

if(!validOwner(response.data,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||pendingMutation

||document.hidden)return;

runRead(async()=>{

await loadOverview();

if(selectedType

&&!editorOpen

&&!editorDirty

&&!selectedVersion

&&!$("confirmPublish").checked

&&!$("publishConfirmation").value.trim()

&&!$("cancelScheduleReason").value.trim()

&&versionRecords.length===0

&&acceptanceRecords.length===0){

await loadDocument(selectedType);

await loadAcceptanceStats();

}

});

},60000);

setInterval(()=>{

if(isOwner()){

updateControls();

}

},15000);

window.addEventListener("offline",()=>{

clearSession();

message("status","offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(editorDirty

||mutationBusy

||pendingMutation

||$("cancelScheduleReason").value.trim()){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderLanguage();

updateControls();

initializeSecurity();

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="robots"
content="noindex,nofollow,noarchive">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Driver Management</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

header{
text-align:center;
padding:15px 0;
}

h1{
color:#FFD600;
font-size:38px;
margin:8px 0;
}

.country{
color:#FFD600;
letter-spacing:5px;
font-size:13px;
}

h2{
font-size:23px;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.statsGrid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border:1px solid #444;
border-radius:10px;
padding:14px;
}

.stat span{
display:block;
font-size:13px;
color:#CCC;
line-height:1.7;
}

.stat strong{
display:block;
font-size:25px;
color:#FFD600;
margin-top:10px;
}

input,select,textarea{
width:100%;
background:#292929;
color:#fff;
border:1px solid #666;
border-radius:8px;
padding:13px;
font-size:16px;
margin:8px 0 15px;
font-family:inherit;
}

textarea{
min-height:100px;
resize:vertical;
}

label{
display:block;
font-size:14px;
line-height:1.8;
}

.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-weight:bold;
font-size:14px;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.success{
background:#15803D;
color:#fff;
}

.danger{
background:#A51D2D;
color:#fff;
}

.driverCard,.record{
background:#292929;
border:1px solid #555;
border-radius:12px;
padding:14px;
margin:12px 0;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
border-bottom:1px solid #444;
padding:11px 0;
font-size:14px;
line-height:1.8;
}

.row strong{
max-width:60%;
text-align:right;
overflow-wrap:anywhere;
white-space:pre-wrap;
}

.green{
color:#4ADE80!important;
}

.red{
color:#FF6464!important;
}

.yellow{
color:#FFD600!important;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:14px;
margin:12px 0;
line-height:1.8;
}

.notice{
background:#302C17;
border:1px solid #FFD600;
border-radius:10px;
padding:14px;
margin:12px 0;
line-height:1.8;
}

.note{
color:#BBB;
font-size:13px;
line-height:1.8;
}

.languageGrid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.languageButton{
background:#292929;
color:#FFD600;
border:1px solid #FFD600;
border-radius:7px;
padding:12px 4px;
cursor:pointer;
}

.languageButton.selected{
background:#FFD600;
color:#111;
}

.checkItem{
display:flex;
align-items:flex-start;
gap:12px;
padding:13px;
background:#292929;
border:1px solid #555;
border-radius:8px;
margin:9px 0;
line-height:1.8;
}

.checkItem input{
width:21px;
height:21px;
margin:3px 0 0;
flex-shrink:0;
accent-color:#FFD600;
}

#status,#listStatus,#detailStatus,
#actionStatus,#historyStatus{
text-align:center;
line-height:1.8;
overflow-wrap:anywhere;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#999;
font-size:12px;
padding:25px 0;
}

[hidden]{
display:none!important;
}

@media(min-width:700px){

.statsGrid{
grid-template-columns:repeat(4,minmax(0,1fr));
}

}

</style>
</head>

<body>

<main>

<header>

<h1>MY RIDE</h1>

<div class="country">SRI LANKA</div>

<h2 data-t="heading">
Driver Management
</h2>

</header>

<div class="languageGrid">

<button class="languageButton"
data-lang="si">සිංහල</button>

<button class="languageButton"
data-lang="en">English</button>

<button class="languageButton"
data-lang="ta">தமிழ்</button>

</div>

<p id="status"
class="yellow"
role="status"
aria-live="polite">

Checking owner authorization...

</p>

<section id="deniedPanel"
class="panel" hidden>

<div class="warning"
data-t="denied"></div>

<a id="loginLink"
class="action"
data-t="login"></a>

<button id="retryButton"
class="action secondary"
data-t="refresh"></button>

</section>

<div id="content" hidden>

<a id="dashboardLink"
class="action secondary"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="statsGrid"
class="statsGrid"></div>

<p id="updatedAt"
class="note"></p>

</section>

<section class="panel">

<h3 data-t="searchDrivers"></h3>

<form id="searchForm">

<label for="searchText"
data-t="searchLabel"></label>

<input id="searchText"
type="search"
maxlength="100"
autocomplete="off">

<label for="statusFilter"
data-t="accountStatus"></label>

<select id="statusFilter">

<option value="all"
data-t="all"></option>

<option value="pending"
data-t="pending"></option>

<option value="approved"
data-t="approved"></option>

<option value="activated"
data-t="activated"></option>

<option value="rejected"
data-t="rejected"></option>

<option value="suspended"
data-t="suspended"></option>

<option value="blocked"
data-t="blocked"></option>

</select>

<label for="vehicleFilter"
data-t="vehicleType"></label>

<select id="vehicleFilter">

<option value="all"
data-t="all"></option>

<option value="bike"
data-t="bike"></option>

<option value="tuk"
data-t="tuk"></option>

<option value="car"
data-t="car"></option>

<option value="van"
data-t="van"></option>

</select>

<label for="districtFilter"
data-t="district"></label>

<select id="districtFilter"></select>

<button id="searchButton"
type="submit"
class="action"
data-t="search"></button>

<button id="clearButton"
type="button"
class="action secondary"
data-t="clear"></button>

</form>

</section>

<section class="panel">

<h3 data-t="driverList"></h3>

<p id="listStatus"
class="note"
role="status"></p>

<div id="driverList"></div>

<button id="loadMore"
class="action secondary"
data-t="loadMore"
hidden></button>

</section>

<section id="details"
class="panel" hidden>

<h3 data-t="driverDetails"></h3>

<button id="closeDetails"
class="action secondary"
data-t="close"></button>

<p id="detailStatus"
role="status"></p>

<div id="personalDetails"></div>

<div id="vehiclePanel" hidden>

<h3 data-t="vehicleDetails"></h3>

<div id="vehicleDetails"></div>

<h3 data-t="documentDetails"></h3>

<div id="documentDetails"></div>

<h3 data-t="consentDetails"></h3>

<div id="consentDetails"></div>

<h3 data-t="systemDetails"></h3>

<div id="systemDetails"></div>

</div>

<div id="contactButtons" hidden>

<a id="callDriver"
class="action success"
data-t="call"></a>

<a id="whatsappDriver"
class="action success"
target="_blank"
rel="noopener noreferrer"
data-t="whatsapp"></a>

</div>

<section id="verificationPanel" hidden>

<h3 data-t="verification"></h3>

<div class="notice"
data-t="verificationNote"></div>

<div id="checklist"></div>

<button id="saveChecklist"
class="action"
data-t="saveChecklist"></button>

</section>

<section id="accountControl" hidden>

<h3 data-t="accountControl"></h3>

<div class="notice"
data-t="controlNote"></div>

<button id="approveButton"
class="action success"
data-t="approve"
hidden></button>

<button id="rejectButton"
class="action danger"
data-t="reject"
hidden></button>

<button id="suspendButton"
class="action danger"
data-t="suspend"
hidden></button>

<button id="blockButton"
class="action danger"
data-t="block"
hidden></button>

<button id="restoreButton"
class="action success"
data-t="restore"
hidden></button>

<button id="reviewButton"
class="action secondary"
data-t="reviewAgain"
hidden></button>

<form id="accountForm" hidden>

<h3 id="actionTitle"></h3>

<label for="reason"
data-t="reason"></label>

<textarea id="reason"
minlength="10"
maxlength="500"
required></textarea>

<p id="confirmationInstruction"
class="note"></p>

<input id="confirmationText"
maxlength="20"
autocomplete="off"
required>

<button id="confirmAction"
type="submit"
class="action danger"
data-t="confirm"></button>

<button id="cancelAction"
type="button"
class="action secondary"
data-t="cancel"></button>

</form>

</section>

<section id="activationPanel" hidden>

<h3 data-t="activation"></h3>

<div id="activationDetails"></div>

<div class="notice"
data-t="activationNote"></div>

<button id="activationButton"
class="action"
data-t="sendActivation"></button>

</section>

<p id="actionStatus"
role="status"
aria-live="polite"></p>

<section id="historyPanel" hidden>

<h3 data-t="history"></h3>

<button id="historyButton"
class="action secondary"
data-t="viewHistory"></button>

<p id="historyStatus"
class="note"></p>

<div id="historyRecords"></div>

<button id="moreHistory"
class="action secondary"
data-t="loadMore"
hidden></button>

</section>

</section>

<button id="refreshButton"
class="action"
data-t="refresh"></button>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// VALIDATION HELPERS

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,max=500){

return typeof value==="string"

&&value.length<=max;

}

function validCount(value){

return Number.isSafeInteger(value)

&&value>=0;

}

function validPhone(value){

return typeof value==="string"

&&/^\+[1-9]\d{7,14}$/.test(value);

}

function validTime(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>0

&&value<=8640000000000000;

}

function validDate(value){

if(

typeof value!=="string"

||!/^\d{4}-\d{2}-\d{2}$/.test(value)

)return false;

const date=new Date(value+"T00:00:00Z");

return Number.isFinite(date.getTime())

&&date.toISOString().slice(0,10)===value;

}

function validCursor(value){

return value===null

||(typeof value==="string"

&&value.length>0

&&value.length<=4096);

}

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function ownerValid(result,userUid){

return result?.authorized===true

&&result.uid===userUid

&&result.role==="owner"

&&result.ownerUidVerified===true

&&result.sessionValid===true;

}

function pageLink(page){

return "./"+page+"?lang="+
encodeURIComponent(lang);

}

function translateValue(value){

return Object.prototype.hasOwnProperty.call(t,value)

?t[value]:t.unknown;

}

function formatDate(value){

if(!validTime(value))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(value));

}

function sriLankaToday(){

return new Date(Date.now()+330*60000)

.toISOString().slice(0,10);

}

function displayStatus(driver){

return driver.status==="approved"

&&driver.activationComplete===true

?"activated":driver.status;

}

function statusColor(status){

if(["approved","activated","online"].includes(status)){

return "green";

}

if(["blocked","rejected","suspended"].includes(status)){

return "red";

}

return "yellow";

}

const item=districts.find(d=>d[0]===value);

if(!item)return value;

return item[lang==="si"?1:lang==="ta"?2:0];

}

const today=sriLankaToday();

if(date<today){

color="red";

value+="\n"+t.expiredDocument;

}else{

const days=Math.floor(

(Date.parse(date+"T00:00:00Z")-

Date.parse(today+"T00:00:00Z"))

/86400000

);

if(days<=30){

color="yellow";

value+="\n"+t.expiringDocument;

}

}

addRow(container,label,value,color);

}

// SECURE SERVER REQUESTS

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,

name,

{timeout:25000}

)(data);

if(

currentGeneration!==generation

||!validSession()

){

throw new Error("Session changed");

}

return response.data;

}

async function freshOwnerAuthentication(){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const user=auth.currentUser;

const provider=new GoogleAuthProvider();

provider.setCustomParameters({

prompt:"select_account"

});

const credential=

await reauthenticateWithPopup(user,provider);

if(

currentGeneration!==generation

||credential.user.uid!==uid

||!validSession()

){

throw new Error("Owner changed");

}

const token=await user.getIdTokenResult(true);

if(

currentGeneration!==generation

||!validSession()

||token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"

){

throw new Error("Owner denied");

}

const result=await serverCall("verifyOwnerAdmin");

if(!ownerValid(result,uid)){

throw new Error("Owner authorization failed");

}

}

function validChecklist(value){

return value

&&CHECK_KEYS.every(

key=>typeof value[key]==="boolean"

);

}

function validActivation(value){

return value

&&[

"notIssued","queued","sent","delivered",

"failed","expired","used"

].includes(value.deliveryStatus)

&&(

value.expiresAtMs===null

||validTime(value.expiresAtMs)

);

}

function validProfile(driver,targetUid){

if(!validDriver(driver)||driver.uid!==targetUid){

return false;

}

const textKeys=[

"nic","address","licenceNumber",

"vehicleNumber","vehicleModel","vehicleColor",

"insuranceNumber","serviceArea","termsVersion"

];

const dateKeys=[

"dob","licenceExpiry",

"insuranceExpiry","revenueExpiry"

];

const booleanKeys=[

"truthConsent","termsConsent",

"commissionConsent","gpsConsent",

"whatsappConsent","phoneVerified",

"documentsValid"

];

return textKeys.every(

key=>validText(driver[key],500)

)

&&dateKeys.every(

key=>validDate(driver[key])

)

&&booleanKeys.every(

key=>typeof driver[key]==="boolean"

)

&&validCount(driver.experience)

&&validCount(driver.capacity)

&&driver.capacity>0

&&driver.capacity<=10

&&(

driver.whatsapp===null

||validPhone(driver.whatsapp)

)

&&["day","night","both"].includes(driver.workingTime)

&&LANGUAGES.includes(driver.language)

&&validTime(driver.acceptedAtMs)

&&validCount(driver.revision)

&&validChecklist(driver.verification)

&&validActivation(driver.activation)

&&(

driver.statusReason===null

||validText(driver.statusReason,500)

);

}

// IDEMPOTENT REQUEST IDENTIFIERS

function requestIdFor(name,payload){

const signature=JSON.stringify([name,payload]);

if(

!pendingRequest

||pendingRequest.signature!==signature

){

pendingRequest={

signature,

requestId:crypto.randomUUID()

};

}

return pendingRequest.requestId;

}

if(!navigator.onLine){

||appToken.token.length===0

if(currentGeneration!==generation)return;

if(

token.signInProvider!=="google.com"

||token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

){

}

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(

currentGeneration!==generation

||auth.currentUser?.uid!==user.uid

)return;

if(!ownerValid(response.data,user.uid)){

throw new Error("Owner denied");

}

uid=user.uid;

authorized=true;

$("content").hidden=false;

$("deniedPanel").hidden=true;

showStatus("verified");

subscribeOverview();

updateControls();

await loadDrivers(true);

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

$("retryButton").onclick=()=>{

if(auth?.currentUser){

verifyOwner(auth.currentUser);

}else{

location.replace(pageLink("admin-login.html"));

}

};

// INITIALIZE FIREBASE

async function initializeSecurity(){

try{

app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

APP_CHECK_SITE_KEY

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

db=getFirestore(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

// PERIODIC OWNER SECURITY CHECK

setInterval(async()=>{

if(

!validSession()

||verifying

||busy

)return;

const currentGeneration=generation;

verifying=true;

try{

const result=await serverCall(

"verifyOwnerAdmin"

);

if(!ownerValid(result,uid)){

throw new Error("Owner access revoked");

}

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

if(currentGeneration===generation){

verifying=false;

}

}

},60000);

// NETWORK SECURITY

window.addEventListener("offline",()=>{

clearSession();

showStatus("offlineError");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("pagehide",()=>{

clearSession();

});

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

document.addEventListener(

"visibilitychange",

()=>{

if(

!document.hidden

&&auth?.currentUser

&&!busy

&&!authorized

){

verifyOwner(auth.currentUser);

}

}

);

renderLanguage();

initializeSecurity();

</script>

</body>
</html>

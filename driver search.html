
<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">

<title>MY RIDE - Driver Search</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
}

main{
max-width:550px;
margin:auto;
padding:20px;
}

h1{
color:#FFD600;
text-align:center;
margin-bottom:5px;
}

.country{
text-align:center;
color:#FFD600;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.6;
}

.radar{
position:relative;
width:210px;
height:210px;
margin:35px auto;
display:flex;
align-items:center;
justify-content:center;
}

.circle{
position:absolute;
border:2px solid #FFD600;
border-radius:50%;
animation:pulse 2s infinite;
}

.circle:nth-child(1){
width:70px;
height:70px;
}

.circle:nth-child(2){
width:130px;
height:130px;
animation-delay:.4s;
}

.circle:nth-child(3){
width:200px;
height:200px;
animation-delay:.8s;
}

.car{
font-size:38px;
z-index:2;
}

@keyframes pulse{
0%,100%{opacity:.3}
50%{opacity:1}
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:18px;
margin:20px 0;
}

.row{
display:flex;
justify-content:space-between;
gap:15px;
padding:13px 0;
border-bottom:1px solid #444;
}

.row strong{
color:#FFD600;
text-align:right;
overflow-wrap:anywhere;
}

#status{
text-align:center;
color:#FFD600;
line-height:1.8;
}

button,.action{
display:block;
width:100%;
padding:16px;
border:0;
border-radius:10px;
background:#FFD600;
color:#111;
font-size:16px;
font-weight:bold;
text-align:center;
text-decoration:none;
margin:12px 0;
}

.back{
display:block;
text-align:center;
color:#FFD600;
padding:20px;
text-decoration:none;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>
<div class="country">SRI LANKA</div>

<h2 id="heading"></h2>

<div id="radar" class="radar" hidden>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="car">🚕</div>

</div>

<p id="status"
role="status"
aria-live="polite"></p>

<section id="bookingPanel"
class="panel" hidden>

<div class="row">
<span data-t="bookingId"></span>
<strong id="bookingId"></strong>
</div>

<div class="row">
<span data-t="vehicle"></span>
<strong id="vehicle"></strong>
</div>

<div class="row">
<span data-t="distance"></span>
<strong id="distance"></strong>
</div>

<div class="row">
<span data-t="fare"></span>
<strong id="fare"></strong>
</div>

</section>

<section id="driverPanel"
class="panel" hidden>

<h2 data-t="driverFound"></h2>

<div class="row">
<span data-t="driverName"></span>
<strong id="driverName"></strong>
</div>

<div class="row">
<span data-t="driverPhone"></span>
<strong id="driverPhone"></strong>
</div>

<a id="callDriver"
class="action"
data-t="call"></a>

<a id="trackDriver"
class="action"
data-t="track"></a>

</section>

<button id="retryButton"
data-t="retry" hidden></button>

<a id="backButton"
class="back"
data-t="back"></a>

<footer>© MY RIDE SRI LANKA</footer>

</main>

<script type="module">

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getFirestore,
doc,
onSnapshot
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

import {
initializeAppCheck,

} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js";

const $=id=>document.getElementById(id);


// LANGUAGE SYSTEM

let savedLanguage=null;

try{

savedLanguage=
localStorage.getItem("myride_language");

}catch(e){}

const params=
new URLSearchParams(location.search);

const requestedLanguage=params.get("lang");

const lang=
allowedLanguages.includes(requestedLanguage)
?requestedLanguage
:allowedLanguages.includes(savedLanguage)
?savedLanguage:"si";

document.documentElement.lang=lang;

const translations={

auth:"Booking එක බැලීමට නිවැරදි පාරිභෝගික සැසිය අවශ්‍යයි.",
error:"Booking පද්ධතියට සම්බන්ධ විය නොහැක.",
denied:"මෙම Booking එක බැලීමට අවසර නැත.",
cancelled:"මෙම Booking එක අවලංගු කර ඇත.",
completed:"මෙම ගමන අවසන් වී ඇත.",
active:"ඔබගේ ගමන ආරම්භ කර ඇත.",
connecting:"පද්ධතියට සම්බන්ධ වෙමින්...",
unknown:"Booking තත්ත්වය තහවුරු වී නැත.",
offline:"අන්තර්ජාල සම්බන්ධතාව නොමැත."

},

en:{

heading:"Find a Driver",
searching:"Searching for your nearest eligible driver...",
waiting:"Waiting for the driver's response...",
driverFound:"Your driver has been found",
bookingId:"Booking ID",
vehicle:"Vehicle",
distance:"Travel Distance",
fare:"Estimated Fare",
driverName:"Driver Name",
driverPhone:"Phone Number",
call:"📞 Call Driver",
track:"📍 Track Driver",
retry:"Reconnect",
back:"← Customer Services",
bike:"Scooter / Bike",
tuk:"Three Wheeler",
car:"Car",
van:"Van",
scheduled:"Your scheduled ride has been registered.",
noDrivers:"No eligible drivers are currently available.",
missing:"No confirmed booking was found.",
auth:"A valid customer session is required.",
error:"Unable to connect to the booking system.",
denied:"You do not have access to this booking.",
cancelled:"This booking has been cancelled.",
completed:"This ride has been completed.",
active:"Your ride has started.",
connecting:"Connecting to the system...",
unknown:"Booking status is not verified.",
offline:"No internet connection."

},

ta:{

heading:"சாரதியைத் தேடுதல்",
searching:"அருகிலுள்ள தகுதியான சாரதி தேடப்படுகிறார்...",
waiting:"சாரதியின் பதிலுக்காக காத்திருக்கிறது...",
driverFound:"உங்கள் சாரதி கிடைத்துள்ளார்",
bookingId:"முன்பதிவு எண்",
vehicle:"வாகனம்",
distance:"பயண தூரம்",
fare:"மதிப்பிடப்பட்ட கட்டணம்",
driverName:"சாரதியின் பெயர்",
driverPhone:"தொலைபேசி எண்",
call:"📞 சாரதியை அழைக்கவும்",
track:"📍 சாரதியின் பாதை",
retry:"மீண்டும் இணைக்கவும்",
back:"← வாடிக்கையாளர் சேவைகள்",
bike:"மோட்டார் சைக்கிள்",
tuk:"முச்சக்கர வண்டி",
car:"கார்",
van:"வேன்",
scheduled:"திட்டமிட்ட பயணம் பதிவு செய்யப்பட்டுள்ளது.",
noDrivers:"தற்போது தகுதியான சாரதிகள் இல்லை.",
missing:"உறுதிப்படுத்தப்பட்ட முன்பதிவு இல்லை.",
auth:"சரியான வாடிக்கையாளர் அமர்வு தேவை.",
error:"முன்பதிவு அமைப்புடன் இணைக்க முடியவில்லை.",
denied:"இந்த முன்பதிவைப் பார்க்க அனுமதி இல்லை.",
cancelled:"இந்த முன்பதிவு ரத்து செய்யப்பட்டது.",
completed:"இந்தப் பயணம் முடிந்துவிட்டது.",
active:"உங்கள் பயணம் தொடங்கியுள்ளது.",
connecting:"அமைப்புடன் இணைக்கப்படுகிறது...",
unknown:"முன்பதிவு நிலை உறுதிப்படுத்தப்படவில்லை.",
offline:"இணைய இணைப்பு இல்லை."

}

};

const t=translations[lang];

document.querySelectorAll("[data-t]")
.forEach(el=>{

el.textContent=t[el.dataset.t];

});

$("heading").textContent=t.heading;

$("backButton").href=
"./customer.html?lang="+lang;

function status(message){

$("status").textContent=message;

}


// FIREBASE CONFIGURATION

const firebaseConfig={

apiKey:"AIzaSyDzrAZ7sc-c7CYIIwOpsiC9xdCPNHO7Km4",

authDomain:"my-ride-sri-lanka.firebaseapp.com",

projectId:"my-ride-sri-lanka",

storageBucket:"my-ride-sri-lanka.firebasestorage.app",

messagingSenderId:"88909447786",

appId:"1:88909447786:web:f8f7b8ccce99ea390a4013"

};

let auth=null;
let db=null;
let unsubscribe=null;
let currentUser=null;

try{

const app=initializeApp(firebaseConfig);

initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);
db=getFirestore(app);

}catch(error){

status(t.error);

}


// CONFIRMED BOOKING ID

let bookingId=params.get("booking");

if(!bookingId){

try{

bookingId=sessionStorage.getItem(
"myride_confirmed_booking_id"
);

}catch(e){}

}

function validBookingId(id){

return typeof id==="string"
&& /^[A-Za-z0-9_-]{1,128}$/.test(id);

}


// STOP LIVE LISTENER

function stopListener(){

if(unsubscribe){

unsubscribe();
unsubscribe=null;

}

}

function clearDisplay(){

$("radar").hidden=true;
$("driverPanel").hidden=true;
$("bookingPanel").hidden=true;

$("driverName").textContent="";
$("driverPhone").textContent="";

$("callDriver").removeAttribute("href");
$("trackDriver").removeAttribute("href");

}


// DISPLAY BOOKING DATA

function displayBooking(data){

$("bookingId").textContent=bookingId;

const validVehicles=[
"bike","tuk","car","van"
];

$("vehicle").textContent=
validVehicles.includes(data.vehicle)
?t[data.vehicle]
:t.unknown;

$("distance").textContent=
Number.isFinite(data.estimatedDistance)
?data.estimatedDistance.toFixed(2)+" KM"
:t.unknown;

$("fare").textContent=
Number.isFinite(data.estimatedFare)
?"LKR "+data.estimatedFare.toLocaleString()
:t.unknown;

$("bookingPanel").hidden=false;

}


// DISPLAY ACCEPTED DRIVER

function displayDriver(data){

const driver=data.assignedDriver;

if(!driver
||typeof driver.name!=="string"
||typeof driver.phone!=="string"){

status(t.unknown);
return;

}

const phone=driver.phone.replace(/[\s-]/g,"");

if(!/^(?:\+94|94|0)7\d{8}$/.test(phone)){

status(t.unknown);
return;

}

$("driverName").textContent=driver.name;

$("driverPhone").textContent=phone;

$("callDriver").href="tel:"+phone;

$("trackDriver").href=

"./tracking.html?lang="+lang
+"&booking="+encodeURIComponent(bookingId);

$("driverPanel").hidden=false;

}


// REAL-TIME BOOKING STATUS

function updateBooking(data){

$("radar").hidden=true;
$("driverPanel").hidden=true;

$("retryButton").hidden=true;

displayBooking(data);

switch(data.status){

case "confirmed":
case "searching":

$("radar").hidden=false;

status(t.searching);

break;

case "offered":

$("radar").hidden=false;

status(t.waiting);

break;

case "scheduled":

status(t.scheduled);

break;

case "accepted":
case "arrived":

status(t.driverFound);

displayDriver(data);

break;

case "active":

status(t.active);

displayDriver(data);

$("trackDriver").href=

"./active-ride.html?lang="+lang
+"&booking="+encodeURIComponent(bookingId);

break;

case "no_driver":

status(t.noDrivers);

break;

case "cancelled":

status(t.cancelled);

break;

case "completed":

status(t.completed);

break;

default:

status(t.unknown);

}

}


// SECURE BOOKING LISTENER

function connect(){

stopListener();
clearDisplay();

$("retryButton").hidden=true;

if(!validBookingId(bookingId)){

status(t.missing);
return;

}

if(!db||!auth){

status(t.error);
return;

}

if(!currentUser){

status(t.auth);
return;

}

if(!navigator.onLine){

status(t.offline);

$("retryButton").hidden=false;

return;

}

status(t.connecting);

const bookingRef=doc(

db,

"bookings",

bookingId

);

unsubscribe=onSnapshot(

bookingRef,

{includeMetadataChanges:true},

snapshot=>{

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites){

clearDisplay();

status(t.connecting);

return;

}

if(!snapshot.exists()){

clearDisplay();

status(t.missing);

return;

}

const data=snapshot.data();

if(data.customerUid!==currentUser.uid){

clearDisplay();

status(t.denied);

stopListener();

return;

}

updateBooking(data);

},

error=>{

clearDisplay();

status(

error.code==="permission-denied"
?t.denied
:t.error

);

$("retryButton").hidden=false;

}

);

}


// AUTHENTICATION CHECK

if(auth&&db){

onAuthStateChanged(

auth,

user=>{

currentUser=user;

connect();

},

()=>{

clearDisplay();

status(t.auth);

}

);

}


// NETWORK RECOVERY

$("retryButton").onclick=connect;

window.addEventListener(

"offline",

()=>{

stopListener();

clearDisplay();

status(t.offline);

$("retryButton").hidden=false;

}

);

window.addEventListener(

"online",

connect

);

window.addEventListener(

"pagehide",

stopListener

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted)connect();

}

);

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Driver Licence Renewal</title>

<style>
*{
box-sizing:border-box;
}
body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}
main{
max-width:650px;
margin:auto;
padding:16px;
}
h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}
.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}
h2{
text-align:center;
line-height:1.7;
}
h3{
color:#FFD600;
line-height:1.7;
}
.documentIcon{
width:90px;
height:90px;
background:#FFD600;
color:#111;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:20px auto;
}
.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}
.document{
background:#292929;
border:1px solid #555;
border-left:5px solid #FFD600;
border-radius:12px;
padding:15px;
margin:15px 0;
}
.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.8;
}
.row span{
color:#CCC;
}
.row strong{
text-align:right;
max-width:60%;
overflow-wrap:anywhere;
}
.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}
.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}
label{
display:block;
font-size:14px;
font-weight:bold;
line-height:1.8;
margin-top:12px;
}
input:not([type=checkbox]),
select,
textarea{
width:100%;
padding:14px;
background:#292929;
color:#fff;
border:1px solid #555;
border-radius:9px;
font-size:16px;
margin:8px 0 15px;
font-family:inherit;
color-scheme:dark;
}
textarea{
min-height:100px;
resize:vertical;
}
input[type=checkbox]{
width:19px;
height:19px;
accent-color:#FFD600;
vertical-align:middle;
}
.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:15px;
color:#FFB4B4;
line-height:1.8;
margin:15px 0;
}
.notice{
background:#302C17;
border:1px solid #FFD600;
border-radius:10px;
padding:15px;
line-height:1.8;
margin:15px 0;
}
.note{
font-size:13px;
color:#BBB;
line-height:1.9;
}
.history{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
overflow-wrap:anywhere;
}
.green{
color:#4ADE80;
}
.yellow{
color:#FFD600;
}
.orange{
color:#FFA500;
}
.red{
color:#FF6464;
}
#status,
#formStatus,
#historyStatus{
text-align:center;
line-height:1.8;
color:#FFD600;
overflow-wrap:anywhere;
}
button:disabled,
input:disabled,
select:disabled,
textarea:disabled{
opacity:.5;
cursor:not-allowed;
}
footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}
[hidden]{
display:none!important;
}
</style>
</head>

<body>
<main>

<h1>MY RIDE</h1>
<div class="country">SRI LANKA</div>

<div class="documentIcon">
<svg width="50" height="50"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">
<rect x="3" y="4" width="18" height="16" rx="2"/>
<circle cx="8" cy="10" r="2"/>
<path d="M5 16c0-4 6-4 6 0"/>
<path d="M14 9h4"/>
<path d="M14 13h4"/>
<path d="M14 17h4"/>
</svg>
</div>

<h2 data-t="heading"></h2>

<p id="status" role="status"
aria-live="polite"></p>

<section id="accessPanel"
class="panel" hidden>
<p data-t="denied"></p>
<a id="loginLink"
class="action"
data-t="login"></a>
</section>

<div id="content" hidden>

<section class="panel">

<h3 data-t="driverDetails"></h3>

<div class="row">
<span data-t="driverName"></span>
<strong id="driverName">—</strong>
</div>

<div class="row">
<span>Driver ID</span>
<strong id="driverId" class="yellow">—</strong>
</div>

<div class="row">
<span data-t="vehicleNumber"></span>
<strong id="vehicleNumber">—</strong>
</div>

<div class="row">
<span data-t="accountStatus"></span>
<strong id="accountStatus">—</strong>
</div>

<div class="row">
<span data-t="eligibility"></span>
<strong id="eligibility">—</strong>
</div>

<div id="expiredWarning"
class="warning" hidden
data-t="expiredWarning"></div>

</section>

<section class="panel">

<h3 data-t="currentDocuments"></h3>

<div id="documentList"></div>

<button id="refreshButton"
class="action secondary"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="renewDocument"></h3>

<div class="notice"
data-t="approvalNotice"></div>

<div id="busyNotice"
class="warning" hidden
data-t="busyNotice"></div>

<form id="renewalForm">

<label for="documentType"
data-t="documentType"></label>

<select id="documentType" required>
<option value="" data-t="chooseDocument"></option>
<option value="licence" data-t="licence"></option>
<option value="insurance" data-t="insurance"></option>
<option value="revenue" data-t="revenue"></option>
</select>

<div id="numberField" hidden>

<label for="newNumber"
data-t="newNumber"></label>

<input id="newNumber"
type="text"
maxlength="80"
autocomplete="off">

</div>

<label for="newExpiry"
data-t="newExpiry"></label>

<input id="newExpiry"
type="date"
required>

<label for="renewalNote"
data-t="renewalNote"></label>

<textarea id="renewalNote"
maxlength="500"></textarea>

<label>
<input id="declaration"
type="checkbox" required>
<span data-t="declaration"></span>
</label>

<p class="note"
data-t="originalDocuments"></p>

<button id="submitButton"
class="action"
type="submit"
data-t="submit"></button>

<p id="formStatus"
role="status"
aria-live="polite"></p>

</form>

</section>

<section class="panel">

<h3 data-t="renewalHistory"></h3>

<label for="historyFilter"
data-t="filterStatus"></label>

<select id="historyFilter">
<option value="all" data-t="all"></option>
<option value="pending" data-t="pending"></option>
<option value="approved" data-t="approved"></option>
<option value="rejected" data-t="rejected"></option>
</select>

<p id="historyStatus"
role="status"></p>

<div id="historyList"></div>

<button id="loadMoreButton"
class="action secondary"
data-t="loadMore" hidden></button>

</section>

<section class="panel">

<h3 data-t="renewalRules"></h3>

<p data-t="rule1"></p>
<p data-t="rule2"></p>
<p data-t="rule3"></p>
<p data-t="rule4"></p>
<p data-t="rule5"></p>
<p data-t="rule6"></p>

</section>

<a id="profileLink"
class="action secondary"
data-t="profile"></a>

<a id="helpLink"
class="action secondary"
data-t="help"></a>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){
return authorized
&&uid!==null
&&auth?.currentUser?.uid===uid
&&navigator.onLine;
}

function validId(value){
return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);
}

function validText(value,min,max){
return typeof value==="string"
&&value.trim().length>=min
&&value.length<=max;
}

function validTime(value){
return Number.isFinite(value)
&&value>0
&&value<=8640000000000000;
}

function validDate(value){

if(typeof value!=="string"
||!/^\d{4}-\d{2}-\d{2}$/.test(value)){
return false;
}

const ms=Date.parse(value+"T00:00:00Z");

return Number.isFinite(ms)
&&new Date(ms).toISOString().slice(0,10)===value;

}

function busy(){
return driver?.availability==="busy"
||Boolean(driver?.activeBookingId);
}

async function serverCall(name,data={}){

if(!validSession()){
throw new Error("Unauthorized");
}

const currentGeneration=generation;

const response=await httpsCallable(
functions,name
)(data);

if(!validSession()
||currentGeneration!==generation){
throw new Error("Session changed");
}

return response.data;

}

// SRI LANKA SERVER TIME

async function syncServerTime(){

const currentGeneration=generation;
const start=Date.now();

const result=await serverCall(
"getDriverServerTime"
);

const end=Date.now();

if(currentGeneration!==generation)return;

if(!validTime(result?.serverTimeMs)
||end-start>10000){
throw new Error("Invalid server time");
}

serverOffset=
result.serverTimeMs-(start+end)/2;

serverSyncAt=end;

}

function serverNow(){

if(serverOffset===null
||Date.now()-serverSyncAt>120000){
return null;
}

return Date.now()+serverOffset;

}

function sriLankaToday(){

const now=serverNow();

if(now===null)return null;

return new Date(now+330*60000)
.toISOString().slice(0,10);

}

function remainingDays(expiry){

const today=sriLankaToday();

if(!today||!validDate(expiry)){
return null;
}

return Math.round(
(
Date.parse(expiry+"T00:00:00Z")
-Date.parse(today+"T00:00:00Z")
)/DAY_MS
);

}

function formatDate(ms){

if(!validTime(ms))return "—";

return new Intl.DateTimeFormat(
lang==="si"?"si-LK":
lang==="ta"?"ta-LK":"en-LK",
{
timeZone:"Asia/Colombo",
dateStyle:"medium",
timeStyle:"short"
}
).format(new Date(ms));

}

};

}

// GPS CONTINUITY

function startGps(){

if(gpsWatch!==null
||!navigator.geolocation
||!validSession())return;

const currentGeneration=generation;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const c=position.coords;

if(currentGeneration!==generation
||!validSession()
||!driver
||!["online","busy"].includes(
driver.availability
)
||(
driver.documentsValid!==true
&&driver.availability!=="busy"
)
||!Number.isFinite(c.latitude)
||!Number.isFinite(c.longitude)
||!Number.isFinite(c.accuracy)
||c.accuracy<0
||c.accuracy>100
||c.latitude<5.85
||c.latitude>9.9
||c.longitude<79.5
||c.longitude>82
||Date.now()-position.timestamp>30000
||position.timestamp>Date.now()+5000
||gpsSending
||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;
lastGpsSent=Date.now();

try{

await serverCall(
"updateDriverLocation",
{
lat:c.latitude,
lon:c.longitude,
accuracy:c.accuracy,
capturedAtMs:position.timestamp
}
);

}catch(e){

// Backend must expire stale GPS data.

}finally{

if(currentGeneration===generation){
gpsSending=false;
}

}

},

()=>{},

{
enableHighAccuracy:true,
maximumAge:5000,
timeout:15000
}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

function validDocuments(data){

||data.driverUid!==uid
||!validText(data.vehicleNumber,1,40)
||typeof data.documentsValid!=="boolean"
||!data.documents
||!Array.isArray(data.pendingTypes)
||!data.pendingTypes.every(
type=>TYPES.includes(type)
)){

return TYPES.every(type=>{

const item=data.documents[type];

return item
&&validDate(item.expiryDate)
&&(
type==="revenue"
?(
item.number===null
||validText(item.number,1,80)
)
:validText(item.number,1,80)
);

});

}

:expiry.days<0
?t.expiredDays+" "
+Math.abs(expiry.days)+" "+t.days
:expiry.days+" "+t.days;

addRow(
card,
t.remainingDays,
daysText,
expiry.color
);

addRow(
card,
t.documentStatus,
expiry.label,
expiry.color
);

const pending=pendingTypes.includes(type);

if(pending){

addRow(
card,
t.requestStatus,
t.pending,
"yellow"
);

}

const button=element(
"button",
"action",
pending?t.pending:t.renew
);

button.type="button";

button.disabled=
pending
||submitting
||busy()
||!validSession()
||serverNow()===null;

button.onclick=()=>{

$("documentType").value=type;

updateRenewalFields();

$("renewalForm").scrollIntoView({
behavior:"smooth"
});

};

card.appendChild(button);

container.appendChild(card);

});

const eligible=
!expired
&&documents.documentsValid===true
&&driver?.documentsValid===true;

$("eligibility").textContent=
eligible?t.eligible:t.notEligible;

$("eligibility").className=
eligible?"green":"red";

$("expiredWarning").hidden=eligible;

updateControls();

}

// LOAD DOCUMENT DETAILS

async function loadDocuments(){

if(!validSession()||!driver)return;

const currentGeneration=generation;
const requestGeneration=++documentGeneration;

try{

if(serverNow()===null){
await syncServerTime();
}

const result=await serverCall(
"getDriverRenewalDocuments"
);

if(currentGeneration!==generation
||requestGeneration!==documentGeneration
||!driver)return;

if(result?.success!==true
||!validDocuments(result.data)){
throw new Error("Invalid documents");
}

documents=result.data;

pendingTypes=[
...new Set(documents.pendingTypes)
];

renderDocuments();

updateRenewalFields(false);

status("");

}catch(e){

if(currentGeneration!==generation
||requestGeneration!==documentGeneration)return;

documents=null;
pendingTypes=[];

$("documentList").replaceChildren();

$("vehicleNumber").textContent="—";

$("eligibility").textContent=t.unknown;

$("expiredWarning").hidden=false;

status(t.error);

updateControls();

}

}

// RENEWAL FORM

function updateRenewalFields(reset=true){

const type=$("documentType").value;

const requiresNumber=
type==="licence"
||type==="insurance";

$("numberField").hidden=!requiresNumber;

$("newNumber").required=requiresNumber;

if(reset){

$("newNumber").value="";

$("newExpiry").value="";

$("renewalNote").value="";

$("declaration").checked=false;

$("formStatus").textContent="";

pendingRequest=null;

if(requiresNumber&&documents){

$("newNumber").value=
documents.documents[type].number||"";

}

}

const today=sriLankaToday();

if(today&&documents&&TYPES.includes(type)){

const currentExpiry=
documents.documents[type].expiryDate;

const baseDate=
currentExpiry>today
?currentExpiry
:today;

$("newExpiry").min=
new Date(
Date.parse(baseDate+"T00:00:00Z")
+DAY_MS
).toISOString().slice(0,10);

}else{

$("newExpiry").removeAttribute("min");

}

if(pendingTypes.includes(type)){

$("formStatus").textContent=
t.pendingExists;

}

updateControls();

}

$("documentType").onchange=()=>{

updateRenewalFields();

};

function updateControls(){

const enabled=
validSession()
&&driver!==null
&&documents!==null;

const type=$("documentType").value;

const pending=
pendingTypes.includes(type);

$("busyNotice").hidden=!busy();

$("documentType").disabled=
!enabled||submitting||busy();

$("newNumber").disabled=
!enabled||submitting||busy()||pending;

$("newExpiry").disabled=
!enabled||submitting||busy()||pending;

$("renewalNote").disabled=
!enabled||submitting||busy()||pending;

$("declaration").disabled=
!enabled||submitting||busy()||pending;

$("submitButton").disabled=
!enabled
||submitting
||busy()
||pending
||!TYPES.includes(type)
||serverNow()===null;

$("refreshButton").disabled=
!validSession()
||!driver
||submitting;

$("historyFilter").disabled=
!validSession()
||!driver
||submitting;

$("loadMoreButton").disabled=
!validSession()
||loading
||submitting
||!nextCursor;

}

// SUBMIT RENEWAL REQUEST

$("renewalForm").onsubmit=async event=>{

event.preventDefault();

if(!validSession()
||!driver
||!documents
||submitting
||busy())return;

const type=$("documentType").value;

if(!TYPES.includes(type))return;

if(pendingTypes.includes(type)){

$("formStatus").textContent=
t.pendingExists;

return;

}

const number=
type==="revenue"
?null
:$("newNumber").value.trim();

const expiry=$("newExpiry").value;

const note=$("renewalNote").value.trim();

const today=sriLankaToday();

if(type!=="revenue"
&&(
!validText(number,2,80)
||/[\u0000-\u001F\u007F]/.test(number)
)){

$("formStatus").textContent=
t.invalidNumber;

return;

}

if(!today
||!validDate(expiry)
||expiry<=today
||expiry<=documents.documents[type].expiryDate){

$("formStatus").textContent=
t.invalidExpiry;

return;

}

if(note.length>500
||!$("declaration").checked){

return;

}

if(!confirm(t.confirmSubmit))return;

const payload={
documentType:type,
newDocumentNumber:number,
newExpiryDate:expiry,
expectedCurrentExpiry:
documents.documents[type].expiryDate,
note,
language:lang,
declarationAccepted:true
};

const signature=JSON.stringify(payload);

if(!pendingRequest
||pendingRequest.signature!==signature){

pendingRequest={
signature,
requestId:crypto.randomUUID()
};

}

const currentGeneration=generation;

submitting=true;

$("formStatus").textContent=t.sending;

renderDocuments();

updateControls();

try{

const result=await serverCall(
"submitDriverRenewalRequest",
{
...payload,
requestId:pendingRequest.requestId
}
);

if(currentGeneration!==generation
||!driver)return;

if(result?.accepted!==true
||result.driverUid!==uid
||result.status!=="pending"
||!validId(result.requestId)){

throw new Error("Request not confirmed");

}

pendingTypes=[
...new Set([...pendingTypes,type])
];

pendingRequest=null;

$("renewalForm").reset();

updateRenewalFields();

$("formStatus").textContent=
t.sent+" "+t.reference+": "
+result.requestId;

await loadDocuments();

await loadHistory(false);

}catch(e){

if(currentGeneration!==generation)return;

$("formStatus").textContent=t.failed;

}finally{

if(currentGeneration===generation){

submitting=false;

renderDocuments();

updateControls();

}

}

};

// RENEWAL HISTORY VALIDATION

function validRecord(record){

return record
&&record.driverUid===uid
&&validId(record.requestId)
&&TYPES.includes(record.documentType)
&&["pending","approved","rejected"]
.includes(record.status)
&&validDate(record.oldExpiryDate)
&&validDate(record.newExpiryDate)
&&validTime(record.createdAtMs)
&&(
record.reviewedAtMs===null
||validTime(record.reviewedAtMs)
)
&&(
record.adminReason===null
||validText(record.adminReason,1,2000)
);

}

// DISPLAY RENEWAL HISTORY

function renderHistory(){

const container=$("historyList");

container.replaceChildren();

records.forEach(record=>{

const card=element(
"article",
"history"
);

card.appendChild(
element(
"h3",
"",
t[record.documentType]
)
);

addRow(
card,
t.reference,
record.requestId
);

addRow(
card,
t.expiryDate,
record.oldExpiryDate
);

addRow(
card,
t.newExpiry,
record.newExpiryDate
);

addRow(
card,
t.submittedDate,
formatDate(record.createdAtMs)
);

addRow(
card,
t.requestStatus,
t[record.status],
record.status==="approved"
?"green"
:record.status==="rejected"
?"red":"yellow"
);

if(record.reviewedAtMs!==null){

addRow(
card,
t.reviewedDate,
formatDate(record.reviewedAtMs)
);

}

if(record.adminReason){

addRow(
card,
t.adminReason,
record.adminReason
);

}

container.appendChild(card);

});

$("loadMoreButton").hidden=!nextCursor;

updateControls();

}

// LOAD RENEWAL HISTORY

async function loadHistory(append=false){

if(!validSession()||!driver)return;

if(append&&(loading||!nextCursor))return;

const currentGeneration=generation;
const requestGeneration=++historyGeneration;

const cursor=append?nextCursor:null;

const filter=$("historyFilter").value;

if(!append){

records=[];
nextCursor=null;

}

loading=true;

$("historyStatus").textContent=t.loading;

renderHistory();

try{

const result=await serverCall(
"getDriverRenewalHistory",
{
status:filter==="all"?null:filter,
limit:20,
cursor
}
);

if(currentGeneration!==generation
||requestGeneration!==historyGeneration
||!driver)return;

if(result?.success!==true
||result.driverUid!==uid
||!Array.isArray(result.records)
||result.records.length>20
||!result.records.every(validRecord)
||!result.records.every(record=>
filter==="all"||record.status===filter
)
||!(
result.nextCursor===null
||validText(result.nextCursor,1,2048)
)){

throw new Error("Invalid history");

}

if(result.nextCursor!==null
&&result.nextCursor===cursor){

throw new Error("Invalid pagination");

}

const combined=new Map();

if(append){

records.forEach(record=>{

combined.set(record.requestId,record);

});

}

result.records.forEach(record=>{

combined.set(record.requestId,record);

});

records=Array.from(combined.values())
.sort((a,b)=>b.createdAtMs-a.createdAtMs);

nextCursor=result.nextCursor;

$("historyStatus").textContent=
records.length===0?t.empty:"";

renderHistory();

}catch(e){

if(currentGeneration!==generation
||requestGeneration!==historyGeneration)return;

$("historyStatus").textContent=t.error;

}finally{

if(currentGeneration===generation
&&requestGeneration===historyGeneration){

loading=false;

updateControls();

}

}

}

$("historyFilter").onchange=()=>{

loadHistory(false);

};

$("loadMoreButton").onclick=()=>{

loadHistory(true);

};

$("refreshButton").onclick=async()=>{

if(!validSession()||submitting)return;

try{

await syncServerTime();

await loadDocuments();

await loadHistory(false);

}catch(e){

status(t.error);

}

};

// LIVE ADMIN APPROVAL MONITORING

function subscribeRenewalState(){

if(renewalUnsubscribe){

renewalUnsubscribe();

renewalUnsubscribe=null;

}

if(!validSession()||!driver)return;

const currentGeneration=generation;

previousRevision=null;

renewalUnsubscribe=onSnapshot(

doc(
db,
"drivers",
uid,
"renewalState",
"summary"
),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation
||!validSession()
||!driver)return;

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites){

return;

}

const data=snapshot.data();

if(!snapshot.exists()
||data.driverUid!==uid
||!Number.isSafeInteger(data.revision)
||data.revision<0){

return;

}

const changed=
previousRevision!==null
&&data.revision!==previousRevision;

previousRevision=data.revision;

if(changed){

loadDocuments();

loadHistory(false);

}

},

()=>{

if(currentGeneration!==generation)return;

status(t.error);

}

);

}

// CLEAR PRIVATE DATA

function clearRenewalData(){

historyGeneration++;
documentGeneration++;

if(renewalUnsubscribe){

renewalUnsubscribe();

renewalUnsubscribe=null;

}

documents=null;
pendingTypes=[];
records=[];
nextCursor=null;

loading=false;
submitting=false;

pendingRequest=null;
previousRevision=null;

$("documentList").replaceChildren();

$("historyList").replaceChildren();

$("historyStatus").textContent="";

$("formStatus").textContent="";

$("loadMoreButton").hidden=true;

$("renewalForm").reset();

$("numberField").hidden=true;

$("vehicleNumber").textContent="—";

$("eligibility").textContent="—";

$("expiredWarning").hidden=true;

updateControls();

}

function disconnect(){

generation++;

authorized=false;
uid=null;
driver=null;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

stopGps();

gpsSending=false;
lastGpsSent=0;

serverOffset=null;
serverSyncAt=0;

clearRenewalData();

$("driverName").textContent="—";

$("driverId").textContent="—";

$("accountStatus").textContent="—";

$("content").hidden=true;

updateControls();

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// DRIVER ACCOUNT MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation
||!validSession())return;

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites){

driver=null;

stopGps();

clearRenewalData();

$("content").hidden=true;

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()
||data.uid!==uid
||data.status!=="approved"
||data.activationComplete!==true
||typeof data.documentsValid!=="boolean"
||!validText(data.fullName,1,150)
||!validId(data.driverId)
||!["online","offline","busy"].includes(
data.availability
)){

denyAccess();

return;

}

const firstLoad=driver===null;

const validityChanged=
driver!==null
&&driver.documentsValid!==data.documentsValid;

driver=data;

$("driverName").textContent=
data.fullName;

$("driverId").textContent=
data.driverId;

$("accountStatus").textContent=
t.approved;

$("accountStatus").className="green";

$("content").hidden=false;

$("accessPanel").hidden=true;

if(
data.availability==="busy"
||(
data.availability==="online"
&&data.documentsValid===true
)
){

startGps();

}else{

stopGps();

}

if(firstLoad){

subscribeRenewalState();

loadDocuments();

loadHistory(false);

}else if(validityChanged){

loadDocuments();

}

renderDocuments();

updateControls();

status("");

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// SPECIAL RENEWAL AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!db||!functions){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true
||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(
functions,
"verifyDriverRenewalSession"
)({});

if(currentGeneration!==generation
||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true
||account.uid!==user.uid
||account.status!=="approved"
||account.activationComplete!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// AUTOMATIC SESSION VERIFICATION

setInterval(async()=>{

if(!validSession()
||!driver
||checkingSession)return;

const currentGeneration=generation;

checkingSession=true;

try{

const result=await serverCall(
"verifyDriverRenewalSession"
);

if(currentGeneration!==generation)return;

if(result?.authorized!==true
||result.uid!==uid
||result.status!=="approved"
||result.activationComplete!==true){

denyAccess();

return;

}

try{

await syncServerTime();

if(currentGeneration!==generation)return;

renderDocuments();

updateRenewalFields(false);

}catch(e){

if(currentGeneration===generation){

status(t.error);

renderDocuments();

}

}

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

checkingSession=false;

}

},60000);

// INTERNET CONNECTION MONITORING

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(
"pagehide",
disconnect
);

window.addEventListener(
"pageshow",
event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}
);

updateControls();

</script>

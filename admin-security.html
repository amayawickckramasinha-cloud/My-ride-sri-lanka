<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

content="noindex,nofollow,noarchive">

<title>MY RIDE - Security Management</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.dangerPanel{
border:2px solid #EF4444;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:#fff;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:24px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.criticalRecord{
border:2px solid #EF4444;
}

.securityRow{
padding:14px 0;
border-bottom:1px solid #444;
line-height:1.8;
}

.securityRow:last-child{
border-bottom:0;
}

.securityName{
font-weight:bold;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.bad{
color:#FF7777;
}

.unknown{
color:#AAA;
}

.danger{
background:#B91C1C;
color:white;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
}

.messageBody{
white-space:pre-wrap;
overflow-wrap:anywhere;
background:#181818;
border-radius:8px;
padding:12px;
margin:10px 0;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Security Management
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>
<button data-lang="en">English</button>
<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"

role="status"
aria-live="polite">
Checking security...
</p>

<section id="accessPanel"
class="panel"
hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="overview"
class="grid"></div>

<p id="lastUpdate"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="securityCenter"></h3>

<p class="note"
data-t="securityNotice"></p>

<div id="securityChecks"></div>

<button id="auditButton"
data-t="runAudit"></button>

<p id="auditResult"
class="message"
role="status"></p>

</section>

<section class="panel">

<h3 data-t="alerts"></h3>

<label for="alertSeverity"
data-t="severity"></label>

<select id="alertSeverity">

<option value="all"
data-t="all"></option>

<option value="low"
data-t="low"></option>

<option value="medium"
data-t="medium"></option>

<option value="high"
data-t="high"></option>

<option value="critical"
data-t="critical"></option>

</select>

<label for="alertStatus"
data-t="alertStatus"></label>

<select id="alertStatus">

<option value="all"
data-t="all"></option>

<option value="open"
data-t="open"></option>

<option value="acknowledged"
data-t="acknowledged"></option>

<option value="resolved"
data-t="resolved"></option>

</select>

<button id="searchAlerts"
data-t="search"></button>

<div id="alertList"></div>

<button id="moreAlerts"
data-t="more"
hidden></button>

</section>

<section id="alertDetailsPanel"
class="panel"
hidden>

<h3 data-t="alertDetails"></h3>

<div id="alertDetails"></div>

<label for="alertAction"
data-t="action"></label>

<select id="alertAction">

<option value="acknowledged"
data-t="acknowledged"></option>

<option value="resolved"
data-t="resolved"></option>

</select>

<label for="alertReason"
data-t="reason"></label>

<textarea id="alertReason"
maxlength="1000"></textarea>

<label class="checkRow">

<input id="confirmAlert"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="saveAlert"
data-t="save"></button>

<button id="closeAlert"
class="back"
data-t="close"></button>

</section>

<section class="panel">

<h3 data-t="loginHistory"></h3>

<label for="loginRole"
data-t="role"></label>

<select id="loginRole">

<option value="all"
data-t="all"></option>

<option value="owner"
data-t="owner"></option>

<option value="driver"
data-t="driver"></option>

<option value="customer"
data-t="customer"></option>

</select>

<label for="loginStatus"
data-t="loginStatus"></label>

<select id="loginStatus">

<option value="all"
data-t="all"></option>

<option value="success"
data-t="success"></option>

<option value="failed"
data-t="failed"></option>

<option value="blocked"
data-t="blocked"></option>

</select>

<button id="loadLogins"
data-t="search"></button>

<div id="loginList"></div>

<button id="moreLogins"
data-t="more"
hidden></button>

</section>

<section class="panel">

<h3 data-t="sessions"></h3>

<p class="note"
data-t="sessionNotice"></p>

<button id="loadSessions"
data-t="viewSessions"></button>

<div id="sessionList"></div>

</section>

<section id="sessionActionPanel"
class="panel dangerPanel"
hidden>

<h3 data-t="revokeSession"></h3>

<div id="selectedSessionInfo"></div>

<label for="sessionReason"
data-t="reason"></label>

<textarea id="sessionReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="confirmSession"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="revokeSession"
class="danger"
data-t="revokeSession"></button>

<button id="closeSession"
class="back"
data-t="close"></button>

</section>

<section class="panel">

<h3 data-t="securitySettings"></h3>

<p id="settingsVersion"
class="note"></p>

<label for="maxLoginAttempts"
data-t="maxLoginAttempts"></label>

<input id="maxLoginAttempts"
type="number"
min="3"
max="10"
step="1">

<label for="lockoutMinutes"
data-t="lockoutMinutes"></label>

<input id="lockoutMinutes"
type="number"
min="15"
max="1440"
step="1">

<label for="sessionMinutes"
data-t="sessionMinutes"></label>

<input id="sessionMinutes"
type="number"
min="5"
max="60"
step="1">

<label for="registrationLimit"
data-t="registrationLimit"></label>

<input id="registrationLimit"
type="number"
min="1"
max="20"
step="1">

<label class="checkRow">

<input id="securityEmail"
type="checkbox">

<span data-t="securityEmail"></span>

</label>

<p class="note"
data-t="mandatoryProtection"></p>

<label for="settingsReason"
data-t="reason"></label>

<textarea id="settingsReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="confirmSettings"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="saveSettings"
data-t="saveSettings"></button>

</section>

<section class="panel">

<h3 data-t="backup"></h3>

<div id="backupInfo"></div>

<a id="databaseLink"
class="action"
data-t="databasePage"></a>

</section>

<section class="panel dangerPanel">

<h3 data-t="emergencyLock"></h3>

<p id="lockStatus"
class="warning"></p>

<p data-t="lockNotice"></p>

<label for="lockReason"
data-t="reason"></label>

<textarea id="lockReason"
maxlength="500"></textarea>

<label for="lockConfirmation"
data-t="lockConfirmation"></label>

<input id="lockConfirmation"
autocomplete="off"
maxlength="20">

<label class="checkRow">

<input id="confirmLock"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="lockButton"
class="danger"
data-t="activateLock"></button>

<button id="unlockButton"
data-t="deactivateLock"></button>

<p id="lockResult"
class="message"
role="status"></p>

</section>

<section class="panel">

<h3 data-t="auditHistory"></h3>

<button id="loadAuditHistory"
data-t="viewHistory"></button>

<div id="auditHistory"></div>

<button id="moreAudit"
data-t="more"
hidden></button>

</section>

<section class="panel">

<h3 data-t="relatedPages"></h3>

<a id="gmailLink"
class="action"
data-t="gmailPage"></a>

<a id="emergencyLink"
class="action"
data-t="emergencyPage"></a>

<a id="settingsLink"
class="action"
data-t="settingsPage"></a>

<a id="accountLink"
class="action"
data-t="accountPage"></a>

</section>

<p id="result"
class="message"
role="status"
aria-live="polite"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

||reason.length>500)return null;

return {

sessionId:selectedSession.sessionId,

reason

};

}

$("revokeSession").onclick=()=>{

const payload=readSessionAction();

if(!payload){

message("result","invalid");

return;

}

runMutation(

"revokeAdminSecuritySession",

payload,

response=>

response.revoked===true

&&response.sessionId===payload.sessionId,

async()=>{

selectedSession=null;

$("sessionReason").value="";

$("confirmSession").checked=false;

renderSelectedSession();

message("result","saved");

try{

await loadSessions();

await loadOverview();

}catch(e){

message("result","error");

}

}

);

};

const settingsIds=[

"maxLoginAttempts",
"lockoutMinutes",
"sessionMinutes",
"registrationLimit",
"securityEmail",
"settingsReason"

];

settingsIds.forEach(id=>{

$(id).addEventListener("input",()=>{

settingsDirty=true;

$("confirmSettings").checked=false;

updateControls();

});

});

function readSettings(){

if(!settings

||!settingsDirty

||!$("confirmSettings").checked)return null;

const data={

maxLoginAttempts:Number($("maxLoginAttempts").value),

lockoutMinutes:Number($("lockoutMinutes").value),

sessionMinutes:Number($("sessionMinutes").value),

registrationLimit:Number($("registrationLimit").value),

securityEmail:$("securityEmail").checked

};

const reason=$("settingsReason").value.trim();

if(!validSettings({

...data,

version:settings.version

})

||reason.length<10

||reason.length>500)return null;

return {

settings:data,

expectedVersion:settings.version,

reason

};

}

$("saveSettings").onclick=()=>{

const payload=readSettings();

if(!payload){

message("result","invalid");

return;

}

runMutation(

"saveAdminSecuritySettings",

payload,

response=>

validSettings(response.settings)

&&response.settings.version>payload.expectedVersion

&&Object.keys(payload.settings).every(key=>

response.settings[key]===payload.settings[key]),

async response=>{

settings=response.settings;

settingsDirty=false;

$("settingsReason").value="";

$("confirmSettings").checked=false;

renderSettings();

message("result","saved");

}

);

};

function readLockAction(locked){

if(!systemControl

||systemControl.emergencyLocked===locked

||!$("confirmLock").checked)return null;

const reason=$("lockReason").value.trim();

const confirmation=

$("lockConfirmation").value.trim();

if(reason.length<10

||reason.length>500

||confirmation!==(locked?"LOCK":"UNLOCK")){

return null;

}

return {

locked,

reason,

expectedRevision:systemControl.revision

};

}

function changeEmergencyLock(locked){

const payload=readLockAction(locked);

if(!payload){

message("lockResult","invalid");

return;

}

runMutation(

"setOwnerEmergencyLock",

payload,

response=>

validControl(response.control)

&&response.control.emergencyLocked===locked

&&response.control.revision>payload.expectedRevision,

async response=>{

systemControl=response.control;

$("lockReason").value="";

$("lockConfirmation").value="";

$("confirmLock").checked=false;

renderLock();

message("lockResult","saved");

try{

await loadOverview();

}catch(e){

message("result","error");

}

},

"lockResult"

);

}

$("lockButton").onclick=()=>{

changeEmergencyLock(true);

};

$("unlockButton").onclick=()=>{

changeEmergencyLock(false);

};

function validAudit(record){

return record

&&validId(record.recordId)

&&validText(record.action,150)

&&validText(record.reason,1000)

&&validTime(record.createdAtMs);

}

function renderAuditHistory(){

const container=$("auditHistory");

container.replaceChildren();

$("moreAudit").hidden=auditCursor===null;

auditRecords.forEach(record=>{

const box=makeRecord();

addLine(box,"action",record.action);

addLine(box,"created",formatDate(record.createdAtMs));

addBody(box,record.reason);

container.appendChild(box);

});

}

async function loadAuditHistory(reset=true){

const response=await serverCall(

"getAdminSecurityAuditHistory",

{

limit:30,

cursor:reset?null:auditCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validAudit)

||!validCursor(response.nextCursor)){

throw new Error("Invalid audit history");

}

auditRecords=mergeRecords(

reset?[]:auditRecords,

response.records,

"recordId"

);

auditCursor=response.nextCursor;

renderAuditHistory();

if(!auditRecords.length){

$("auditHistory").textContent=t("noRecords");

}

}

$("loadAuditHistory").onclick=()=>{

runRead(()=>loadAuditHistory(true));

};

$("moreAudit").onclick=()=>{

if(auditCursor!==null){

runRead(()=>loadAuditHistory(false));

}

};

$("refreshButton").onclick=()=>{

runRead(async()=>{

try{

await loadOverview();

}catch(e){

overview=null;

checks=null;

backup=null;

systemControl=null;

lastSync=null;

renderOverview();

renderChecks();

renderBackup();

renderLock();

throw e;

}

if(!settingsDirty){

await loadSettings();

}

});

};

const mutationInputs=[

"alertAction",
"alertReason",
"confirmAlert",
"sessionReason",
"confirmSession",
...settingsIds,
"confirmSettings",
"lockReason",
"lockConfirmation",
"confirmLock"

];

mutationInputs.forEach(id=>{

$(id).addEventListener("input",updateControls);

$(id).addEventListener("change",updateControls);

});

[

["alertAction","confirmAlert"],
["alertReason","confirmAlert"],
["sessionReason","confirmSession"],
["lockReason","confirmLock"],
["lockConfirmation","confirmLock"]

].forEach(([id,confirmId])=>{

$(id).addEventListener("input",()=>{

$(confirmId).checked=false;

updateControls();

});

});

function updateControls(){

const locked=

busy||mutationBusy||!isOwner();

const pending=!!pendingMutation;

[

"refreshButton",
"searchAlerts",
"alertSeverity",
"alertStatus",
"moreAlerts",
"closeAlert",
"loadLogins",
"loginRole",
"loginStatus",
"moreLogins",
"loadSessions",
"closeSession",
"loadAuditHistory",
"moreAudit"

].forEach(id=>{

$(id).disabled=locked||pending;

});

document.querySelectorAll("[data-dynamic]")

.forEach(button=>{

button.disabled=locked||pending;

});

mutationInputs.forEach(id=>{

$(id).disabled=locked||pending;

});

settingsIds.forEach(id=>{

$(id).disabled=

locked||pending||!settings;

});

$("confirmSettings").disabled=

locked||pending||!settings;

function mutationAllowed(name){

return !locked

&&(!pendingMutation

||pendingMutation.name===name);

}

$("auditButton").disabled=

!mutationAllowed("requestAdminSecurityAudit");

$("saveAlert").disabled=

!mutationAllowed("updateAdminSecurityAlert")

||!readAlertAction();

$("revokeSession").disabled=

!mutationAllowed("revokeAdminSecuritySession")

||!readSessionAction();

$("saveSettings").disabled=

!mutationAllowed("saveAdminSecuritySettings")

||!readSettings();

$("lockButton").disabled=

!mutationAllowed("setOwnerEmergencyLock")

||!readLockAction(true);

$("unlockButton").disabled=

!mutationAllowed("setOwnerEmergencyLock")

||!readLockAction(false);

}

function renderLanguage(){

document.documentElement.lang=lang;

document.querySelectorAll("[data-t]")

.forEach(element=>{

element.textContent=t(element.dataset.t);

});

const links={

loginLink:"admin-login.html",

dashboardLink:"admin-dashboard.html",

backLink:"admin-dashboard.html",

databaseLink:"admin-database.html",

gmailLink:"admin-gmail.html",

emergencyLink:"admin-emergency.html",

settingsLink:"admin-settings.html",

accountLink:"admin-account.html"

};

Object.entries(links).forEach(([id,page])=>{

$(id).href=pageLink(page);

});

Object.keys(messages).forEach(id=>{

message(id,messages[id]);

});

renderOverview();

renderChecks();

renderSettings();

renderBackup();

renderLock();

renderAlerts();

renderAlertDetails();

renderLogins();

renderSessions();

renderSelectedSession();

renderAuditHistory();

updateControls();

}

document.querySelectorAll("[data-lang]")

.forEach(button=>{

button.onclick=()=>{

if(!languages.includes(button.dataset.lang))return;

lang=button.dataset.lang;

try{

localStorage.setItem(

"myride_admin_language",

lang

);

const url=new URL(location.href);

url.searchParams.set("lang",lang);

history.replaceState(null,"",url);

}catch(e){}

renderLanguage();

};

});

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

overview=null;

checks=null;

settings=null;

backup=null;

systemControl=null;

lastSync=null;

clockOffset=0;

settingsDirty=false;

selectedAlert=null;

selectedSession=null;

pendingMutation=null;

alertRecords=[];

loginRecords=[];

sessionRecords=[];

auditRecords=[];

alertCursor=null;

loginCursor=null;

auditCursor=null;

alertQuery=null;

loginQuery=null;

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("alertDetailsPanel").hidden=true;

$("sessionActionPanel").hidden=true;

[

"alertReason",
"sessionReason",
"settingsReason",
"lockReason",
"lockConfirmation"

].forEach(id=>{

$(id).value="";

});

[

"confirmAlert",
"confirmSession",
"confirmSettings",
"confirmLock"

].forEach(id=>{

$(id).checked=false;

});

[

"alertSeverity",
"alertStatus",
"loginRole",
"loginStatus"

].forEach(id=>{

$(id).value="all";

});

[

"result",
"auditResult",
"lockResult"

].forEach(id=>{

message(id,"");

});

renderLanguage();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

message("status","denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

message("status","offline");

return;

}

message("status","checking");

try{

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

message("status","verified");

updateControls();

await runRead(async()=>{

await loadOverview();

await loadSettings();

alertQuery={

severity:"all",

status:"all"

};

await loadAlerts(true);

});

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

setInterval(async()=>{

if(!isOwner()

||checking

||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation)return;

if(!validOwner(response.data,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||pendingMutation

||document.hidden)return;

runRead(async()=>{

try{

await loadOverview();

}catch(e){

overview=null;

checks=null;

systemControl=null;

backup=null;

lastSync=null;

renderOverview();

renderChecks();

renderLock();

renderBackup();

throw e;

}

if(alertQuery

&&!selectedAlert

&&alertCursor===null){

await loadAlerts(true);

}

});

},30000);

setInterval(()=>{

if(isOwner()){

renderChecks();

}

},15000);

window.addEventListener("offline",()=>{

clearSession();

message("status","offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(settingsDirty

||mutationBusy

||pendingMutation

||$("alertReason").value.trim()

||$("sessionReason").value.trim()

||$("lockReason").value.trim()){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderLanguage();

updateControls();

initializeSecurity();

</script>

</body>
</html>

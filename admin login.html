&&auth?.currentUser?.uid===user.uid

&&navigator.onLine;

async function verifyAppCheck(){

}

renderState("appCheckState","checking");

try{

appCheck,
false
);

||result.token.length===0

){

}

appCheckReady=true;

renderState(
"appCheckState",
"verified"
);

}catch(e){

appCheckReady=false;

renderState(
"appCheckState",
"failed"
);

throw e;

}finally{

updateControls();

}

}

// OPTIONAL SERVER AUDIT REQUEST

async function reportLoginAttempt(
user,
reason
){

if(

!functions

||!auth?.currentUser

||auth.currentUser.uid!==user.uid

||!appCheckReady

){

return;

}

const allowedReasons=[

"owner_claim_missing",

"google_provider_invalid",

"backend_denied"

];

if(!allowedReasons.includes(reason)){

return;

}

try{

await httpsCallable(

functions,

"reportOwnerLoginAttempt",

{timeout:10000}

)({

reason

});

}catch(e){

// Never grant access if audit fails.
// Backend must independently audit
// actual authentication attempts.

}

}

// OWNER AUTHORIZATION

async function verifyOwner(user){

const currentGeneration=++generation;

resetSecurity();

setBusy(true);

if(!user){

showStatus("ready");

setBusy(false);

return;

}

if(!navigator.onLine){

showStatus("connectionLost","red");

setBusy(false);

return;

}

showStatus("signingIn");

renderState("googleState","checking");

try{

await verifyAppCheck();

}catch(e){

if(currentGeneration!==generation)return;

showStatus("appCheckFailed","red");

$("retryButton").hidden=false;

setBusy(false);

return;

}

if(!validSession(
user,
currentGeneration
))return;

let tokenResult;

try{

tokenResult=

await user.getIdTokenResult(true);

}catch(e){

if(currentGeneration!==generation)return;

showStatus("loginError","red");

$("retryButton").hidden=false;

setBusy(false);

return;

}

if(!validSession(
user,
currentGeneration
))return;

// Google sign-in provider is mandatory.

const googleProvider=

tokenResult.signInProvider==="google.com"

&&user.providerData.some(

item=>item.providerId==="google.com"

);

const emailVerified=

tokenResult.claims.email_verified===true;

if(!googleProvider||!emailVerified){

renderState("googleState","failed");

await denyAccess(

user,

"google_provider_invalid",

"notOwner"

);

return;

}

renderState("googleState","verified");

showStatus("verifyingOwner");

renderState("ownerState","checking");

// A custom claim is required.
// It must be assigned using Admin SDK,
// never from browser JavaScript.

if(tokenResult.claims.ownerAdmin!==true){

await denyAccess(

user,

"owner_claim_missing",

"setupRequired",

true

);

return;

}

renderState("ownerState","verified");

renderState("uidState","checking");

renderState("backendState","checking");

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(!validSession(
user,
currentGeneration
))return;

const result=response.data;

// Backend must verify:
// 1. Firebase Auth ID token.
// 2. Google sign-in provider.
// 3. Verified email.
// 4. ownerAdmin custom claim.
// 5. Server-side immutable owner UID.
// 6. Revoked or disabled accounts.
// 7. Owner session policy.
// 8. Firebase App Check.
// 9. Login rate limits.
// 10. Security audit records.

if(

result?.authorized!==true

||result.uid!==user.uid

||result.role!=="owner"

||result.ownerUidVerified!==true

||result.sessionValid!==true

){

await denyAccess(

user,

"backend_denied",

"notOwner"

);

return;

}

renderState("uidState","verified");

renderState("backendState","verified");

showStatus("authorized","green");

redirecting=true;

updateControls();

if(!validSession(
user,
currentGeneration
)){

redirecting=false;

setBusy(false);

return;

}

showStatus("redirecting","green");

location.replace(

"./admin-dashboard.html?lang="

+encodeURIComponent(lang)

);

}catch(e){

if(currentGeneration!==generation)return;

renderState("uidState","failed");

renderState("backendState","failed");

redirecting=false;

showStatus(

"backendUnavailable",

"red"

);

$("retryButton").hidden=false;

$("switchAccount").hidden=false;

setBusy(false);

}

}

function handleLoginError(error){

const code=error?.code||"";

switch(code){

case "auth/popup-closed-by-user":

case "auth/cancelled-popup-request":

showStatus("popupClosed","yellow");

break;

case "auth/popup-blocked":

showStatus("popupBlocked","red");

break;

case "auth/unauthorized-domain":

showStatus("domainError","red");

break;

case "auth/too-many-requests":

retryAfter=Date.now()+60000;

showStatus("tooManyRequests","red");

if(retryTimer){

clearTimeout(retryTimer);

}

retryTimer=setTimeout(

updateControls,

60000

);

break;

case "auth/network-request-failed":

showStatus("connectionLost","red");

break;

default:

showStatus("loginError","red");

}

$("retryButton").hidden=false;

setBusy(false);

}

generation++;

redirecting=false;

appCheckReady=false;

clearSetup();

showStatus(

"connectionLost",

"red"

);

setBusy(false);

}

);

window.addEventListener(

"online",

async()=>{

if(!initialized)return;

if(auth.currentUser){

await verifyOwner(auth.currentUser);

}else{

setBusy(true);

try{

await verifyAppCheck();

showStatus("ready");

}catch(e){

showStatus(

"appCheckFailed",

"red"

);

$("retryButton").hidden=false;

}finally{

setBusy(false);

}

}

}

);

// PAGE RESTORATION

window.addEventListener(

"pageshow",

event=>{

if(

event.persisted

&&initialized

&&auth.currentUser

){

redirecting=false;

verifyOwner(auth.currentUser);

}

}

);

updateControls();

initializeSecurity();

</script>

</body>

</html>

<meta charset="UTF-8">
<meta name="viewport"

<title>MY RIDE - Owner Admin Account</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:#fff;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
}

.checkRow input{
width:22px;
height:22px;
flex-shrink:0;
accent-color:#FFD600;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
padding:15px;
border-radius:9px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
margin-top:10px;
font-size:19px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.profile{
text-align:center;
padding:15px;
}

.avatar{
width:85px;
height:85px;
border-radius:50%;
background:#FFD600;
color:#111;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
margin:10px auto;
}

.good{
color:#55E68A!important;
}

.bad{
color:#FF7777!important;
}

.warning{
color:#FFB347;
line-height:1.8;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
overflow-wrap:anywhere;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.danger{
background:#A71919;
color:#fff;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

@media(max-width:450px){
.grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Owner Admin Account
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>

<button data-lang="en">English</button>

</section>

</div>

</section>

<p class="note"
data-t="googleNotice"></p>

</section>

<section class="panel">

<h3 data-t="sessionHeading"></h3>

<p class="note"
data-t="sessionNotice"></p>

<button id="loadSessions"
data-t="refresh"></button>

<div id="sessionList"></div>

<button id="moreSessions"
data-t="more"
hidden></button>

</section>

<section id="revokePanel"
class="panel"
hidden>

<h3 data-t="revokeHeading"></h3>

<div id="selectedSession"
class="record"></div>

<label for="revokeReason"
data-t="reason"></label>

<textarea id="revokeReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="confirmRevoke"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="revokeSession"
class="danger"
data-t="revokeSession"></button>

<button id="closeRevoke"
class="back"
data-t="close"></button>

</section>

<section class="panel">

<h3 data-t="loginHistory"></h3>

<button id="loadLoginHistory"
data-t="viewHistory"></button>

<div id="loginHistoryList"></div>

<button id="moreLoginHistory"
data-t="more"
hidden></button>

</section>

<section class="panel">

<h3 data-t="securityAlerts"></h3>

<button id="loadAlerts"
data-t="refresh"></button>

<div id="alertList"></div>

<button id="moreAlerts"
data-t="more"
hidden></button>

<a id="securityLink"
class="action"
data-t="securityManagement"></a>

</section>

<section class="panel">

<h3 data-t="lostDevice"></h3>

<p class="warning"
data-t="lostDeviceNotice"></p>

<a class="action"
href="https://myaccount.google.com/device-activity"
target="_blank"
rel="noopener noreferrer"
data-t="googleDevices"></a>

<a class="action"
href="https://accounts.google.com/signin/recovery"
target="_blank"
rel="noopener noreferrer"
data-t="recovery"></a>

</section>

<section class="panel">

<h3 data-t="sessionControl"></h3>

<label for="allReason"
data-t="reason"></label>

<textarea id="allReason"
maxlength="500"></textarea>

<label for="confirmationText"
data-t="confirmationText"></label>

<input id="confirmationText"
maxlength="20"
autocomplete="off">

<label class="checkRow">

<input id="confirmAll"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="revokeOthers"
class="danger"
data-t="revokeOthers"></button>

<button id="revokeAll"
class="danger"
data-t="revokeAll"></button>

<p class="warning"
data-t="revokeNotice"></p>

</section>

<section class="panel">

<h3 data-t="ownerProtection"></h3>

<p data-t="ownerProtectionNotice"
class="note"></p>

<a id="settingsLink"
class="action"
data-t="systemSettings"></a>

<a id="databaseLink"
class="action"
data-t="databaseManagement"></a>

</section>

<section class="panel">

<h3 data-t="auditHistory"></h3>

<button id="loadAudit"
data-t="viewHistory"></button>

<div id="auditList"></div>

<button id="moreAudit"
data-t="more"
hidden></button>

</section>

<p id="result"
class="message"
role="status"
aria-live="polite"></p>

<button id="logoutButton"
class="danger"
data-t="logout"></button>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

function validText(value,max){

return typeof value==="string"

&&value.length<=max;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validCount(value){

return Number.isSafeInteger(value)

&&value>=0;

}

function validTime(value){

return Number.isFinite(value)

&&value>0

&&value<=8640000000000000;

}

function nullableTime(value){

return value===null||validTime(value);

}

function validCursor(value){

return value===null

||(

validText(value,4000)

&&value.length>0

);

}

function formatDate(value){

if(!validTime(value))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(value));

}

&&ownerUid!==null

&&auth?.currentUser?.uid===ownerUid

function validOwner(data,uid){

async function serverCall(name,data={}){

if(!isOwner()){

}

const currentGeneration=generation;

const response=await httpsCallable(

name,

{timeout:30000}

)(data);

if(currentGeneration!==generation

||!isOwner()){

}

if(response.data?.success!==true

}

return response.data;

}

const user=auth.currentUser;

prompt:"select_account"

});

const credential=await reauthenticateWithPopup(

);

if(credential.user.uid!==uid

||auth.currentUser?.uid!==uid

||!isOwner()){

throw new Error("Owner changed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

}

&&typeof record.current==="boolean"

&&validCount(record.revision)

&&account

&&record.current===

(record.sessionId===account.currentSessionId);

}

function validLogin(record){

return record

&&validText(record.browser,200)

&&validTime(record.createdAtMs)

&&["success","failed","blocked"]

.includes(record.status);

function validAudit(record){

}

addLine(box,"device",record.device);

addLine(box,"browser",record.browser);

addLine(

box,

"created",

formatDate(record.createdAtMs)

);

addLine(

box,

"lastSeen",

formatDate(record.lastSeenAtMs)

);

addLine(

box,

"currentStatus",

t(record.status)

);

addLine(

box,

"currentDevice",

t(record.current?"yes":"no")

);

}

function renderList(type){

const config=listConfig[type];

const data=lists[type];

const container=$(config.container);

container.replaceChildren();

$(config.more).hidden=

data.cursor===null;

if(!isOwner())return;

if(!data.records.length){

container.textContent=t("noRecords");

return;

}

data.records.forEach(record=>{

const box=makeRecord();

if(type==="sessions"){

sessionLines(box,record);

if(record.status==="active"

&&!record.current){

const button=makeButton(

"revokeSession",

()=>openRevoke(record.sessionId)

);

button.classList.add("danger");

box.appendChild(button);

}

}

if(type==="logins"){

addLine(box,"device",record.device);

addLine(box,"browser",record.browser);

addLine(

box,

"currentStatus",

t(record.status)

);

addLine(

box,

"created",

formatDate(record.createdAtMs)

);

}

if(type==="alerts"){

const title=document.createElement("h4");

title.textContent=record.title;

const description=document.createElement("p");

description.textContent=record.description;

box.append(title,description);

addLine(

box,

"severity",

t(record.severity)

);

addLine(

box,

"currentStatus",

t(record.status)

);

addLine(

box,

"created",

formatDate(record.createdAtMs)

);

}

if(type==="audit"){

addLine(box,"action",record.action);

addLine(box,"reason",record.reason);

addLine(box,"sessionId",record.sessionId);

addLine(

box,

"currentStatus",

t(record.status)

);

addLine(

box,

"created",

formatDate(record.createdAtMs)

);

}

container.appendChild(box);

});

}

async function loadList(type,reset=true){

const config=listConfig[type];

const data=lists[type];

const response=await serverCall(

config.functionName,

{

limit:30,

cursor:reset?null:data.cursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(config.validator)

||!validCursor(response.nextCursor)){

throw new Error("Invalid records");

}

const map=new Map(

(reset?[]:data.records)

.map(record=>[record[config.key],record])

);

response.records.forEach(record=>{

map.set(record[config.key],record);

});

data.records=[...map.values()];

data.cursor=response.nextCursor;

renderList(type);

}

async function runRead(callback){

if(!isOwner()

||busy

||mutationBusy

||pendingMutation)return;

const currentGeneration=generation;

busy=true;

updateControls();

message("result","loading");

try{

await callback();

if(currentGeneration===generation){

message("result","");

}

}catch(e){

if(currentGeneration===generation){

message("result","error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

}

$("refreshAccount").onclick=()=>{

runRead(async()=>{

await loadAccount();

await loadList("sessions",true);

});

};

$("loadSessions").onclick=()=>{

runRead(()=>loadList("sessions",true));

};

$("moreSessions").onclick=()=>{

if(lists.sessions.cursor!==null){

runRead(()=>loadList("sessions",false));

}

};

$("loadLoginHistory").onclick=()=>{

runRead(()=>loadList("logins",true));

};

$("moreLoginHistory").onclick=()=>{

if(lists.logins.cursor!==null){

runRead(()=>loadList("logins",false));

}

};

$("loadAlerts").onclick=()=>{

runRead(()=>loadList("alerts",true));

};

$("moreAlerts").onclick=()=>{

if(lists.alerts.cursor!==null){

runRead(()=>loadList("alerts",false));

}

};

$("loadAudit").onclick=()=>{

runRead(()=>loadList("audit",true));

};

$("moreAudit").onclick=()=>{

if(lists.audit.cursor!==null){

runRead(()=>loadList("audit",false));

}

};

function renderSelectedSession(){

$("revokePanel").hidden=

!selectedSession||!isOwner();

const box=$("selectedSession");

box.replaceChildren();

if(selectedSession){

sessionLines(box,selectedSession);

}

}

function openRevoke(sessionId){

runRead(async()=>{

const response=await serverCall(

"getAdminOwnerSessionDetails",

{sessionId}

);

if(!validSession(response.session)

||response.session.sessionId!==sessionId

||response.session.current

||response.session.status!=="active"){

throw new Error("Invalid session");

}

selectedSession=response.session;

$("revokeReason").value="";

$("confirmRevoke").checked=false;

renderSelectedSession();

$("revokePanel").scrollIntoView({

behavior:"smooth"

});

});

}

function closeRevoke(){

selectedSession=null;

$("revokeReason").value="";

$("confirmRevoke").checked=false;

renderSelectedSession();

updateControls();

}

$("closeRevoke").onclick=()=>{

if(!mutationBusy&&!pendingMutation){

closeRevoke();

}

};

function readSingleRevoke(){

if(!selectedSession

||selectedSession.current

||selectedSession.status!=="active"

||!$("confirmRevoke").checked){

return null;

}

const reason=$("revokeReason").value.trim();

if(reason.length<10||reason.length>500){

return null;

}

return {

sessionId:selectedSession.sessionId,

expectedRevision:selectedSession.revision,

reason

};

}

function readBulkRevoke(scope){

if(!["others","all"].includes(scope)

||!account

||$("confirmationText").value.trim()!=="REVOKE"

||!$("confirmAll").checked){

return null;

}

const reason=$("allReason").value.trim();

if(reason.length<10||reason.length>500){

return null;

}

return {

scope,

currentSessionId:account.currentSessionId,

reason

};

}

async function runMutation(

name,

payload,

validate,

onSuccess

){

if(!isOwner()

||busy

||mutationBusy)return;

const fingerprint=JSON.stringify({

name,payload

});

if(pendingMutation

&&pendingMutation.fingerprint!==fingerprint){

message("result","saveError");

return;

}

if(!pendingMutation){

pendingMutation={

name,

payload,

fingerprint,

requestId:crypto.randomUUID()

};

}

const currentGeneration=generation;

mutationBusy=true;

updateControls();

message("result","saving");

try{

await freshOwnerAuthentication();

if(currentGeneration!==generation

||!isOwner())return;

const response=await serverCall(

name,

{

...pendingMutation.payload,

requestId:pendingMutation.requestId

}

);

if(!validate(response)){

throw new Error("Action not confirmed");

}

pendingMutation=null;

await onSuccess(response);

}catch(e){

if(currentGeneration===generation){

message("result","saveError");

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

}

}

}

$("revokeSession").onclick=()=>{

const name="revokeAdminOwnerSession";

const payload=

pendingMutation?.name===name

?pendingMutation.payload

:readSingleRevoke();

if(!payload){

message("result","invalid");

return;

}

runMutation(

name,

payload,

response=>

validSession(response.session)

&&response.session.sessionId===payload.sessionId

&&response.session.status==="revoked"

&&response.session.revision>payload.expectedRevision,

async()=>{

closeRevoke();

message("result","revokeSuccess");

try{

await loadAccount();

await loadList("sessions",true);

}catch(e){

message("result","error");

}

}

);

};

async function localLogout(){

clearSession();

try{

await signOut(auth);

location.replace(pageLink("admin-login.html"));

}catch(e){

denyAccess();

message("result","error");

}

}

function bulkRevoke(scope){

const name="revokeAdminOwnerSessions";

const payload=

pendingMutation?.name===name

?pendingMutation.payload

:readBulkRevoke(scope);

if(!payload||payload.scope!==scope){

message("result","invalid");

return;

}

runMutation(

name,

payload,

response=>

response.revoked===true

&&response.scope===payload.scope

&&validCount(response.revokedCount)

&&response.currentSessionRevoked===

(payload.scope==="all"),

async()=>{

if(scope==="all"){

await localLogout();

return;

}

$("allReason").value="";

$("confirmationText").value="";

$("confirmAll").checked=false;

closeRevoke();

message("result","revokeSuccess");

try{

await loadAccount();

await loadList("sessions",true);

}catch(e){

message("result","error");

}

}

);

}

$("revokeOthers").onclick=()=>{

bulkRevoke("others");

};

$("revokeAll").onclick=()=>{

bulkRevoke("all");

};

$("logoutButton").onclick=async()=>{

if(!window.confirm(t("confirmLogout")))return;

if(busy||mutationBusy)return;

mutationBusy=true;

updateControls();

try{

if(isOwner()){

const response=await serverCall(

"endOwnerAdminSession",

{

requestId:crypto.randomUUID()

}

);

if(response.ended!==true){

throw new Error("Logout not confirmed");

}

}

}catch(e){

window.alert(t("logoutError"));

}finally{

await localLogout();

}

};

[

["revokeReason","confirmRevoke"],

["allReason","confirmAll"],

["confirmationText","confirmAll"]

].forEach(([id,confirmId])=>{

$(id).addEventListener("input",()=>{

$(confirmId).checked=false;

updateControls();

});

});

["confirmRevoke","confirmAll"]

.forEach(id=>{

$(id).addEventListener(

"change",

updateControls

);

});

function updateControls(){

const locked=

!isOwner()

||busy

||mutationBusy;

const pending=!!pendingMutation;

[

"refreshAccount",

"loadSessions",

"moreSessions",

"loadLoginHistory",

"moreLoginHistory",

"loadAlerts",

"moreAlerts",

"loadAudit",

"moreAudit",

"closeRevoke",

"revokeReason",

"confirmRevoke",

"allReason",

"confirmationText",

"confirmAll"

].forEach(id=>{

$(id).disabled=locked||pending;

});

document.querySelectorAll("[data-dynamic]")

.forEach(button=>{

button.disabled=locked||pending;

});

$("revokeSession").disabled=

locked

||(

pending

?pendingMutation.name!=="revokeAdminOwnerSession"

:!readSingleRevoke()

);

$("revokeOthers").disabled=

locked

||(

pending

?(

pendingMutation.name!=="revokeAdminOwnerSessions"

||pendingMutation.payload.scope!=="others"

)

:!readBulkRevoke("others")

);

$("revokeAll").disabled=

locked

||(

pending

?(

pendingMutation.name!=="revokeAdminOwnerSessions"

||pendingMutation.payload.scope!=="all"

)

:!readBulkRevoke("all")

);

$("logoutButton").disabled=

busy||mutationBusy;

}

function renderLanguage(){

document.documentElement.lang=lang;

document.querySelectorAll("[data-t]")

.forEach(element=>{

element.textContent=t(element.dataset.t);

});

const links={

loginLink:"admin-login.html",

dashboardLink:"admin-dashboard.html",

backLink:"admin-dashboard.html",

securityLink:"admin-security.html",

settingsLink:"admin-settings.html",

databaseLink:"admin-database.html"

};

Object.entries(links).forEach(([id,page])=>{

$(id).href=pageLink(page);

});

Object.keys(messages).forEach(id=>{

message(id,messages[id]);

});

renderAccount();

Object.keys(lists).forEach(renderList);

renderSelectedSession();

updateControls();

}

document.querySelectorAll("[data-lang]")

.forEach(button=>{

button.onclick=()=>{

if(!languages.includes(button.dataset.lang))return;

lang=button.dataset.lang;

try{

localStorage.setItem(

"myride_admin_language",

lang

);

const url=new URL(location.href);

url.searchParams.set("lang",lang);

history.replaceState(null,"",url);

}catch(e){}

renderLanguage();

};

});

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

account=null;

selectedSession=null;

pendingMutation=null;

Object.values(lists).forEach(list=>{

list.records=[];

list.cursor=null;

});

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("revokePanel").hidden=true;

$("revokeReason").value="";

$("confirmRevoke").checked=false;

$("allReason").value="";

$("confirmationText").value="";

$("confirmAll").checked=false;

message("result","");

renderLanguage();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

message("status","denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

message("status","offline");

return;

}

message("status","checking");

try{

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

message("status","ownerVerified");

updateControls();

await runRead(async()=>{

await loadAccount();

await loadList("sessions",true);

});

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

setInterval(async()=>{

if(!isOwner()

||checking

||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation)return;

if(!validOwner(response.data,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||pendingMutation

||document.hidden)return;

runRead(async()=>{

await loadAccount();

if(!selectedSession){

await loadList("sessions",true);

}

});

},60000);

window.addEventListener("offline",()=>{

clearSession();

message("status","offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(mutationBusy||pendingMutation){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderLanguage();

updateControls();

initializeSecurity();

</script>

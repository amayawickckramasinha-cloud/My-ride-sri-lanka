<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="robots"
content="noindex,nofollow,noarchive">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Complaints & Feedback</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:110px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:23px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.record.urgent{
border:2px solid #FF5555;
}

.messageBody{
white-space:pre-wrap;
overflow-wrap:anywhere;
background:#181818;
border-radius:8px;
padding:12px;
margin:10px 0;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.bad{
color:#FF7777;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.whatsapp{
background:#25D366;
color:#111;
}

.danger{
background:#B91C1C;
color:white;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Complaints & Feedback
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>
<button data-lang="en">English</button>
<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"
class="message"
role="status"
aria-live="polite">
Checking security...
</p>

<section id="accessPanel"
class="panel"
hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="overview"
class="grid"></div>

<p id="lastUpdate"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="emergency"></h3>

<p class="warning"
data-t="emergencyNotice"></p>

<button id="urgentButton"
class="danger"
data-t="viewUrgent"></button>

<a id="emergencyLink"
class="action back"
data-t="emergencyPage"></a>

</section>

<section class="panel">

<h3 data-t="complaints"></h3>

<label for="search"
data-t="search"></label>

<input id="search"
type="search"
maxlength="100"
autocomplete="off">

<label for="source"
data-t="source"></label>

<select id="source">

<option value="all"
data-t="all"></option>

<option value="customer"
data-t="customer"></option>

<option value="driver"
data-t="driver"></option>

</select>

<label for="type"
data-t="type"></label>

<select id="type">

<option value="all"
data-t="all"></option>

<option value="complaint"

<option value="feedback"
data-t="feedback"></option>

<option value="question"
data-t="question"></option>

</select>

<label for="caseStatus"

<select id="caseStatus">

<option value="all"
data-t="all"></option>

<option value="pending"
data-t="pending"></option>

<option value="investigating"
data-t="investigating"></option>

<option value="resolved"
data-t="resolved"></option>

<option value="rejected"
data-t="rejected"></option>

</select>

<label for="priority"
data-t="priority"></label>

<select id="priority">

<option value="all"
data-t="all"></option>

<option value="normal"
data-t="normal"></option>

<option value="high"
data-t="high"></option>

<option value="urgent"
data-t="urgent"></option>

</select>

<label for="fromDate"
data-t="fromDate"></label>

<input id="fromDate"
type="date">

<label for="toDate"
data-t="toDate"></label>

<input id="toDate"
type="date">

<button id="searchButton"
data-t="searchButton"></button>

<p id="listResult"
class="message"
role="status"></p>

<div id="complaintList"></div>

<button id="moreComplaints"
data-t="more"
hidden></button>

</section>

<section id="detailsPanel"
class="panel"
hidden>

<h3 data-t="details"></h3>

<div id="complaintDetails"></div>

<a id="callButton"
class="action"
data-t="call"
hidden></a>

<a id="whatsappButton"
class="action whatsapp"
data-t="whatsapp"
target="_blank"
rel="noopener noreferrer"
hidden></a>

<h4 data-t="history"></h4>

<div id="caseHistory"></div>

<button id="moreHistory"
data-t="more"
hidden></button>

<button id="closeDetails"
class="back"
data-t="close"></button>

</section>

<section id="managementPanel"
class="panel"
hidden>

<h3 data-t="management"></h3>

<label for="newStatus"
data-t="newStatus"></label>

<select id="newStatus">

<option value="pending"
data-t="pending"></option>

<option value="investigating"
data-t="investigating"></option>

<option value="resolved"
data-t="resolved"></option>

<option value="rejected"
data-t="rejected"></option>

</select>

<label for="newPriority"
data-t="priority"></label>

<select id="newPriority">

<option value="normal"
data-t="normal"></option>

<option value="high"
data-t="high"></option>

<option value="urgent"
data-t="urgent"></option>

</select>

<label for="internalNote"
data-t="internalNote"></label>

<textarea id="internalNote"
maxlength="2000"></textarea>

<p class="note"
data-t="privateNotice"></p>

<label for="reply"
data-t="reply"></label>

<textarea id="reply"
maxlength="2000"></textarea>

<label for="replyLanguage"
data-t="replyLanguage"></label>

<select id="replyLanguage">

<option value="si">සිංහල</option>
<option value="en">English</option>
<option value="ta">தமிழ்</option>

</select>

<label class="checkRow">

<input id="sendReply"
type="checkbox">

<span data-t="sendReply"></span>

</label>

<p class="note"
data-t="replyNotice"></p>

<label class="checkRow">

<input id="confirmAction"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="saveAction"
data-t="save"
disabled></button>

<p id="actionResult"
class="message"
role="status"></p>

</section>

<section class="panel">

<h3 data-t="relatedPages"></h3>

<a id="customersLink"
class="action"
data-t="customersPage"></a>

<a id="driversLink"
class="action"
data-t="driversPage"></a>

<a id="bookingsLink"
class="action"
data-t="bookingsPage"></a>

</section>

<p id="result"
class="message"
role="status"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

function isOwner(){

return authorized

&&ownerUid!==null

&&auth?.currentUser?.uid===ownerUid

&&navigator.onLine;

}

function validOwner(data,uid){

return data?.authorized===true

&&data.uid===uid

&&data.role==="owner"

&&data.ownerUidVerified===true

&&data.sessionValid===true;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,max=2000){

return typeof value==="string"

&&value.length<=max;

}

function validPhone(value){

return typeof value==="string"

&&/^\+[1-9]\d{7,14}$/.test(value);

}

function validCount(value){

return Number.isSafeInteger(value)

&&value>=0;

}

function validTime(value){

return Number.isFinite(value)

&&value>0

&&value<=8640000000000000;

}

function validCursor(value){

return value===null

||validText(value,4000);

}

function validDate(value){

if(typeof value!=="string"

||!/^\d{4}-\d{2}-\d{2}$/.test(value)){

return false;

}

const date=new Date(value+"T00:00:00Z");

return Number.isFinite(date.getTime())

&&date.toISOString().slice(0,10)===value;

}

function formatDate(value){

if(!validTime(value))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(value));

}

function mergeRecords(previous,incoming,key){

const map=new Map(

previous.map(record=>[record[key],record])

);

incoming.forEach(record=>{

map.set(record[key],record);

});

return [...map.values()];

}

if(!isOwner()){

const currentGeneration=generation;

||!isOwner()){

throw new Error("Session changed");

}

if(response.data?.success!==true

||response.data.ownerUid!==ownerUid){

throw new Error("Invalid response");

}

return response.data;

}

function validRecord(record){

&&validId(record.caseId)

&&(record.bookingId===null

||validId(record.bookingId))

&&(record.driverId===null

||validId(record.driverId))

&&sources.includes(record.source)

&&types.includes(record.type)

&&statuses.includes(record.status)

&&priorities.includes(record.priority)

&&validText(record.name,200)

&&validText(record.subject,200)

&&validPhone(record.phone)

&&languages.includes(record.language)

&&validTime(record.createdAtMs)

&&validTime(record.updatedAtMs)

&&record.updatedAtMs>=record.createdAtMs

&&validCount(record.revision);

}

&&validText(record.message,10000)

&&(record.whatsapp===null

||validPhone(record.whatsapp))

&&typeof record.whatsappConsent==="boolean"

&&typeof record.canReply==="boolean"

&&deliveryStatuses.includes(

record.deliveryStatus

);

}

function readQuery(openOnly=false){

const source=$("source").value;

const type=$("type").value;

const status=$("caseStatus").value;

const priority=$("priority").value;

const fromDate=$("fromDate").value||null;

const toDate=$("toDate").value||null;

if(!["all",...sources].includes(source)

||!["all",...types].includes(type)

||!["all",...statuses].includes(status)

||!["all",...priorities].includes(priority)

||(fromDate&&!validDate(fromDate))

||(toDate&&!validDate(toDate))

||(fromDate&&toDate&&fromDate>toDate)){

throw new Error("Invalid query");

}

return {

search:$("search").value.trim(),

source,

type,

status,

priority,

fromDate,

toDate,

openOnly,

timeZone:"Asia/Colombo"

};

async function fetchRecords(reset=true){

if(!currentQuery)return;

if(reset){

records=[];

nextCursor=null;

renderRecords();

}

const response=await serverCall(

"getAdminComplaints",

{

...currentQuery,

limit:30,

cursor:reset?null:nextCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validRecord)

||!validCursor(response.nextCursor)){

throw new Error("Invalid records");

}

if(currentQuery.openOnly

&&response.records.some(record=>

!["pending","investigating"]

.includes(record.status))){

throw new Error("Invalid open cases");

}

records=mergeRecords(

records,

response.records,

"caseId"

);

nextCursor=response.nextCursor;

renderRecords();

}

async function runRead(callback,resultId="result"){

if(!isOwner()||busy||mutationBusy)return;

const currentGeneration=generation;

busy=true;

updateControls();

message(resultId,"loading");

try{

await callback();

if(currentGeneration===generation){

message(resultId,"");

}

}catch(e){

if(currentGeneration===generation){

message(resultId,"error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

}

function validHistory(record){

return record

&&validId(record.actionId)

&&validId(record.caseId)

&&statuses.includes(record.oldStatus)

&&statuses.includes(record.newStatus)

&&priorities.includes(record.priority)

&&validText(record.internalNote,2000)

&&validText(record.reply,2000)

&&deliveryStatuses.includes(

record.deliveryStatus

)

&&validTime(record.createdAtMs);

}

function renderHistory(){

const container=$("caseHistory");

container.replaceChildren();

$("moreHistory").hidden=

historyCursor===null;

if(!selectedCase||!isOwner())return;

if(!historyRecords.length){

container.textContent=t("noRecords");

return;

}

historyRecords.forEach(record=>{

const box=recordBox();

addLine(box,"date",

formatDate(record.createdAtMs));

addLine(box,"oldStatus",

t(record.oldStatus));

addLine(box,"newStatus",

t(record.newStatus));

addLine(box,"priority",

t(record.priority));

addMessage(box,"internalNote",

record.internalNote);

if(record.reply){

addMessage(box,"reply",record.reply);

}

addLine(box,"deliveryStatus",

deliveryLabel(record.deliveryStatus));

container.appendChild(box);

});

}

function renderDetails(){

const container=$("complaintDetails");

container.replaceChildren();

$("callButton").hidden=true;

$("whatsappButton").hidden=true;

$("callButton").removeAttribute("href");

$("whatsappButton").removeAttribute("href");

$("detailsPanel").hidden=

!selectedCase||!isOwner();

$("managementPanel").hidden=

!selectedCase||!isOwner();

if(!selectedCase||!isOwner())return;

const record=selectedCase;

recordLines(container,record);

addLine(container,"driverId",

record.driverId||"—");

addLine(container,"language",

record.language==="si"?"සිංහල":

record.language==="ta"?"தமிழ்":"English");

addLine(container,"deliveryStatus",

deliveryLabel(record.deliveryStatus));

addMessage(container,"message",record.message);

if(validPhone(record.phone)){

$("callButton").href="tel:"+record.phone;

$("callButton").hidden=false;

}

if(record.whatsappConsent

&&validPhone(record.whatsapp)){

$("whatsappButton").href=

"https://wa.me/"+record.whatsapp.slice(1);

$("whatsappButton").hidden=false;

}

renderHistory();

}

function resetDraft(){

if(!selectedCase)return;

$("newStatus").value=selectedCase.status;

$("newPriority").value=selectedCase.priority;

$("internalNote").value="";

$("reply").value="";

$("replyLanguage").value=selectedCase.language;

$("sendReply").checked=false;

$("confirmAction").checked=false;

message("actionResult","");

updateControls();

}

async function loadDetails(caseId){

const response=await serverCall(

"getAdminComplaintDetails",

{

caseId

}

);

if(!validDetails(response.record)

||response.record.caseId!==caseId){

throw new Error("Invalid details");

}

selectedCase=response.record;

resetDraft();

renderDetails();

}

async function loadHistory(reset=true){

if(!selectedCase)return;

const caseId=selectedCase.caseId;

if(reset){

historyRecords=[];

historyCursor=null;

renderHistory();

}

const response=await serverCall(

"getAdminComplaintHistory",

{

caseId,

limit:30,

cursor:reset?null:historyCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(record=>

validHistory(record)

&&record.caseId===caseId

)

||!validCursor(response.nextCursor)){

throw new Error("Invalid history");

}

historyRecords=mergeRecords(

historyRecords,

response.records,

"actionId"

);

historyCursor=response.nextCursor;

renderHistory();

}

function openCase(caseId){

if(busy||mutationBusy||!isOwner())return;

if(!canDiscard())return;

runRead(async()=>{

selectedCase=null;

historyRecords=[];

historyCursor=null;

renderDetails();

await loadDetails(caseId);

await loadHistory(true);

$("detailsPanel").scrollIntoView({

behavior:"smooth"

});

});

}

$("moreHistory").onclick=()=>{

if(historyCursor!==null&&selectedCase){

runRead(()=>loadHistory(false));

};

$("closeDetails").onclick=()=>{

if(busy||mutationBusy)return;

historyRecords=[];

historyCursor=null;

$("internalNote").value="";

async function freshOwnerAuthentication(){

if(!isOwner()){

throw new Error("Unauthorized");

}

const user=auth.currentUser;

const uid=user.uid;

const provider=new GoogleAuthProvider();

provider.setCustomParameters({

prompt:"select_account"

});

const credential=await reauthenticateWithPopup(

user,

provider

);

if(credential.user.uid!==uid

||auth.currentUser?.uid!==uid

||!isOwner()){

throw new Error("Owner changed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Invalid owner");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(!validOwner(response.data,uid)

||!isOwner()){

throw new Error("Owner verification failed");

}

}

function readAction(){

if(!selectedCase)return null;

const status=$("newStatus").value;

const priority=$("newPriority").value;

const internalNote=$("internalNote").value.trim();

const reply=$("reply").value.trim();

const replyLanguage=$("replyLanguage").value;

const sendReply=$("sendReply").checked;

if(!statuses.includes(status)

||!priorities.includes(priority)

||!languages.includes(replyLanguage)

||internalNote.length<10

||internalNote.length>2000

||reply.length>2000

||(sendReply

&&(!selectedCase.canReply||reply.length<2))

||(!sendReply&&reply.length>0)

||!$("confirmAction").checked){

return null;

}

return {

caseId:selectedCase.caseId,

expectedRevision:selectedCase.revision,

status,

priority,

internalNote,

reply:sendReply?reply:"",

replyLanguage,

sendReply

};

}

$("saveAction").onclick=async()=>{

if(!isOwner()

||busy

||mutationBusy

||!selectedCase)return;

const payload=readAction();

if(!payload){

message("actionResult","invalid");

return;

}

const fingerprint=JSON.stringify(payload);

if(pendingMutation

&&pendingMutation.fingerprint!==fingerprint){

message("actionResult","saveError");

return;

}

if(!pendingMutation){

pendingMutation={

fingerprint,

requestId:crypto.randomUUID()

};

}

const currentGeneration=generation;

mutationBusy=true;

updateControls();

message("actionResult","saving");

try{

await freshOwnerAuthentication();

if(currentGeneration!==generation

||!isOwner())return;

const response=await serverCall(

"updateAdminComplaint",

{

...payload,

requestId:pendingMutation.requestId

}

);

if(!validDetails(response.record)

||response.record.caseId!==payload.caseId

||response.record.revision<=

payload.expectedRevision

||response.record.status!==payload.status

||response.record.priority!==payload.priority

||typeof response.replyQueued!=="boolean"

||(payload.sendReply&&!response.replyQueued)){

throw new Error("Update not confirmed");

}

selectedCase=response.record;

pendingMutation=null;

records=records.map(record=>

record.caseId===selectedCase.caseId

?selectedCase

:record

);

resetDraft();

renderDetails();

renderRecords();

message(

"actionResult",

response.replyQueued?"queued":"saved"

);

try{

await loadOverview();

await loadHistory(true);

if(currentQuery){

await fetchRecords(true);

}

}catch(e){

message("result","error");

}

}catch(e){

if(currentGeneration===generation){

message("actionResult","saveError");

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

}

}

};

function updateControls(){

const locked=busy||mutationBusy||!isOwner();

[

"refreshButton",
"urgentButton",
"search",
"source",
"type",
"caseStatus",
"priority",
"fromDate",
"toDate",
"searchButton",
"moreComplaints",
"moreHistory",
"closeDetails"

].forEach(id=>{

$(id).disabled=locked;

});

document.querySelectorAll("[data-dynamic]")

.forEach(button=>{

button.disabled=locked;

});

[

"newStatus",
"newPriority",
"internalNote",
"confirmAction"

].forEach(id=>{

$(id).disabled=locked||!selectedCase;

});

$("sendReply").disabled=

locked||!selectedCase?.canReply;

$("reply").disabled=

locked||!selectedCase?.canReply

||!$("sendReply").checked;

$("replyLanguage").disabled=

locked||!selectedCase?.canReply

||!$("sendReply").checked;

$("saveAction").disabled=

locked||!readAction();

}

[

"newStatus",
"newPriority",
"internalNote",
"reply",
"replyLanguage",
"sendReply"

].forEach(id=>{

$(id).addEventListener("input",()=>{

$("confirmAction").checked=false;

updateControls();

});

});

$("confirmAction").onchange=updateControls;

$("sendReply").addEventListener("change",()=>{

if(!$("sendReply").checked){

$("reply").value="";

}

updateControls();

});

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

overview=null;

lastSync=null;

records=[];

historyRecords=[];

nextCursor=null;

historyCursor=null;

currentQuery=null;

selectedCase=null;

pendingMutation=null;

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("detailsPanel").hidden=true;

$("managementPanel").hidden=true;

[

"search",
"fromDate",
"toDate",
"internalNote",
"reply"

].forEach(id=>{

$(id).value="";

});

[

"source",
"type",
"caseStatus",
"priority"

].forEach(id=>{

$(id).value="all";

});

$("newStatus").value="pending";

$("newPriority").value="normal";

$("sendReply").checked=false;

$("confirmAction").checked=false;

$("complaintDetails").replaceChildren();

$("caseHistory").replaceChildren();

$("callButton").removeAttribute("href");

$("whatsappButton").removeAttribute("href");

$("callButton").hidden=true;

$("whatsappButton").hidden=true;

[

"result",
"listResult",
"actionResult"

].forEach(id=>{

message(id,"");

});

renderOverview();

renderRecords();

renderDetails();

updateControls();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

message("status","denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

message("status","offline");

return;

}

message("status","checking");

try{

const appToken=await getToken(appCheck,false);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

message("status","verified");

updateControls();

await runRead(async()=>{

await loadOverview();

currentQuery=readQuery(false);

await fetchRecords(true);

});

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

setInterval(async()=>{

if(!isOwner()

||checking

||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation)return;

if(!validOwner(response.data,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||document.hidden)return;

runRead(async()=>{

await loadOverview();

if(currentQuery

&&!selectedCase

&&!pendingMutation){

await fetchRecords(true);

}

});

},30000);

window.addEventListener("offline",()=>{

clearSession();

message("status","offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(hasDraft()

||mutationBusy

||pendingMutation){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderLanguage();

updateControls();

initializeSecurity();

</script>

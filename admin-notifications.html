<title>MY RIDE - Notifications Management</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:110px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:23px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.messageBody{
white-space:pre-wrap;
overflow-wrap:anywhere;
background:#181818;
border-radius:8px;
padding:12px;
margin:10px 0;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
padding:8px 0;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.danger{
background:#B91C1C;
color:white;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.bad{
color:#FF7777;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<footer>
© MY RIDE SRI LANKA

if(currentGeneration===generation){

async function runMutation(

name,

payload,

validate,

onSuccess,

resultId

){

if(!isOwner()||busy||mutationBusy)return;

const fingerprint=JSON.stringify({

name,

payload

});

if(pendingMutation

&&pendingMutation.fingerprint!==fingerprint){

message(resultId,"saveError");

return;

}

if(!pendingMutation){

pendingMutation={

fingerprint,

requestId:crypto.randomUUID()

};

}

const currentGeneration=generation;

mutationBusy=true;

updateControls();

message(resultId,"saving");

try{

await freshOwnerAuthentication();

if(currentGeneration!==generation

||!isOwner())return;

const response=await serverCall(

name,

{

...payload,

requestId:pendingMutation.requestId

}

);

if(!validate(response)){

throw new Error("Mutation not confirmed");

}

pendingMutation=null;

await onSuccess(response);

}catch(e){

if(currentGeneration===generation){

message(resultId,"saveError");

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

}

}

}

if(!audiences.includes(audience)

||!notificationTypes.includes(type)

||!priorities.includes(priority)

||!["now","scheduled"].includes(sendMode)

||reason.length<10

||reason.length>500){

throw new Error("Invalid input");

}

let recipientId=null;

let district="all";

let vehicle="all";

if(["singleDriver","singleCustomer"]

.includes(audience)){

recipientId=$("recipientId").value.trim();

if(!validId(recipientId)){

throw new Error("Invalid recipient");

}

}

if(audience==="filteredDrivers"){

district=$("district").value;

vehicle=$("vehicle").value;

if(!(district==="all"

||districts.some(row=>row[0]===district))

||!["all",...vehicles].includes(vehicle)){

throw new Error("Invalid filters");

}

}

const translations={};

en:"En",

ta:"Ta"

};

languages.forEach(language=>{

const title=$("title"+suffix).value.trim();

const body=$("body"+suffix).value.trim();

if(title.length<2

||title.length>100

||body.length<2

||body.length>1000){

throw new Error("Invalid translation");

}

translations[language]={title,body};

});

const channels=[];

if($("inApp").checked){

channels.push("inApp");

}

if($("push").checked){

if(!settings?.pushConnected){

throw new Error("Push unavailable");

}

channels.push("push");

}

if(!channels.length){

throw new Error("Select channel");

}

let scheduledAtMs=null;

if(sendMode==="scheduled"){

const date=$("scheduleDate").value;

const time=$("scheduleTime").value;

if(!/^\d{4}-\d{2}-\d{2}$/.test(date)

||!/^\d{2}:\d{2}$/.test(time)){

throw new Error("Invalid schedule");

}

scheduledAtMs=Date.parse(

date+"T"+time+":00+05:30"

);

if(!validTime(scheduledAtMs)

||scheduledAtMs<serverNow()+60000

||scheduledAtMs>serverNow()+365*86400000){

throw new Error("Invalid schedule");

}

}

if(type==="emergency"

&&sendMode==="scheduled"){

throw new Error("Emergency must be immediate");

}

return {

audience,

recipientId,

district,

vehicle,

type,

priority,

translations,

channels,

sendMode,

scheduledAtMs,

reason,

timeZone:"Asia/Colombo"

};

}

const label=language==="si"?"සිංහල":

language==="ta"?"தமிழ்":"English";

addMessage(

container,

label+" — "+translation.title,

translation.body

);

});

}

$("previewButton").onclick=()=>{

let payload;

try{

payload=readNotification();

}catch(e){

message("composeResult","invalid");

return;

}

invalidatePreview();

runRead(async()=>{

const response=await serverCall(

"previewAdminNotification",

payload

);

if(!validText(response.previewToken,4096)

||!response.previewToken

||!validCount(response.recipientCount)

||!validTime(response.expiresAtMs)

||response.expiresAtMs<=serverNow()

||response.expiresAtMs>serverNow()+600000){

throw new Error("Invalid preview");

}

if(response.recipientCount===0){

previewData=null;

$("previewPanel").hidden=true;

$("previewContent").textContent=t("noRecipients");

$("previewPanel").hidden=false;

return;

}

previewData={

payload,

previewToken:response.previewToken,

recipientCount:response.recipientCount,

expiresAtMs:response.expiresAtMs

};

$("confirmSend").checked=false;

renderPreview();

$("previewPanel").scrollIntoView({

behavior:"smooth"

});

},"composeResult");

};

$("confirmSend").onchange=updateControls;

$("closePreview").onclick=()=>{

if(!mutationBusy){

invalidatePreview();

}

};

$("sendButton").onclick=()=>{

if(!previewData

||!$("confirmSend").checked

||!isOwner())return;

if(previewData.expiresAtMs<=serverNow()

&&!pendingMutation){

invalidatePreview();

message("composeResult","expiredPreview");

return;

}

const payload={

previewToken:previewData.previewToken,

notification:previewData.payload

};

runMutation(

"submitAdminNotification",

payload,

response=>

response.accepted===true

&&validId(response.notificationId)

&&["scheduled","queued"]

.includes(response.status),

async response=>{

invalidatePreview();

resetComposer();

message("composeResult","accepted");

try{

await loadOverview();

if(historyQuery){

await loadHistory(true);

}

}catch(e){

message("result","error");

}

},

"composeResult"

);

};

function resetComposer(){

[

"recipientId",
"titleSi",
"bodySi",
"titleEn",
"bodyEn",
"titleTa",
"bodyTa",
"scheduleDate",
"scheduleTime",
"sendReason"

].forEach(id=>{

$(id).value="";

});

$("audience").value="allDrivers";

$("district").value="all";

$("vehicle").value="all";

$("notificationType").value="general";

$("priority").value="normal";

$("sendMode").value="now";

$("inApp").checked=true;

$("push").checked=false;

updateAudience();

invalidatePreview();

}

function validRecord(record){

return record

&&validId(record.notificationId)

&&audiences.includes(record.audience)

&&notificationTypes.includes(record.type)

&&priorities.includes(record.priority)

&&deliveryStatuses.includes(record.status)

&&validText(record.title,100)

&&validCount(record.recipientCount)

&&validCount(record.successCount)

&&validCount(record.failedCount)

&&validCount(record.pendingCount)

&&record.recipientCount===

record.successCount

+record.failedCount

+record.pendingCount

&&validTime(record.createdAtMs)

&&validTime(record.updatedAtMs)

&&record.updatedAtMs>=record.createdAtMs

&&(record.scheduledAtMs===null

||validTime(record.scheduledAtMs))

&&validCount(record.revision);

}

function validDetails(record){

return validRecord(record)

&&languages.every(language=>

validText(record.translations?.[language]?.title,100)

&&validText(record.translations?.[language]?.body,1000))

&&Array.isArray(record.channels)

&&record.channels.length>=1

&&record.channels.length<=2

&&record.channels.every(channel=>

["inApp","push"].includes(channel))

&&new Set(record.channels).size===

record.channels.length

&&validText(record.reason,500)

&&typeof record.canRetry==="boolean"

&&typeof record.canCancel==="boolean";

}

function recordLines(container,record){

addLine(container,"notificationId",

record.notificationId);

addLine(container,"title",record.title);

addLine(container,"audience",t(record.audience));

addLine(container,"notificationType",t(record.type));

addLine(container,"priority",t(record.priority));

addLine(container,"deliveryStatus",t(record.status));

addLine(container,"recipientCount",record.recipientCount);

addLine(container,"successCount",record.successCount);

addLine(container,"failedCount",record.failedCount);

addLine(container,"pendingCount",record.pendingCount);

addLine(container,"created",

formatDate(record.createdAtMs));

addLine(container,"updated",

formatDate(record.updatedAtMs));

if(record.scheduledAtMs){

addLine(container,"scheduleTime",

formatDate(record.scheduledAtMs));

}

}

function renderHistory(){

const container=$("historyList");

container.replaceChildren();

$("moreHistory").hidden=nextCursor===null;

if(!isOwner()||!historyQuery)return;

if(!records.length){

container.textContent=t("noRecords");

return;

}

records.forEach(record=>{

const box=document.createElement("div");

box.className="record";

recordLines(box,record);

const button=document.createElement("button");

button.textContent=t("viewDetails");

button.dataset.dynamic="true";

button.disabled=busy||mutationBusy;

button.onclick=()=>openDetails(

record.notificationId

);

box.appendChild(button);

container.appendChild(box);

});

}

async function loadHistory(reset=true){

if(!historyQuery)return;

if(reset){

records=[];

nextCursor=null;

renderHistory();

}

const response=await serverCall(

"getAdminNotificationHistory",

{

...historyQuery,

limit:30,

cursor:reset?null:nextCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validRecord)

||!validCursor(response.nextCursor)){

throw new Error("Invalid history");

}

if(historyQuery.status!=="all"

&&response.records.some(record=>

record.status!==historyQuery.status)){

throw new Error("Invalid status");

}

const map=new Map(

records.map(record=>[

record.notificationId,

record

])

);

response.records.forEach(record=>{

map.set(record.notificationId,record);

});

records=[...map.values()];

nextCursor=response.nextCursor;

renderHistory();

}

function readHistoryQuery(){

const status=$("historyStatus").value;

if(!["all",...deliveryStatuses].includes(status)){

throw new Error("Invalid status");

}

return {

search:$("historySearch").value.trim(),

status

};

}

$("historySearchButton").onclick=()=>{

runRead(async()=>{

historyQuery=readHistoryQuery();

await loadHistory(true);

},"historyResult");

};

$("moreHistory").onclick=()=>{

if(nextCursor!==null){

runRead(

()=>loadHistory(false),

"historyResult"

);

}

};

function renderDetails(){

const container=$("detailsContent");

container.replaceChildren();

$("detailsPanel").hidden=

!selectedNotification||!isOwner();

$("retryButton").hidden=true;

$("cancelButton").hidden=true;

if(!selectedNotification||!isOwner())return;

const record=selectedNotification;

recordLines(container,record);

addLine(container,"reason",record.reason);

addLine(container,"channels",

record.channels.map(t).join(", "));

languages.forEach(language=>{

const translation=record.translations[language];

addMessage(

container,

translation.title,

translation.body

);

});

$("retryButton").hidden=

!record.canRetry

||record.failedCount===0;

$("cancelButton").hidden=

!record.canCancel

||record.status!=="scheduled";

}

async function loadDetails(notificationId){

const response=await serverCall(

"getAdminNotificationDetails",

{

notificationId

}

);

if(!validDetails(response.record)

||response.record.notificationId!==notificationId){

throw new Error("Invalid details");

}

selectedNotification=response.record;

$("actionReason").value="";

$("confirmAction").checked=false;

renderDetails();

}

function openDetails(notificationId){

runRead(async()=>{

selectedNotification=null;

renderDetails();

message("actionResult","");

await loadDetails(notificationId);

$("detailsPanel").scrollIntoView({

behavior:"smooth"

});

});

}

$("closeDetails").onclick=()=>{

if(mutationBusy||busy)return;

selectedNotification=null;

$("actionReason").value="";

$("confirmAction").checked=false;

renderDetails();

updateControls();

};

function readHistoryAction(action){

if(!selectedNotification

||!$("confirmAction").checked){

return null;

}

const reason=$("actionReason").value.trim();

if(reason.length<10||reason.length>500){

return null;

}

if(action==="retry"

&&(!selectedNotification.canRetry

||selectedNotification.failedCount===0)){

return null;

}

if(action==="cancel"

&&(!selectedNotification.canCancel

||selectedNotification.status!=="scheduled")){

return null;

}

return {

notificationId:selectedNotification.notificationId,

expectedRevision:selectedNotification.revision,

reason

};

}

function submitHistoryAction(action){

const payload=readHistoryAction(action);

if(!payload){

message("actionResult","invalid");

return;

}

const functionName=

action==="retry"

?"retryAdminNotification"

:"cancelAdminScheduledNotification";

runMutation(

functionName,

payload,

response=>

validDetails(response.record)

&&response.record.notificationId===

payload.notificationId

&&response.record.revision>

payload.expectedRevision

&&(action!=="cancel"

||response.record.status==="cancelled"),

async response=>{

selectedNotification=response.record;

$("actionReason").value="";

$("confirmAction").checked=false;

renderDetails();

message("actionResult","actionAccepted");

try{

await loadOverview();

if(historyQuery){

await loadHistory(true);

}

}catch(e){

message("result","error");

}

},

"actionResult"

);

}

$("retryButton").onclick=()=>{

submitHistoryAction("retry");

};

$("cancelButton").onclick=()=>{

submitHistoryAction("cancel");

};

$("actionReason").oninput=()=>{

$("confirmAction").checked=false;

updateControls();

};

$("confirmAction").onchange=updateControls;

$("refreshButton").onclick=()=>{

runRead(async()=>{

await loadOverview();

if(!settingsDirty){

await loadSettings();

}

if(historyQuery){

await loadHistory(true);

}

});

};

function updateControls(){

const locked=busy||mutationBusy||!isOwner();

[

"refreshButton",
"historySearch",
"historyStatus",
"historySearchButton",
"moreHistory",
"closeDetails"

].forEach(id=>{

$(id).disabled=locked;

});

document.querySelectorAll("[data-dynamic]")

.forEach(button=>{

button.disabled=locked;

});

$("autoEnabled").disabled=

locked||!settings;

automaticKeys.forEach(key=>{

$("auto_"+key).disabled=

locked

||!settings

||essentialKeys.includes(key)

||!$("autoEnabled").checked;

});

$("settingsReason").disabled=

locked||!settings;

$("saveSettings").disabled=

locked

||!settings

||!settingsDirty

||$("settingsReason").value.trim().length<10;

composeIds.forEach(id=>{

$(id).disabled=locked||!settings;

});

$("push").disabled=

locked||!settings?.pushConnected;

$("previewButton").disabled=

locked||!settings||!!pendingMutation;

$("confirmSend").disabled=

locked||!previewData;

$("sendButton").disabled=

locked

||!previewData

||!$("confirmSend").checked

||(previewData.expiresAtMs<=serverNow()

&&!pendingMutation);

$("closePreview").disabled=

locked||!!pendingMutation;

$("actionReason").disabled=

locked||!selectedNotification;

$("confirmAction").disabled=

locked||!selectedNotification;

$("retryButton").disabled=

locked||!readHistoryAction("retry");

$("cancelButton").disabled=

locked||!readHistoryAction("cancel");

if(pendingMutation){

composeIds.forEach(id=>{

$(id).disabled=true;

});

$("autoEnabled").disabled=true;

automaticKeys.forEach(key=>{

$("auto_"+key).disabled=true;

});

$("settingsReason").disabled=true;

$("actionReason").disabled=true;

$("confirmAction").disabled=true;

$("confirmSend").disabled=true;

$("closeDetails").disabled=true;

$("historySearchButton").disabled=true;

$("refreshButton").disabled=true;

$("moreHistory").disabled=true;

document.querySelectorAll("[data-dynamic]")

.forEach(button=>{

button.disabled=true;

});

}

}

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

overview=null;

settings=null;

settingsDirty=false;

lastSync=null;

clockOffset=0;

records=[];

nextCursor=null;

historyQuery=null;

selectedNotification=null;

previewData=null;

pendingMutation=null;

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("detailsPanel").hidden=true;

$("previewPanel").hidden=true;

$("settingsReason").value="";

$("actionReason").value="";

$("historySearch").value="";

$("historyStatus").value="all";

$("confirmAction").checked=false;

$("confirmSend").checked=false;

resetComposer();

[

"result",
"settingsResult",
"composeResult",
"historyResult",
"actionResult"

].forEach(id=>{

message(id,"");

});

renderOverview();

renderSettings();

renderHistory();

renderDetails();

renderPreview();

updateControls();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

message("status","denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

message("status","offline");

return;

}

message("status","checking");

try{

const appToken=await getToken(appCheck,false);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

message("status","verified");

updateControls();

await runRead(async()=>{

await loadOverview();

await loadSettings();

historyQuery=readHistoryQuery();

await loadHistory(true);

});

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

setInterval(async()=>{

if(!isOwner()

||checking

||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation)return;

if(!validOwner(response.data,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||pendingMutation

||document.hidden)return;

runRead(async()=>{

await loadOverview();

if(historyQuery

&&!selectedNotification){

await loadHistory(true);

}

});

},30000);

setInterval(()=>{

if(previewData

&&!mutationBusy

&&!pendingMutation

&&previewData.expiresAtMs<=serverNow()){

invalidatePreview();

message("composeResult","expiredPreview");

}

},1000);

window.addEventListener("offline",()=>{

clearSession();

message("status","offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

const hasDraft=composeIds.some(id=>

["titleSi","bodySi","titleEn","bodyEn",

"titleTa","bodyTa","sendReason"]

.includes(id)

&&$(id).value.trim()!==""

);

if(hasDraft

||settingsDirty

||mutationBusy

||pendingMutation

||$("actionReason").value.trim()){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

buildAutomaticOptions();

renderLanguage();

updateControls();

initializeSecurity();

</script>

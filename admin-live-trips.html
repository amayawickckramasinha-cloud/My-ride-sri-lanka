<html lang="si" translate="no">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<meta name="robots"
content="noindex,nofollow,noarchive">

<meta name="google"
content="notranslate">

<meta name="referrer"
content="no-referrer">

<title>MY RIDE - Live Trip Monitoring</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

crossorigin="anonymous">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

label{
display:block;
margin-top:12px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:24px;
margin-top:10px;
color:#FFD600;
}

#map{
height:420px;
width:100%;
border-radius:10px;
background:#292929;
}

.trip{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.8;
overflow-wrap:anywhere;
}

.tripId{
font-size:19px;
font-weight:bold;
color:#FFD600;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.danger{
color:#FF7777;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

#status,#result{
color:#FFD600;
text-align:center;
line-height:1.8;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.whatsapp{
background:#25D366;
color:#111;
}

.sectionTitle{
color:#FFD600;
font-weight:bold;
margin-top:18px;
border-bottom:1px solid #555;
padding-bottom:8px;
}

.details{
line-height:1.9;
overflow-wrap:anywhere;
}

.legend{
display:flex;
flex-wrap:wrap;
gap:12px;
font-size:13px;
margin-top:12px;
}

.dot{
display:inline-block;
width:12px;
height:12px;
border-radius:50%;
margin-right:5px;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

@media(max-width:450px){

#map{
height:350px;
}

.stat strong{
font-size:21px;
}

}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Live Trip Monitoring
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>

<button data-lang="en">English</button>

<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"
role="status"
aria-live="polite">

Checking security...

</p>

<section id="accessPanel"
class="panel"
hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="statistics"></h3>

<div id="statistics"
class="grid"></div>

</section>

<section class="panel">

<h3 data-t="liveMap"></h3>

<div id="map"></div>

<div class="legend">

<span>

<i class="dot"
style="background:#25D366"></i>

<span data-t="pickup"></span>

</span>

<span>

<i class="dot"
style="background:#FF4444"></i>

<span data-t="destination"></span>

</span>

<span>

<i class="dot"
style="background:#FFD600"></i>

<span data-t="driver"></span>

</span>

<span>

<i class="dot"
style="background:#3388FF"></i>

<span data-t="travelledRoute"></span>

</span>

</div>

<p class="note"
data-t="mapNotice"></p>

<button id="fitMap"
data-t="showAll"></button>

</section>

<section class="panel">

<h3 data-t="searchTrips"></h3>

<label for="searchInput"
data-t="searchLabel"></label>

<input id="searchInput"
type="search"
maxlength="100"
autocomplete="off">

<label for="vehicleFilter"
data-t="vehicle"></label>

<select id="vehicleFilter">

<option value="all"
data-t="all"></option>

<option value="bike"
data-t="bike"></option>

<option value="tuk"
data-t="tuk"></option>

<option value="car"
data-t="car"></option>

<option value="van"
data-t="van"></option>

</select>

<label for="gpsFilter"
data-t="gpsStatus"></label>

<select id="gpsFilter">

<option value="all"
data-t="all"></option>

<option value="live"
data-t="gpsLive"></option>

<option value="stale"
data-t="gpsStale"></option>

</select>

<button id="searchButton"
data-t="search"></button>

<button id="resetButton"
data-t="reset"></button>

</section>

<section class="panel">

<h3 data-t="tripList"></h3>

<p id="recordCount"
class="note"></p>

<div id="tripList"></div>

<button id="loadMore"
data-t="more"
hidden></button>

</section>

<section id="detailsPanel"
class="panel"
hidden>

<h3 data-t="tripDetails"></h3>

<div id="tripMeter"
class="grid"></div>

<div id="tripDetails"
class="details"></div>

<button id="focusTrip"
data-t="viewRoute"></button>

<button id="closeDetails"
class="back"
data-t="close"></button>

</section>

<p id="result"
role="status"
aria-live="polite"></p>

<p id="lastUpdate"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

function validId(value){

return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validPhone(value){

return typeof value==="string"
&&/^\+[1-9]\d{7,14}$/.test(value);

}

function validText(value,max){

return typeof value==="string"
&&value.length<=max;

}

function validCount(value){

return Number.isSafeInteger(value)
&&value>=0;

}

function validNumber(value){

return Number.isFinite(value)
&&value>=0;

}

function nullableNumber(value){

return value===null||validNumber(value);

}

function validTime(value){

return Number.isFinite(value)
&&value>0
&&value<=8640000000000000;

}

function validPoint(point){

return point

&&Number.isFinite(point.lat)

&&Number.isFinite(point.lon)

&&point.lat>=5.85

&&point.lat<=9.9

&&point.lon>=79.5

&&point.lon<=82;

}

function validLocation(point){

return validPoint(point)

&&validNumber(point.accuracy)

&&validTime(point.updatedAtMs);

}

function serverNow(){

return Date.now()+serverOffset;

}

function recentGPS(record){

if(!serverClockReady
||!validLocation(record.location)
||record.location.accuracy>100){

return false;

}

const age=serverNow()
-record.location.updatedAtMs;

return age>=-5000
&&age<=60000;

}

function recentMeter(record){

if(!serverClockReady
||!validTime(record.meterUpdatedAtMs)){

return false;

}

const age=serverNow()
-record.meterUpdatedAtMs;

return age>=-5000
&&age<=60000;

}

}

).format(new Date(value));

}

function distance(value){

if(!validNumber(value))return "—";

return (value/1000).toFixed(2)+" KM";

}

function duration(value){

if(!validNumber(value))return "—";

const seconds=Math.floor(value);

const h=Math.floor(seconds/3600);

const m=Math.floor((seconds%3600)/60);

const s=seconds%60;

return [h,m,s]

.map(number=>String(number).padStart(2,"0"))

.join(":");

}

async function serverCall(name,data={}){

if(!isOwner()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,

name,

{timeout:25000}

)(data);

if(currentGeneration!==generation
||!isOwner()){

throw new Error("Session changed");

}

return response.data;

}

async function syncServerClock(){

const started=Date.now();

const response=await serverCall(

"getOwnerServerTime"

);

const finished=Date.now();

if(!validTime(response?.serverTimeMs)

||finished-started>10000){

throw new Error("Invalid server time");

}

serverOffset=response.serverTimeMs

-((started+finished)/2);

serverClockReady=true;

}

function subscribeStatistics(){

if(unsubscribe)unsubscribe();

const currentGeneration=generation;

unsubscribe=onSnapshot(

doc(db,"adminDashboard","liveTrips"),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation
||!isOwner())return;

const data=snapshot.data();

const keys=[

"activeTrips",
"liveGpsTrips",
"staleGpsTrips",
"completedToday"

];

if(

snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites

||!snapshot.exists()

||!keys.every(key=>validCount(data[key]))

||data.liveGpsTrips+data.staleGpsTrips

!==data.activeTrips

){

statistics=null;

}else{

statistics=data;

}

renderStatistics();

},

()=>{

if(currentGeneration!==generation)return;

statistics=null;

renderStatistics();

});

}

function validTrip(record){

return record

&&validId(record.bookingId)

&&record.status==="active"

&&vehicles.includes(record.vehicleType)

&&validText(record.driverName,150)

&&validText(record.customerName,150)

&&validText(record.pickupName,500)

&&validText(record.destinationName,500)

&&validPoint(record.pickup)

&&validPoint(record.destination)

&&(record.location===null

||validLocation(record.location))

&&nullableNumber(record.distanceMeters)

&&nullableNumber(record.durationSeconds)

&&nullableNumber(record.currentFare)

&&validTime(record.startedAtMs)

&&(record.meterUpdatedAtMs===null

||validTime(record.meterUpdatedAtMs));

}

function validRoute(route){

return Array.isArray(route)

&&route.length<=5000

&&route.every(point=>

validPoint(point)

&&validTime(point.recordedAtMs)

)

&&route.every((point,index)=>

index===0

||point.recordedAtMs>=

route[index-1].recordedAtMs

);

}

function validDetails(record){

&&validId(record.driverId)

&&validPhone(record.driverPhone)

&&validPhone(record.customerPhone)

&&(record.driverWhatsapp===null

&&Number.isSafeInteger(record.passengers)

&&record.passengers>=1

&&record.passengers<=10

&&["day","night"].includes(record.period)

&&["normal","rain","unknown"]

.includes(record.weatherStatus)

&&["normal","difficult","unknown"]

&&nullableNumber(record.commissionRate)

button.textContent=t("details");

button.disabled=busy;

button.onclick=()=>openTrip(record.bookingId);

panel.appendChild(button);

container.appendChild(panel);

});

$("loadMore").hidden=cursor===null;

if(!records.length){

container.textContent=t("noRecords");

}

}

function renderDetails(){

const container=$("tripDetails");

const meter=$("tripMeter");

container.replaceChildren();

meter.replaceChildren();

if(!selectedTrip||!isOwner()){

$("detailsPanel").hidden=true;

return;

}

const trip=selectedTrip;

$("detailsPanel").hidden=false;

meter.append(

createStat("distance",

distance(trip.distanceMeters)),

createStat("duration",

duration(trip.durationSeconds)),

createStat("currentFare",

money(trip.currentFare)),

createStat("commission",

money(trip.commissionAmount)),

createStat("driverNet",

money(trip.driverNet))

);

if(!recentMeter(trip)){

const warning=document.createElement("p");

warning.className="warning";

warning.textContent=t("meterStale");

container.appendChild(warning);

}

addLine(container,"bookingId",trip.bookingId);

addLine(container,"started",

formatDate(trip.startedAtMs));

addLine(container,"meterUpdated",

formatDate(trip.meterUpdatedAtMs));

addTitle(container,"customer");

addLine(container,"customerName",trip.customerName);

addLine(container,"customerPhone",trip.customerPhone);

container.appendChild(

makeAction(

"callCustomer",

"tel:"+trip.customerPhone

)

);

if(trip.customerWhatsapp){

const link=makeAction(

"whatsapp",

"https://wa.me/"

+trip.customerWhatsapp.slice(1),

"whatsapp"

);

link.target="_blank";

link.rel="noopener noreferrer";

container.appendChild(link);

}

addTitle(container,"driver");

addLine(container,"driverId",trip.driverId);

addLine(container,"driverName",trip.driverName);

addLine(container,"driverPhone",trip.driverPhone);

container.appendChild(

makeAction(

"callDriver",

"tel:"+trip.driverPhone

)

);

if(trip.driverWhatsapp){

const link=makeAction(

"whatsapp",

"https://wa.me/"

+trip.driverWhatsapp.slice(1),

"whatsapp"

);

link.target="_blank";

link.rel="noopener noreferrer";

container.appendChild(link);

}

addTitle(container,"tripDetails");

addLine(container,"vehicle",t(trip.vehicleType));

addLine(container,"passengers",trip.passengers);

addLine(container,"pickup",trip.pickupName);

addLine(container,"destination",trip.destinationName);

addLine(container,"gpsStatus",

t(recentGPS(trip)?"gpsLive":"gpsStale"));

if(trip.location){

addLine(container,"updated",

formatDate(trip.location.updatedAtMs));

addLine(container,"accuracy",

Math.round(trip.location.accuracy)

+" "+t("meters"));

}

addTitle(container,"fareDetails");

addLine(container,"period",t(trip.period));

addLine(container,"weather",t(trip.weatherStatus));

addLine(container,"road",t(trip.roadStatus));

addLine(container,"rainCharge",

money(trip.rainCharge));

addLine(container,"roadCharge",

money(trip.roadCharge));

addLine(container,"discount",

money(trip.distanceDiscount));

addLine(container,"tolls",

money(trip.tolls));

addLine(container,"parking",

money(trip.parking));

addLine(container,"currentFare",

money(trip.currentFare));

addLine(container,"commissionRate",

trip.commissionRate===null

?"—"

:trip.commissionRate+"%");

addLine(container,"commission",

money(trip.commissionAmount));

addLine(container,"driverNet",

money(trip.driverNet));

const note=document.createElement("p");

note.className="note";

note.textContent=t("readOnly");

container.appendChild(note);

$("focusTrip").disabled=!map;

}

function readFilters(){

const search=$("searchInput").value.trim();

const vehicle=$("vehicleFilter").value;

const gps=$("gpsFilter").value;

if(

search.length>100

||!["all",...vehicles].includes(vehicle)

||!["all","live","stale"].includes(gps)

){

throw new Error("Invalid filters");

}

return {

search,

vehicle,

gps

};

}

async function loadTrips(reset=true){

const response=await serverCall(

"getAdminLiveTrips",

{

...filters,

limit:30,

cursor:reset?null:cursor

}

);

if(

response?.success!==true

||response.ownerUid!==ownerUid

||!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validTrip)

||!(response.nextCursor===null

||typeof response.nextCursor==="string")

||!validTime(response.serverTimeMs)

){

throw new Error("Invalid trip records");

}

const unique=new Map(

(reset?[]:records)

.map(record=>[record.bookingId,record])

);

response.records.forEach(record=>{

unique.set(record.bookingId,record);

});

records=[...unique.values()];

cursor=response.nextCursor;

lastSync=response.serverTimeMs;

renderTrips();

renderMap();

renderLastSync();

}

async function fetchTrip(bookingId){

if(!validId(bookingId)){

throw new Error("Invalid booking ID");

}

const response=await serverCall(

"getAdminLiveTripDetails",

{bookingId}

);

if(response?.success!==true

||response.ownerUid!==ownerUid

||response.bookingId!==bookingId){

throw new Error("Invalid trip response");

}

if(response.active===false){

return null;

}

if(response.active!==true

||!validDetails(response.trip)

||response.trip.bookingId!==bookingId){

throw new Error("Invalid trip details");

}

return response.trip;

}

function closeDetails(force=false){

if(busy&&!force)return;

selectedTrip=null;

$("detailsPanel").hidden=true;

$("tripDetails").replaceChildren();

$("tripMeter").replaceChildren();

renderMap();

}

$("closeDetails").onclick=()=>closeDetails();

async function openTrip(bookingId){

if(!isOwner()||busy)return;

const currentGeneration=generation;

setBusy(true);

result("loading");

try{

selectedTrip=await fetchTrip(bookingId);

if(!selectedTrip){

closeDetails(true);

result("tripEnded");

await loadTrips(true);

return;

}

renderDetails();

renderMap();

result("");

$("detailsPanel").scrollIntoView({

behavior:"smooth",

block:"start"

});

}catch(e){

if(currentGeneration===generation){

closeDetails(true);

result("error");

}

}finally{

if(currentGeneration===generation){

setBusy(false);

renderTrips();

}

}

}

async function refreshTrips(reset=true){

if(!isOwner()||busy)return;

const currentGeneration=generation;

setBusy(true);

result("loading");

try{

if(reset){

filters=readFilters();

}

await syncServerClock();

await loadTrips(reset);

result("");

}catch(e){

if(currentGeneration===generation){

records=[];

cursor=null;

lastSync=null;

closeDetails(true);

renderTrips();

renderMap();

renderLastSync();

result("error");

}

}finally{

if(currentGeneration===generation){

setBusy(false);

renderTrips();

}

}

}

$("searchButton").onclick=()=>{

closeDetails();

refreshTrips(true);

};

$("searchInput").addEventListener(

"keydown",

event=>{

if(event.key==="Enter"){

closeDetails();

refreshTrips(true);

}

}

);

$("resetButton").onclick=()=>{

$("searchInput").value="";

$("vehicleFilter").value="all";

$("gpsFilter").value="all";

closeDetails();

refreshTrips(true);

};

$("loadMore").onclick=()=>{

if(cursor!==null){

refreshTrips(false);

}

};

$("refreshButton").onclick=()=>{

closeDetails();

refreshTrips(true);

};

async function refreshLiveTrips(){

if(!isOwner()

||busy

||document.hidden)return;

const currentGeneration=generation;

setBusy(true);

try{

const bookingIds=records.map(

record=>record.bookingId

);

if(bookingIds.length){

const updated=new Map();

for(let i=0;i<bookingIds.length;i+=30){

const batch=bookingIds.slice(i,i+30);

const response=await serverCall(

"getAdminLiveTripUpdates",

{

bookingIds:batch

}

);

if(

response?.success!==true

||response.ownerUid!==ownerUid

||!Array.isArray(response.records)

||response.records.length>batch.length

||!response.records.every(validTrip)

||!response.records.every(record=>

batch.includes(record.bookingId)

)

||!validTime(response.serverTimeMs)

){

throw new Error("Invalid live updates");

}

response.records.forEach(record=>{

updated.set(record.bookingId,record);

});

lastSync=response.serverTimeMs;

}

records=records

.filter(record=>updated.has(record.bookingId))

.map(record=>updated.get(record.bookingId));

}else{

await loadTrips(true);

}

if(selectedTrip){

const bookingId=selectedTrip.bookingId;

selectedTrip=await fetchTrip(bookingId);

if(!selectedTrip){

closeDetails(true);

result("tripEnded");

}

}

renderTrips();

renderDetails();

renderMap();

renderLastSync();

}catch(e){

if(currentGeneration===generation){

records=[];

cursor=null;

lastSync=null;

closeDetails(true);

renderTrips();

renderMap();

renderLastSync();

result("error");

}

}finally{

if(currentGeneration===generation){

setBusy(false);

renderTrips();

}

}

}

function startLiveUpdates(){

if(refreshTimer){

clearInterval(refreshTimer);

}

refreshTimer=setInterval(

refreshLiveTrips,

10000

);

}

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

records=[];

statistics=null;

cursor=null;

selectedTrip=null;

lastSync=null;

serverOffset=0;

serverClockReady=false;

busy=false;

if(unsubscribe){

unsubscribe();

unsubscribe=null;

}

if(refreshTimer){

clearInterval(refreshTimer);

refreshTimer=null;

}

if(map){

map.remove();

map=null;

markerLayer=null;

routeLayer=null;

}

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("detailsPanel").hidden=true;

$("tripList").replaceChildren();

$("tripDetails").replaceChildren();

$("tripMeter").replaceChildren();

$("recordCount").textContent="";

$("lastUpdate").textContent="";

$("loadMore").hidden=true;

$("searchInput").value="";

$("vehicleFilter").value="all";

$("gpsFilter").value="all";

filters={

search:"",
vehicle:"all",
gps:"all"

};

result("");

renderStatistics();

setBusy(false);

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

status("denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

status("offlineInternet");

return;

}

status("checking");

try{

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(

token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"

){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

status("verified");

initializeMap();

subscribeStatistics();

await refreshTrips(true);

if(currentGeneration===generation

&&isOwner()){

startLiveUpdates();

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

db=getFirestore(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(

auth,

verifyOwner

);

}catch(e){

denyAccess();

}

}

let checking=false;

setInterval(async()=>{

if(!isOwner()||checking)return;

const currentGeneration=generation;

checking=true;

try{

const response=await serverCall(

"verifyOwnerAdmin"

);

if(!validOwner(response,ownerUid)){

throw new Error("Access revoked");

}

await syncServerClock();

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()||busy)return;

renderTrips();

renderDetails();

renderMap();

},5000);

setInterval(()=>{

if(!isOwner()

||busy

||selectedTrip

||document.hidden)return;

refreshTrips(true);

},60000);

window.addEventListener(

"offline",

()=>{

clearSession();

status("offlineInternet");

}

);

window.addEventListener(

"online",

()=>{

if(auth){

verifyOwner(auth.currentUser);

}

}

);

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

}

);

document.addEventListener(

"visibilitychange",

()=>{

if(!document.hidden&&isOwner()){

refreshLiveTrips();

}

}

);

renderLanguage();

setBusy(false);

initializeSecurity();

</script>

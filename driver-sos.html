
<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Driver SOS</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.sosIcon{
width:100px;
height:100px;
border-radius:50%;
background:#B91C1C;
border:4px solid #FF6464;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
font-weight:bold;
margin:20px auto;
}

.center{
text-align:center;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:15px;
color:#FFB4B4;
line-height:1.8;
margin:15px 0;
}

.success{
background:#163322;
border:1px solid #4ADE80;
border-radius:10px;
padding:15px;
color:#4ADE80;
line-height:1.8;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.7;
}

.row span{
color:#CCC;
}

.row strong{
text-align:right;
max-width:60%;
overflow-wrap:anywhere;
}

.yellow{
color:#FFD600;
}

.green{
color:#4ADE80;
}

.red{
color:#FF6464;
}

.action{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.emergency{
background:#B91C1C;
color:#fff;
}

.sosButton{
background:#B91C1C;
color:#fff;
font-size:21px;
padding:23px;
border:2px solid #FF6464;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.whatsapp{
background:#25D366;
color:#111;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-size:14px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:14px;
background:#292929;
color:#fff;
border:1px solid #555;
border-radius:9px;
font-size:16px;
}

textarea{
min-height:120px;
resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
outline:2px solid #FFD600;
}

input[type="checkbox"]{
width:22px;
height:22px;
accent-color:#FFD600;
flex-shrink:0;
}

.checkboxRow{
display:flex;
align-items:flex-start;
gap:10px;
margin:18px 0;
}

.checkboxRow label{
margin:0;
font-weight:normal;
line-height:1.8;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.8;
}

#status,
#gpsStatus,
#sosStatus,
#adminStatus{
text-align:center;
line-height:1.8;
color:#FFD600;
overflow-wrap:anywhere;
}

button:disabled,
input:disabled,
select:disabled,
textarea:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading"></h2>

<div class="sosIcon">
SOS
</div>

<div class="warning"
data-t="emergencyWarning"></div>

<!-- EMERGENCY NUMBERS -->

<section class="panel">

<h3 data-t="emergencyServices"></h3>

<a href="tel:119"
class="action emergency"
data-t="police"></a>

<a href="tel:1990"
class="action emergency"
data-t="ambulance"></a>

<p class="note"
data-t="emergencyNote"></p>

</section>

<!-- GPS LOCATION -->

<section class="panel">

<h3 data-t="currentLocation"></h3>

<button id="gpsButton"
class="action"
data-t="getLocation"></button>

<p id="gpsStatus"
role="status"
aria-live="polite"></p>

<div id="locationDetails" hidden>

<div class="row">

<span data-t="latitude"></span>

<strong id="latitude">—</strong>

</div>

<div class="row">

<span data-t="longitude"></span>

<strong id="longitude">—</strong>

</div>

<div class="row">

<span data-t="accuracy"></span>

<strong id="accuracy">—</strong>

</div>

<div class="row">

<span data-t="locationTime"></span>

<strong id="locationTime">—</strong>

</div>

<a id="mapButton"
class="action secondary"
target="_blank"
rel="noopener noreferrer"
data-t="openMap"></a>

<button id="copyLocation"
class="action secondary"
data-t="copyLocation"></button>

</div>

</section>

<p id="status"
role="status"
aria-live="polite"></p>

<!-- ACCESS DENIED -->

<section id="accessPanel"
class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<!-- APPROVED DRIVER CONTENT -->

<div id="content" hidden>

<section class="panel">

<h3 data-t="driverDetails"></h3>

<div class="row">

<span data-t="driverName"></span>

<strong id="driverName">—</strong>

</div>

<div class="row">

<span>Driver ID</span>

<strong id="driverId"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="vehicleNumber"></span>

<strong id="vehicleNumber">—</strong>

</div>

<div class="row">

<span data-t="activeBooking"></span>

<strong id="activeBooking">—</strong>

</div>

</section>

<!-- SOS FORM -->

<section class="panel">

<h3 data-t="sendEmergency"></h3>

<form id="sosForm">

<label for="emergencyType"
data-t="emergencyType"></label>

<select id="emergencyType" required>

<option value=""
data-t="select"></option>

<option value="accident"
data-t="accident"></option>

<option value="medical"
data-t="medical"></option>

<option value="threat"
data-t="threat"></option>

<option value="vehicle_breakdown"
data-t="breakdown"></option>

<option value="passenger_emergency"
data-t="passengerEmergency"></option>

<option value="other"
data-t="other"></option>

</select>

<label for="description"
data-t="description"></label>

<textarea
id="description"
maxlength="1000"></textarea>

<p class="note"
data-t="descriptionNote"></p>

<div class="checkboxRow">

<input
id="locationConsent"
type="checkbox"
checked>

<label for="locationConsent"
data-t="locationConsent"></label>

</div>

<p class="note"
data-t="privacyNote"></p>

<button id="sosButton"
type="submit"
class="action sosButton"
data-t="sendSOS"></button>

</form>

<p id="sosStatus"
role="status"
aria-live="polite"></p>

</section>

<!-- SOS CONFIRMATION -->

<section id="confirmPanel"
class="panel" hidden>

<div class="warning"
data-t="confirmWarning"></div>

<button id="confirmSOS"
class="action emergency"
data-t="confirmSOS"></button>

<button id="cancelSOS"
class="action secondary"
data-t="cancel"></button>

</section>

<!-- SOS SERVER STATUS -->

<section id="incidentPanel"
class="panel" hidden>

<h3 data-t="incidentDetails"></h3>

<div class="row">

<span data-t="incidentId"></span>

<strong id="incidentId"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="incidentStatus"></span>

<strong id="incidentStatus">—</strong>

</div>

<div class="row">

<span data-t="submittedTime"></span>

<strong id="submittedTime">—</strong>

</div>

<div class="row">

<span data-t="adminReply"></span>

<strong id="adminReply">—</strong>

</div>

<p id="incidentNote"
class="note"></p>

<button id="refreshIncident"
class="action secondary"
data-t="refresh"></button>

</section>

<!-- ADMIN EMERGENCY CONTACT -->

<section class="panel">

<h3 data-t="contactAdmin"></h3>

<div class="row">

<span data-t="adminPhone"></span>

<strong id="adminPhone">—</strong>

</div>

<div class="row">

<span>WhatsApp</span>

<strong id="adminWhatsApp">—</strong>

</div>

<p id="adminStatus"
role="status"></p>

<a id="callAdmin"
class="action"
data-t="callAdmin"
hidden></a>

<button id="whatsappAdmin"
class="action whatsapp"
data-t="whatsappAdmin"
disabled></button>

<p class="note"
data-t="whatsappNote"></p>

</section>

<a id="feedbackLink"
class="action secondary"
data-t="feedback"></a>

<a id="helpLink"
class="action secondary"
data-t="help"></a>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function normalizePhone(value){

if(typeof value!=="string")return null;

const phone=value.replace(/[\s()-]/g,"");

return /^\+[1-9]\d{7,14}$/.test(phone)

?phone:null;

}

function formatDate(ms){

if(!Number.isFinite(ms)

||ms<=0

||ms>8640000000000000){

return "—";

}

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(ms));

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// GPS LOCATION VALIDATION

function validLocation(data,maxAge=60000){

return data

&&Number.isFinite(data.lat)

&&Number.isFinite(data.lon)

&&Number.isFinite(data.accuracy)

&&Number.isFinite(data.capturedAtMs)

&&data.lat>=-90

&&data.lat<=90

&&data.lon>=-180

&&data.lon<=180

&&data.accuracy>=0

&&data.capturedAtMs<=Date.now()+5000

&&Date.now()-data.capturedAtMs<=maxAge;

}

function positionData(position){

return {

lat:position.coords.latitude,

lon:position.coords.longitude,

accuracy:position.coords.accuracy,

capturedAtMs:position.timestamp

};

}

function mapUrl(data){

return "https://www.google.com/maps/search/?api=1&query="

+encodeURIComponent(

data.lat+","+data.lon

);

}

function displayLocation(data){

if(!validLocation(data))return;

currentLocation=data;

$("latitude").textContent=

data.lat.toFixed(6);

$("longitude").textContent=

data.lon.toFixed(6);

$("accuracy").textContent=

Math.round(data.accuracy)+" "+t.meters;

$("locationTime").textContent=

formatDate(data.capturedAtMs);

$("mapButton").href=mapUrl(data);

$("locationDetails").hidden=false;

$("gpsStatus").textContent=t.locationReady;

}

function clearLocation(){

currentLocation=null;

$("locationDetails").hidden=true;

$("mapButton").removeAttribute("href");

$("latitude").textContent="—";

$("longitude").textContent="—";

$("accuracy").textContent="—";

$("locationTime").textContent="—";

}

// GET CURRENT GPS

function getCurrentLocation(){

return new Promise((resolve,reject)=>{

if(!navigator.geolocation){

reject(new Error("GPS unsupported"));

return;

}

navigator.geolocation.getCurrentPosition(

position=>{

const data=positionData(position);

if(!validLocation(data)){

reject(new Error("Invalid location"));

return;

}

resolve(data);

},

reject,

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:12000

}

);

});

}

$("gpsButton").onclick=async()=>{

if(!navigator.geolocation){

$("gpsStatus").textContent=

t.locationUnsupported;

return;

}

$("gpsButton").disabled=true;

$("gpsStatus").textContent=t.locating;

try{

const data=await getCurrentLocation();

displayLocation(data);

}catch(e){

clearLocation();

$("gpsStatus").textContent=

t.locationFailed;

}finally{

$("gpsButton").disabled=false;

}

};

// COPY LOCATION

$("copyLocation").onclick=async()=>{

if(!validLocation(currentLocation)){

$("gpsStatus").textContent=t.locationOld;

return;

}

try{

await navigator.clipboard.writeText(

mapUrl(currentLocation)

);

$("gpsStatus").textContent=t.copied;

}catch(e){

$("gpsStatus").textContent=t.copyFailed;

}

};

// GPS CONTINUITY FOR ONLINE DRIVERS

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const data=positionData(position);

if(!validSession()

||!driver

||!["online","busy"].includes(

driver.availability

)

||!validLocation(data,30000)

||data.accuracy>100

||data.lat<5.85

||data.lat>9.9

||data.lon<79.5

||data.lon>82

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

data

);

}catch(e){

// Backend must expire stale GPS records.

}finally{

gpsSending=false;

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// CLEAR ADMIN CONTACTS

function clearContacts(){

supportSettings=null;

$("adminPhone").textContent="—";

$("adminWhatsApp").textContent="—";

$("callAdmin").hidden=true;

$("callAdmin").removeAttribute("href");

$("whatsappAdmin").disabled=true;

$("adminStatus").textContent="";

}

function stopSupportListener(){

if(supportUnsubscribe){

supportUnsubscribe();

supportUnsubscribe=null;

}

clearContacts();

}

// ADMIN CONTACT SETTINGS

function subscribeSupport(){

stopSupportListener();

if(!validSession()||!driver)return;

const currentGeneration=generation;

supportUnsubscribe=onSnapshot(

doc(db,"publicSettings","driverSupport"),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession()

||!driver)return;

clearContacts();

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites

||!snapshot.exists()){

$("adminStatus").textContent=

t.notConfigured;

return;

}

const data=snapshot.data();

if(data.enabled!==true){

$("adminStatus").textContent=

t.notConfigured;

return;

}

supportSettings=data;

const phone=normalizePhone(data.phone);

const whatsapp=normalizePhone(data.whatsapp);

if(data.callEnabled===true&&phone){

$("adminPhone").textContent=phone;

$("callAdmin").href="tel:"+phone;

$("callAdmin").hidden=false;

}

if(data.whatsappEnabled===true&&whatsapp){

$("adminWhatsApp").textContent=whatsapp;

$("whatsappAdmin").disabled=false;

}

if($("callAdmin").hidden

&&$("whatsappAdmin").disabled){

$("adminStatus").textContent=

t.notConfigured;

}

},

()=>{

if(currentGeneration!==generation)return;

clearContacts();

$("adminStatus").textContent=

t.contactError;

}

);

}

// SOS INCIDENT STATUS

function stopIncidentListener(){

if(incidentUnsubscribe){

incidentUnsubscribe();

incidentUnsubscribe=null;

}

activeIncidentId=null;

$("incidentPanel").hidden=true;

$("incidentId").textContent="—";

$("incidentStatus").textContent="—";

$("submittedTime").textContent="—";

$("adminReply").textContent="—";

$("incidentNote").textContent="";

}

function displayIncident(data){

if(!data

||data.driverUid!==uid

||!validId(data.incidentId)

||!INCIDENT_STATUSES.includes(data.status)){

return false;

}

activeIncidentId=data.incidentId;

$("incidentId").textContent=

data.incidentId;

$("incidentStatus").textContent=

t[data.status];

$("incidentStatus").className=

data.status==="resolved"

||data.status==="closed"

?"green":"yellow";

$("submittedTime").textContent=

formatDate(data.createdAt?.toMillis?.());

$("adminReply").textContent=

typeof data.adminReply==="string"

&&data.adminReply.length<=4000

&&data.adminReply.trim()

?data.adminReply

:t.waiting;

$("incidentNote").textContent=

t.incidentWarning;

$("incidentPanel").hidden=false;

return true;

}

function subscribeIncident(){

stopIncidentListener();

if(!validSession()||!driver)return;

const currentGeneration=generation;

incidentUnsubscribe=onSnapshot(

doc(

db,

"drivers",

uid,

"sosIncidents",

"latest"

),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession()

||!driver)return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

$("incidentStatus").textContent="—";

$("adminReply").textContent="—";

$("incidentNote").textContent=

t.incidentUnavailable;

return;

}

if(!snapshot.exists()){

$("incidentPanel").hidden=true;

activeIncidentId=null;

return;

}

if(!displayIncident(snapshot.data())){

$("incidentPanel").hidden=true;

activeIncidentId=null;

}

},

()=>{

if(currentGeneration!==generation)return;

$("incidentStatus").textContent="—";

$("adminReply").textContent="—";

$("incidentNote").textContent=

t.incidentUnavailable;

}

);

}

$("refreshIncident").onclick=()=>{

if(validSession()&&driver){

subscribeIncident();

}

};

// SOS FORM CONTROLS

function updateControls(){

const enabled=

validSession()

&&driver!==null

&&!sending

&&confirmedDraft===null;

[

"emergencyType",

"description",

"locationConsent",

"sosButton"

].forEach(id=>{

$(id).disabled=!enabled;

});

$("confirmSOS").disabled=sending;

$("cancelSOS").disabled=sending;

}

function closeConfirmation(){

confirmedDraft=null;

$("confirmPanel").hidden=true;

updateControls();

}

// FIRST SOS CONFIRMATION

$("sosForm").onsubmit=event=>{

event.preventDefault();

if(!validSession()

||!driver

||sending)return;

const type=$("emergencyType").value;

const description=

$("description").value.trim();

if(!EMERGENCY_TYPES.includes(type)

||description.length>1000){

$("sosStatus").textContent=t.invalid;

return;

}

confirmedDraft={

type,

description,

shareLocation:$("locationConsent").checked

};

$("confirmPanel").hidden=false;

$("sosStatus").textContent="";

updateControls();

$("confirmPanel").scrollIntoView({

behavior:"smooth",

block:"center"

});

};

$("cancelSOS").onclick=()=>{

if(!sending){

closeConfirmation();

}

};

// SEND SOS TO BACKEND

$("confirmSOS").onclick=async()=>{

if(!validSession()

||!driver

||!confirmedDraft

||sending)return;

const currentGeneration=generation;

const draft={...confirmedDraft};

sending=true;

updateControls();

$("sosStatus").textContent=t.sending;

try{

let gps=null;

if(draft.shareLocation){

if(validLocation(currentLocation,30000)){

gps={...currentLocation};

}else{

try{

gps=await getCurrentLocation();

if(currentGeneration!==generation)return;

displayLocation(gps);

}catch(e){

gps=null;

}

}

if(currentGeneration!==generation

||!validSession()

||!driver)return;

if(!gps&&!confirm(t.noLocation)){

return;

}

}

const fingerprint=JSON.stringify([

draft.type,

draft.description,

draft.shareLocation,

lang

]);

if(!pendingRequest

||pendingRequest.fingerprint!==fingerprint){

pendingRequest={

fingerprint,

requestId:crypto.randomUUID(),

location:gps

};

}

const result=await serverCall(

"submitDriverSOS",

{

requestId:pendingRequest.requestId,

type:draft.type,

description:draft.description,

locationConsent:draft.shareLocation,

location:pendingRequest.location,

language:lang

}

);

if(currentGeneration!==generation

||!driver)return;

if(result?.accepted!==true

||!validId(result.incidentId)){

throw new Error("SOS not confirmed");

}

activeIncidentId=result.incidentId;

pendingRequest=null;

$("sosForm").reset();

$("incidentId").textContent=

result.incidentId;

$("incidentStatus").textContent=t.new;

$("incidentStatus").className="yellow";

$("submittedTime").textContent=

formatDate(result.createdAtMs);

$("adminReply").textContent=t.waiting;

$("incidentNote").textContent=

t.incidentWarning;

$("incidentPanel").hidden=false;

$("sosStatus").textContent=t.submitted;

}catch(e){

if(currentGeneration!==generation)return;

$("sosStatus").textContent=t.sendFailed;

}finally{

if(currentGeneration===generation){

sending=false;

closeConfirmation();

updateControls();

}

}

};

// ADMIN WHATSAPP MESSAGE

$("whatsappAdmin").onclick=()=>{

if(!validSession()

||!driver

||supportSettings?.enabled!==true

||supportSettings?.whatsappEnabled!==true){

return;

}

const phone=normalizePhone(

supportSettings.whatsapp

);

if(!phone)return;

const lines=[

"MY RIDE SRI LANKA",

t.emergencyMessage,

"",

t.driverName+": "+driver.fullName,

"Driver ID: "+driver.driverId

];

if(typeof driver.vehicleNumber==="string"){

lines.push(

t.vehicleNumber+": "+driver.vehicleNumber

);

}

if(validId(driver.activeBookingId)){

lines.push(

"Booking ID: "+driver.activeBookingId

);

}

if(validId(activeIncidentId)){

lines.push(

"SOS ID: "+activeIncidentId

);

}

const type=$("emergencyType").value;

if(EMERGENCY_TYPES.includes(type)){

lines.push(

t.emergencyType+": "+t[TYPE_LABELS[type]]

);

}

const description=

$("description").value.trim();

if(description){

lines.push(

t.description+": "+description.slice(0,1000)

);

}

if($("locationConsent").checked

&&validLocation(currentLocation)){

lines.push(

"",

t.currentLocation+":",

mapUrl(currentLocation),

t.accuracy+": "+

Math.round(currentLocation.accuracy)

+" "+t.meters

);

}else{

lines.push(t.locationNotShared);

}

const url=

"https://wa.me/"

+phone.slice(1)

+"?text="

+encodeURIComponent(lines.join("\n"));

window.location.assign(url);

};

// ADMIN CALL VALIDATION

$("callAdmin").addEventListener(

"click",

event=>{

if(!validSession()

||!driver

||supportSettings?.enabled!==true

||supportSettings?.callEnabled!==true

||!normalizePhone(supportSettings.phone)){

event.preventDefault();

}

}

);

// CLEAR PRIVATE DRIVER INFORMATION

function disconnect(){

generation++;

authorized=false;

uid=null;

driver=null;

sending=false;

pendingRequest=null;

confirmedDraft=null;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

stopSupportListener();

stopIncidentListener();

stopGps();

clearLocation();

$("gpsStatus").textContent="";

$("driverName").textContent="—";

$("driverId").textContent="—";

$("vehicleNumber").textContent="—";

$("activeBooking").textContent="—";

$("sosForm").reset();

$("sosStatus").textContent="";

$("confirmPanel").hidden=true;

$("content").hidden=true;

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// DRIVER ACCOUNT MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

driver=null;

stopGps();

stopSupportListener();

stopIncidentListener();

closeConfirmation();

$("sosForm").reset();

pendingRequest=null;

$("content").hidden=true;

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||typeof data.fullName!=="string"

||!data.fullName.trim()

||!validId(data.driverId)){

denyAccess();

return;

}

const firstLoad=driver===null;

driver=data;

$("driverName").textContent=

data.fullName;

$("driverId").textContent=

data.driverId;

$("vehicleNumber").textContent=

typeof data.vehicleNumber==="string"

?data.vehicleNumber:"—";

$("activeBooking").textContent=

validId(data.activeBookingId)

?data.activeBookingId

:t.noBooking;

$("content").hidden=false;

$("accessPanel").hidden=true;

if(["online","busy"].includes(

data.availability

)){

startGps();

}else{

stopGps();

}

if(firstLoad||!supportUnsubscribe){

subscribeSupport();

}

if(firstLoad||!incidentUnsubscribe){

subscribeIncident();

}

updateControls();

status("");

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// APPROVED DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!db||!functions){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true

||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(

functions,

"verifyDriverSOSSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// AUTOMATIC SESSION VERIFICATION

setInterval(async()=>{

if(!validSession()

||!driver

||checkingSession)return;

const currentGeneration=generation;

checkingSession=true;

try{

const result=await serverCall(

"verifyDriverSOSSession"

);

if(currentGeneration!==generation)return;

if(result?.authorized!==true

||result.uid!==uid

||result.status!=="approved"

||result.activationComplete!==true){

denyAccess();

}

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

checkingSession=false;

}

},60000);

// GPS EXPIRY MONITORING

setInterval(()=>{

if(currentLocation

&&!validLocation(currentLocation)){

clearLocation();

$("gpsStatus").textContent=t.locationOld;

}

},5000);

// INTERNET CONNECTION MONITORING

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>


<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Pay Commission</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
text-align:center;
color:#FFD600;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.highlight{
border-color:#FFD600;
text-align:center;
}

.label{
color:#CCC;
font-size:14px;
line-height:1.8;
}

.amount{
font-size:32px;
font-weight:bold;
margin:12px 0;
overflow-wrap:anywhere;
}

.yellow{color:#FFD600}
.green{color:#4ADE80}
.red{color:#FF6464}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
}

.row strong{
text-align:right;
overflow-wrap:anywhere;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-size:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:14px;
border:1px solid #555;
border-radius:9px;
background:#292929;
color:#fff;
font-size:16px;
}

input:focus{
outline:2px solid #FFD600;
}

input[type="file"]{
font-size:13px;
}

input[type="checkbox"]{
width:22px;
height:22px;
flex-shrink:0;
accent-color:#FFD600;
}

.checkboxRow{
display:flex;
align-items:flex-start;
gap:10px;
margin:18px 0;
line-height:1.8;
}

.checkboxRow label{
margin:0;
font-size:14px;
font-weight:normal;
}

.action{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border:0;
border-radius:10px;
background:#FFD600;
color:#111;
font-size:16px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.smallButton{
padding:8px 12px;
background:#FFD600;
color:#111;
border:0;
border-radius:6px;
cursor:pointer;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:15px;
color:#FFB4B4;
line-height:1.8;
margin:15px 0;
}

.success{
background:#163322;
border:1px solid #4ADE80;
border-radius:10px;
padding:15px;
color:#4ADE80;
line-height:1.8;
}

.pending{
background:#39320D;
border:1px solid #FFD600;
border-radius:10px;
padding:15px;
color:#FFD600;
line-height:1.8;
}

.note{
color:#BBB;
font-size:13px;
line-height:1.8;
}

#status{
text-align:center;
color:#FFD600;
line-height:1.8;
}

#preview{
display:block;
max-width:100%;
max-height:280px;
margin:15px auto;
border-radius:10px;
object-fit:contain;
}

.progress{
height:12px;
background:#444;
border-radius:10px;
overflow:hidden;
margin:15px 0;
}

#uploadBar{
height:100%;
width:0;
background:#FFD600;
}

hr{
border:0;
border-top:1px solid #444;
margin:18px 0;
}

button:disabled,
input:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading"></h2>

<p id="status"
role="status"
aria-live="polite"></p>

<section id="accessPanel"
class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="content" hidden>

<section class="panel">

<div class="row">

<span data-t="driverName"></span>

<strong id="driverName">—</strong>

</div>

<div class="row">

<span>Driver ID</span>

<strong id="driverId">—</strong>

</div>

</section>

<section class="panel highlight">

<div class="label"
data-t="outstanding"></div>

<div id="outstanding"
class="amount red">—</div>

<hr>

<div class="label"
data-t="overdue"></div>

<div id="overdue"
class="amount red">—</div>

<hr>

<div class="label"
data-t="pendingAmount"></div>

<div id="pendingAmount"
class="amount yellow">—</div>

<hr>

<div class="label"
data-t="availableAmount"></div>

<div id="availableAmount"
class="amount yellow">—</div>

<div class="row">

<span data-t="deadline"></span>

<strong id="deadline">—</strong>

</div>

</section>

<div id="overdueWarning"
class="warning" hidden
data-t="overdueWarning"></div>

<div id="allPaid"
class="success" hidden
data-t="allPaid"></div>

<section id="bankPanel"
class="panel" hidden>

<h3 data-t="bankDetails"></h3>

<div class="row">

<span data-t="bankName"></span>

<strong id="bankName">—</strong>

</div>

<div class="row">

<span data-t="branch"></span>

<strong id="branch">—</strong>

</div>

<div class="row">

<span data-t="accountName"></span>

<strong id="accountName">—</strong>

</div>

<div class="row">

<span data-t="accountNumber"></span>

<strong id="accountNumber"
class="yellow">—</strong>

</div>

<button id="copyAccount"
class="action secondary"
data-t="copyAccount"></button>

<p class="note"
data-t="bankNote"></p>

</section>

<section id="paymentPanel"
class="panel" hidden>

<h3 data-t="paymentDetails"></h3>

<form id="paymentForm">

<label for="paymentAmount"
data-t="amount"></label>

<input
id="paymentAmount"
type="number"
min="0.01"
step="0.01"
inputmode="decimal"
required>

<button
id="fullAmountButton"
type="button"
class="action secondary"
data-t="fullAmount"></button>

<label for="paymentDate"
data-t="paymentDate"></label>

<input
id="paymentDate"
type="date"
required>

<label for="reference"
data-t="reference"></label>

<input
id="reference"
type="text"
minlength="3"
maxlength="100"
autocomplete="off"
required>

<label for="payerName"
data-t="payerName"></label>

<input
id="payerName"
type="text"
minlength="2"
maxlength="100"
required>

<label for="paymentSlip"
data-t="paymentSlip"></label>

<input
id="paymentSlip"
type="file"
accept="image/jpeg,image/png,application/pdf"
required>

<p class="note"
data-t="fileNote"></p>

<img id="preview"
alt="Payment slip preview"
hidden>

<p id="fileName"
class="note"></p>

<div class="checkboxRow">

<input
id="confirmPayment"
type="checkbox"
required>

<label for="confirmPayment"
data-t="confirmPayment"></label>

</div>

<section id="uploadPanel" hidden>

<div class="progress">

<div id="uploadBar"></div>

</div>

<p id="uploadStatus"
class="note"></p>

</section>

<button
id="submitButton"
type="submit"
data-t="submit"
class="action"></button>

</form>

<p class="note"
data-t="verificationNote"></p>

</section>

<section id="receiptPanel"
class="panel" hidden>

<h3 data-t="receipt"></h3>

<div class="row">

<span data-t="paymentId"></span>

<strong id="receiptId">—</strong>

</div>

<div class="row">

<span data-t="amount"></span>

<strong id="receiptAmount"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="reference"></span>

<strong id="receiptReference">—</strong>

</div>

<div class="row">

<span data-t="paymentStatus"></span>

<strong id="receiptStatus">—</strong>

</div>

<p id="receiptMessage"
class="note"></p>

<p id="rejectionReason"
class="red"></p>

</section>

<a id="historyLink"
class="action"
data-t="history"></a>

<a id="commissionLink"
class="action secondary"
data-t="commission"></a>

<button id="refreshButton"
class="action secondary"
data-t="refresh"></button>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function number(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function money(value){

return number(value)

?"Rs. "+value.toLocaleString(

"en-LK",

{

minimumFractionDigits:2,

maximumFractionDigits:2

}

)

:"—";

}

function cents(value){

return Math.round(value*100);

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncClock(){

const started=Date.now();

const result=await serverCall(

"getDriverServerTime"

);

const ended=Date.now();

if(!Number.isFinite(result?.serverTimeMs)

||ended-started>10000){

throw new Error("Server time unavailable");

}

serverOffset=

result.serverTimeMs-(started+ended)/2;

clockCheckedAt=ended;

$("paymentDate").max=sriLankaToday();

}

function clockValid(){

return clockCheckedAt>0

&&Date.now()-clockCheckedAt<120000;

}

function sriLankaToday(){

return new Date(

Date.now()+serverOffset+330*60000

).toISOString().slice(0,10);

}

function formatDate(value){

const ms=value?.toMillis?.();

if(!Number.isFinite(ms))return "—";

return new Intl.DateTimeFormat(

"en-GB",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(ms));

}

// GPS CONTINUITY

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const c=position.coords;

if(!validSession()

||!driver

||!["online","busy"].includes(driver.availability)

||!Number.isFinite(c.latitude)

||!Number.isFinite(c.longitude)

||!number(c.accuracy)

||c.accuracy>100

||c.latitude<5.85

||c.latitude>9.9

||c.longitude<79.5

||c.longitude>82

||Date.now()-position.timestamp>30000

||position.timestamp>Date.now()+5000

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

{

lat:c.latitude,

lon:c.longitude,

accuracy:c.accuracy,

capturedAtMs:position.timestamp

}

);

}catch(e){

// Backend must expire stale GPS data.

}finally{

gpsSending=false;

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// COMMISSION BALANCE

function validBalance(data){

if(!data||data.driverUid!==uid){

return false;

}

const fields=[

"totalCommission",

"paidCommission",

"outstandingCommission",

"overdueCommission",

"pendingPaymentAmount"

];

if(!fields.every(key=>number(data[key]))){

return false;

}

if(Math.abs(

data.totalCommission

-data.paidCommission

-data.outstandingCommission

)>0.02){

return false;

}

if(data.overdueCommission

>data.outstandingCommission+0.02

||data.pendingPaymentAmount

>data.outstandingCommission+0.02){

return false;

}

return true;

}

function availableBalance(){

if(!balance)return 0;

return Math.max(

0,

cents(balance.outstandingCommission)

-cents(balance.pendingPaymentAmount)

)/100;

}

function displayBalance(data){

balance=data;

$("outstanding").textContent=

money(data.outstandingCommission);

$("overdue").textContent=

money(data.overdueCommission);

$("pendingAmount").textContent=

money(data.pendingPaymentAmount);

$("availableAmount").textContent=

money(availableBalance());

$("deadline").textContent=

formatDate(data.nextDueAt);

$("overdueWarning").hidden=

data.overdueCommission<=0;

$("allPaid").hidden=

data.outstandingCommission>0;

$("paymentAmount").max=

availableBalance().toFixed(2);

updateForm();

}

function subscribeBalance(){

const currentGeneration=generation;

balanceUnsubscribe=onSnapshot(

doc(

db,

"drivers",

uid,

"commission",

"summary"

),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession()||!driver)return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites

||!snapshot.exists()

||!validBalance(snapshot.data())){

clearBalance();

updateForm();

return;

}

displayBalance(snapshot.data());

},

()=>{

if(currentGeneration!==generation)return;

clearBalance();

updateForm();

status(t.error);

}

);

}

),

snapshot=>{

// PAYMENT FORM

function updateForm(){

const recovery=Boolean(currentRequest);

const enabled=

validSession()

&&driver

&&balance

&&bankSettings

&&clockValid()

&&availableBalance()>0;

$("paymentPanel").hidden=

!enabled&&!recovery&&!busy;

[

"paymentAmount",

"paymentDate",

"reference",

"payerName",

"paymentSlip",

"confirmPayment",

"fullAmountButton"

].forEach(id=>{

$(id).disabled=

busy||recovery||!enabled;

});

$("submitButton").disabled=

busy||(!enabled&&!recovery);

$("submitButton").textContent=

recovery?t.retry:t.submit;

$("refreshButton").disabled=busy;

}

$("fullAmountButton").onclick=()=>{

if(!validSession()||busy)return;

$("paymentAmount").value=

availableBalance().toFixed(2);

};

// PAYMENT SLIP VALIDATION

async function validFile(file){

if(!file

||!ALLOWED_TYPES.includes(file.type)

||file.size<=0

||file.size>MAX_FILE_SIZE){

return false;

}

const bytes=new Uint8Array(

await file.slice(0,8).arrayBuffer()

);

if(file.type==="image/jpeg"){

return bytes[0]===255

&&bytes[1]===216

&&bytes[2]===255;

}

if(file.type==="image/png"){

return [

137,80,78,71,13,10,26,10

].every((value,index)=>

bytes[index]===value

);

}

if(file.type==="application/pdf"){

return String.fromCharCode(

...bytes.slice(0,5)

)==="%PDF-";

}

return false;

}

$("paymentSlip").onchange=async()=>{

clearPreview();

const file=$("paymentSlip").files[0];

if(!file)return;

const currentGeneration=generation;

if(!await validFile(file)){

if(currentGeneration!==generation)return;

$("paymentSlip").value="";

status(t.invalidFile);

return;

}

if(currentGeneration!==generation

||$("paymentSlip").files[0]!==file)return;

$("fileName").textContent=

file.name+" ("+

(file.size/1024/1024).toFixed(2)

+" MB)";

if(file.type.startsWith("image/")){

previewUrl=URL.createObjectURL(file);

$("preview").src=previewUrl;

$("preview").hidden=false;

}

};

// PAYMENT RECEIPT STATUS

function displayReceipt(data){

$("receiptPanel").hidden=false;

$("receiptId").textContent=

data.paymentId;

$("receiptAmount").textContent=

money(data.amount);

$("receiptReference").textContent=

data.reference;

$("receiptStatus").textContent=

t[data.status];

$("receiptStatus").className=

data.status==="approved"

?"green"

:data.status==="rejected"

?"red":"yellow";

$("receiptMessage").textContent=

t[data.status+"Message"];

$("rejectionReason").textContent=

data.status==="rejected"

?String(data.rejectionReason||"")

:"";

}

function subscribeReceipt(paymentId){

clearReceipt();

if(!validSession()||!validId(paymentId))return;

const currentGeneration=generation;

receiptUnsubscribe=onSnapshot(

doc(

db,

"drivers",

uid,

"commissionPayments",

paymentId

),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession()||!driver)return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites

||!snapshot.exists()){

$("receiptPanel").hidden=true;

return;

}

const data=snapshot.data();

if(data.driverUid!==uid

||data.paymentId!==paymentId

||!number(data.amount)

||typeof data.reference!=="string"

||!["pending","approved","rejected"]

.includes(data.status)){

$("receiptPanel").hidden=true;

return;

}

displayReceipt(data);

},

()=>{

$("receiptPanel").hidden=true;

status(t.error);

}

);

}

// PRIVATE FILE UPLOAD

function uploadSlip(file,path){

return new Promise((resolve,reject)=>{

const currentGeneration=generation;

const fileRef=ref(storage,path);

const task=uploadBytesResumable(

fileRef,

file,

{

contentType:file.type,

cacheControl:"private,no-store"

}

);

uploadTask=task;

$("uploadPanel").hidden=false;

task.on(

"state_changed",

snapshot=>{

if(currentGeneration!==generation)return;

const percent=

snapshot.bytesTransferred

/snapshot.totalBytes*100;

$("uploadBar").style.width=

percent+"%";

$("uploadStatus").textContent=

t.uploading+" "+Math.round(percent)+"%";

},

error=>{

if(uploadTask===task){

uploadTask=null;

}

reject(error);

},

()=>{

if(uploadTask===task){

uploadTask=null;

}

if(currentGeneration!==generation

||!validSession()){

reject(new Error("Session changed"));

return;

}

resolve();

}

);

});

}

// RECOVER EXISTING REQUEST

async function recoverPayment(){

if(!currentRequest||!validSession()){

return false;

}

const result=await serverCall(

"getCommissionPaymentRequestStatus",

{

requestId:currentRequest.requestId

}

);

if(result?.success!==true){

throw new Error("Unable to recover request");

}

if(result.state==="submitted"

&&validId(result.paymentId)){

removeRequest();

subscribeReceipt(result.paymentId);

$("paymentForm").reset();

clearPreview();

status(t.submitted);

return true;

}

if(result.state==="uploaded"){

const response=await serverCall(

"submitDriverCommissionPayment",

{

requestId:currentRequest.requestId

}

);

if(response?.accepted!==true

||!validId(response.paymentId)){

throw new Error("Submission not confirmed");

}

removeRequest();

subscribeReceipt(response.paymentId);

$("paymentForm").reset();

clearPreview();

status(t.submitted);

return true;

}

if(["expired","not_found","abandoned"]

.includes(result.state)){

removeRequest();

status(t.failed);

return false;

}

if(result.state==="awaiting_upload"){

const cancelled=await serverCall(

"cancelCommissionPaymentUpload",

{

requestId:currentRequest.requestId

}

);

if(cancelled?.cancelled!==true){

throw new Error("Cancellation not confirmed");

}

removeRequest();

status(t.failed);

return false;

}

throw new Error("Unknown request state");

}

// SUBMIT COMMISSION PAYMENT

$("paymentForm").onsubmit=async event=>{

event.preventDefault();

if(busy||!validSession()||!driver)return;

const currentGeneration=generation;

if(currentRequest){

busy=true;

updateForm();

try{

await recoverPayment();

}catch(e){

status(t.failed);

}finally{

if(currentGeneration===generation){

busy=false;

updateForm();

}

}

return;

}

if(!balance||!bankSettings||!clockValid()){

status(t.error);

return;

}

const amount=Number(

$("paymentAmount").value

);

const paymentDate=

$("paymentDate").value;

const reference=

$("reference").value.trim();

const payerName=

$("payerName").value.trim();

const file=

$("paymentSlip").files[0];

if(!number(amount)

||amount<=0

||Math.abs(amount*100-cents(amount))>0.00001

||cents(amount)>cents(availableBalance())){

status(t.invalidAmount);

return;

}

if(!/^\d{4}-\d{2}-\d{2}$/.test(paymentDate)

||paymentDate>sriLankaToday()

||!Number.isFinite(Date.parse(paymentDate))){

status(t.invalidDate);

return;

}

if(reference.length<3

||reference.length>100

||/[\u0000-\u001F\u007F]/.test(reference)){

status(t.invalidReference);

return;

}

if(payerName.length<2

||payerName.length>100){

status(t.invalidName);

return;

}

if(!$("confirmPayment").checked){

status(t.agree);

return;

}

busy=true;

updateForm();

try{

if(!await validFile(file)){

status(t.invalidFile);

return;

}

if(currentGeneration!==generation

||!validSession())return;

if(!confirm(t.confirmSubmit))return;

const requestId=crypto.randomUUID();

const driverUid=uid;

const settingsVersion=bankSettings?.version;

if(!settingsVersion

||!balance

||cents(amount)>cents(availableBalance())){

status(t.invalidAmount);

return;

}

currentRequest={

driverUid,

requestId

};

// Persist only the request ID,
// not the bank slip or personal data.

saveRequest(currentRequest);

status(t.submitting);

// Server creates a private upload reservation.

const prepared=await serverCall(

"prepareCommissionPaymentUpload",

{

requestId,

amount,

paymentDate,

reference,

payerName,

bankSettingsVersion:settingsVersion,

fileType:file.type,

fileSize:file.size,

language:lang,

declarationAccepted:true

}

);

if(prepared?.accepted!==true

||prepared.requestId!==requestId){

throw new Error("Upload not authorized");

}

const extension=

file.type==="image/jpeg"

?"jpg"

:file.type==="image/png"

?"png":"pdf";

const expectedPath=

"commissionSlips/"

+driverUid+"/"

+requestId+"/slip."

+extension;

if(prepared.storagePath!==expectedPath){

throw new Error("Invalid upload path");

}

await uploadSlip(

file,

expectedPath

);

if(currentGeneration!==generation

||!validSession())return;

status(t.submitting);

// Backend verifies the stored file
// and creates a pending payment.

const result=await serverCall(

"submitDriverCommissionPayment",

{

requestId

}

);

if(result?.accepted!==true

||!validId(result.paymentId)

||!["pending","approved","rejected"]

.includes(result.status)){

throw new Error("Submission not confirmed");

}

removeRequest();

$("paymentForm").reset();

clearPreview();

$("uploadPanel").hidden=true;

subscribeReceipt(result.paymentId);

status(t.submitted);

}catch(e){

if(currentGeneration!==generation)return;

status(t.failed);

}finally{

if(currentGeneration===generation){

busy=false;

$("uploadPanel").hidden=true;

updateForm();

}

}

};

// DRIVER STATUS MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

driver=null;

if(uploadTask){

uploadTask.cancel();

}

stopDataListeners();

stopGps();

$("content").hidden=true;

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true){

denyAccess();

return;

}

driver=data;

$("driverName").textContent=

typeof data.fullName==="string"

?data.fullName:"—";

$("driverId").textContent=

typeof data.driverId==="string"

?data.driverId:"—";

$("content").hidden=false;

$("accessPanel").hidden=true;

if(["online","busy"].includes(data.availability)){

startGps();

}else{

stopGps();

}

if(!balanceUnsubscribe){

subscribeBalance();

}

if(!bankUnsubscribe){

subscribeBank();

}

if(!busy&&!currentRequest){

currentRequest=restoreRequest();

}

updateForm();

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!functions||!db||!storage){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true

||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

await syncClock();

if(currentGeneration!==generation)return;

$("paymentDate").value=sriLankaToday();

status(t.loading);

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// SERVER TIME UPDATE

setInterval(async()=>{

if(!validSession()||!driver)return;

const currentGeneration=generation;

try{

await syncClock();

if(currentGeneration!==generation)return;

updateForm();

}catch(e){

if(currentGeneration!==generation)return;

clockCheckedAt=0;

updateForm();

}

},60000);

// REFRESH

$("refreshButton").onclick=()=>{

if(auth&&!busy){

verifyDriver(auth.currentUser);

}

};

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

const t=translations[lang];

document.querySelectorAll("[data-t]")
.forEach(el=>{

el.textContent=t[el.dataset.t];

});

document.title="MY RIDE - "+t.heading;

$("forgotButton").href=
"./driver-reset.html?lang="+lang;

$("registerButton").href=
"./driver-register.html?lang="+lang;

$("pendingButton").href=
"./driver-pending.html?lang="+lang;

$("backButton").href=
"./menu.html?lang="+lang;

// FIREBASE CONFIGURATION

const firebaseConfig={

apiKey:"AIzaSyDzrAZ7sc-c7CYIIwOpsiC9xdCPNHO7Km4",

authDomain:"my-ride-sri-lanka.firebaseapp.com",

projectId:"my-ride-sri-lanka",

storageBucket:"my-ride-sri-lanka.firebasestorage.app",

messagingSenderId:"88909447786",

appId:"1:88909447786:web:f8f7b8ccce99ea390a4013"

};

let auth=null;
let functions=null;
let busy=false;
let ready=false;
let completed=false;

function status(message){

$("status").textContent=message;

}

function updateButtons(){

$("loginButton").disabled=

!ready||busy||completed||!navigator.onLine;

}

async function initialize(){

status(t.connecting);

try{

const app=initializeApp(firebaseConfig);

initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

ready=true;

status("");

}catch(e){

ready=false;

status(t.error);

}

updateButtons();

}

// PHONE VALIDATION

function normalizePhone(value){

const phone=value.replace(/[\s-]/g,"");

if(!/^(?:\+94|94|0)7\d{8}$/.test(phone)){

return null;

}

return "+94"+phone.slice(-9);

}

// SHOW PASSWORD

$("showPassword").onchange=()=>{

$("password").type=

$("showPassword").checked

?"text":"password";

};

// ACCOUNT STATUS MESSAGES

const accountStates={

pending:[t.pending,t.pendingMessage],

not_activated:[t.activation,t.activationMessage],

rejected:[t.rejected,t.rejectedMessage],

suspended:[t.suspended,t.suspendedMessage],

blocked:[t.blocked,t.blockedMessage],

documents_expired:[t.expired,t.expiredMessage],

maintenance:[t.maintenance,t.maintenanceMessage]

};

function showAccountStatus(state){

if(!Object.hasOwn(accountStates,state)){

status(t.invalid);

return;

}

const details=accountStates[state];

$("accountTitle").textContent=details[0];

$("accountMessage").textContent=details[1];

$("accountPanel").hidden=false;

status("");

}

// SECURE DRIVER LOGIN

$("loginForm").addEventListener(

"submit",

async event=>{

event.preventDefault();

if(busy||!ready||completed)return;

$("accountPanel").hidden=true;

if(!navigator.onLine){

status(t.offline);

return;

}

const phone=normalizePhone(

$("phone").value

);

const password=$("password").value;

if(!phone){

status(t.phoneError);

return;

}

if(!password||password.length>128){

status(t.passwordError);

return;

}

busy=true;

$("phone").disabled=true;

$("password").disabled=true;

updateButtons();

status(t.checking);

let signedIn=false;

try{

// Password verification and rate limits
// must be handled by the secure backend.

const loginDriver=httpsCallable(

functions,

"loginDriver"

);

const response=await loginDriver({

phone,

password

});

const result=response.data;

if(result?.authenticated!==true){

status(t.invalid);

return;

}

// Account status may only be returned
// after valid credentials are verified.

if(result.allowed!==true){

showAccountStatus(result.status);

return;

}

if(typeof result.customToken!=="string"

||!result.customToken){

throw new Error("Missing session token");

}

// Create authenticated Firebase session.

const credential=await signInWithCustomToken(

auth,

result.customToken

);

signedIn=true;

const tokenResult=

await credential.user.getIdTokenResult(true);

if(tokenResult.claims.driver!==true){

throw new Error("Driver role required");

}

// Recheck approval and account eligibility
// against the authoritative backend.

const verifySession=httpsCallable(

functions,

"verifyDriverSession"

);

const verification=await verifySession({});

const account=verification.data;

if(account?.authorized!==true

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true

||account.uid!==credential.user.uid){

await signOut(auth);

signedIn=false;

if(account?.status){

showAccountStatus(account.status);

}else{

status(t.invalid);

}

return;

}

completed=true;

$("password").value="";

status(t.success);

location.replace(

"./driver-dashboard.html?lang="+lang

);

}catch(e){

if(signedIn){

try{

await signOut(auth);

}catch(error){}

}

if(e.code==="functions/resource-exhausted"

||e.code==="auth/too-many-requests"){

status(t.limit);

}else if(

e.code==="functions/unauthenticated"

||e.code==="functions/permission-denied"

){

status(t.invalid);

}else{

status(t.error);

}

}finally{

$("password").value="";

$("phone").disabled=false;

$("password").disabled=false;

busy=false;

updateButtons();

}

}

);

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

status(t.offline);

updateButtons();

});

window.addEventListener("online",()=>{

if(!busy&&!completed){

status("");

}

updateButtons();

});

// CLEAR PASSWORD ON PAGE EXIT

window.addEventListener("pagehide",()=>{

$("password").value="";

$("showPassword").checked=false;

$("password").type="password";

});

initialize();

</script>

</body>
</html>

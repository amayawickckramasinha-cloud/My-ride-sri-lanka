
<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Active Ride</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
padding:12px 0;
border-bottom:1px solid #444;
}

.row strong{
text-align:right;
overflow-wrap:anywhere;
}

.yellow{color:#FFD600}
.green{color:#4ADE80}
.red{color:#FF6464}

#map{
height:320px;
border-radius:12px;
background:#333;
margin:15px 0;
}

.meter{
text-align:center;
border-color:#FFD600;
}

.fare{
font-size:38px;
color:#FFD600;
font-weight:bold;
margin:15px 0;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#292929;
border-radius:10px;
padding:15px 8px;
}

.statValue{
font-size:23px;
font-weight:bold;
color:#FFD600;
margin-top:10px;
}

button,.action{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border:0;
border-radius:10px;
background:#FFD600;
color:#111;
font-size:16px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.danger{
background:#DC2626;
color:white;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

.note{
color:#BBB;
font-size:13px;
line-height:1.8;
}

#status{
text-align:center;
color:#FFD600;
line-height:1.8;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading"></h2>

<p id="status"
role="status"
aria-live="polite"></p>

<section id="accessPanel"
class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="content" hidden>

<section class="panel">

<p id="bookingId"></p>

<div class="row">

<span data-t="rideStatus"></span>

<strong id="rideStatus"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="availability"></span>

<strong id="availability"
class="red">—</strong>

</div>

<div class="row">

<span>GPS</span>

<strong id="gpsStatus">—</strong>

</div>

</section>

<section id="customerPanel"
class="panel">

<div class="row">

<span data-t="customer"></span>

<strong id="customerName">—</strong>

</div>

<div class="row">

<span data-t="phone"></span>

<strong id="customerPhone">—</strong>

</div>

<div class="row">

<span data-t="pickup"></span>

<strong id="pickup">—</strong>

</div>

<div class="row">

<span data-t="destination"></span>

<strong id="destination">—</strong>

</div>

<div class="row">

<span data-t="passengers"></span>

<strong id="passengers">—</strong>

</div>

<a id="callButton"
class="action"
data-t="call" hidden></a>

<a id="whatsappButton"
class="action"
data-t="whatsapp" hidden></a>

</section>

<section id="mapPanel">

<div id="map"></div>

<button id="centerButton"
class="secondary"
data-t="center"></button>

<p class="note"
data-t="mapNote"></p>

</section>

<section id="meterPanel"
class="panel meter">

<div id="fareLabel"
data-t="currentFare"></div>

<div id="fare"
class="fare">—</div>

<div class="stats">

<div class="stat">

<span data-t="distance"></span>

<div id="distance"
class="statValue">—</div>

</div>

<div class="stat">

<span data-t="duration"></span>

<div id="duration"
class="statValue">—</div>

</div>

</div>

<p id="meterStatus"
class="note"></p>

</section>

<section id="fareDetails"
class="panel">

<div class="row">

<span data-t="period"></span>

<strong id="period">—</strong>

</div>

<div class="row">

<span data-t="weather"></span>

<strong id="weather">—</strong>

</div>

<div class="row">

<span data-t="road"></span>

<strong id="road">—</strong>

</div>

<div class="row">

<span data-t="discount"></span>

<strong id="discount">—</strong>

</div>

<div class="row">

<span data-t="rainCharge"></span>

<strong id="rainCharge">—</strong>

</div>

<div class="row">

<span data-t="roadCharge"></span>

<strong id="roadCharge">—</strong>

</div>

<div class="row">

<span data-t="tollParking"></span>

<strong id="tollParking">—</strong>

</div>

<div class="row">

<span id="commissionLabel">
MY RIDE
</span>

<strong id="commission"
class="red">—</strong>

</div>

<div class="row">

<span data-t="income"></span>

<strong id="income"
class="green">—</strong>

</div>

</section>

<button id="arrivedButton"
data-t="arrivedButton" hidden></button>

<button id="startButton"
data-t="startButton" hidden></button>

<button id="endButton"
class="danger"
data-t="endButton" hidden></button>

<section id="endConfirmPanel"
class="panel" hidden>

<h3 data-t="endConfirm"></h3>

<p class="note"
data-t="endNote"></p>

<button id="confirmEndButton"
class="danger"
data-t="confirmEnd"></button>

<button id="continueRideButton"
class="secondary"
data-t="continueRide"></button>

</section>

<section id="completedPanel"
class="panel" hidden>

<h3 class="green"
data-t="completed"></h3>

<p data-t="completedNote"></p>

<a id="historyLink"
class="action"
data-t="history"></a>

</section>

<button id="refreshButton"
class="secondary"
data-t="refresh"></button>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function number(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0;

}

function validPoint(point){

return point

&&Number.isFinite(point.lat)

&&Number.isFinite(point.lon)

&&point.lat>=5.85

&&point.lat<=9.9

&&point.lon>=79.5

&&point.lon<=82;

}

function validPosition(position){

return validPoint({

lat:position.coords.latitude,

lon:position.coords.longitude

})

&&number(position.coords.accuracy)

&&position.coords.accuracy<=100

&&Date.now()-position.timestamp<30000

&&position.timestamp<=Date.now()+5000;

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||generation!==currentGeneration){

throw new Error("Session changed");

}

return response.data;

}

// FORMAT VALUES

function money(value){

return number(value)

?"Rs. "+value.toLocaleString(

"en-LK",

{

minimumFractionDigits:2,

maximumFractionDigits:2

}

)

:"—";

}

function formatDuration(seconds){

if(!number(seconds))return "—";

seconds=Math.floor(seconds);

return [

Math.floor(seconds/3600),

Math.floor((seconds%3600)/60),

seconds%60

].map(value=>

String(value).padStart(2,"0")

).join(":");

}

function normalizePhone(value){

if(typeof value!=="string")return null;

const phone=value.replace(/[\s-]/g,"");

if(!/^(?:\+94|94|0)7\d{8}$/.test(phone)){

return null;

}

return "+94"+phone.slice(-9);

}

// ROUTE GUIDANCE

async function updateRoute(position){

if(!map||!booking

||Date.now()-lastRouteRequest<15000){

return;

}

const target=

booking.status==="active"

?booking.destination

:booking.pickup;

if(!validPoint(target))return;

lastRouteRequest=Date.now();

if(routeController){

routeController.abort();

}

const controller=new AbortController();

routeController=controller;

const currentGeneration=generation;

const currentRideGeneration=rideGeneration;

const targetPoint=[target.lat,target.lon];

if(targetMarker){

targetMarker.setLatLng(targetPoint);

}else{

targetMarker=L.marker(targetPoint)

.addTo(map);

}

const c=position.coords;

const url=

"https://router.project-osrm.org/route/v1/driving/"

+c.longitude+","+c.latitude

+";"+target.lon+","+target.lat

+"?overview=full&geometries=geojson";

const timeout=setTimeout(

()=>controller.abort(),

15000

);

try{

const response=await fetch(url,{

signal:controller.signal,

cache:"no-store"

});

if(!response.ok){

throw new Error("Route unavailable");

}

const data=await response.json();

if(currentGeneration!==generation

||currentRideGeneration!==rideGeneration

||controller.signal.aborted

||routeController!==controller

||!validSession())return;

if(data.code!=="Ok"

||!data.routes?.[0]?.geometry){

throw new Error("Route unavailable");

}

if(routeLine){

map.removeLayer(routeLine);

}

routeLine=L.geoJSON(

data.routes[0].geometry,

{

style:{

color:"#2684FF",

weight:6

}

}

).addTo(map);

}catch(e){

// GPS tracking continues even if
// route guidance is unavailable.

}finally{

clearTimeout(timeout);

}

}

lat:position.coords.latitude,

lon:position.coords.longitude,

function startGps(){

||!navigator.geolocation

async position=>{

{

maximumAge:3000,

timeout:15000

);

reject(new Error("GPS unavailable"));

reject,

{

maximumAge:0,

timeout:15000

}

);

});

}

function subscribeBooking(id){

if(bookingId===id&&bookingUnsubscribe){

return;

}

clearRide();

if(!validSession()||!validId(id))return;

bookingId=id;

const currentRideGeneration=rideGeneration;

bookingUnsubscribe=onSnapshot(

doc(db,"bookings",id),

{includeMetadataChanges:true},

snapshot=>{

if(currentRideGeneration!==rideGeneration

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

$("content").hidden=true;

stopGps();

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.assignedDriver?.uid!==uid

||!["accepted","arrived","active",

"completed","cancelled"]

.includes(data.status)){

clearRide();

status(t.denied);

return;

}

displayBooking(data);

},

()=>{

clearRide();

status(t.error);

}

);

}

// TRIP ACTIONS

async function performAction(action){

if(busy||!validSession()||!booking)return;

const requiredStatus={

arrived:"accepted",

start:"arrived",

end:"active"

};

if(booking.status!==requiredStatus[action]){

return;

}

const id=bookingId;

const currentRideGeneration=rideGeneration;

busy=true;

updateButtons();

status(t.processing);

try{

let location=null;

if(action!=="end"){

const position=await getPosition();

if(!validPosition(position)){

throw new Error("Invalid GPS");

}

location=locationData(position);

}

if(!pendingAction

||pendingAction.bookingId!==id

||pendingAction.action!==action){

pendingAction={

bookingId:id,

action,

requestId:crypto.randomUUID()

};

}

const functionNames={

arrived:"markDriverArrived",

start:"startDriverTrip",

end:"endDriverTrip"

};

const result=await serverCall(

functionNames[action],

{

bookingId:id,

requestId:pendingAction.requestId,

location

}

);

if(currentRideGeneration!==rideGeneration){

return;

}

const expectedStatus={

arrived:"arrived",

start:"active",

end:"completed"

};

if(result?.accepted!==true

||result.bookingId!==id

||result.status!==expectedStatus[action]){

throw new Error("Action not confirmed");

}

pendingAction=null;

$("endConfirmPanel").hidden=true;

// Firestore supplies the confirmed
// trip status and final meter.

status("");

}catch(e){

status(t.failed);

}finally{

busy=false;

updateButtons();

}

}

$("arrivedButton").onclick=()=>{

if(confirm(t.confirmArrived)){

performAction("arrived");

}

};

$("startButton").onclick=()=>{

if(confirm(t.confirmStart)){

performAction("start");

}

};

$("endButton").onclick=()=>{

if(booking?.status==="active"

&&validSession()&&!busy){

$("endConfirmPanel").hidden=false;

}

};

$("continueRideButton").onclick=()=>{

$("endConfirmPanel").hidden=true;

};

$("confirmEndButton").onclick=()=>{

performAction("end");

};

// DRIVER ACCOUNT LISTENER

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

$("content").hidden=true;

stopGps();

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true){

disconnect();

status(t.denied);

return;

}

driver=data;

const requestedId=params.get("booking");

const activeId=data.activeBookingId;

if(validId(activeId)){

if(bookingId!==activeId){

subscribeBooking(activeId);

}

}else if(bookingId){

// Keep the current listener briefly
// to receive the completed report.

updateButtons();

}else if(validId(requestedId)){

subscribeBooking(requestedId);

}else{

clearRide();

status(t.empty);

}

},

()=>{

disconnect();

status(t.denied);

}

);

}

// DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!functions||!db){

$("accessPanel").hidden=false;

status(t.denied);

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true){

throw new Error("Driver role required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// REFRESH STATUS

setInterval(()=>{

updateGpsStatus();

updateMeterStatus();

updateButtons();

},1000);

$("refreshButton").onclick=()=>{

if(auth&&!busy){

verifyDriver(auth.currentUser);

}

};

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

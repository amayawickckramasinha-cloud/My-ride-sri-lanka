
<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">

<title>MY RIDE - Driver Terms</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.termsIcon{
width:90px;
height:90px;
background:#FFD600;
color:#111;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:20px auto;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:14px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.8;
}

.row span{
color:#CCC;
}

.row strong{
text-align:right;
max-width:60%;
overflow-wrap:anywhere;
}

.termsList{
padding-left:25px;
}

.termsList li{
padding:12px 4px;
border-bottom:1px solid #444;
line-height:1.9;
font-size:14px;
overflow-wrap:anywhere;
}

.termsList li::marker{
color:#FFD600;
font-weight:bold;
}

.termsText{
white-space:pre-wrap;
line-height:1.9;
font-size:14px;
overflow-wrap:anywhere;
}

.action{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.checkboxRow{
display:flex;
align-items:flex-start;
gap:12px;
padding:15px 0;
line-height:1.8;
border-bottom:1px solid #444;
}

.checkboxRow input{
width:23px;
height:23px;
accent-color:#FFD600;
flex-shrink:0;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.9;
}

.success{
background:#163322;
border:1px solid #4ADE80;
border-radius:10px;
padding:15px;
color:#4ADE80;
line-height:1.8;
margin:15px 0;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:15px;
color:#FFB4B4;
line-height:1.8;
margin:15px 0;
}

.yellow{
color:#FFD600;
}

.green{
color:#4ADE80;
}

.red{
color:#FF6464;
}

.commissionRate{
text-align:center;
font-size:44px;
font-weight:bold;
color:#FFD600;
margin:20px 0;
}

#status,
#saveStatus{
text-align:center;
line-height:1.8;
color:#FFD600;
overflow-wrap:anywhere;
}

button:disabled,
input:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}
</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<div class="termsIcon">

<svg width="50" height="50"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M8 12h8"/>
<path d="M8 16h8"/>
<path d="M8 8h2"/>

</div>

<h2 data-t="heading"></h2>

<p id="status"
role="status"
aria-live="polite"></p>

<section id="accessPanel"
class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="content" hidden>

<section class="panel">

<h3 data-t="driverDetails"></h3>

<div class="row">

<span data-t="driverName"></span>

<strong id="driverName">—</strong>

</div>

<div class="row">

<span>Driver ID</span>

<strong id="driverId"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="currentVersion"></span>

<strong id="currentVersion">—</strong>

</div>

<div class="row">

<span data-t="acceptedVersion"></span>

<strong id="acceptedVersion">—</strong>

</div>

<div class="row">

<span data-t="publishedDate"></span>

<strong id="publishedDate">—</strong>

</div>

<div class="row">

<span data-t="effectiveDate"></span>

<strong id="effectiveDate">—</strong>

</div>

<div class="row">

<span data-t="acceptedDate"></span>

<strong id="acceptedDate">—</strong>

</div>

<div class="row">

<span data-t="agreementStatus"></span>

<strong id="agreementStatus">—</strong>

</div>

</section>

<div id="updateWarning"
class="warning" hidden>

<span data-t="newTerms"></span>

</div>

<div id="acceptedPanel"
class="success" hidden>

<span data-t="alreadyAccepted"></span>

</div>

<section class="panel">

<h3 data-t="rulesHeading"></h3>

<p id="draftNote"
class="note"
data-t="draftNote"></p>

<ol id="rulesList"
class="termsList"></ol>

</section>

<section class="panel">

<h3 data-t="commissionHeading"></h3>

<div id="commissionRate"
class="commissionRate">
—
</div>

<div class="row">

<span data-t="deadline"></span>

<strong id="deadlineDays">—</strong>

</div>

<div id="commissionText"
class="termsText"></div>

<a id="commissionLink"
class="action secondary"
data-t="commissionReport"></a>

</section>

<section class="panel">

<h3 data-t="privacyHeading"></h3>

<div id="privacyText"
class="termsText"></div>

</section>

<section id="agreementPanel"
class="panel" hidden>

<h3 data-t="acceptHeading"></h3>

<form id="agreementForm">

<div class="checkboxRow">

<input
id="termsConsent"
type="checkbox"
required>

<label for="termsConsent"
data-t="termsConsent"></label>

</div>

<div class="checkboxRow">

<input
id="commissionConsent"
type="checkbox"
required>

<label for="commissionConsent"
data-t="commissionConsent"></label>

</div>

<div class="checkboxRow">

<input
id="gpsConsent"
type="checkbox"
required>

<label for="gpsConsent"
data-t="gpsConsent"></label>

</div>

<div class="checkboxRow">

<input
id="privacyConsent"
type="checkbox"
required>

<label for="privacyConsent"
data-t="privacyConsent"></label>

</div>

<p class="note"
data-t="recordNote"></p>

<button id="acceptButton"
type="submit"
class="action"
data-t="acceptTerms"
disabled></button>

</form>

</section>

<p id="saveStatus"
role="status"
aria-live="polite"></p>

<button id="refreshButton"
class="action secondary"
data-t="refresh"></button>

<a id="helpLink"
class="action secondary"
data-t="help"></a>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

}

function validVersion(value){

return typeof value==="string"

&&/^[A-Za-z0-9._-]{1,100}$/.test(value);

}

function validHash(value){

return typeof value==="string"

&&/^[a-f0-9]{64}$/i.test(value);

}

function validText(value,min,max){

return typeof value==="string"

&&value.trim().length>=min

&&value.length<=max;

}

function timestampMs(value){

const ms=value?.toMillis?.();

return Number.isFinite(ms)&&ms>0

?ms:null;

}

function formatDate(value){

const ms=timestampMs(value);

if(!ms)return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(ms));

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// GPS CONTINUITY

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const c=position.coords;

if(!validSession()

||!driver

||!["online","busy"].includes(driver.availability)

||!Number.isFinite(c.latitude)

||!Number.isFinite(c.longitude)

||!Number.isFinite(c.accuracy)

||c.accuracy<0

||c.accuracy>100

||c.latitude<5.85

||c.latitude>9.9

||c.longitude<79.5

||c.longitude>82

||Date.now()-position.timestamp>30000

||position.timestamp>Date.now()+5000

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

{

lat:c.latitude,

lon:c.longitude,

accuracy:c.accuracy,

capturedAtMs:position.timestamp

}

);

}catch(e){

// Backend must expire stale GPS data.

}finally{

gpsSending=false;

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// SAFE TERMS DISPLAY

function renderRules(rules){

const list=$("rulesList");

list.replaceChildren();

rules.forEach(rule=>{

const item=document.createElement("li");

item.textContent=rule;

list.appendChild(item);

});

}

function showDraftTerms(){

renderRules(defaultRules[lang]);

$("commissionRate").textContent="5%";

$("deadlineDays").textContent="7 "+t.days;

$("commissionText").textContent=

defaultCommission[lang];

$("privacyText").textContent=

defaultPrivacy[lang];

$("draftNote").hidden=false;

$("currentVersion").textContent="—";

$("publishedDate").textContent="—";

$("effectiveDate").textContent="—";

$("agreementPanel").hidden=true;

}

showDraftTerms();

// PUBLISHED TERMS VALIDATION

function validTerms(data){

if(!data

||data.published!==true

||!validVersion(data.version)

||!validHash(data.contentHash)

||!timestampMs(data.publishedAt)

||!timestampMs(data.effectiveAt)

||timestampMs(data.effectiveAt)<timestampMs(data.publishedAt)

||!Number.isFinite(data.commissionRate)

||data.commissionRate<0

||data.commissionRate>100

||!Number.isInteger(data.paymentDeadlineDays)

||data.paymentDeadlineDays<1

||data.paymentDeadlineDays>365

||!data.translations){

return false;

}

return LANGUAGES.every(language=>{

const content=data.translations[language];

return content

&&Array.isArray(content.rules)

&&content.rules.length>=1

&&content.rules.length<=100

&&content.rules.every(

rule=>validText(rule,1,5000)

)

&&validText(content.commissionText,1,30000)

&&validText(content.privacyText,1,30000);

});

}

function validAcceptance(data){

return data

&&data.driverUid===uid

&&validVersion(data.version)

&&validHash(data.contentHash)

&&LANGUAGES.includes(data.language)

&&data.termsAccepted===true

&&data.commissionAccepted===true

&&data.gpsAccepted===true

&&data.privacyAcknowledged===true

&&timestampMs(data.acceptedAt)!==null;

}

// CONSENT CONTROLS

const CONSENT_IDS=[

"termsConsent",

"commissionConsent",

"gpsConsent",

"privacyConsent"

];

function resetConsent(){

CONSENT_IDS.forEach(id=>{

$(id).checked=false;

});

}

function allConsents(){

return CONSENT_IDS.every(

id=>$(id).checked===true

);

}

function alreadyAccepted(){

return currentTerms!==null

&&acceptance!==null

&&acceptance.version===currentTerms.version

&&acceptance.contentHash===currentTerms.contentHash;

}

function updateControls(){

const enabled=

validSession()

&&driver!==null

&&currentTerms!==null

&&termsLoaded

&&acceptanceLoaded

&&!alreadyAccepted()

&&!saving;

CONSENT_IDS.forEach(id=>{

$(id).disabled=!enabled;

});

$("acceptButton").disabled=

!enabled||!allConsents();

}

CONSENT_IDS.forEach(id=>{

$(id).addEventListener(

"change",

updateControls

);

});

// DISPLAY CURRENT AGREEMENT

function renderAgreement(){

$("acceptedVersion").textContent=

acceptance?.version||"—";

$("acceptedDate").textContent=

acceptance

?formatDate(acceptance.acceptedAt)

:"—";

$("acceptedPanel").hidden=true;

$("updateWarning").hidden=true;

$("agreementPanel").hidden=true;

if(!termsLoaded

||!acceptanceLoaded

||!currentTerms){

$("agreementStatus").textContent=t.unknown;

$("agreementStatus").className="yellow";

updateControls();

return;

}

if(alreadyAccepted()){

$("agreementStatus").textContent=t.accepted;

$("agreementStatus").className="green";

$("acceptedPanel").hidden=false;

}else{

$("agreementStatus").textContent=t.pending;

$("agreementStatus").className="red";

$("updateWarning").hidden=false;

$("agreementPanel").hidden=false;

}

updateControls();

}

// DISPLAY PUBLISHED TERMS

function displayTerms(data){

const previousVersion=currentTerms?.version;

const previousHash=currentTerms?.contentHash;

currentTerms=data;

const changed=

previousVersion!==data.version

||previousHash!==data.contentHash;

if(changed){

resetConsent();

pendingRequest=null;

if(previousVersion){

$("saveStatus").textContent=t.termsChanged;

}

}

const content=data.translations[lang];

renderRules(content.rules);

$("commissionRate").textContent=

data.commissionRate+"%";

$("deadlineDays").textContent=

data.paymentDeadlineDays+" "+t.days;

$("commissionText").textContent=

content.commissionText;

$("privacyText").textContent=

content.privacyText;

$("currentVersion").textContent=

data.version;

$("publishedDate").textContent=

formatDate(data.publishedAt);

$("effectiveDate").textContent=

formatDate(data.effectiveAt);

$("draftNote").hidden=true;

renderAgreement();

}

// LIVE ADMIN TERMS

function subscribeTerms(){

if(termsUnsubscribe){

termsUnsubscribe();

termsUnsubscribe=null;

}

currentTerms=null;

termsLoaded=false;

resetConsent();

showDraftTerms();

renderAgreement();

if(!validSession()||!driver)return;

const currentGeneration=generation;

termsUnsubscribe=onSnapshot(

doc(

db,

"publicSettings",

"driverTerms"

),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession()

||!driver)return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

currentTerms=null;

termsLoaded=false;

resetConsent();

showDraftTerms();

renderAgreement();

return;

}

if(!snapshot.exists()

||!validTerms(snapshot.data())){

currentTerms=null;

termsLoaded=false;

showDraftTerms();

renderAgreement();

$("saveStatus").textContent=t.notPublished;

return;

}

termsLoaded=true;

displayTerms(snapshot.data());

},

()=>{

if(currentGeneration!==generation)return;

currentTerms=null;

termsLoaded=false;

showDraftTerms();

renderAgreement();

$("saveStatus").textContent=t.error;

}

);

}

// DRIVER ACCEPTANCE RECORD

function subscribeAcceptance(){

if(acceptanceUnsubscribe){

acceptanceUnsubscribe();

acceptanceUnsubscribe=null;

}

acceptance=null;

acceptanceLoaded=false;

renderAgreement();

if(!validSession()||!driver)return;

const currentGeneration=generation;

acceptanceUnsubscribe=onSnapshot(

doc(

db,

"drivers",

uid,

"agreements",

"current"

),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession()

||!driver)return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

acceptance=null;

acceptanceLoaded=false;

renderAgreement();

return;

}

if(!snapshot.exists()){

acceptance=null;

acceptanceLoaded=true;

renderAgreement();

return;

}

const data=snapshot.data();

if(!validAcceptance(data)){

acceptance=null;

acceptanceLoaded=false;

renderAgreement();

$("saveStatus").textContent=t.error;

return;

}

acceptance=data;

acceptanceLoaded=true;

renderAgreement();

},

()=>{

if(currentGeneration!==generation)return;

acceptance=null;

acceptanceLoaded=false;

renderAgreement();

$("saveStatus").textContent=t.error;

}

);

}

// SAVE DRIVER AGREEMENT

$("agreementForm").onsubmit=async event=>{

event.preventDefault();

if(!validSession()

||!driver

||!currentTerms

||!termsLoaded

||!acceptanceLoaded

||alreadyAccepted()

||saving)return;

if(!allConsents()){

$("saveStatus").textContent=t.selectAll;

return;

}

if(!confirm(t.confirmAccept))return;

const currentGeneration=generation;

const version=currentTerms.version;

const contentHash=currentTerms.contentHash;

if(!pendingRequest

||pendingRequest.version!==version

||pendingRequest.contentHash!==contentHash){

pendingRequest={

version,

contentHash,

requestId:crypto.randomUUID()

};

}

saving=true;

updateControls();

$("saveStatus").textContent=t.saving;

try{

const result=await serverCall(

"acceptDriverTerms",

{

requestId:pendingRequest.requestId,

version,

contentHash,

language:lang,

termsAccepted:true,

commissionAccepted:true,

gpsAccepted:true,

privacyAcknowledged:true

}

);

if(currentGeneration!==generation)return;

if(result?.accepted!==true

||result.driverUid!==uid

||result.version!==version

||result.contentHash!==contentHash){

throw new Error("Acceptance not confirmed");

}

pendingRequest=null;

resetConsent();

if(!currentTerms

||currentTerms.version!==version

||currentTerms.contentHash!==contentHash){

$("saveStatus").textContent=t.termsChanged;

return;

}

$("saveStatus").textContent=t.saved;

// Reload authoritative acceptance record.

subscribeAcceptance();

}catch(e){

if(currentGeneration!==generation)return;

if(e.code==="functions/failed-precondition"){

$("saveStatus").textContent=t.termsChanged;

subscribeTerms();

subscribeAcceptance();

}else{

$("saveStatus").textContent=t.saveFailed;

}

}finally{

if(currentGeneration===generation){

saving=false;

updateControls();

}

}

};

// CLEAR PRIVATE INFORMATION

function stopTermsListeners(){

if(termsUnsubscribe){

termsUnsubscribe();

termsUnsubscribe=null;

}

if(acceptanceUnsubscribe){

acceptanceUnsubscribe();

acceptanceUnsubscribe=null;

}

currentTerms=null;

acceptance=null;

termsLoaded=false;

acceptanceLoaded=false;

pendingRequest=null;

resetConsent();

showDraftTerms();

renderAgreement();

}

function disconnect(){

generation++;

authorized=false;

uid=null;

driver=null;

saving=false;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

stopGps();

stopTermsListeners();

$("driverName").textContent="—";

$("driverId").textContent="—";

$("saveStatus").textContent="";

$("content").hidden=true;

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// DRIVER ACCOUNT MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

driver=null;

stopGps();

stopTermsListeners();

$("content").hidden=true;

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||!validText(data.fullName,1,150)

||!validId(data.driverId)){

denyAccess();

return;

}

const firstLoad=driver===null;

driver=data;

$("driverName").textContent=

data.fullName;

$("driverId").textContent=

data.driverId;

$("content").hidden=false;

$("accessPanel").hidden=true;

if(["online","busy"].includes(

data.availability

)){

startGps();

}else{

stopGps();

}

if(firstLoad||!termsUnsubscribe){

subscribeTerms();

}

if(firstLoad||!acceptanceUnsubscribe){

subscribeAcceptance();

}

renderAgreement();

status("");

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// APPROVED DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!db||!functions){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true

||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(

functions,

"verifyDriverTermsSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// AUTOMATIC SESSION VERIFICATION

setInterval(async()=>{

if(!validSession()

||!driver

||checkingSession)return;

const currentGeneration=generation;

checkingSession=true;

try{

const result=await serverCall(

"verifyDriverTermsSession"

);

if(currentGeneration!==generation)return;

if(result?.authorized!==true

||result.uid!==uid

||result.status!=="approved"

||result.activationComplete!==true){

denyAccess();

}

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

checkingSession=false;

}

},60000);

// REFRESH BUTTON

$("refreshButton").onclick=()=>{

if(saving)return;

if(validSession()&&driver){

$("saveStatus").textContent="";

subscribeTerms();

subscribeAcceptance();

}else if(auth){

verifyDriver(auth.currentUser);

}

};

// INTERNET CONNECTION MONITORING

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

</body>
</html>

// SESSION SECURITY

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function number(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0;

}

function money(value){

return number(value)

?"Rs. "+value.toLocaleString(

"en-LK",

{maximumFractionDigits:2}

)

:"—";

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const currentUid=uid;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||generation!==currentGeneration

||uid!==currentUid){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncClock(){

const start=Date.now();

const result=await serverCall(

"getDriverServerTime"

);

const end=Date.now();

if(!Number.isFinite(result?.serverTimeMs)

||end-start>10000){

throw new Error("Clock unavailable");

}

serverOffset=

result.serverTimeMs-(start+end)/2;

clockCheckedAt=end;

}

function clockValid(){

return clockCheckedAt>0

&&Date.now()-clockCheckedAt<120000;

}

function serverNow(){

return Date.now()+serverOffset;

}

// GPS SYSTEM

function validPosition(position){

const c=position.coords;

return Number.isFinite(c.latitude)

&&Number.isFinite(c.longitude)

&&Number.isFinite(c.accuracy)

&&c.latitude>=5.85

&&c.latitude<=9.9

&&c.longitude>=79.5

&&c.longitude<=82

&&c.accuracy>=0

&&c.accuracy<=100

&&Date.now()-position.timestamp<30000

&&position.timestamp<=Date.now()+5000;

}

return{

lat:position.coords.latitude,

lon:position.coords.longitude,

accuracy:position.coords.accuracy,

capturedAtMs:position.timestamp

};

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

if(!validSession()

||!driver

||!["online","busy"].includes(driver.availability)

||!validPosition(position)

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

locationData(position)

);

}catch(e){

status(t.gpsError);

}finally{

gpsSending=false;

}

},

()=>status(t.gpsError),

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function getPosition(){

return new Promise((resolve,reject)=>{

if(!navigator.geolocation){

reject(new Error("GPS unavailable"));

return;

}

navigator.geolocation.getCurrentPosition(

resolve,

reject,

{

enableHighAccuracy:true,

maximumAge:0,

timeout:15000

}

);

});

}

// CLEAR PRIVATE DATA

function clearRides(){

rides.clear();

$("rideList").replaceChildren();

$("emptyPanel").hidden=true;

}

function disconnect(){

generation++;

authorized=false;

uid=null;

driver=null;

clockCheckedAt=0;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

if(ridesUnsubscribe){

ridesUnsubscribe();

ridesUnsubscribe=null;

}

stopGps();

clearRides();

pendingRequests.clear();

notified.clear();

$("content").hidden=true;

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// PHONE VALIDATION

function normalizePhone(value){

if(typeof value!=="string")return null;

const phone=value.replace(/[\s-]/g,"");

if(!/^(?:\+94|94|0)7\d{8}$/.test(phone)){

return null;

}

return "+94"+phone.slice(-9);

}

// BOOKING VALIDATION

function validRide(id,data){

if(!validId(id)

||data.assignedDriver?.uid!==uid

||data.status!=="scheduled"

||typeof data.pickupName!=="string"

||typeof data.destinationName!=="string"

||!["bike","tuk","car","van"].includes(data.vehicle)

||!Number.isInteger(data.passengers)

||data.passengers<1

||!number(data.estimatedDistance)

||!number(data.estimatedDuration)

||!number(data.estimatedFare)

||!number(data.estimatedCommission)

||!number(data.estimatedDriverIncome)

||!number(data.commissionRate)

||data.commissionRate>100){

return false;

}

const scheduledAt=data.scheduledAt?.toMillis?.();

const prepareAt=data.prepareAllowedAt?.toMillis?.();

if(!Number.isFinite(scheduledAt)

||!Number.isFinite(prepareAt)

||prepareAt>scheduledAt){

return false;

}

if(Math.abs(

data.estimatedFare

-data.estimatedCommission

-data.estimatedDriverIncome

)>0.02){

return false;

}

return true;

}

// SAFE UI ELEMENTS

function addRow(parent,label,value,className=""){

const row=document.createElement("div");

row.className="row";

const name=document.createElement("span");

name.textContent=label;

const content=document.createElement("strong");

content.textContent=String(value??"—");

content.className=className;

row.append(name,content);

parent.appendChild(row);

}

function addLocation(parent,label,value){

const box=document.createElement("div");

box.className="location";

const name=document.createElement("div");

name.className="label";

name.textContent=label;

const content=document.createElement("strong");

content.textContent=value;

box.append(name,content);

parent.appendChild(box);

}

function addLink(parent,label,url){

const link=document.createElement("a");

link.className="action";

link.textContent=label;

link.href=url;

parent.appendChild(link);

return link;

}

// SRI LANKA DATE AND TIME

function formatDate(timestamp){

return new Intl.DateTimeFormat(

"en-GB",

{

timeZone:"Asia/Colombo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}

).format(new Date(timestamp));

}

function formatTime(timestamp){

return new Intl.DateTimeFormat(

"en-GB",

{

timeZone:"Asia/Colombo",

hour:"2-digit",

minute:"2-digit",

hour12:true

}

).format(new Date(timestamp));

}

// NOTIFICATIONS

$("notificationButton").onclick=async()=>{

if(!("Notification" in window)){

$("notificationStatus").textContent=

t.notificationUnavailable;

return;

}

try{

const permission=

await Notification.requestPermission();

$("notificationStatus").textContent=

permission==="granted"

?t.notificationEnabled

:t.notificationDenied;

}catch(e){

$("notificationStatus").textContent=

t.notificationUnavailable;

}

};

function sendReminder(id,minutes){

const key=id+"_"+minutes;

if(notified.has(key))return;

notified.add(key);

const message=

t.reminder+" "+minutes+" "+t.minutes;

$("notificationStatus").textContent=

message+" | "+id;

if("Notification" in window

&&Notification.permission==="granted"){

try{

new Notification(

"MY RIDE",

{

body:message,

tag:"myride-"+key

}

);

}catch(e){

// In-page reminder remains visible.

}

}

}

// WHATSAPP MESSAGE

function whatsappUrl(id,data,phone){

const customerLanguage=

languages.includes(data.language)

?data.language:"si";

const driverName=

String(driver?.fullName||"MY RIDE Driver");

const driverPhone=

normalizePhone(driver?.phone)||"";

const scheduledTime=formatTime(

data.scheduledAt.toMillis()

);

const scheduledDate=formatDate(

data.scheduledAt.toMillis()

);

const messages={

si:

"ආයුබෝවන්! මම ඔබගේ MY RIDE රියදුරු "+driverName+".\nදුරකථන අංකය: "+driverPhone+"\nBooking ID: "+id+"\nඔබගේ වෙන්කර ඇති හයර් එක: "+scheduledDate+" "+scheduledTime,

en:

"Hello! I am your MY RIDE driver "+driverName+".\nPhone: "+driverPhone+"\nBooking ID: "+id+"\nYour scheduled ride: "+scheduledDate+" "+scheduledTime,

ta:

"வணக்கம்! நான் உங்கள் MY RIDE சாரதி "+driverName+".\nதொலைபேசி: "+driverPhone+"\nBooking ID: "+id+"\nஉங்கள் முன்பதிவு பயணம்: "+scheduledDate+" "+scheduledTime

};

return "https://wa.me/"

+phone.replace("+","")

+"?text="

+encodeURIComponent(

messages[customerLanguage]

);

}

// PREPARE FOR SCHEDULED HIRE

async function prepareRide(id){

if(busy||!validSession()

||!clockValid())return;

const ride=rides.get(id);

if(!ride)return;

if(serverNow()<ride.prepareAt){

status(t.notReady);

return;

}

if(!confirm(t.prepareConfirm))return;

busy=true;

updateCountdowns();

status(t.processing);

try{

const position=await getPosition();

if(!validPosition(position)){

status(t.gpsError);

return;

}

if(!pendingRequests.has(id)){

pendingRequests.set(

id,

crypto.randomUUID()

);

}

const result=await serverCall(

"prepareScheduledRide",

{

bookingId:id,

requestId:pendingRequests.get(id),

location:locationData(position)

}

);

if(result?.accepted!==true

||result.bookingId!==id

||result.status!=="accepted"){

throw new Error("Preparation denied");

}

pendingRequests.delete(id);

location.replace(

"./driver-active-ride.html"

+"?lang="+lang

+"&booking="+encodeURIComponent(id)

);

}catch(e){

status(t.error);

}finally{

busy=false;

updateCountdowns();

}

}

// BUILD SCHEDULED RIDE CARD

function buildRide(id,data){

const panel=document.createElement("section");

panel.className="panel ride";

const title=document.createElement("h3");

title.textContent="📅 "+t.scheduled;

panel.appendChild(title);

const booking=document.createElement("p");

booking.textContent="Booking ID: "+id;

panel.appendChild(booking);

const scheduledAt=data.scheduledAt.toMillis();

const prepareAt=data.prepareAllowedAt.toMillis();

addRow(panel,t.date,formatDate(scheduledAt));

addRow(panel,t.time,formatTime(scheduledAt));

addRow(

panel,

t.customer,

typeof data.customerName==="string"

?data.customerName:"—"

);

const phone=normalizePhone(data.customerPhone);

addRow(panel,t.phone,phone||"—");

addLocation(panel,t.pickup,data.pickupName);

addLocation(panel,t.destination,data.destinationName);

addRow(panel,t.passengers,data.passengers);

addRow(panel,t.vehicle,t[data.vehicle]);

addRow(

panel,

t.distance,

data.estimatedDistance.toFixed(2)+" KM"

);

addRow(

panel,

t.duration,

Math.ceil(data.estimatedDuration)+" "+t.minutes

);

addRow(

panel,

t.fare,

money(data.estimatedFare),

"yellow money"

);

addRow(

panel,

t.commission+" "+data.commissionRate+"%",

money(data.estimatedCommission),

"red"

);

addRow(

panel,

t.income,

money(data.estimatedDriverIncome),

"green money"

);

const countdown=document.createElement("div");

countdown.className="countdown";

const countdownLabel=document.createElement("div");

countdownLabel.textContent=t.remaining;

const clock=document.createElement("div");

clock.className="clock";

clock.textContent="—";

countdown.append(countdownLabel,clock);

panel.appendChild(countdown);

if(phone){

addLink(panel,t.call,"tel:"+phone);

}

const whatsapp=normalizePhone(

data.customerWhatsApp

);

if(whatsapp&&data.whatsappConsent===true){

const link=addLink(

panel,

t.whatsapp,

whatsappUrl(id,data,whatsapp)

);

link.target="_blank";

link.rel="noopener noreferrer";

}

const prepareButton=document.createElement("button");

prepareButton.textContent=t.prepare;

prepareButton.disabled=true;

prepareButton.onclick=()=>prepareRide(id);

panel.appendChild(prepareButton);

const note=document.createElement("p");

note.className="note";

note.textContent=t.estimate;

panel.appendChild(note);

rides.set(id,{

data,

scheduledAt,

prepareAt,

clock,

prepareButton,

previousRemaining:null

});

return panel;

}

// COUNTDOWN SYSTEM

function formatRemaining(milliseconds){

const seconds=Math.max(

0,

Math.ceil(milliseconds/1000)

);

const hours=Math.floor(seconds/3600);

const minutes=Math.floor((seconds%3600)/60);

const remainingSeconds=seconds%60;

return [

hours,

minutes,

remainingSeconds

].map(value=>

String(value).padStart(2,"0")

).join(":");

}

function updateCountdowns(){

rides.forEach((ride,id)=>{

if(!clockValid()||!validSession()){

ride.clock.textContent="—";

ride.prepareButton.disabled=true;

return;

}

const remaining=

ride.scheduledAt-serverNow();

ride.clock.textContent=

remaining>0

?formatRemaining(remaining)

:t.due;

const thresholds=[60,30,10];

if(ride.previousRemaining!==null){

thresholds.forEach(minutes=>{

const threshold=minutes*60000;

if(remaining>0

&&remaining<=threshold

&&ride.previousRemaining>threshold){

sendReminder(id,minutes);

}

});

}

ride.previousRemaining=remaining;

const anotherRide=

validId(driver?.activeBookingId)

&&driver.activeBookingId!==id;

ride.prepareButton.disabled=

busy

||anotherRide

||serverNow()<ride.prepareAt

||!validSession();

});

}

setInterval(updateCountdowns,1000);

// LIVE SCHEDULED BOOKINGS

function subscribeRides(){

if(ridesUnsubscribe){

ridesUnsubscribe();

ridesUnsubscribe=null;

}

if(!validSession())return;

const currentGeneration=generation;

const ref=query(

collection(db,"bookings"),

where("assignedDriver.uid","==",uid),

where("status","==","scheduled")

);

ridesUnsubscribe=onSnapshot(

ref,

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

clearRides();

status(t.checking);

return;

}

const previous=new Map(rides);

clearRides();

const items=[];

snapshot.forEach(item=>{

const data=item.data();

if(validRide(item.id,data)){

items.push({

id:item.id,

data

});

}

});

items.sort((a,b)=>

a.data.scheduledAt.toMillis()

-b.data.scheduledAt.toMillis()

);

items.forEach(item=>{

const panel=buildRide(

item.id,

item.data

);

const old=previous.get(item.id);

if(old){

rides.get(item.id).previousRemaining=

old.previousRemaining;

}

$("rideList").appendChild(panel);

});

$("emptyPanel").hidden=

items.length!==0;

status("");

updateCountdowns();

},

error=>{

if(currentGeneration!==generation)return;

clearRides();

status(t.error);

}

);

}

// LIVE DRIVER APPROVAL CHECK

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

driver=null;

stopGps();

clearRides();

$("content").hidden=true;

if(ridesUnsubscribe){

ridesUnsubscribe();

ridesUnsubscribe=null;

}

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true){

denyAccess();

return;

}

driver=data;

$("content").hidden=false;

$("accessPanel").hidden=true;

if(["online","busy"].includes(data.availability)){

startGps();

}else{

stopGps();

}

if(!ridesUnsubscribe){

subscribeRides();

}

updateCountdowns();

},

error=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// VERIFY DRIVER ACCOUNT

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!functions||!db){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true){

throw new Error("Driver role required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

await syncClock();

if(currentGeneration!==generation)return;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// REFRESH SERVER TIME

setInterval(async()=>{

if(!validSession())return;

try{

await syncClock();

}catch(e){

clockCheckedAt=0;

}

updateCountdowns();

},60000);

// REFRESH BUTTON

$("refreshButton").onclick=()=>{

if(auth&&!busy){

verifyDriver(auth.currentUser);

}

};

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

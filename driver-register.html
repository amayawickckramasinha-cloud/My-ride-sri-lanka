<style>

label{

}
button{
width:100%;
padding:16px;
margin:15px 0;

.note{

summary{

li{margin:12px 0;line-height:1.8}
#status{

#driverId{

}

<main>

<h1>MY RIDE</h1>
<div class="country">SRI LANKA</div>

<form id="registerForm">

<section class="panel">
<h3 id="personalHeading"></h3>
<div id="personalFields"></div>
</section>

<section class="panel">
<h3 id="vehicleHeading"></h3>

</section>

<h3 id="termsHeading"></h3>

</section>

<button type="submit"

<a id="backButton" class="back"></a>

<footer>© MY RIDE SRI LANKA</footer>

fields.forEach((field,index)=>{

const [id,type,si,en,ta]=field;

const parent=index<10
?$("personalFields")
:$("vehicleFields");

const label=document.createElement("label");

label.htmlFor=id;

label.textContent=
String(index+1).padStart(2,"0")+". "+
tr(si,en,ta);

parent.appendChild(label);

const input=document.createElement(
type==="select"?"select":
type==="textarea"?"textarea":"input"
);

input.id=id;
input.name=id;
input.required=true;

if(type==="select"){

input.add(new Option(
tr("තෝරන්න","Select","தேர்ந்தெடுக்கவும்"),
""
));

choices[id].forEach(option=>{

input.add(new Option(
option[languageIndex+1],
option[0]
));

});

}else if(type!=="textarea"){

input.type=type;

}

if(type==="text"||type==="textarea"){

input.maxLength=id==="address"?300:100;

}

if(type==="tel"){

input.maxLength=16;
input.placeholder="07XXXXXXXX";

}

parent.appendChild(input);

});

car:4,
van:10

$("vehicleType").onchange=()=>{

};

"ඉලක්කම් 6ක OTP අංකය ඇතුළත් කරන්න.",
"Enter the six-digit OTP.",
"ஆறு இலக்க OTP எண்ணை உள்ளிடவும்."
);

return;

}

busy=true;
$("phone").readOnly=true;

updateButtons();

try{

const result=await confirmation.confirm(code);

if(result.user.phoneNumber!==otpPhone){

throw new Error("Phone mismatch");

}

verifiedPhone=otpPhone;
verifiedUid=result.user.uid;

confirmation=null;

$("otpPanel").hidden=true;
$("otp").value="";

text("verifiedStatus",
"✓ දුරකථන අංකය තහවුරු කර ඇත.",
"✓ Phone number verified.",
"✓ தொலைபேசி எண் சரிபார்க்கப்பட்டது.");

$("status").textContent="";

}catch(e){

status(
"OTP තහවුරු කළ නොහැක.",
"OTP verification failed.",
"OTP சரிபார்ப்பு தோல்வியடைந்தது."
);

}finally{

busy=false;
$("phone").readOnly=false;

updateButtons();

}

};

// SRI LANKA DATE

function todaySL(){

return new Date(
Date.now()+330*60000
).toISOString().slice(0,10);

}

$("dob").max=todaySL();

["licenceExpiry","insuranceExpiry","revenueExpiry"]
.forEach(id=>$(id).min=todaySL());

// FORM VALIDATION

function getData(){

const data={};

for(const field of fields){

const id=field[0];

data[id]=$(id).value.trim();

if(!data[id]){

status(
"සියලු තොරතුරු ඇතුළත් කරන්න.",
"Complete all fields.",
"அனைத்து தகவல்களையும் உள்ளிடவும்."
);

return null;

}

}

data.nic=data.nic.toUpperCase();

if(!/^(?:\d{9}[VX]|\d{12})$/.test(data.nic)){

status(
"නිවැරදි NIC අංකයක් ඇතුළත් කරන්න.",
"Enter a valid NIC number.",
"சரியான NIC எண்ணை உள்ளிடவும்."
);

return null;

}

data.phone=normalizePhone(data.phone);

data.whatsapp=normalizePhone(data.whatsapp);

if(!data.phone||!data.whatsapp||!isVerified()){

status(
"දුරකථන අංක පරීක්ෂා කරන්න.",
"Check your phone numbers.",
"தொலைபேசி எண்களைச் சரிபார்க்கவும்."
);

return null;

}

const adultDate=new Date(todaySL()+"T00:00:00Z");

adultDate.setUTCFullYear(
adultDate.getUTCFullYear()-18
);

if(data.dob>adultDate.toISOString().slice(0,10)){

status(
"අවම වයස අවුරුදු 18යි.",
"Minimum age is 18.",
"குறைந்தபட்ச வயது 18."

);

return null;

}

for(const id of [
"licenceExpiry",
"insuranceExpiry",
"revenueExpiry"
]){

if(data[id]<todaySL()){

status(
"කල් ඉකුත් වූ බලපත්‍ර හෝ රක්ෂණ භාවිතා කළ නොහැක.",
"Expired licences or insurance are not accepted.",
"காலாவதியான உரிமங்கள் அல்லது காப்பீடு ஏற்கப்படாது."
);

return null;

}

}

data.capacity=Number(data.capacity);

data.experience=Number(data.experience);

if(!Number.isInteger(data.capacity)

||data.capacity<1

||data.capacity>capacityLimits[data.vehicleType]

||!Number.isInteger(data.experience)

||data.experience<0

||data.experience>70){

status(
"මගී ධාරිතාව සහ පළපුරුද්ද පරීක්ෂා කරන්න.",
"Check capacity and driving experience.",
"பயணிகள் எண்ணிக்கை மற்றும் அனுபவத்தைச் சரிபார்க்கவும்."
);

return null;

}

for(const item of consents){

data[item[0]]=$(item[0]).checked;

}

if(!data.truthConsent

||!data.termsConsent

||!data.commissionConsent

||!data.gpsConsent){

status(
"අනිවාර්ය එකඟතා සලකුණු කරන්න.",
"Accept the required consents.",
"கட்டாய ஒப்புதல்களை ஏற்கவும்."
);

return null;

}

data.language=lang;
data.termsVersion=TERMS_VERSION;

return data;

}

// SECURE REGISTRATION

$("registerForm").addEventListener(
"submit",
async event=>{

event.preventDefault();

if(busy||submitted||!isVerified()||!functions){

return;

}

const data=getData();

if(!data)return;

const payload=JSON.stringify(data);

if(!requestId||requestPayload!==payload){

requestId=crypto.randomUUID();
requestPayload=payload;

}

const uid=auth.currentUser.uid;

busy=true;

const controls=$("registerForm")
.querySelectorAll("input,select,textarea");

controls.forEach(el=>el.disabled=true);

updateButtons();

status(
"ලියාපදිංචිය යොමු කරමින්...",
"Submitting registration...",
"பதிவு அனுப்பப்படுகிறது..."
);

try{

const registerDriver=httpsCallable(
functions,
"submitDriverRegistration"
);

const response=await registerDriver({

...data,
requestId

});

if(auth.currentUser?.uid!==uid){

throw new Error("Session changed");

}

const result=response.data;

if(result?.accepted!==true

||result.status!=="pending"

||typeof result.driverId!=="string"

||! /^[A-Za-z0-9_-]{1,128}$/.test(result.driverId)){

throw new Error("Invalid response");

}

submitted=true;

$("driverId").textContent=result.driverId;

$("registerForm").hidden=true;

$("successPanel").hidden=false;

$("registerForm").reset();

$("status").textContent="";

}catch(e){

if(e.code==="functions/already-exists"){

status(
"මෙම රියදුරු තොරතුරු දැනටමත් ලියාපදිංචි කර ඇත.",
"These driver details are already registered.",
"இந்த சாரதி தகவல்கள் ஏற்கனவே பதிவு செய்யப்பட்டுள்ளன."
);

}else{

status(
"ලියාපදිංචිය යොමු කළ නොහැක. නැවත උත්සාහ කරන්න.",
"Unable to submit registration. Try again.",
"பதிவை அனுப்ப முடியவில்லை. மீண்டும் முயற்சிக்கவும்."
);

}

}finally{

busy=false;

controls.forEach(el=>el.disabled=false);

updateButtons();

}

});

window.addEventListener("offline",updateButtons);
window.addEventListener("online",updateButtons);

updateButtons();

</script>
</body>
</html>

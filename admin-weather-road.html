<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="robots"
content="noindex,nofollow,noarchive">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Weather & Road Management</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
crossorigin="anonymous">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:22px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.8;
overflow-wrap:anywhere;
}

#map{
height:420px;
width:100%;
border-radius:10px;
background:#292929;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.bad{
color:#FF7777;
}

.danger{
background:#C62828;
color:white;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
margin:15px 0;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.legend{
display:flex;
flex-wrap:wrap;
gap:15px;
font-size:13px;
margin-top:12px;
}

.dot{
display:inline-block;
width:12px;
height:12px;
border-radius:50%;
margin-right:5px;
}

#status,#result,#saveResult,#reviewResult{
color:#FFD600;
text-align:center;
line-height:1.8;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

@media(max-width:450px){

#map{
height:350px;
}

.stat strong{
font-size:19px;
}

}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Weather & Road Management
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>
<button data-lang="en">English</button>
<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"
role="status"
aria-live="polite">
Checking security...
</p>

<section id="accessPanel"
class="panel"
hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="overview"
class="grid"></div>

<p id="lastUpdate"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="liveMap"></h3>

<div id="map"></div>

<div class="legend">

<span>
<i class="dot"
style="background:#25D366"></i>
<span data-t="normal"></span>
</span>

<span>
<i class="dot"
style="background:#3388FF"></i>
<span data-t="rain"></span>
</span>

<span>
<i class="dot"
style="background:#FF9800"></i>
<span data-t="difficult"></span>
</span>

<span>
<i class="dot"
style="background:#888888"></i>
<span data-t="unknown"></span>
</span>

</div>

<p class="note"
data-t="mapNotice"></p>

<button id="fitMap"
data-t="showAll"></button>

</section>

<section class="panel">

<h3 data-t="districtWeather"></h3>

<label for="districtFilter"
data-t="district"></label>

<select id="districtFilter">

<option value="all"
data-t="all"></option>

</select>

<button id="checkDistrict"
data-t="check"></button>

<div id="weatherList"></div>

</section>

<section class="panel">

<h3 data-t="surcharges"></h3>

<div id="fareSummary"
class="grid"></div>

<p class="note"
data-t="fareNotice"></p>

<a id="fareLink"
class="action"
data-t="fareManagement"></a>

</section>

<section class="panel">

<h3 data-t="automaticSettings"></h3>

<label class="checkRow">

<input id="weatherEnabled"
type="checkbox">

<span data-t="autoWeather"></span>

</label>

<label class="checkRow">

<input id="roadEnabled"
type="checkbox">

<span data-t="autoRoad"></span>

</label>

<label class="checkRow">

<input id="weatherChargeEnabled"
type="checkbox">

<span data-t="autoRainCharge"></span>

</label>

<label class="checkRow">

<input id="roadChargeEnabled"
type="checkbox">

<span data-t="autoRoadCharge"></span>

</label>

<label for="rainThreshold"
data-t="rainThreshold"></label>

<input id="rainThreshold"
type="number"
min="0.1"
max="100"
step="0.1">

<label for="weatherInterval"
data-t="weatherInterval"></label>

<select id="weatherInterval">

<option value="5">5 MIN</option>
<option value="10">10 MIN</option>
<option value="15">15 MIN</option>
<option value="30">30 MIN</option>
<option value="60">60 MIN</option>

</select>

<label for="weatherMaxAge"
data-t="weatherMaxAge"></label>

<select id="weatherMaxAge">

<option value="10">10 MIN</option>
<option value="15">15 MIN</option>
<option value="30">30 MIN</option>
<option value="60">60 MIN</option>

</select>

<label for="roadMaxAge"
data-t="roadMaxAge"></label>

<select id="roadMaxAge">

<option value="1">1 DAY</option>
<option value="3">3 DAYS</option>
<option value="7">7 DAYS</option>
<option value="14">14 DAYS</option>
<option value="30">30 DAYS</option>

</select>

<p class="note"
data-t="unknownNotice"></p>

<label for="settingsReason"
data-t="reason"></label>

<textarea id="settingsReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="settingsConsent"
type="checkbox">

<span data-t="confirmSettings"></span>

</label>

<button id="saveSettings"
data-t="save"
disabled></button>

<p id="saveResult"
role="status"
aria-live="polite"></p>

</section>

<section class="panel">

<h3 data-t="roadReports"></h3>

<label for="reportStatus"
data-t="reportStatus"></label>

<select id="reportStatus">

<option value="all"
data-t="all"></option>

<option value="pending"
data-t="pending"></option>

<option value="approved"
data-t="approved"></option>

<option value="rejected"
data-t="rejected"></option>

<option value="expired"
data-t="expired"></option>

</select>

<button id="loadReports"
data-t="loadReports"></button>

<div id="reportList"></div>

<button id="moreReports"
data-t="more"
hidden></button>

</section>

<section id="reviewPanel"
class="panel"
hidden>

<h3 data-t="reviewReport"></h3>

<div id="reviewDetails"></div>

<label for="reviewDecision"
data-t="decision"></label>

<select id="reviewDecision">

<option value="approved"
data-t="approved"></option>

<option value="rejected"
data-t="rejected"></option>

</select>

<label for="evidence"
data-t="evidence"></label>

<textarea id="evidence"
maxlength="1000"></textarea>

<label for="reviewReason"
data-t="reason"></label>

<textarea id="reviewReason"
maxlength="500"></textarea>

<p class="warning"
data-t="reviewNotice"></p>

<label class="checkRow">

<input id="reviewConsent"
type="checkbox">

<span data-t="confirmReview"></span>

</label>

<button id="submitReview"
data-t="confirm"
disabled></button>

<button id="closeReview"
class="back"
data-t="close"></button>

<p id="reviewResult"
role="status"
aria-live="polite"></p>

</section>

<section class="panel">

<h3 data-t="history"></h3>

<div id="historyList"></div>

<button id="loadHistory"
data-t="loadHistory"></button>

<button id="moreHistory"
data-t="more"
hidden></button>

</section>

<p id="result"
role="status"
aria-live="polite"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

</script>

function validId(value){

return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,max){

return typeof value==="string"
&&value.length<=max;

}

function validCount(value){

return Number.isSafeInteger(value)
&&value>=0;

}

function validNumber(value,min,max){

return typeof value==="number"
&&Number.isFinite(value)
&&value>=min
&&value<=max;

}

function validTime(value){

return Number.isFinite(value)
&&value>0
&&value<=8640000000000000;

}

function validPoint(point){

return point
&&validNumber(point.lat,5.85,9.9)
&&validNumber(point.lon,79.5,82);

dateStyle:"medium",
timeStyle:"medium"

}

).format(new Date(value));

$("reviewReason").value="";

$("evidence").value="";

$("reviewConsent").checked=false;

reviewResult("");

renderReview();

$("reviewPanel").scrollIntoView({

behavior:"smooth"

});

}

function closeReview(force=false){

if(mutationBusy&&!force)return;

selectedReport=null;

$("reviewPanel").hidden=true;

$("reviewDetails").replaceChildren();

$("reviewReason").value="";

$("evidence").value="";

$("reviewConsent").checked=false;

reviewResult("");

updateControls();

}

$("closeReview").onclick=()=>closeReview();

$("submitReview").onclick=async()=>{

if(!isOwner()

||busy

||mutationBusy

||!selectedReport

||!$("reviewConsent").checked)return;

const decision=$("reviewDecision").value;

const reason=$("reviewReason").value.trim();

const evidence=$("evidence").value.trim();

if(!["approved","rejected"].includes(decision)

||reason.length<10

||reason.length>500

||evidence.length>1000

||(decision==="approved"&&evidence.length<10)

||(decision==="approved"&&selectedReport.unsafe)){

reviewResult("invalid");

return;

}

const payload={

reportId:selectedReport.reportId,

expectedRevision:selectedReport.revision,

decision,

reason,

evidence

};

let requestId;

try{

requestId=requestIdFor({

action:"review",

...payload

});

}catch(e){

reviewResult("saveError");

return;

}

const currentGeneration=generation;

mutationBusy=true;

updateControls();

reviewResult("saving");

try{

await freshOwnerAuthentication();

const response=await serverCall(

"reviewAdminRoadReport",

{

...payload,

requestId

}

);

if(response?.success!==true

||response.ownerUid!==ownerUid

||!validReport(response.report)

||response.report.reportId!==payload.reportId

||response.report.status!==decision

||response.report.revision<=payload.expectedRevision){

throw new Error("Review not confirmed");

}

pendingMutation=null;

reports=reports.map(record=>

record.reportId===response.report.reportId

?response.report

:record

);

if(reportFilter!=="all"){

reports=reports.filter(

record=>record.status===reportFilter

);

}

closeReview(true);

result("saved");

try{

await loadOverview(true);

}catch(e){

result("error");

}

}catch(e){

if(currentGeneration===generation){

$("reviewConsent").checked=false;

reviewResult("saveError");

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

renderReports();

}

}

};

function validHistory(record){

return record

&&validId(record.recordId)

&&["settingsChange","reportReview"]
.includes(record.action)

&&validText(record.reason,500)

&&validTime(record.createdAtMs)

&&(record.version===null

||validCount(record.version))

&&(record.reportId===null

||validId(record.reportId));

}

function renderHistory(){

const container=$("historyList");

container.replaceChildren();

$("moreHistory").hidden=historyCursor===null;

if(!isOwner()||!historyLoaded)return;

if(!historyRecords.length){

container.textContent=t("noRecords");

return;

}

historyRecords.forEach(record=>{

const panel=document.createElement("div");

panel.className="record";

addLine(panel,"action",t(record.action));

addLine(panel,"reason",record.reason);

addLine(panel,"updated",

formatDate(record.createdAtMs));

if(record.version!==null){

addLine(panel,"version",record.version);

}

if(record.reportId!==null){

addLine(panel,"reportId",record.reportId);

}

container.appendChild(panel);

});

}

async function loadHistory(reset=true){

if(!isOwner()||busy||mutationBusy)return;

const currentGeneration=generation;

busy=true;

updateControls();

result("loading");

try{

const response=await serverCall(

"getAdminWeatherRoadHistory",

{

limit:30,

cursor:reset?null:historyCursor

}

);

if(response?.success!==true

||response.ownerUid!==ownerUid

||!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validHistory)

||!validCursor(response.nextCursor)){

throw new Error("Invalid history");

}

const unique=new Map(

(reset?[]:historyRecords)

.map(record=>[record.recordId,record])

);

response.records.forEach(record=>{

unique.set(record.recordId,record);

});

historyRecords=[...unique.values()];

historyCursor=response.nextCursor;

historyLoaded=true;

result("");

}catch(e){

if(currentGeneration===generation){

historyRecords=[];

historyCursor=null;

historyLoaded=false;

result("error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

renderHistory();

}

}

}

$("loadHistory").onclick=()=>loadHistory(true);

$("moreHistory").onclick=()=>{

if(historyCursor!==null){

loadHistory(false);

}

};

function startLiveUpdates(){

if(refreshTimer){

clearInterval(refreshTimer);

}

refreshTimer=setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||document.hidden)return;

refreshOverview(true);

},60000);

}

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

settings=null;

summary=null;

fares=null;

weatherRecords=[];

roadSegments=[];

reports=[];

historyRecords=[];

reportCursor=null;

historyCursor=null;

reportsLoaded=false;

historyLoaded=false;

dirty=false;

lastSync=null;

serverOffset=0;

pendingMutation=null;

if(refreshTimer){

clearInterval(refreshTimer);

refreshTimer=null;

}

if(map){

map.remove();

map=null;

mapLayer=null;

}

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

closeReview(true);

$("weatherList").replaceChildren();

$("reportList").replaceChildren();

$("historyList").replaceChildren();

$("settingsReason").value="";

$("settingsConsent").checked=false;

$("rainThreshold").value="";

[

"weatherEnabled",

"roadEnabled",

"weatherChargeEnabled",

"roadChargeEnabled"

].forEach(id=>{

$(id).checked=false;

});

$("districtFilter").value="all";

$("reportStatus").value="all";

reportFilter="all";

result("");

saveResult("");

renderOverview();

renderFares();

renderReports();

renderHistory();

updateControls();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

status("denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

status("offline");

return;

}

status("checking");

try{

const appToken=await getToken(appCheck,false);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

status("verified");

initializeMap();

await refreshOverview(false);

if(currentGeneration===generation

&&isOwner()){

startLiveUpdates();

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

let checking=false;

setInterval(async()=>{

if(!isOwner()||checking||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await serverCall(

"verifyOwnerAdmin"

);

if(!validOwner(response,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()||busy||mutationBusy)return;

renderOverview();

renderWeather();

renderMap();

},15000);

window.addEventListener("offline",()=>{

clearSession();

status("offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(dirty||mutationBusy||pendingMutation){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

document.addEventListener(

"visibilitychange",

()=>{

if(!document.hidden&&isOwner()){

refreshOverview(true);

}

}

);

renderLanguage();

updateControls();

initializeSecurity();

</script>

</body>
</html>

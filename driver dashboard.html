<style>

*{box-sizing:border-box}

body{
margin:0;
background:#111;
color:white;

}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;

}

h2{
text-align:center;
line-height:1.6;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:18px;
margin:16px 0;
}

.profileName{
font-size:22px;
font-weight:bold;
overflow-wrap:anywhere;
}

.driverId{
color:#FFD600;
margin-top:8px;
}

.approved{
color:#4ADE80;
font-weight:bold;
margin:10px 0;
}

.row{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
padding:12px 0;
border-bottom:1px solid #444;
}

.stats{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#202020;
border:1px solid #444;
border-radius:10px;
padding:14px;
}

.statLabel{
font-size:13px;
color:#CCC;
line-height:1.6;
}

.statValue{
font-size:21px;
font-weight:bold;
color:#FFD600;
margin-top:10px;
overflow-wrap:anywhere;
}

button,.menuButton{
display:block;
width:100%;
background:#FFD600;
color:#111;
border:0;
border-radius:10px;
padding:16px;
margin:12px 0;
font-size:16px;
font-weight:bold;
text-decoration:none;
cursor:pointer;
line-height:1.6;
}

.menuButton{
display:flex;
align-items:center;
gap:12px;
}

.menuIcon{
font-size:23px;
width:30px;
flex-shrink:0;
}

.menuText{
flex:1;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

.secondary{
background:transparent;
border:1px solid #FFD600;
color:#FFD600;
text-align:center;
}

.offline{
color:#FF6464;
}

.online{
color:#4ADE80;
}

.busy{
color:#FFA500;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.8;
}

#status{
color:#FFD600;
text-align:center;
line-height:1.8;
}

footer{
color:#AAA;
text-align:center;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

panel.append(label,value);

$("stats").appendChild(panel);

});

// FIREBASE CONFIGURATION

const firebaseConfig={

apiKey:"AIzaSyDzrAZ7sc-c7CYIIwOpsiC9xdCPNHO7Km4",

authDomain:"my-ride-sri-lanka.firebaseapp.com",

projectId:"my-ride-sri-lanka",

storageBucket:"my-ride-sri-lanka.firebasestorage.app",

messagingSenderId:"88909447786",

appId:"1:88909447786:web:f8f7b8ccce99ea390a4013"

};

let auth=null;

let db=null;

let functions=null;

let currentUid=null;

let authorized=false;

let driver=null;

let driverUnsubscribe=null;

let statsUnsubscribe=null;

let gpsWatch=null;

let gpsActive=false;

let gpsSending=false;

let lastGpsSent=0;

let lastGpsFix=0;

let busy=false;

let generation=0;

let statsDay=null;

function status(message){

$("status").textContent=message;

}

function validSession(){

return authorized

&&currentUid!==null

&&auth?.currentUser?.uid===currentUid

&&navigator.onLine;

}

try{

const app=initializeApp(firebaseConfig);

initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

db=getFirestore(app);

functions=getFunctions(app);

}catch(e){

status(t.connection);

}

// SERVER FUNCTIONS

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const uid=currentUid;

const callGeneration=generation;

const callable=httpsCallable(functions,name);

const response=await callable(data);

if(!validSession()

||currentUid!==uid

||callGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// GPS DISPLAY

function updateGpsDisplay(){

const active=gpsActive

&&Date.now()-lastGpsFix<30000;

$("gpsValue").textContent=

active?t.gpsActive:t.gpsInactive;

$("gpsValue").className=

active?"online":"offline";

$("stat_gps").textContent=

active?t.gpsActive:t.gpsInactive;

}

// STOP GPS

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

gpsActive=false;

lastGpsFix=0;

updateGpsDisplay();

}

// GPS VALIDATION

function validPosition(position){

const c=position.coords;

return Number.isFinite(c.latitude)

&&Number.isFinite(c.longitude)

&&Number.isFinite(c.accuracy)

&&c.latitude>=5.85

&&c.latitude<=9.9

&&c.longitude>=79.5

&&c.longitude<=82

&&c.accuracy>=0

&&c.accuracy<=100

&&Date.now()-position.timestamp<30000

&&position.timestamp<=Date.now()+5000;

}

// SEND DRIVER LOCATION

async function sendGps(position){

if(!validSession()

||!driver

||!["online","busy"].includes(driver.availability)

||!validPosition(position))return;

gpsActive=true;

lastGpsFix=Date.now();

updateGpsDisplay();

if(gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

const result=await serverCall(

"updateDriverLocation",

{

lat:position.coords.latitude,

lon:position.coords.longitude,

accuracy:position.coords.accuracy,

capturedAtMs:position.timestamp

}

);

if(result?.accepted!==true){

throw new Error("GPS rejected");

}

}catch(e){

gpsActive=false;

updateGpsDisplay();

status(t.gpsError);

}finally{

gpsSending=false;

}

}

// START GPS TRACKING

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

sendGps,

error=>{

gpsActive=false;

lastGpsFix=0;

updateGpsDisplay();

status(t.gpsError);

},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

// CLEAR PRIVATE DATA

function clearStats(){

statKeys.forEach(key=>{

$("stat_"+key).textContent="—";

});

}

function disconnect(){

generation++;

authorized=false;

currentUid=null;

driver=null;

statsDay=null;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

if(statsUnsubscribe){

statsUnsubscribe();

statsUnsubscribe=null;

}

stopGps();

clearStats();

$("driverName").textContent="";

$("driverId").textContent="";

$("vehicleValue").textContent="—";

$("availabilityValue").textContent="—";

$("dashboard").hidden=true;

$("onlineButton").disabled=true;

}

// ACCESS DENIED

function denyAccess(message){

disconnect();

$("accessMessage").textContent=message;

$("accessPanel").hidden=false;

status(message);

}

// DRIVER APPROVAL CHECK

function eligible(data){

return data

&&data.uid===currentUid

&&data.status==="approved"

&&data.activationComplete===true

&&data.documentsValid===true;

}

// UPDATE ONLINE BUTTON

function updateAvailability(){

if(!driver)return;

const availability=driver.availability;

$("availabilityValue").textContent=

availability==="busy"

?t.busy

:availability==="online"

?t.online:t.offline;

$("availabilityValue").className=

availability==="busy"

?"busy"

:availability==="online"

?"online":"offline";

$("onlineButton").textContent=

availability==="online"

?t.goOffline

:availability==="busy"

?t.busy:t.goOnline;

$("onlineButton").disabled=

busy

||!validSession()

||availability==="busy"

||!["online","offline"].includes(availability);

}

// DISPLAY DRIVER DATA

function displayDriver(data){

if(!eligible(data)){

denyAccess(t.denied);

return;

}

if(!["online","offline","busy"]

.includes(data.availability)){

denyAccess(t.denied);

return;

}

driver=data;

$("driverName").textContent=

typeof data.fullName==="string"

?data.fullName:"—";

$("driverId").textContent=

typeof data.driverId==="string"

?data.driverId:"—";

$("vehicleValue").textContent=

["bike","tuk","car","van"]

.includes(data.vehicleType)

?t[data.vehicleType]:"—";

$("dashboard").hidden=false;

$("accessPanel").hidden=true;

updateAvailability();

if(["online","busy"].includes(data.availability)){

startGps();

}else{

stopGps();

}

}

// SRI LANKA DATE

function sriLankaDate(){

return new Date(

Date.now()+330*60000

).toISOString().slice(0,10);

}

// STATISTICS DISPLAY

function safeNumber(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0

?value:null;

}

function money(value){

const number=safeNumber(value);

return number===null

?"—"

:"Rs. "+number.toLocaleString(

"en-LK",

{maximumFractionDigits:2}

);

}

function displayStats(data){

const countKeys=[

"receivedRides",

"completedRides"

];

countKeys.forEach(key=>{

const number=safeNumber(data[key]);

$("stat_"+key).textContent=

number!==null&&Number.isInteger(number)

?number.toLocaleString("en-LK")

:"—";

});

[

"grossIncome",

"commission",

"netIncome",

"outstandingCommission"

].forEach(key=>{

$("stat_"+key).textContent=

money(data[key]);

});

const distance=safeNumber(data.distanceKm);

$("stat_distanceKm").textContent=

distance===null

?"—"

:distance.toFixed(2)+" KM";

updateGpsDisplay();

}

// DAILY STATISTICS LISTENER

function subscribeStats(){

if(!validSession())return;

const day=sriLankaDate();

if(statsUnsubscribe){

statsUnsubscribe();

}

statsDay=day;

clearStats();

const uid=currentUid;

const listenerGeneration=generation;

const ref=doc(

db,

"drivers",

uid,

"dailyStats",

day

);

statsUnsubscribe=onSnapshot(

ref,

{includeMetadataChanges:true},

snapshot=>{

if(listenerGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

clearStats();

return;

}

if(snapshot.exists()){

displayStats(snapshot.data());

}else{

clearStats();

}

},

error=>{

if(listenerGeneration!==generation)return;

clearStats();

status(t.connection);

}

);

}

// VERIFY AUTHENTICATED DRIVER

async function verifyDriver(user){

disconnect();

const checkGeneration=generation;

if(!user||!functions||!db){

denyAccess(t.denied);

return;

}

if(!navigator.onLine){

denyAccess(t.noInternet);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true){

throw new Error("Driver role required");

}

const verify=httpsCallable(

functions,

"verifyDriverSession"

);

const response=await verify({});

if(checkGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Driver not eligible");

}

authorized=true;

currentUid=user.uid;

$("accessPanel").hidden=true;

const ref=doc(

db,

"drivers",

currentUid

);

driverUnsubscribe=onSnapshot(

ref,

{includeMetadataChanges:true},

snapshot=>{

if(checkGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

$("dashboard").hidden=true;

stopGps();

status(t.checking);

return;

}

if(!snapshot.exists()){

denyAccess(t.denied);

return;

}

displayDriver(snapshot.data());

if(validSession()){

status("");

}

},

error=>{

if(checkGeneration!==generation)return;

denyAccess(t.denied);

}

);

subscribeStats();

}catch(e){

if(checkGeneration!==generation)return;

denyAccess(t.denied);

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// GET CURRENT GPS POSITION

function getPosition(){

return new Promise((resolve,reject)=>{

if(!navigator.geolocation){

reject(new Error("GPS unavailable"));

return;

}

navigator.geolocation.getCurrentPosition(

resolve,

reject,

{

enableHighAccuracy:true,

maximumAge:0,

timeout:15000

}

);

});

}

// ONLINE / OFFLINE SYSTEM

$("onlineButton").onclick=async()=>{

if(busy||!validSession()||!driver)return;

if(driver.availability==="busy"){

status(t.busyError);

return;

}

const next=

driver.availability==="online"

?"offline":"online";

busy=true;

updateAvailability();

status(t.updating);

try{

let locationData=null;

if(next==="online"){

status(t.gpsPermission);

const position=await getPosition();

if(!validPosition(position)){

throw new Error("Invalid GPS");

}

locationData={

lat:position.coords.latitude,

lon:position.coords.longitude,

accuracy:position.coords.accuracy,

capturedAtMs:position.timestamp

};

}

const result=await serverCall(

"setDriverAvailability",

{

availability:next,

location:locationData

}

);

if(result?.accepted!==true){

throw new Error("Availability rejected");

}

// The Firestore listener displays
// the server-confirmed availability.

if(next==="offline"){

stopGps();

}

status("");

}catch(e){

status(t.updateError);

}finally{

busy=false;

updateAvailability();

}

};

// DRIVER LOGOUT

$("logoutButton").onclick=async()=>{

if(busy||!validSession())return;

if(driver?.availability==="busy"){

status(t.busyError);

return;

}

if(!confirm(t.logoutConfirm))return;

busy=true;

$("logoutButton").disabled=true;

updateAvailability();

try{

const result=await serverCall(

"endDriverSession"

);

if(result?.accepted!==true){

throw new Error("Logout rejected");

}

disconnect();

await signOut(auth);

location.replace(

"./driver-login.html?lang="+lang

);

}catch(e){

status(t.logoutError);

}finally{

busy=false;

$("logoutButton").disabled=false;

updateAvailability();

}

};

// CHECK GPS AND DATE

setInterval(()=>{

updateGpsDisplay();

if(validSession()

&&statsDay!==sriLankaDate()){

subscribeStats();

}

},5000);

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

disconnect();

status(t.noInternet);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener("pagehide",()=>{

disconnect();

});

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

});

status(t.checking);

</script>

href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.emergencyPanel{
border:2px solid #EF4444;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:110px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:25px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.record.critical{
border:2px solid #EF4444;
}

.messageBody{
white-space:pre-wrap;
overflow-wrap:anywhere;
background:#181818;
border-radius:8px;
padding:12px;
margin:10px 0;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.danger{
background:#B91C1C;
color:white;
}

.whatsapp{
background:#25D366;
color:#111;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.bad{
color:#FF7777;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
}

#map{
height:350px;
width:100%;
border-radius:10px;
background:#292929;
margin-top:12px;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Emergency Management
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>
<button data-lang="en">English</button>
<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"
class="message"
role="status"
aria-live="polite">
Checking security...
</p>

<section class="panel emergencyPanel">

<h3 data-t="emergencyContacts"></h3>

<p class="warning"
data-t="safetyNotice"></p>

<a href="tel:119"
class="action danger"
data-t="police"></a>

<a href="tel:1990"
class="action danger"
data-t="ambulance"></a>

<p class="note"
data-t="callNotice"></p>

</section>

<section id="accessPanel"
class="panel"
hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="overview"
class="grid"></div>

<p id="lastUpdate"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<section class="panel emergencyPanel">

<h3 data-t="activeEmergencies"></h3>

<p id="alertMessage"
class="warning"
role="status"
aria-live="polite"></p>

<button id="openCasesButton"
class="danger"
data-t="viewOpen"></button>

</section>

<section class="panel">

<h3 data-t="records"></h3>

<label for="search"
data-t="search"></label>

<input id="search"
type="search"
maxlength="128"
autocomplete="off">

<label for="source"
data-t="source"></label>

<select id="source">

<option value="all"
data-t="all"></option>

<option value="driver"
data-t="driver"></option>

<option value="customer"
data-t="customer"></option>

<option value="admin"
data-t="admin"></option>

</select>

<label for="incidentType"
data-t="incidentType"></label>

<select id="incidentType">

<option value="all"
data-t="all"></option>

<option value="sos"
data-t="sos"></option>

<option value="accident"
data-t="accident"></option>

<option value="medical"
data-t="medical"></option>

<option value="security"
data-t="security"></option>

<option value="vehicleBreakdown"
data-t="vehicleBreakdown"></option>

<option value="unsafeRoad"
data-t="unsafeRoad"></option>

<option value="missingContact"
data-t="missingContact"></option>

<option value="other"
data-t="other"></option>

</select>

<label for="caseStatus"
data-t="caseStatus"></label>

<select id="caseStatus">

<option value="all"
data-t="all"></option>

<option value="open"
data-t="open"></option>

<option value="acknowledged"
data-t="acknowledged"></option>

<option value="responding"
data-t="responding"></option>

<option value="resolved"
data-t="resolved"></option>

<option value="falseAlarm"
data-t="falseAlarm"></option>

</select>

<label for="severity"
data-t="severity"></label>

<select id="severity">

<option value="all"
data-t="all"></option>

<option value="high"
data-t="high"></option>

<option value="critical"
data-t="critical"></option>

</select>

<button id="searchButton"
data-t="searchButton"></button>

<div id="incidentList"></div>

<button id="moreRecords"
data-t="more"
hidden></button>

<p id="listResult"
class="message"
role="status"></p>

</section>

<section id="detailsPanel"
class="panel emergencyPanel"
hidden>

<h3 data-t="details"></h3>

<div id="incidentDetails"></div>

<a id="driverCall"
class="action"
data-t="callDriver"
hidden></a>

<a id="customerCall"
class="action"
data-t="callCustomer"
hidden></a>

<a id="driverWhatsapp"
class="action whatsapp"
data-t="whatsappDriver"
target="_blank"
rel="noopener noreferrer"
hidden></a>

<a id="customerWhatsapp"
class="action whatsapp"
data-t="whatsappCustomer"
target="_blank"
rel="noopener noreferrer"
hidden></a>

<h4 data-t="location"></h4>

<p id="gpsStatus"
class="warning"></p>

<p id="coordinates"
class="note"></p>

<div id="map" hidden></div>

<p class="note"
data-t="mapNotice"></p>

<button id="refreshDetails"
data-t="refreshDetails"></button>

<button id="closeDetails"
class="back"
data-t="close"></button>

</section>

<section id="managementPanel"
class="panel"
hidden>

<h3 data-t="management"></h3>

<label for="newStatus"
data-t="newStatus"></label>

<select id="newStatus"></select>

<label for="actionType"
data-t="actionType"></label>

<select id="actionType">

<option value="review"
data-t="review"></option>

<option value="contactDriver"
data-t="contactDriver"></option>

<option value="contactCustomer"
data-t="contactCustomer"></option>

<option value="contactPolice"
data-t="contactPolice"></option>

<option value="contactAmbulance"
data-t="contactAmbulance"></option>

<option value="coordinateHelp"
data-t="coordinateHelp"></option>

<option value="safetyConfirmed"
data-t="safetyConfirmed"></option>

<option value="other"
data-t="other"></option>

</select>

<label for="actionNote"
data-t="actionNote"></label>

<textarea id="actionNote"
maxlength="2000"></textarea>

<p class="note"
data-t="privateNotice"></p>

<label class="checkRow">

<input id="confirmAction"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="saveAction"
data-t="save"
disabled></button>

<p id="actionResult"
class="message"
role="status"></p>

</section>

<section id="historyPanel"
class="panel"
hidden>

<h3 data-t="history"></h3>

<div id="actionHistory"></div>

<button id="moreHistory"
data-t="more"
hidden></button>

</section>

<section class="panel">

<h3 data-t="relatedPages"></h3>

<a id="driversLink"
class="action"
data-t="driversPage"></a>

<a id="bookingsLink"
class="action"
data-t="bookingsPage"></a>

<a id="liveTripsLink"
class="action"
data-t="liveTripsPage"></a>

<a id="complaintsLink"
class="action"
data-t="complaintsPage"></a>

<a id="notificationsLink"
class="action"
data-t="notificationsPage"></a>

</section>

<p id="result"
class="message"
role="status"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

function isOwner(){

return authorized

&&ownerUid!==null

&&auth?.currentUser?.uid===ownerUid

&&navigator.onLine;

}

function validOwner(data,uid){

return data?.authorized===true

&&data.uid===uid

&&data.role==="owner"

&&data.ownerUidVerified===true

&&data.sessionValid===true;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,max){

return typeof value==="string"

&&value.length<=max;

}

function validCount(value){

return Number.isSafeInteger(value)

&&value>=0;

}

function validTime(value){

return Number.isFinite(value)

&&value>0

&&value<=8640000000000000;

}

function validPhone(value){

return typeof value==="string"

&&/^\+[1-9]\d{7,14}$/.test(value);

}

function validCursor(value){

return value===null

||validText(value,4000);

}

function serverNow(){

return Date.now()+clockOffset;

}

function formatDate(value){

if(!validTime(value))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

{

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(value));

}

function validRecord(record){

return record

&&validId(record.incidentId)

&&(record.bookingId===null

||validId(record.bookingId))

&&(record.driverId===null

||validId(record.driverId))

&&sources.includes(record.source)

&&incidentTypes.includes(record.type)

&&statuses.includes(record.status)

&&severities.includes(record.severity)

&&validText(record.summary,500)

&&validTime(record.createdAtMs)

&&validTime(record.updatedAtMs)

&&record.updatedAtMs>=record.createdAtMs

&&validCount(record.revision);

}

function validLocation(location){

return location===null

||(

location

&&Number.isFinite(location.lat)

&&Number.isFinite(location.lon)

&&location.lat>=5.8

&&location.lat<=10.1

&&location.lon>=79.3

&&location.lon<=82.2

&&Number.isFinite(location.accuracy)

&&location.accuracy>=0

&&location.accuracy<=100000

&&validTime(location.updatedAtMs)

);

}

function validPerson(person){

return person===null

||(

person

&&validText(person.name,200)

&&(person.phone===null

||validPhone(person.phone))

&&(person.whatsapp===null

||validPhone(person.whatsapp))

&&typeof person.whatsappConsent==="boolean"

);

}

&&typeof record.canUpdate==="boolean";

}

function readQuery(openOnly=false){

const source=$("source").value;

const type=$("incidentType").value;

const status=$("caseStatus").value;

const severity=$("severity").value;

if(!["all",...sources].includes(source)

||!["all",...incidentTypes].includes(type)

||!["all",...statuses].includes(status)

||!["all",...severities].includes(severity)){

throw new Error("Invalid query");

}

return {

search:$("search").value.trim(),

source,

type,

status,

severity,

openOnly

};

}

async function loadRecords(reset=true){

if(!currentQuery)return;

const response=await serverCall(

"getAdminEmergencyIncidents",

{

...currentQuery,

limit:30,

cursor:reset?null:nextCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validRecord)

||!validCursor(response.nextCursor)){

throw new Error("Invalid records");

}

if(currentQuery.openOnly

&&response.records.some(record=>

!activeStatuses.includes(record.status))){

throw new Error("Invalid open records");

}

const previous=reset?[]:records;

const merged=new Map(

previous.map(record=>[

record.incidentId,

record

])

);

response.records.forEach(record=>{

merged.set(record.incidentId,record);

});

records=[...merged.values()];

nextCursor=response.nextCursor;

renderRecords();

}

async function runRead(

callback,

resultId="result"

){

if(!isOwner()||busy||mutationBusy)return;

const currentGeneration=generation;

busy=true;

updateControls();

message(resultId,"loading");

try{

await callback();

if(currentGeneration===generation){

message(resultId,"");

}

}catch(e){

overview=null;

lastSync=null;

renderOverview();

message(resultId,"error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

function renderLocation(){

||!selectedIncident.location){

clearMap();

$("gpsStatus").textContent=t("gpsUnavailable");

return;

}

const location=selectedIncident.location;

const age=serverNow()-location.updatedAtMs;

const fresh=

age>=-10000

&&age<=60000

&&location.accuracy<=100;

$("gpsStatus").textContent=

t(fresh?"gpsFresh":"gpsStale");

fresh?"good":"warning";

$("coordinates").textContent=

location.lat.toFixed(6)

+", "+location.lon.toFixed(6)

+" | "+t("gpsAccuracy")

+": "+Math.round(location.accuracy)+" m"

+" | "+formatDate(location.updatedAtMs);

if(!window.L){

$("gpsStatus").textContent+=

" | "+t("mapError");

return;

}

try{

$("map").hidden=false;

const point=[location.lat,location.lon];

if(!map){

map=L.map("map",{

zoomControl:true

}).setView(point,15);

L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:"&copy; OpenStreetMap contributors"

}

).addTo(map);

marker=L.circleMarker(point,{

radius:10,

color:"#fff",

weight:3,

fillColor:fresh?"#FFD600":"#999",

fillOpacity:1

}).addTo(map);

accuracyCircle=L.circle(point,{

radius:location.accuracy,

color:"#FFD600",

fillOpacity:.12

}).addTo(map);

}else{

marker.setLatLng(point);

marker.setStyle({

fillColor:fresh?"#FFD600":"#999"

});

accuracyCircle.setLatLng(point);

accuracyCircle.setRadius(location.accuracy);

}

map.invalidateSize();

}catch(e){

$("gpsStatus").textContent=t("mapError");

}

async function freshOwnerAuthentication(){

if(!isOwner()){

throw new Error("Unauthorized");

}

const user=auth.currentUser;

const uid=user.uid;

const provider=new GoogleAuthProvider();

provider.setCustomParameters({

prompt:"select_account"

});

const credential=await reauthenticateWithPopup(

user,

provider

);

if(credential.user.uid!==uid

||auth.currentUser?.uid!==uid

||!isOwner()){

throw new Error("Owner changed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Invalid owner");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(!validOwner(response.data,uid)

||!isOwner()){

throw new Error("Owner verification failed");

}

}

function readAction(){

if(!selectedIncident

||!selectedIncident.canUpdate

||!activeStatuses.includes(

selectedIncident.status

)){

return null;

}

const status=$("newStatus").value;

const actionType=$("actionType").value;

const note=$("actionNote").value.trim();

const allowed=

transitions[selectedIncident.status]||[];

if(!allowed.includes(status)

||!actionTypes.includes(actionType)

||note.length<10

||note.length>2000

||!$("confirmAction").checked){

return null;

}

if(status==="resolved"

&&actionType!=="safetyConfirmed"){

return null;

}

return {

incidentId:selectedIncident.incidentId,

expectedRevision:selectedIncident.revision,

status,

actionType,

note

};

}

$("saveAction").onclick=async()=>{

if(!isOwner()

||busy

||mutationBusy)return;

const payload=readAction();

if(!payload){

message("actionResult","invalid");

return;

}

const fingerprint=JSON.stringify(payload);

if(pendingMutation

&&pendingMutation.fingerprint!==fingerprint){

message("actionResult","saveError");

return;

}

if(!pendingMutation){

pendingMutation={

fingerprint,

requestId:crypto.randomUUID()

};

}

const currentGeneration=generation;

mutationBusy=true;

updateControls();

message("actionResult","saving");

try{

await freshOwnerAuthentication();

if(currentGeneration!==generation

||!isOwner())return;

const response=await serverCall(

"updateAdminEmergencyIncident",

{

...payload,

requestId:pendingMutation.requestId

}

);

if(!validDetails(response.record)

||response.record.incidentId!==payload.incidentId

||response.record.revision<=

payload.expectedRevision

||response.record.status!==payload.status){

throw new Error("Response not confirmed");

}

selectedIncident=response.record;

pendingMutation=null;

resetDraft();

renderDetails();

message("actionResult","saved");

try{

await loadOverview();

await loadHistory(true);

if(currentQuery){

await loadRecords(true);

}

}catch(e){

message("result","error");

}

}catch(e){

if(currentGeneration===generation){

message("actionResult","saveError");

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

}

}

};

$("newStatus").replaceChildren();

$("actionType").value="review";

$("incidentDetails").replaceChildren();

$("actionHistory").replaceChildren();

resetContacts();

clearMap();

[

"result",
"listResult",
"actionResult"

].forEach(id=>{

message(id,"");

});

renderOverview();

renderRecords();

renderDetails();

updateControls();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

message("status","denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

message("status","offline");

return;

}

message("status","checking");

try{

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

message("status","verified");

updateControls();

await runRead(async()=>{

await loadOverview();

currentQuery=readQuery(true);

await loadRecords(true);

});

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

setInterval(async()=>{

if(!isOwner()

||checking

||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation)return;

if(!validOwner(response.data,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||pendingMutation

||document.hidden)return;

runRead(async()=>{

await loadOverview();

if(currentQuery

&&!selectedIncident

&&nextCursor===null){

await loadRecords(true);

}

if(selectedIncident&&!hasDraft()){

await loadDetails(

selectedIncident.incidentId,

true

);

}

});

},15000);

setInterval(()=>{

if(isOwner()

&&selectedIncident

&&!document.hidden){

renderLocation();

}

},5000);

window.addEventListener("offline",()=>{

clearSession();

message("status","offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(hasDraft()

||mutationBusy

||pendingMutation){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderLanguage();

updateControls();

initializeSecurity();

</script>

</body>
</html>

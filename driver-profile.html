
<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Driver Profile</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.profileHeader{
text-align:center;
border-color:#FFD600;
}

.profileIcon{
width:85px;
height:85px;
border-radius:50%;
background:#FFD600;
color:#111;
margin:10px auto;
display:flex;
align-items:center;
justify-content:center;
}

.profileName{
font-size:23px;
font-weight:bold;
margin:15px 0;
overflow-wrap:anywhere;
}

.driverId{
color:#FFD600;
font-size:15px;
}

.badge{
display:inline-block;
padding:9px 14px;
border-radius:8px;
margin:12px 0;
font-size:13px;
font-weight:bold;
}

.approved{
background:#163322;
color:#4ADE80;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:15px;
color:#FFB4B4;
line-height:1.8;
margin:15px 0;
}

.success{
background:#163322;
border:1px solid #4ADE80;
border-radius:10px;
padding:15px;
color:#4ADE80;
line-height:1.8;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.7;
}

.row span{
color:#CCC;
}

.row strong{
text-align:right;
max-width:60%;
overflow-wrap:anywhere;
}

.yellow{color:#FFD600}
.green{color:#4ADE80}
.red{color:#FF6464}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-size:14px;
font-weight:bold;
}

input,textarea,select{
width:100%;
padding:14px;
border:1px solid #555;
border-radius:9px;
background:#292929;
color:#fff;
font-size:16px;
color-scheme:dark;
}

textarea{
min-height:110px;
resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
outline:2px solid #FFD600;
}

input[type="checkbox"]{
width:22px;
height:22px;
accent-color:#FFD600;
flex-shrink:0;
}

.checkboxRow{
display:flex;
align-items:flex-start;
gap:10px;
margin:18px 0;
}

.checkboxRow label{
margin:0;
font-weight:normal;
line-height:1.8;
}

.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.8;
}

.passwordBox{
position:relative;
}

.passwordBox input{
padding-right:75px;
}

.showPassword{
position:absolute;
right:8px;
top:8px;
bottom:8px;
background:#444;
color:#FFD600;
border:0;
border-radius:5px;
padding:5px 9px;
cursor:pointer;
}

#status{
text-align:center;
color:#FFD600;
line-height:1.8;
}

details{
background:#202020;
border:1px solid #444;
border-radius:12px;
margin:14px 0;
}

summary{
padding:17px;
color:#FFD600;
font-weight:bold;
cursor:pointer;
line-height:1.8;
}

.detailsContent{
padding:0 16px 16px;
}

button:disabled,
input:disabled,
select:disabled,
textarea:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading"></h2>

<p id="status"
role="status"
aria-live="polite"></p>

<section id="accessPanel"
class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="content" hidden>

<section class="panel profileHeader">

<div class="profileIcon">

<svg width="48" height="48"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round">

<circle cx="12" cy="7" r="4"/>

<path d="M4 22v-3a8 8 0 0 1 16 0v3"/>

</svg>

</div>

<div id="profileName"
class="profileName">—</div>

<div id="profileDriverId"
class="driverId">—</div>

<div class="badge approved"
data-t="approved"></div>

<p id="registeredAt"
class="note"></p>

</section>

<div id="documentWarning"
class="warning" hidden
data-t="documentWarning"></div>

<details open>

<summary data-t="personalDetails"></summary>

<div id="personalDetails"
class="detailsContent"></div>

</details>

<details>

<summary data-t="vehicleDetails"></summary>

<div id="vehicleDetails"
class="detailsContent"></div>

</details>

<details>

<summary data-t="licenceDetails"></summary>

<div id="licenceDetails"
class="detailsContent"></div>

</details>

<details>

<summary data-t="insuranceDetails"></summary>

<div id="insuranceDetails"
class="detailsContent"></div>

</details>

<details>

<summary data-t="serviceDetails"></summary>

<div id="serviceDetails"
class="detailsContent"></div>

</details>

<details>

<summary data-t="accountDetails"></summary>

<div id="accountDetails"
class="detailsContent"></div>

</details>

<section class="panel">

<h3 data-t="updateDetails"></h3>

<p class="note"
data-t="updateNote"></p>

<form id="updateForm">

<label for="changeType"
data-t="changeType"></label>

<select id="changeType" required>

<option value=""
data-t="select"></option>

<option value="fullName"
data-t="fullName"></option>

<option value="phone"
data-t="phone"></option>

<option value="whatsapp"
data-t="whatsapp"></option>

<option value="address"
data-t="address"></option>

<option value="district"
data-t="district"></option>

<option value="nic"
data-t="nic"></option>

<option value="dob"
data-t="dob"></option>

<option value="vehicle"
data-t="vehicleDetails"></option>

<option value="licence"
data-t="licenceDetails"></option>

<option value="insurance"
data-t="insuranceDetails"></option>

<option value="serviceArea"
data-t="serviceArea"></option>

<option value="workingTime"
data-t="workingTime"></option>

<option value="other"
data-t="other"></option>

</select>

<label for="changeValue"
data-t="newDetails"></label>

<textarea
id="changeValue"
minlength="2"
maxlength="500"
required></textarea>

<label for="changeReason"
data-t="reason"></label>

<textarea
id="changeReason"
minlength="5"
maxlength="500"
required></textarea>

<div class="checkboxRow">

<input
id="updateConsent"
type="checkbox"
required>

<label for="updateConsent"
data-t="updateConsent"></label>

</div>

<button
id="updateButton"
class="action"
type="submit"
data-t="sendRequest"></button>

</form>

<p id="updateStatus"
class="note"
role="status"></p>

</section>

<section id="requestPanel"
class="panel" hidden>

<h3 data-t="latestRequest"></h3>

<div id="requestDetails"></div>

</section>

<section class="panel">

<h3 data-t="changePassword"></h3>

<form id="passwordForm">

<label for="currentPassword"
data-t="currentPassword"></label>

<div class="passwordBox">

<input
id="currentPassword"
type="password"
autocomplete="current-password"
maxlength="128"
required>

<button
type="button"
class="showPassword"
data-target="currentPassword"
data-t="show"></button>

</div>

<label for="newPassword"
data-t="newPassword"></label>

<div class="passwordBox">

<input
id="newPassword"
type="password"
autocomplete="new-password"
minlength="15"
maxlength="128"
required>

<button
type="button"
class="showPassword"
data-target="newPassword"
data-t="show"></button>

</div>

<label for="confirmPassword"
data-t="confirmPassword"></label>

<div class="passwordBox">

<input
id="confirmPassword"
type="password"
autocomplete="new-password"
minlength="15"
maxlength="128"
required>

<button
type="button"
class="showPassword"
data-target="confirmPassword"
data-t="show"></button>

</div>

<p class="note"
data-t="passwordRules"></p>

<button
id="passwordButton"
type="submit"
class="action"
data-t="savePassword"></button>

</form>

<p id="passwordStatus"
class="note"
role="status"></p>

<a id="resetLink"
class="action secondary"
data-t="forgotPassword"></a>

</section>

<a id="renewalLink"
class="action"
data-t="renewDocuments"></a>

<a id="accountLink"
class="action secondary"
data-t="accountStatus"></a>

<button id="refreshButton"
class="action secondary"
data-t="refresh"></button>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,max=500){

return typeof value==="string"

&&value.trim().length>0

&&value.length<=max;

}

function number(value){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0;

}

function text(value){

if(typeof value==="string"

&&value.trim()){

return value;

}

if(typeof value==="number"

&&Number.isFinite(value)){

return String(value);

}

return "—";

}

function yesNo(value){

return value===true

?t.yes

:value===false

?t.no:"—";

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncClock(){

const started=Date.now();

const result=await serverCall(

"getDriverServerTime"

);

const ended=Date.now();

if(!Number.isFinite(result?.serverTimeMs)

||ended-started>10000){

throw new Error("Server time unavailable");

}

serverOffset=

result.serverTimeMs-(started+ended)/2;

clockCheckedAt=ended;

}

function serverNow(){

return Date.now()+serverOffset;

}

function clockValid(){

return clockCheckedAt>0

&&Date.now()-clockCheckedAt<120000;

}

function sriLankaToday(){

return new Date(

serverNow()+330*60000

).toISOString().slice(0,10);

}

function validDate(value){

if(typeof value!=="string"

||!/^\d{4}-\d{2}-\d{2}$/.test(value)){

return false;

}

const date=new Date(value+"T00:00:00Z");

return Number.isFinite(date.getTime())

&&date.toISOString().slice(0,10)===value;

}

function formatDate(ms){

if(!Number.isFinite(ms)

||ms<=0

||ms>8640000000000000){

return "—";

}

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(ms));

}

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const c=position.coords;

if(!validSession()

||!driver

||!["online","busy"].includes(

driver.availability

)

||!Number.isFinite(c.latitude)

||!Number.isFinite(c.longitude)

||!number(c.accuracy)

||c.accuracy>100

||c.latitude<5.85

||c.latitude>9.9

||c.longitude<79.5

||c.longitude>82

||Date.now()-position.timestamp>30000

||position.timestamp>Date.now()+5000

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

{

lat:c.latitude,

lon:c.longitude,

accuracy:c.accuracy,

capturedAtMs:position.timestamp

}

);

}catch(e){

// Backend must expire stale GPS data.

}finally{

gpsSending=false;

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// PRIVATE DATA CLEARING

const profileSections=[

"personalDetails",

"vehicleDetails",

"licenceDetails",

"insuranceDetails",

"serviceDetails",

"accountDetails"

];

function clearProfile(){

profileGeneration++;

profile=null;

profileSections.forEach(id=>{

$(id).replaceChildren();

});

$("profileName").textContent="—";

$("profileDriverId").textContent="—";

$("registeredAt").textContent="";

$("documentWarning").hidden=true;

$("content").hidden=true;

}

function clearPasswords(){

$("passwordForm").reset();

document.querySelectorAll("[data-target]")

.forEach(button=>{

$(button.dataset.target).type="password";

button.textContent=t.show;

});

}

function stopRequestListener(){

if(requestUnsubscribe){

requestUnsubscribe();

requestUnsubscribe=null;

}

$("requestDetails").replaceChildren();

$("requestPanel").hidden=true;

}

function disconnect(){

generation++;

authorized=false;

uid=null;

driver=null;

clockCheckedAt=0;

updateBusy=false;

passwordBusy=false;

pendingUpdate=null;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

stopRequestListener();

stopGps();

clearProfile();

clearPasswords();

$("updateForm").reset();

$("updateStatus").textContent="";

$("passwordStatus").textContent="";

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// SAFE PROFILE DISPLAY

function addRow(parent,label,value,color=""){

const row=document.createElement("div");

row.className="row";

const name=document.createElement("span");

name.textContent=label;

const result=document.createElement("strong");

result.textContent=text(value);

if(color){

result.className=color;

}

row.append(name,result);

parent.append(row);

}

function addProfileRow(section,key,value,color=""){

addRow(

$(section),

t[key]||key,

value,

color

);

}

function maskNic(value){

if(typeof value!=="string"

||value.length<5){

return "—";

}

return "••••••"+value.slice(-4);

}

// PROFILE DATA VALIDATION

function validProfile(data){

if(!data

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true

||!validText(data.fullName,150)

||!validId(data.driverId)){

return false;

}

if(!["bike","tuk","car","van"]

.includes(data.vehicleType)){

return false;

}

if(!["day","night","both"]

.includes(data.workingTime)){

return false;

}

if(!Number.isInteger(data.capacity)

||data.capacity<1

||data.capacity>10){

return false;

}

if(!number(data.experience)

||!number(data.commissionRate)

||data.commissionRate>100){

return false;

}

const dateFields=[

"dob",

"licenceExpiry",

"insuranceExpiry",

"revenueExpiry"

];

if(!dateFields.every(key=>

validDate(data[key])

)){

return false;

}

const requiredText=[

"nic",

"phone",

"address",

"district",

"vehicleNumber",

"vehicleModel",

"vehicleColor",

"licenceNumber",

"insuranceNumber",

"serviceArea"

];

if(!requiredText.every(key=>

validText(data[key])

)){

return false;

}

if(!Number.isFinite(data.createdAtMs)

||data.createdAtMs<=0

||data.createdAtMs>serverNow()+30000){

return false;

}

return true;

}

// DOCUMENT EXPIRY WARNING

function updateDocumentWarning(){

if(!profile||!clockValid()){

$("documentWarning").hidden=true;

return;

}

const today=sriLankaToday();

const todayMs=Date.parse(

today+"T00:00:00Z"

);

const expiring=[

profile.licenceExpiry,

profile.insuranceExpiry,

profile.revenueExpiry

].some(value=>{

const expiry=Date.parse(

value+"T00:00:00Z"

);

const days=

(expiry-todayMs)/86400000;

return days>=0&&days<=30;

});

$("documentWarning").hidden=!expiring;

}

addProfileRow(

);

addProfileRow(

"personalDetails",

data.phone

);

addProfileRow(

"personalDetails",

"whatsapp",

data.whatsapp

);

addProfileRow(

"personalDetails",

data.address

);

addProfileRow(

"personalDetails",

"district",

data.district

);

addProfileRow(

"vehicleDetails",

t[data.vehicleType]

);

addProfileRow(

"vehicleDetails",

data.vehicleNumber,

"yellow"

);

addProfileRow(

);

addProfileRow(

);

// DRIVING LICENCE

);

);

// INSURANCE AND REVENUE LICENCE

addProfileRow(

addProfileRow(

);

// LOAD PRIVATE PROFILE FROM BACKEND

async function loadProfile(){

if(!validSession()||!driver)return;

const currentGeneration=generation;

const currentProfileGeneration=

++profileGeneration;

status(t.loading);

try{

const result=await serverCall(

"getDriverProfile"

);

if(currentGeneration!==generation

||currentProfileGeneration!==profileGeneration

||!driver){

return;

}

if(result?.success!==true

||!validProfile(result.profile)){

throw new Error("Invalid profile");

}

displayProfile(result.profile);

}catch(e){

if(currentGeneration!==generation

||currentProfileGeneration!==profileGeneration){

return;

}

clearProfile();

status(t.error);

}

}

// PROFILE CHANGE REQUEST STATUS

function subscribeLatestRequest(){

stopRequestListener();

if(!validSession()||!driver)return;

const currentGeneration=generation;

requestUnsubscribe=onSnapshot(

doc(

db,

"drivers",

uid,

"profileRequests",

"latest"

),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession()

||!driver)return;

$("requestDetails").replaceChildren();

$("requestPanel").hidden=true;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites

||!snapshot.exists()){

return;

}

const data=snapshot.data();

if(data.driverUid!==uid

||!validId(data.requestId)

||!["pending","approved","rejected"]

.includes(data.status)){

return;

}

const section=$("requestDetails");

addRow(

section,

t.requestId,

data.requestId

);

addRow(

section,

t.changeType,

t[data.changeType]||data.changeType

);

const requestStatus=

data.status==="approved"

?t.accepted

:t[data.status];

addRow(

section,

t.requestStatus,

requestStatus,

data.status==="approved"

?"green"

:data.status==="rejected"

?"red":"yellow"

);

const createdAt=

data.createdAt?.toMillis?.();

addRow(

section,

t.requestDate,

formatDate(createdAt)

);

if(typeof data.adminReason==="string"

&&data.adminReason.trim()){

addRow(

section,

t.adminReason,

data.adminReason

);

}

$("requestPanel").hidden=false;

if(data.status==="approved"){

loadProfile();

}

},

()=>{

if(currentGeneration!==generation)return;

$("requestPanel").hidden=true;

}

);

}

// FORM CONTROL

function updateControls(){

const enabled=

validSession()

&&driver!==null

&&profile!==null;

const locked=

updateBusy||passwordBusy;

[

"changeType",

"changeValue",

"changeReason",

"updateConsent",

"updateButton"

].forEach(id=>{

$(id).disabled=!enabled||locked;

});

[

"currentPassword",

"newPassword",

"confirmPassword",

"passwordButton"

].forEach(id=>{

$(id).disabled=!enabled||locked;

});

$("refreshButton").disabled=locked;

}

// REQUEST PROFILE UPDATE

const allowedChanges=[

"fullName",

"phone",

"whatsapp",

"address",

"district",

"nic",

"dob",

"vehicle",

"licence",

"insurance",

"serviceArea",

"workingTime",

"other"

];

$("updateForm").onsubmit=async event=>{

event.preventDefault();

if(!validSession()

||!driver

||!profile

||updateBusy

||passwordBusy)return;

const changeType=

$("changeType").value;

const newValue=

$("changeValue").value.trim();

const reason=

$("changeReason").value.trim();

if(!allowedChanges.includes(changeType)

||newValue.length<2

||newValue.length>500

||reason.length<5

||reason.length>500

||!$("updateConsent").checked){

$("updateStatus").textContent=

t.invalidDetails;

return;

}

if(changeType==="dob"

&&(!validDate(newValue)

||newValue>sriLankaToday())){

$("updateStatus").textContent=

t.invalidDetails;

return;

}

if(["phone","whatsapp"]

.includes(changeType)

&&!/^(?:\+94|0)7\d{8}$/.test(

newValue.replace(/[\s-]/g,"")

)){

$("updateStatus").textContent=

t.invalidDetails;

return;

}

if(!confirm(t.confirmRequest))return;

const currentGeneration=generation;

const fingerprint=JSON.stringify([

changeType,

newValue,

reason

]);

if(!pendingUpdate

||pendingUpdate.fingerprint!==fingerprint){

pendingUpdate={

fingerprint,

requestId:crypto.randomUUID()

};

}

updateBusy=true;

updateControls();

$("updateStatus").textContent=t.sending;

try{

const result=await serverCall(

"submitDriverProfileChange",

{

requestId:pendingUpdate.requestId,

changeType,

newValue,

reason,

declarationAccepted:true,

language:lang

}

);

if(currentGeneration!==generation)return;

if(result?.accepted!==true

||!validId(result.requestId)

||result.status!=="pending"){

throw new Error("Request not confirmed");

}

pendingUpdate=null;

$("updateForm").reset();

$("updateStatus").textContent=

t.requestSent;

}catch(e){

if(currentGeneration!==generation)return;

$("updateStatus").textContent=

t.requestFailed;

}finally{

if(currentGeneration===generation){

updateBusy=false;

updateControls();

}

}

};

// SHOW AND HIDE PASSWORD

document.querySelectorAll("[data-target]")

.forEach(button=>{

button.onclick=()=>{

const input=$(button.dataset.target);

const visible=input.type==="text";

input.type=visible

?"password":"text";

button.textContent=visible

?t.show:t.hide;

};

});

// CHANGE DRIVER PASSWORD

$("passwordForm").onsubmit=async event=>{

event.preventDefault();

if(!validSession()

||!driver

||!profile

||passwordBusy

||updateBusy)return;

if(driver.availability==="busy"

||driver.activeBookingId){

$("passwordStatus").textContent=

t.busyRide;

return;

}

const currentPassword=

$("currentPassword").value;

const newPassword=

$("newPassword").value;

const confirmPassword=

$("confirmPassword").value;

const length=

Array.from(newPassword).length;

if(length<15||length>128){

$("passwordStatus").textContent=

t.passwordLength;

return;

}

if(newPassword!==confirmPassword){

$("passwordStatus").textContent=

t.passwordMismatch;

return;

}

if(currentPassword===newPassword){

$("passwordStatus").textContent=

t.samePassword;

return;

}

if(!currentPassword

||currentPassword.length>128){

$("passwordStatus").textContent=

t.invalidDetails;

return;

}

if(!confirm(t.passwordConfirm))return;

const currentGeneration=generation;

passwordBusy=true;

updateControls();

$("passwordStatus").textContent=

t.sending;

try{

const result=await serverCall(

"changeDriverPassword",

{

currentPassword,

newPassword,

requestId:crypto.randomUUID()

}

);

if(currentGeneration!==generation)return;

if(result?.changed!==true){

throw new Error("Password change failed");

}

clearPasswords();

alert(t.passwordChanged);

disconnect();

await signOut(auth);

location.replace(

"./driver-login.html?lang="+lang

);

}catch(e){

if(currentGeneration!==generation)return;

clearPasswords();

$("passwordStatus").textContent=

t.passwordFailed;

}finally{

if(currentGeneration===generation){

passwordBusy=false;

updateControls();

}

}

};

// DRIVER STATUS MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

driver=null;

stopGps();

stopRequestListener();

clearProfile();

clearPasswords();

$("updateForm").reset();

pendingUpdate=null;

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true){

denyAccess();

return;

}

driver=data;

if(["online","busy"].includes(

data.availability

)){

startGps();

}else{

stopGps();

}

if(!profile){

loadProfile();

}

if(!requestUnsubscribe){

subscribeLatestRequest();

}

updateControls();

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!functions||!db){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true

||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

await syncClock();

if(currentGeneration!==generation)return;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// SERVER TIME AND SESSION UPDATE

setInterval(async()=>{

if(!validSession()||!driver)return;

const currentGeneration=generation;

try{

await syncClock();

if(currentGeneration!==generation)return;

const result=await serverCall(

"verifyDriverSession"

);

if(currentGeneration!==generation)return;

if(result?.authorized!==true

||result.uid!==uid

||result.status!=="approved"

||result.activationComplete!==true

||result.documentsValid!==true){

denyAccess();

return;

}

updateDocumentWarning();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

},60000);

// REFRESH

$("refreshButton").onclick=()=>{

if(auth&&!updateBusy&&!passwordBusy){

verifyDriver(auth.currentUser);

}

};

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

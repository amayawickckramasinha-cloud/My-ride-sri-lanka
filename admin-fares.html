<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<meta name="robots"
content="noindex,nofollow,noarchive">

<meta name="google"
content="notranslate">

<meta name="referrer"
content="no-referrer">

<title>MY RIDE - Fare Management</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:12px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.6;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:22px;
margin-top:10px;
color:#FFD600;
}

.tableWrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:470px;
}

th,td{
border:1px solid #555;
padding:8px;
text-align:center;
}

th{
background:#FFD600;
color:#111;
}

td input{
min-width:75px;
margin:0;
}

.vehiclePanel{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:12px;
margin:16px 0;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.warning{
color:#FFB347;
line-height:1.8;
}

.danger{
background:#C62828;
color:white;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

#status,#result,#saveResult{
color:#FFD600;
text-align:center;
line-height:1.8;
}

.historyItem{
background:#292929;
border:1px solid #555;
border-radius:8px;
padding:14px;
margin:10px 0;
line-height:1.8;
overflow-wrap:anywhere;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Fare Management
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>

<button data-lang="en">English</button>

<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"
role="status"
aria-live="polite">
Checking security...
</p>

<section id="accessPanel"
class="panel"
hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="currentSettings"></h3>

<div id="currentSettings"
class="grid"></div>

<p id="lastUpdate"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="timeSettings"></h3>

<label for="dayStart"
data-t="dayStart"></label>

<input id="dayStart"
type="time">

<label for="nightStart"
data-t="nightStart"></label>

<input id="nightStart"
type="time">

<p class="note"
data-t="timezone"></p>

</section>

<section class="panel">

<h3 data-t="extraSettings"></h3>

<label for="rainRate"
data-t="rainRate"></label>

<input id="rainRate"
type="number"
min="0"
max="10000"
step="0.01">

<label for="roadRate"
data-t="roadRate"></label>

<input id="roadRate"
type="number"
min="0"
max="10000"
step="0.01">

<label for="commissionRate"
data-t="commissionRate"></label>

<input id="commissionRate"
type="number"
min="0"
max="100"
step="0.01">

<p class="note"
data-t="commissionNotice"></p>

<p class="note"
data-t="verificationNotice"></p>

</section>

<section class="panel">

<h3 data-t="vehicleRates"></h3>

<p class="note"
data-t="progressiveNotice"></p>

<div id="vehicleRates"></div>

<button id="defaultButton"
class="back"
data-t="loadDefaults"></button>

<button id="restoreButton"
class="back"
data-t="restore"></button>

</section>

<section class="panel">

<h3 data-t="calculator"></h3>

<label for="testVehicle"
data-t="vehicle"></label>

<select id="testVehicle">

<option value="bike"
data-t="bike"></option>

<option value="tuk"
data-t="tuk"></option>

<option value="car"
data-t="car"></option>

<option value="van"
data-t="van"></option>

</select>

<label for="testDistance"
data-t="distance"></label>

<input id="testDistance"
type="number"
min="0.01"
max="2000"
step="0.01"
value="10">

<label for="testTime"
data-t="startTime"></label>

<input id="testTime"
type="time"
value="10:00">

<label for="testRainKm"
data-t="rainDistance"></label>

<input id="testRainKm"
type="number"
min="0"
step="0.01"
value="0">

<label for="testRoadKm"
data-t="roadDistance"></label>

<input id="testRoadKm"
type="number"
min="0"
step="0.01"
value="0">

<label for="testTolls"
data-t="tolls"></label>

<input id="testTolls"
type="number"
min="0"
step="0.01"
value="0">

<label for="testParking"
data-t="parking"></label>

<input id="testParking"
type="number"
min="0"
step="0.01"
value="0">

<button id="calculateButton"
data-t="calculate"></button>

<div id="calculationResult"
class="grid"></div>

<p class="note"
data-t="previewNotice"></p>

</section>

<section class="panel">

<h3 data-t="publishSettings"></h3>

<p class="warning"
data-t="publishWarning"></p>

<label for="changeReason"
data-t="reason"></label>

<textarea id="changeReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="publishConsent"
type="checkbox">

<span data-t="confirmPublish"></span>

</label>

<button id="publishButton"
data-t="publish"
disabled></button>

<p id="saveResult"
role="status"
aria-live="polite"></p>

</section>

<section class="panel">

<h3 data-t="history"></h3>

<div id="historyList"></div>

<button id="loadHistory"
data-t="loadHistory"></button>

<button id="moreHistory"
data-t="more"
hidden></button>

</section>

<p id="result"
role="status"
aria-live="polite"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

function isOwner(){

return authorized

&&ownerUid!==null

&&auth?.currentUser?.uid===ownerUid

&&navigator.onLine;

}

function validOwner(data,uid){

return data?.authorized===true

&&data.uid===uid

&&data.role==="owner"

&&data.ownerUidVerified===true

&&data.sessionValid===true;

}

function validNumber(value,max=10000000){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=0

&&value<=max;

}

function validMoney(value,max=10000000){

return validNumber(value,max)

&&Math.abs(value*100-Math.round(value*100))<0.000001;

}

function validVersion(value){

return Number.isSafeInteger(value)

&&value>=0;

}

function validTime(value){

return Number.isFinite(value)

&&value>0

&&value<=8640000000000000;

}

function validMinutes(value){

return Number.isInteger(value)

&&value>=0

&&value<1440;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validFareData(data){

if(!data

||!validMinutes(data.dayStartMinutes)

||!validMinutes(data.nightStartMinutes)

||data.dayStartMinutes>=data.nightStartMinutes

||!validMoney(data.rainSurchargePerKm,10000)

||!validMoney(data.difficultRoadSurchargePerKm,10000)

||!validMoney(data.commissionRate,100)

||!data.vehicles){

return false;

}

return vehicles.every(vehicle=>{

const item=data.vehicles[vehicle];

if(!item

||!validMoney(item.minimumFare)

||!Array.isArray(item.bands)

||item.bands.length!==5){

return false;

}

const first=item.bands[0];

return item.bands.every((band,index)=>{

if(!band

||band.upToKm!==limits[index]

||!validMoney(band.dayRate,10000)

||!validMoney(band.nightRate,10000)

||!validMoney(band.discountPerKm,10000)

||band.dayRate<=0

||band.nightRate<=0

||band.nightRate<band.dayRate){

return false;

}

if(index===0){

return band.discountPerKm===0;

}

const previous=item.bands[index-1];

return band.discountPerKm>=previous.discountPerKm

&&band.dayRate<=previous.dayRate

&&band.nightRate<=previous.nightRate

&&Math.abs(

first.dayRate-band.dayRate-band.discountPerKm

)<0.000001

&&Math.abs(

first.nightRate-band.nightRate-band.discountPerKm

)<0.000001;

});

});

}

function validSettings(data){

return validFareData(data)

&&validVersion(data.version)

&&typeof data.published==="boolean"

&&(data.updatedAtMs===null

||validTime(data.updatedAtMs))

&&(data.effectiveAtMs===null

||validTime(data.effectiveAtMs));

}

function formatDate(value){

if(!validTime(value))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"medium"

}

).format(new Date(value));

}

function money(value){

if(!validNumber(value,1000000000))return "—";

return new Intl.NumberFormat("en-LK",{

style:"currency",

currency:"LKR",

minimumFractionDigits:2

}).format(value);

}

function roundMoney(value){

return Math.round((value+Number.EPSILON)*100)/100;

}

function clockToMinutes(value){

if(typeof value!=="string"

||!/^([01]\d|2[0-3]):[0-5]\d$/.test(value)){

throw new Error("Invalid time");

}

const parts=value.split(":").map(Number);

return parts[0]*60+parts[1];

}

function minutesToClock(value){

if(!validMinutes(value))return "";

return String(Math.floor(value/60)).padStart(2,"0")

+":"

+String(value%60).padStart(2,"0");

}

function readNumber(id){

const element=$(id);

if(!element

||element.value.trim()===""

||!element.checkValidity()){

throw new Error("Invalid number");

}

const value=Number(element.value);

if(!Number.isFinite(value)||value<0){

throw new Error("Invalid number");

}

return value;

}

$("dayStart").value=

minutesToClock(data.dayStartMinutes);

function readDraft(){

if(!draftReady){

throw new Error("Settings unavailable");

}

const data={

dayStartMinutes:clockToMinutes($("dayStart").value),

nightStartMinutes:clockToMinutes($("nightStart").value),

rainSurchargePerKm:readNumber("rainRate"),

difficultRoadSurchargePerKm:readNumber("roadRate"),

commissionRate:readNumber("commissionRate"),

vehicles:{}

};

vehicles.forEach(vehicle=>{

data.vehicles[vehicle]={

minimumFare:readNumber(vehicle+"_minimum"),

bands:limits.map((limit,index)=>({

upToKm:limit,

dayRate:readNumber(vehicle+"_"+index+"_dayRate"),

nightRate:readNumber(vehicle+"_"+index+"_nightRate"),

discountPerKm:readNumber(vehicle+"_"+index+"_discountPerKm")

}))

};

});

if(!validFareData(data)){

throw new Error("Invalid fare settings");

}

return data;

}

function fareFingerprint(data){

return JSON.stringify([

data.dayStartMinutes,

data.nightStartMinutes,

data.rainSurchargePerKm,

data.difficultRoadSurchargePerKm,

data.commissionRate,

vehicles.map(vehicle=>[

data.vehicles[vehicle].minimumFare,

data.vehicles[vehicle].bands.map(band=>[

band.upToKm,

band.dayRate,

band.nightRate,

band.discountPerKm

])

])

]);

}

function updateDirty(){

try{

dirty=!currentSettings

||fareFingerprint(readDraft())

!==fareFingerprint(currentSettings);

}catch(e){

}

}

async function serverCall(name,data={}){

throw new Error("Unauthorized");

const currentGeneration=generation;

const response=await httpsCallable(

functions,

name,

{timeout:25000}

)(data);

if(currentGeneration!==generation

||!isOwner()){

throw new Error("Session changed");

}

return response.data;

}

function calculateFare(data,options){

const item=data.vehicles[options.vehicle];

if(!item

||!validNumber(options.distanceKm,2000)

||options.distanceKm<=0

||!validMinutes(options.startMinutes)

||!validNumber(options.rainKm,options.distanceKm)

||!validNumber(options.roadKm,options.distanceKm)

||!validMoney(options.tolls)

||!validMoney(options.parking)){

throw new Error("Invalid test values");

}

const night=

options.startMinutes<data.dayStartMinutes

||options.startMinutes>=data.nightStartMinutes;

let distanceFare=0;

let includedDiscount=0;

let previousLimit=0;

item.bands.forEach(band=>{

const upperLimit=

band.upToKm===null

?options.distanceKm

:Math.min(options.distanceKm,band.upToKm);

const bandDistance=

Math.max(0,upperLimit-previousLimit);

const rate=night

?band.nightRate

:band.dayRate;

distanceFare+=bandDistance*rate;

includedDiscount+=

bandDistance*band.discountPerKm;

if(band.upToKm!==null){

previousLimit=band.upToKm;

}

});

distanceFare=roundMoney(distanceFare);

includedDiscount=roundMoney(includedDiscount);

const rainCharge=roundMoney(

options.rainKm*data.rainSurchargePerKm

);

const roadCharge=roundMoney(

options.roadKm*data.difficultRoadSurchargePerKm

);

const subtotal=roundMoney(

distanceFare+rainCharge+roadCharge

);

const rideFare=roundMoney(

Math.max(item.minimumFare,subtotal)

);

const minimumAdjustment=roundMoney(

rideFare-subtotal

);

const commission=roundMoney(

rideFare*data.commissionRate/100

);

const driverNet=roundMoney(

rideFare-commission

);

const finalFare=roundMoney(

rideFare+options.tolls+options.parking

);

return {

period:night?"night":"day",

baseFare:distanceFare,

discount:includedDiscount,

rainCharge,

roadCharge,

minimumAdjustment,

rideFare,

finalFare,

commission,

driverNet

};

}

async function freshOwnerAuthentication(){

if(!isOwner()){

throw new Error("Unauthorized");

}

const user=auth.currentUser;

const uid=user.uid;

const provider=new GoogleAuthProvider();

provider.setCustomParameters({

prompt:"select_account"

});

const credential=

await reauthenticateWithPopup(user,provider);

if(credential.user.uid!==uid

||auth.currentUser?.uid!==uid

||!isOwner()){

throw new Error("Owner changed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Invalid owner");

}

const verified=await serverCall(

"verifyOwnerAdmin"

);

if(!validOwner(verified,uid)){

throw new Error("Owner verification failed");

}

}

$("publishButton").onclick=async()=>{

if(!isOwner()

||busy

||mutationBusy

||!currentSettings

||!dirty

||!$("publishConsent").checked)return;

let data;

try{

data=readDraft();

}catch(e){

saveResult("invalid");

return;

}

const reason=$("changeReason").value.trim();

if(reason.length<10||reason.length>500){

saveResult("invalidReason");

return;

}

const expectedVersion=currentSettings.version;

const fingerprint=JSON.stringify([

expectedVersion,

fareFingerprint(data),

reason

]);

if(!pendingRequestId

||pendingFingerprint!==fingerprint){

pendingRequestId=crypto.randomUUID();

pendingFingerprint=fingerprint;

}

const requestId=pendingRequestId;

const currentGeneration=generation;

mutationBusy=true;

updateControls();

saveResult("saving");

try{

await freshOwnerAuthentication();

const response=await serverCall(

"publishAdminFareSettings",

{

settings:data,

reason,

expectedVersion,

requestId,

applyTo:"future_confirmed_bookings"

}

);

if(response?.success!==true

||response.ownerUid!==ownerUid

||!validSettings(response.settings)

||response.settings.published!==true

||response.settings.version<=expectedVersion

||fareFingerprint(response.settings)

!==fareFingerprint(data)

||!validTime(response.settings.effectiveAtMs)){

throw new Error("Publication not confirmed");

}

currentSettings=response.settings;

populateEditor(currentSettings);

dirty=false;

pendingRequestId=null;

pendingFingerprint=null;

$("publishConsent").checked=false;

$("changeReason").value="";

renderCurrentSettings();

saveResult("saved");

historyRecords=[];

historyCursor=null;

historyLoaded=false;

renderHistory();

}catch(e){

if(currentGeneration===generation){

saveResult("saveError");

$("publishConsent").checked=false;

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

}

}

};

function validHistory(record){

return record

&&validId(record.recordId)

&&validVersion(record.version)

&&validTime(record.createdAtMs)

&&validTime(record.effectiveAtMs)

&&typeof record.reason==="string"

&&record.reason.length<=500

&&validMoney(record.commissionRate,100)

&&validMoney(record.rainSurchargePerKm,10000)

&&validMoney(record.difficultRoadSurchargePerKm,10000);

}

function renderHistory(){

const container=$("historyList");

container.replaceChildren();

$("moreHistory").hidden=historyCursor===null;

if(!isOwner()||!historyLoaded)return;

if(!historyRecords.length){

container.textContent=t("noHistory");

return;

}

historyRecords.forEach(record=>{

const panel=document.createElement("div");

panel.className="historyItem";

const title=document.createElement("strong");

title.textContent=

t("version")+": "+record.version;

panel.appendChild(title);

addLine(

panel,

"updated",

formatDate(record.createdAtMs)

);

addLine(

panel,

"effective",

formatDate(record.effectiveAtMs)

);

addLine(

panel,

"reason",

record.reason

);

addLine(

panel,

"commissionRate",

record.commissionRate+"%"

);

addLine(

panel,

"rainRate",

money(record.rainSurchargePerKm)

);

addLine(

panel,

"roadRate",

money(record.difficultRoadSurchargePerKm)

);

container.appendChild(panel);

});

}

async function loadFareHistory(reset=true){

if(!isOwner()||busy||mutationBusy)return;

const currentGeneration=generation;

busy=true;

updateControls();

result("loading");

try{

const response=await serverCall(

"getAdminFareHistory",

{

limit:20,

cursor:reset?null:historyCursor

}

);

if(response?.success!==true

||response.ownerUid!==ownerUid

||!Array.isArray(response.records)

||response.records.length>20

||!response.records.every(validHistory)

||!(response.nextCursor===null

||typeof response.nextCursor==="string")){

throw new Error("Invalid history");

}

const unique=new Map(

(reset?[]:historyRecords)

.map(record=>[record.recordId,record])

);

response.records.forEach(record=>{

unique.set(record.recordId,record);

});

historyRecords=[...unique.values()];

historyCursor=response.nextCursor;

historyLoaded=true;

renderHistory();

result("");

}catch(e){

if(currentGeneration===generation){

historyRecords=[];

historyCursor=null;

historyLoaded=false;

renderHistory();

result("error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

}

$("loadHistory").onclick=()=>{

loadFareHistory(true);

};

$("moreHistory").onclick=()=>{

if(historyCursor!==null){

loadFareHistory(false);

}

};

dirty=false;

"dayStart",

"rainRate",

"roadRate",

"commissionRate"

].forEach(id=>{

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

status("denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

status("offline");

return;

}

status("checking");

try{

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

status("verified");

await refreshSettings();

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(

auth,

verifyOwner

);

}catch(e){

denyAccess();

}

}

let checking=false;

setInterval(async()=>{

if(!isOwner()||checking||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await serverCall(

"verifyOwnerAdmin"

);

if(!validOwner(response,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

window.addEventListener("offline",()=>{

clearSession();

status("offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener(

"beforeunload",

event=>{

if(dirty||mutationBusy){

event.preventDefault();

event.returnValue="";

}

}

);

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

}

);

renderLanguage();

updateControls();

initializeSecurity();

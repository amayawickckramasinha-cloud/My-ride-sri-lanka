<title>MY RIDE - Driver Help</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.supportIcon{
width:85px;
height:85px;
border-radius:50%;
background:#FFD600;
color:#111;
display:flex;
align-items:center;
justify-content:center;
margin:15px auto;
}

.center{
text-align:center;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.7;
}

.row span{
color:#CCC;
}

.row strong{
text-align:right;
max-width:60%;
overflow-wrap:anywhere;
}

.yellow{
color:#FFD600;
}

.green{
color:#4ADE80;
}

.red{
color:#FF6464;
}

.action{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.whatsapp{
background:#25D366;
color:#111;
}

.emergency{
background:#A91D1D;
color:#fff;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.8;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:15px;
color:#FFB4B4;
line-height:1.8;
margin:15px 0;
}

label{
display:block;
margin-top:16px;
margin-bottom:8px;
font-size:14px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:14px;
background:#292929;
color:#fff;
border:1px solid #555;
border-radius:9px;
font-size:16px;
}

textarea{
min-height:130px;
resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
outline:2px solid #FFD600;
}

details{
background:#292929;
border:1px solid #444;
border-radius:9px;
margin:10px 0;
}

summary{
padding:15px;
cursor:pointer;
color:#FFD600;
font-weight:bold;
line-height:1.8;
}

.answer{
padding:0 15px 15px;
font-size:14px;
line-height:1.9;
color:#DDD;
}

#status,
#contactStatus,
#messageStatus{
text-align:center;
color:#FFD600;
line-height:1.8;
}

button:disabled,
input:disabled,
select:disabled,
textarea:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>

</head>

termsLink:"driver-terms.html",
accountLink:"driver-account-status.html",
sosLink:"driver-sos.html"

};

Object.entries(links).forEach(([id,page])=>{

$(id).href="./"+page+"?lang="+lang;

});

// FIREBASE CONFIGURATION

const firebaseConfig={

apiKey:"AIzaSyDzrAZ7sc-c7CYIIwOpsiC9xdCPNHO7Km4",

authDomain:"my-ride-sri-lanka.firebaseapp.com",

projectId:"my-ride-sri-lanka",

storageBucket:"my-ride-sri-lanka.firebasestorage.app",

messagingSenderId:"88909447786",

appId:"1:88909447786:web:f8f7b8ccce99ea390a4013"

};

let auth=null;
let db=null;
let functions=null;

let uid=null;
let driver=null;
let authorized=false;

let generation=0;

let driverUnsubscribe=null;
let settingsUnsubscribe=null;

let supportSettings=null;

let gpsWatch=null;
let gpsSending=false;
let lastGpsSent=0;

let checkingSession=false;

const CATEGORIES={

booking:"bookingIssue",
gps:"gpsIssue",
payment:"paymentIssue",
commission:"commissionIssue",
fare:"fareIssue",
account:"accountIssue",
technical:"technicalIssue",
other:"other"

};

function status(message){

$("status").textContent=message;

}

try{

const app=initializeApp(firebaseConfig);

initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

db=getFirestore(app);

functions=getFunctions(app);

}catch(e){

status(t.error);

}

// SECURITY VALIDATION

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,min,max){

return typeof value==="string"

&&value.trim().length>=min

&&value.length<=max;

}

function normalizePhone(value){

if(typeof value!=="string"){

return null;

}

const phone=value.replace(/[\s()-]/g,"");

if(!/^\+[1-9]\d{7,14}$/.test(phone)){

return null;

}

return phone;

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// GPS CONTINUITY

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const c=position.coords;

if(!validSession()

||!driver

||!["online","busy"].includes(

driver.availability

)

||!Number.isFinite(c.latitude)

||!Number.isFinite(c.longitude)

||!Number.isFinite(c.accuracy)

||c.accuracy<0

||c.accuracy>100

||c.latitude<5.85

||c.latitude>9.9

||c.longitude<79.5

||c.longitude>82

||Date.now()-position.timestamp>30000

||position.timestamp>Date.now()+5000

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

{

lat:c.latitude,

lon:c.longitude,

accuracy:c.accuracy,

capturedAtMs:position.timestamp

}

);

}catch(e){

// Backend must expire stale GPS records.

}finally{

gpsSending=false;

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// CLEAR SUPPORT CONTACTS

function clearContacts(){

supportSettings=null;

$("supportPhone").textContent="—";

$("supportWhatsApp").textContent="—";

$("workingHours").textContent="—";

$("supportStatus").textContent=t.unknown;

$("supportStatus").className="";

$("callButton").hidden=true;

$("callButton").removeAttribute("href");

$("whatsappButton").hidden=true;

$("whatsappButton").removeAttribute("href");

$("sendButton").disabled=true;

$("contactStatus").textContent="";

}

function stopSettingsListener(){

if(settingsUnsubscribe){

settingsUnsubscribe();

settingsUnsubscribe=null;

}

clearContacts();

}

function disconnect(){

generation++;

authorized=false;

uid=null;

driver=null;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

stopSettingsListener();

stopGps();

$("driverName").textContent="—";

$("driverId").textContent="—";

$("helpForm").reset();

$("messageStatus").textContent="";

$("content").hidden=true;

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// SUPPORT SETTINGS VALIDATION

function validSettings(data){

if(!data

||typeof data.enabled!=="boolean"

||typeof data.callEnabled!=="boolean"

||typeof data.whatsappEnabled!=="boolean"){

return false;

}

if(data.callEnabled

&&!normalizePhone(data.phone)){

return false;

}

if(data.whatsappEnabled

&&!normalizePhone(data.whatsapp)){

return false;

}

if(data.workingHours!==undefined

&&(

typeof data.workingHours!=="object"

||data.workingHours===null

||Array.isArray(data.workingHours)

)){

return false;

}

if(data.supportAvailable!==undefined

&&typeof data.supportAvailable!=="boolean"){

return false;

}

return true;

}

// WHATSAPP MESSAGE BUILDER

function whatsappUrl(phone,message){

const normalized=normalizePhone(phone);

if(!normalized){

throw new Error("Invalid phone number");

}

return "https://wa.me/"

+normalized.slice(1)

+"?text="

+encodeURIComponent(message);

}

function basicMessage(){

if(!driver)return "";

return [

"MY RIDE SRI LANKA",

t.supportRequest,

"",

t.driverName+": "+driver.fullName,

"Driver ID: "+driver.driverId

].join("\n");

}

// DISPLAY SUPPORT SETTINGS

function displaySettings(data){

clearContacts();

if(!validSettings(data)

||data.enabled!==true){

$("contactStatus").textContent=

t.notConfigured;

return;

}

supportSettings=data;

const phone=normalizePhone(data.phone);

const whatsapp=normalizePhone(data.whatsapp);

if(data.callEnabled&&phone){

$("supportPhone").textContent=phone;

$("callButton").href="tel:"+phone;

$("callButton").hidden=false;

}

if(data.whatsappEnabled&&whatsapp){

$("supportWhatsApp").textContent=whatsapp;

$("whatsappButton").href=

whatsappUrl(

whatsapp,

basicMessage()

);

$("whatsappButton").hidden=false;

$("sendButton").disabled=false;

}

const hours=

data.workingHours?.[lang]

||data.workingHours?.en;

$("workingHours").textContent=

validText(hours,1,200)

?hours:"—";

if(data.supportAvailable===true){

$("supportStatus").textContent=

t.available;

$("supportStatus").className="green";

}else if(data.supportAvailable===false){

$("supportStatus").textContent=

t.unavailable;

$("supportStatus").className="red";

}else{

$("supportStatus").textContent=

t.unknown;

}

if(!data.callEnabled

&&!data.whatsappEnabled){

$("contactStatus").textContent=

t.notConfigured;

}

}

// LIVE SUPPORT SETTINGS

function subscribeSettings(){

stopSettingsListener();

if(!validSession()||!driver)return;

const currentGeneration=generation;

$("contactStatus").textContent=t.loading;

settingsUnsubscribe=onSnapshot(

doc(

db,

"publicSettings",

"driverSupport"

),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession()

||!driver)return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

clearContacts();

$("contactStatus").textContent=

t.loading;

return;

}

if(!snapshot.exists()){

clearContacts();

$("contactStatus").textContent=

t.notConfigured;

return;

}

displaySettings(snapshot.data());

},

()=>{

if(currentGeneration!==generation)return;

clearContacts();

$("contactStatus").textContent=

t.error;

}

);

}

// WHATSAPP SUPPORT FORM

$("helpForm").onsubmit=event=>{

event.preventDefault();

if(!validSession()

||!driver

||!supportSettings

||supportSettings.enabled!==true

||supportSettings.whatsappEnabled!==true){

$("messageStatus").textContent=

t.notReady;

return;

}

const category=$("category").value;

const bookingId=

$("bookingId").value.trim();

const message=

$("message").value.trim();

if(!Object.prototype.hasOwnProperty.call(

CATEGORIES,

category

)

||!validText(message,5,1000)){

$("messageStatus").textContent=

t.invalid;

return;

}

if(bookingId&&!validId(bookingId)){

$("messageStatus").textContent=

t.invalidBooking;

return;

}

const whatsapp=

normalizePhone(supportSettings.whatsapp);

if(!whatsapp){

$("messageStatus").textContent=

t.notReady;

return;

}

const lines=[

"MY RIDE SRI LANKA",

t.supportRequest,

"",

t.driverName+": "+driver.fullName,

"Driver ID: "+driver.driverId,

t.category+": "+t[CATEGORIES[category]]

];

if(bookingId){

lines.push(

"Booking ID: "+bookingId

);

}

lines.push(

"",

t.message+":",

message

);

const fullMessage=lines.join("\n");

const url=whatsappUrl(

whatsapp,

fullMessage

);

$("messageStatus").textContent=

t.messageOpened;

window.location.assign(url);

};

// CONTACT BUTTON SECURITY

$("callButton").addEventListener(

"click",

event=>{

if(!validSession()

||!driver

||supportSettings?.enabled!==true

||supportSettings?.callEnabled!==true

||!normalizePhone(supportSettings.phone)){

event.preventDefault();

}

}

);

$("whatsappButton").addEventListener(

"click",

event=>{

if(!validSession()

||!driver

||supportSettings?.enabled!==true

||supportSettings?.whatsappEnabled!==true

||!normalizePhone(supportSettings.whatsapp)){

event.preventDefault();

}

}

);

// DRIVER ACCOUNT MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

driver=null;

stopGps();

stopSettingsListener();

$("helpForm").reset();

$("content").hidden=true;

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true

||!validText(data.fullName,1,150)

||!validId(data.driverId)){

denyAccess();

return;

}

const firstLoad=driver===null;

driver=data;

$("driverName").textContent=

data.fullName;

$("driverId").textContent=

data.driverId;

$("content").hidden=false;

$("accessPanel").hidden=true;

if(["online","busy"].includes(

data.availability

)){

startGps();

}else{

stopGps();

}

if(firstLoad||!settingsUnsubscribe){

subscribeSettings();

}else if(supportSettings){

displaySettings(supportSettings);

}

status("");

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// APPROVED DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!db||!functions){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true

||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// AUTOMATIC SESSION VERIFICATION

setInterval(async()=>{

if(!validSession()

||!driver

||checkingSession)return;

const currentGeneration=generation;

checkingSession=true;

try{

const result=await serverCall(

"verifyDriverSession"

);

if(currentGeneration!==generation)return;

if(result?.authorized!==true

||result.uid!==uid

||result.status!=="approved"

||result.activationComplete!==true

||result.documentsValid!==true){

denyAccess();

return;

}

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

checkingSession=false;

}

},60000);

// REFRESH SUPPORT SETTINGS

$("refreshButton").onclick=()=>{

if(validSession()&&driver){

subscribeSettings();

}else if(auth){

verifyDriver(auth.currentUser);

}

};

// INTERNET CONNECTION MONITORING

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<meta name="robots"
content="noindex,nofollow,noarchive">

<meta name="google"
content="notranslate">

<title>MY RIDE - Booking Management</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:110px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
}

.stat strong{
display:block;
font-size:26px;
margin-top:10px;
color:#FFD600;
}

.booking{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.8;
overflow-wrap:anywhere;
}

.bookingId{
font-size:19px;
font-weight:bold;
color:#FFD600;
}

.completed,.paid,.accepted{
color:#55E68A;
}

.active,.arrived,.searching,.offered,.scheduled{
color:#FFB347;
}

.cancelled,.no_driver,.rejected{
color:#FF7777;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

#status,#result,#actionResult{
color:#FFD600;
text-align:center;
line-height:1.8;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.danger{
background:#C62828;
color:white;
}

.warning{
background:#FF9800;
color:#111;
}

.whatsapp{
background:#25D366;
color:#111;
}

.sectionTitle{
color:#FFD600;
font-weight:bold;
margin-top:18px;
border-bottom:1px solid #555;
padding-bottom:8px;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
line-height:1.6;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Booking Management
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>

<section class="panel">

<h3 data-t="statistics"></h3>

</section>

<section class="panel">

<h3 data-t="searchBookings"></h3>

<label for="searchInput"

<input id="searchInput"
type="search"

<label for="statusFilter"

<select id="statusFilter">

<option value="all"

<option value="confirmed"
data-t="confirmed"></option>

<option value="searching"
data-t="searching"></option>

<option value="offered"
data-t="offered"></option>

<option value="accepted"
data-t="accepted"></option>

<option value="scheduled"
data-t="scheduled"></option>

<option value="arrived"
data-t="arrived"></option>

<option value="active"
data-t="active"></option>

<option value="completed"
data-t="completed"></option>

<option value="no_driver"
data-t="no_driver"></option>

<option value="cancelled"
data-t="cancelled"></option>

</select>

<label for="vehicleFilter"
data-t="vehicle"></label>

<select id="vehicleFilter">

<option value="all"
data-t="all"></option>

<option value="bike"
data-t="bike"></option>

<option value="tuk"
data-t="tuk"></option>

<option value="car"
data-t="car"></option>

<option value="van"
data-t="van"></option>

</select>

<label for="fromDate"
data-t="fromDate"></label>

<input id="fromDate"
type="date">

<label for="toDate"
data-t="toDate"></label>

<input id="toDate"
type="date">

<button id="searchButton"
data-t="search"></button>

<button id="resetButton"
data-t="reset"></button>

</section>

<section class="panel">

<h3 data-t="bookingList"></h3>

<p id="recordCount"
class="note"></p>

<div id="bookingList"></div>

<button id="loadMore"
data-t="more"
hidden></button>

</section>

<section id="detailsPanel"
class="panel"
hidden>

<h3 data-t="bookingDetails"></h3>

<div id="bookingDetails"></div>

<button id="reassignButton"
class="warning"
data-t="reassign"
hidden></button>

<button id="cancelButton"
class="danger"
data-t="emergencyCancel"
hidden></button>

<button id="closeDetails"
class="back"
data-t="close"></button>

</section>

<section id="actionPanel"
class="panel"
hidden>

<h3 id="actionHeading"></h3>

<p id="actionWarning"
class="note"></p>

<label for="actionReason"
data-t="reason"></label>

<textarea id="actionReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="actionConsent"
type="checkbox">

<span data-t="confirmAction"></span>

</label>

<button id="confirmActionButton"
class="danger"
data-t="continueAction"
disabled></button>

<button id="closeAction"
class="back"
data-t="close"></button>

<p id="actionResult"
role="status"
aria-live="polite"></p>

</section>

<p id="result"
role="status"
aria-live="polite"></p>

<p id="lastUpdate"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

function validId(value){

return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validPhone(value){

return typeof value==="string"
&&/^\+[1-9]\d{7,14}$/.test(value);

}

function validText(value,max){

return typeof value==="string"
&&value.length<=max;

}

function validCount(value){

return Number.isSafeInteger(value)
&&value>=0;

}

function validNumber(value){

return Number.isFinite(value)
&&value>=0;

}

function nullableNumber(value){

return value===null||validNumber(value);

}

function validTime(value){

return Number.isFinite(value)
&&value>0
&&value<=8640000000000000;

}

function validDate(value){

if(typeof value!=="string"
||!/^\d{4}-\d{2}-\d{2}$/.test(value)){

return false;

}

const date=new Date(value+"T00:00:00Z");

return Number.isFinite(date.getTime())
&&date.toISOString().slice(0,10)===value;

}

function validClock(value){

return typeof value==="string"
&&/^([01]\d|2[0-3]):[0-5]\d$/.test(value);

}

function formatDate(value){

if(!validTime(value))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":
lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",
dateStyle:"medium",
timeStyle:"medium"

}

).format(new Date(value));

}

function money(value){

if(!validNumber(value))return "—";

return new Intl.NumberFormat("en-LK",{

style:"currency",
currency:"LKR",
minimumFractionDigits:2

}).format(value);

}

function distance(value){

if(!validNumber(value))return "—";

return (value/1000).toFixed(2)+" KM";

}

function validBooking(record){

return record

&&validId(record.bookingId)

&&bookingStatuses.includes(record.status)

&&vehicles.includes(record.vehicleType)

&&validText(record.customerName,150)

&&validPhone(record.customerPhone)

&&validText(record.pickupName,500)

&&validText(record.destinationName,500)

&&validDate(record.date)

&&validClock(record.time)

&&Number.isSafeInteger(record.passengers)

&&record.passengers>=1

&&record.passengers<=10

&&nullableNumber(record.estimatedFare)

&&nullableNumber(record.finalFare)

&&validCount(record.revision)

&&validTime(record.createdAtMs)

&&validTime(record.updatedAtMs);

}

function validDriver(driver){

return driver===null

||(

driver

&&validId(driver.uid)

&&validId(driver.driverId)

&&validText(driver.name,150)

&&validPhone(driver.phone)

&&(driver.whatsapp===null

||validPhone(driver.whatsapp))

);

}

function validDetails(record){

return validBooking(record)

&&validDriver(record.assignedDriver)

&&nullableNumber(record.estimatedDistanceMeters)

&&nullableNumber(record.actualDistanceMeters)

&&nullableNumber(record.durationSeconds)

&&nullableNumber(record.commissionAmount)

&&nullableNumber(record.driverNet)

&&(record.customerWhatsapp===null

||validPhone(record.customerWhatsapp))

&&paymentStatuses.includes(record.paymentStatus)

&&[null,"cash","bank"].includes(record.paymentMethod)

&&(record.cancelReason===null

||validText(record.cancelReason,500))

&&typeof record.canCancel==="boolean"

&&typeof record.canReassign==="boolean";

}

if(

search.length>100

||!["all",...vehicles].includes(vehicle)

||(fromDate!==null&&!validDate(fromDate))

||(toDate!==null&&!validDate(toDate))

||(fromDate&&toDate&&fromDate>toDate)

){

throw new Error("Invalid filters");

}

vehicle,

fromDate,

toDate

};

async function loadBookings(reset=true){

);

if(

response?.success!==true

||!response.records.every(validBooking)

||!(response.nextCursor===null

||typeof response.nextCursor==="string")

||!validTime(response.serverTimeMs)

){

throw new Error("Invalid records");

}

const unique=new Map(

(reset?[]:records)

.map(record=>[record.bookingId,record])

);

response.records.forEach(record=>{

unique.set(record.bookingId,record);

});

records=[...unique.values()];

cursor=response.nextCursor;

lastSync=response.serverTimeMs;

renderBookings();

renderLastSync();

}

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

renderBookings();

}

}

}

$("searchButton").onclick=()=>{

closeDetails();

refreshBookings(true);

};

$("searchInput").addEventListener(

"keydown",

event=>{

if(event.key==="Enter"){

closeDetails();

refreshBookings(true);

}

}

);

$("resetButton").onclick=()=>{

$("searchInput").value="";

$("statusFilter").value="all";

$("vehicleFilter").value="all";

$("fromDate").value="";

$("toDate").value="";

closeDetails();

refreshBookings(true);

};

$("loadMore").onclick=()=>{

if(cursor!==null){

refreshBookings(false);

}

};

$("refreshButton").onclick=()=>{

closeDetails();

refreshBookings(true);

};

function cancellable(record){

return record?.canCancel===true

&&[

"confirmed",
"searching",
"offered",
"accepted",
"scheduled",
"arrived",
"no_driver"

].includes(record.status);

}

function reassignable(record){

return record?.canReassign===true

&&[

"confirmed",
"searching",
"offered",
"accepted",
"scheduled",
"no_driver"

].includes(record.status);

}

function renderDetails(){

const container=$("bookingDetails");

container.replaceChildren();

if(!selectedBooking||!isOwner()){

$("detailsPanel").hidden=true;

return;

}

const record=selectedBooking;

$("detailsPanel").hidden=false;

addLine(container,"bookingId",record.bookingId);

addLine(container,"bookingStatus",t(record.status));

addLine(container,"created",

formatDate(record.createdAtMs));

addLine(container,"updated",

formatDate(record.updatedAtMs));

addTitle(container,"customer");

addLine(container,"customerName",record.customerName);

addLine(container,"customerPhone",record.customerPhone);

container.appendChild(

makeAction(

"callCustomer",

"tel:"+record.customerPhone

)

);

if(record.customerWhatsapp){

const link=makeAction(

"whatsapp",

"https://wa.me/"

+record.customerWhatsapp.slice(1),

"whatsapp"

);

link.target="_blank";

link.rel="noopener noreferrer";

container.appendChild(link);

}

addTitle(container,"driver");

if(record.assignedDriver){

const driver=record.assignedDriver;

addLine(container,"driverName",driver.name);

addLine(container,"driverId",driver.driverId);

addLine(container,"driverPhone",driver.phone);

container.appendChild(

makeAction(

"callDriver",

"tel:"+driver.phone

)

);

if(driver.whatsapp){

const link=makeAction(

"whatsapp",

"https://wa.me/"+driver.whatsapp.slice(1),

"whatsapp"

);

link.target="_blank";

link.rel="noopener noreferrer";

container.appendChild(link);

}

}else{

const line=document.createElement("p");

line.textContent=t("notAssigned");

container.appendChild(line);

}

addTitle(container,"bookingDetails");

addLine(container,"vehicle",t(record.vehicleType));

addLine(container,"pickup",record.pickupName);

addLine(container,"destination",record.destinationName);

addLine(container,"date",record.date);

addLine(container,"time",record.time);

addLine(container,"passengers",record.passengers);

addLine(container,"estimatedDistance",

distance(record.estimatedDistanceMeters));

addLine(container,"actualDistance",

distance(record.actualDistanceMeters));

addLine(container,"duration",

record.durationSeconds===null

?"—"

:(record.durationSeconds/60).toFixed(1)

+" "+t("minutes"));

addTitle(container,"payment");

addLine(container,"estimatedFare",

money(record.estimatedFare));

addLine(container,"finalFare",

money(record.finalFare));

addLine(container,"commission",

money(record.commissionAmount));

addLine(container,"driverNet",

money(record.driverNet));

addLine(container,"payment",

t(record.paymentStatus));

addLine(container,"paymentMethod",

record.paymentMethod

?t(record.paymentMethod)

:"—");

if(record.cancelReason){

addLine(container,"cancelReason",

record.cancelReason);

}

if(record.status==="active"){

const notice=document.createElement("p");

notice.className="note";

notice.textContent=t("activeNotice");

container.appendChild(notice);

}

$("cancelButton").hidden=!cancellable(record);

$("reassignButton").hidden=!reassignable(record);

updateControls();

}

async function fetchBooking(bookingId){

if(!validId(bookingId)){

throw new Error("Invalid booking ID");

}

const response=await serverCall(

"getAdminBookingDetails",

{bookingId}

);

if(

response?.success!==true

||response.ownerUid!==ownerUid

||!validDetails(response.booking)

||response.booking.bookingId!==bookingId

){

throw new Error("Invalid booking details");

}

return response.booking;

}

async function openBooking(bookingId){

if(!isOwner()||busy||mutationBusy)return;

const currentGeneration=generation;

closeDetails();

busy=true;

updateControls();

result("loading");

try{

selectedBooking=await fetchBooking(bookingId);

renderDetails();

result("");

$("detailsPanel").scrollIntoView({

behavior:"smooth",

block:"start"

});

}catch(e){

if(currentGeneration===generation){

selectedBooking=null;

renderDetails();

result("error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

renderBookings();

}

}

}

function closeAction(force=false){

if(mutationBusy&&!force)return;

selectedAction=null;

pendingRequestId=null;

$("actionPanel").hidden=true;

$("actionReason").value="";

$("actionConsent").checked=false;

actionResult("");

updateControls();

}

function closeDetails(force=false){

if(mutationBusy&&!force)return;

closeAction(force);

selectedBooking=null;

$("detailsPanel").hidden=true;

$("bookingDetails").replaceChildren();

$("cancelButton").hidden=true;

$("reassignButton").hidden=true;

}

$("closeDetails").onclick=()=>closeDetails();

$("closeAction").onclick=()=>closeAction();

function renderAction(){

if(!selectedAction

||!selectedBooking

||!isOwner()){

$("actionPanel").hidden=true;

return;

}

$("actionPanel").hidden=false;

$("actionHeading").textContent=

t(selectedAction==="cancel"

?"emergencyCancel"

:"reassign");

$("actionWarning").textContent=

t(selectedAction==="cancel"

?"cancelWarning"

:"reassignWarning");

updateControls();

}

function openAction(action){

if(!isOwner()

||busy

||mutationBusy

||!selectedBooking)return;

if(action==="cancel"

&&!cancellable(selectedBooking))return;

if(action==="reassign"

&&!reassignable(selectedBooking))return;

closeAction();

selectedAction=action;

pendingRequestId=crypto.randomUUID();

renderAction();

$("actionPanel").scrollIntoView({

behavior:"smooth",

block:"start"

});

}

$("cancelButton").onclick=()=>{

openAction("cancel");

};

$("reassignButton").onclick=()=>{

openAction("reassign");

};

$("actionReason").addEventListener(

"input",

updateControls

);

$("actionConsent").addEventListener(

"change",

updateControls

);

async function freshOwnerAuthentication(){

if(!isOwner()){

throw new Error("Unauthorized");

}

const user=auth.currentUser;

const uid=user.uid;

const provider=new GoogleAuthProvider();

provider.setCustomParameters({

prompt:"select_account"

});

const credential=

await reauthenticateWithPopup(

user,

provider

);

if(credential.user.uid!==uid

||auth.currentUser?.uid!==uid

||!isOwner()){

throw new Error("Owner changed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Invalid owner");

}

const verified=await serverCall(

"verifyOwnerAdmin"

);

if(!validOwner(verified,uid)){

throw new Error("Owner verification failed");

}

}

$("confirmActionButton").onclick=async()=>{

if(!isOwner()

||busy

||mutationBusy

||!selectedBooking

||!selectedAction

||!pendingRequestId)return;

const reason=$("actionReason").value.trim();

if(reason.length<10||reason.length>500){

actionResult("invalidReason");

return;

}

if(!$("actionConsent").checked)return;

const currentGeneration=generation;

const bookingId=selectedBooking.bookingId;

const expectedRevision=selectedBooking.revision;

const action=selectedAction;

const requestId=pendingRequestId;

if(action==="cancel"

&&!cancellable(selectedBooking))return;

if(action==="reassign"

&&!reassignable(selectedBooking))return;

mutationBusy=true;

updateControls();

renderBookings();

actionResult("processing");

try{

await freshOwnerAuthentication();

const latest=await fetchBooking(bookingId);

if(latest.revision!==expectedRevision){

throw new Error("Booking changed");

}

if(action==="cancel"

&&!cancellable(latest)){

throw new Error("Cancellation unavailable");

}

if(action==="reassign"

&&!reassignable(latest)){

throw new Error("Reassignment unavailable");

}

const functionName=

action==="cancel"

?"adminEmergencyCancelBooking"

:"adminReassignBooking";

const response=await serverCall(

functionName,

{

bookingId,

reason,

expectedRevision,

requestId

}

);

if(

response?.success!==true

||response.ownerUid!==ownerUid

||response.bookingId!==bookingId

||!validCount(response.revision)

||response.revision<=expectedRevision

){

throw new Error("Action not confirmed");

}

closeAction(true);

result("success");

try{

selectedBooking=await fetchBooking(bookingId);

renderDetails();

await loadBookings(true);

}catch(e){

closeDetails(true);

records=[];

cursor=null;

renderBookings();

result("error");

}

}catch(e){

if(currentGeneration===generation){

actionResult("actionError");

try{

selectedBooking=await fetchBooking(bookingId);

renderDetails();

}catch(error){

closeDetails(true);

result("error");

}

if(selectedBooking

&&selectedBooking.revision!==expectedRevision){

closeAction(true);

result("actionError");

}

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

renderBookings();

}

}

};

function startLiveUpdates(){

if(refreshTimer){

clearInterval(refreshTimer);

}

refreshTimer=setInterval(async()=>{

if(!isOwner()

||busy

||mutationBusy

||selectedAction

||document.hidden)return;

const currentGeneration=generation;

busy=true;

updateControls();

try{

await loadBookings(true);

if(selectedBooking){

selectedBooking=await fetchBooking(

selectedBooking.bookingId

);

renderDetails();

}

}catch(e){

if(currentGeneration===generation){

records=[];

cursor=null;

lastSync=null;

closeDetails(true);

renderBookings();

renderLastSync();

result("error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

renderBookings();

}

}

},30000);

}

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

records=[];

statistics=null;

cursor=null;

lastSync=null;

busy=false;

mutationBusy=false;

if(unsubscribe){

unsubscribe();

unsubscribe=null;

}

if(refreshTimer){

clearInterval(refreshTimer);

refreshTimer=null;

}

closeDetails(true);

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("bookingList").replaceChildren();

$("recordCount").textContent="";

$("lastUpdate").textContent="";

$("loadMore").hidden=true;

$("searchInput").value="";

$("statusFilter").value="all";

$("vehicleFilter").value="all";

$("fromDate").value="";

$("toDate").value="";

filters={

search:"",
status:"all",
vehicle:"all",
fromDate:null,
toDate:null

};

result("");

renderStatistics();

updateControls();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

status("denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

status("offlineInternet");

return;

}

status("checking");

try{

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

status("verified");

subscribeStatistics();

await refreshBookings(true);

if(currentGeneration===generation

&&isOwner()){

startLiveUpdates();

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

db=getFirestore(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(

auth,

verifyOwner

);

}catch(e){

denyAccess();

}

}

let checking=false;

setInterval(async()=>{

if(!isOwner()||checking)return;

const currentGeneration=generation;

checking=true;

try{

const response=await serverCall(

"verifyOwnerAdmin"

);

if(!validOwner(response,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

window.addEventListener("offline",()=>{

clearSession();

status("offlineInternet");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

}

);

document.addEventListener(

"visibilitychange",

()=>{

if(!document.hidden

&&isOwner()

&&!selectedAction

&&!mutationBusy){

refreshBookings(true);

}

}

);

renderLanguage();

updateControls();

initializeSecurity();

</script>

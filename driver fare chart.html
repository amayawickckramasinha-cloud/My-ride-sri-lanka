
<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<meta name="robots"
content="noindex,nofollow">

<meta name="google"
content="notranslate">

<meta name="referrer"
content="no-referrer">

<title>MY RIDE - Driver Fare Chart</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:850px;
margin:auto;
padding:15px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.fareIcon{
width:90px;
height:90px;
background:#FFD600;
color:#111;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:20px auto;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:15px;
margin:15px 0;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.8;
}

.row span{
color:#CCC;
}

.row strong{
text-align:right;
max-width:60%;
overflow-wrap:anywhere;
}

.stats{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border:1px solid #555;
border-radius:12px;
padding:18px 8px;
text-align:center;
}

.stat strong{
display:block;
font-size:23px;
color:#FFD600;
margin-bottom:10px;
}

.stat span{
font-size:13px;
line-height:1.8;
}

.vehicleCard{
background:#202020;
border:1px solid #555;
border-radius:14px;
padding:14px;
margin:20px 0;
}

.vehicleHeading{
background:#FFD600;
color:#111;
font-size:20px;
font-weight:bold;
padding:15px;
border-radius:9px;
text-align:center;
margin-bottom:15px;
}

.conditionHeading{
color:#FFD600;
font-size:15px;
font-weight:bold;
margin:20px 0 10px;
line-height:1.8;
}

.tableWrap{
overflow-x:auto;
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
font-size:13px;
}

th,td{
border:1px solid #555;
padding:12px 7px;
text-align:center;
}

th{
background:#FFD600;
color:#111;
}

td{
background:#292929;
}

tr:nth-child(even) td{
background:#252525;
}

.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.filters{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:9px;
}

.filterButton{
padding:13px 8px;
border:1px solid #FFD600;
border-radius:8px;
background:#292929;
color:#FFD600;
font-weight:bold;
cursor:pointer;
line-height:1.6;
}

.filterButton.selected{
background:#FFD600;
color:#111;
}

.filterButton:first-child{
grid-column:1/-1;
}

.green{
color:#4ADE80!important;
}

.yellow{
color:#FFD600!important;
}

.red{
color:#FF6464!important;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.9;
}

.notice{
background:#302C17;
border:1px solid #FFD600;
border-radius:10px;
padding:14px;
line-height:1.9;
margin:15px 0;
}

#status,
#fareStatus{
text-align:center;
line-height:1.8;
color:#FFD600;
overflow-wrap:anywhere;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<div class="fareIcon">

<svg width="52" height="52"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">

<rect x="3" y="3"
width="18" height="18" rx="2"/>

<path d="M3 9h18"/>
<path d="M3 15h18"/>
<path d="M10 9v12"/>
<path d="M16 9v12"/>

</svg>

</div>

<h2 data-t="heading">
Driver Fare Chart
</h2>

<p id="status"
role="status"
aria-live="polite">
Checking driver account...
</p>

<section id="accessPanel"
class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="content" hidden>

<section class="panel">

<h3 data-t="driverDetails"></h3>

<div class="row">

<span data-t="driverName"></span>

<strong id="driverName">—</strong>

</div>

<div class="row">

<span>Driver ID</span>

<strong id="driverId"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="registeredVehicle"></span>

<strong id="registeredVehicle">—</strong>

</div>

<div class="row">

<span data-t="accountStatus"></span>

<strong class="green"
data-t="approved"></strong>

</div>

</section>

<section class="panel">

<h3 data-t="serviceHours"></h3>

<div class="row">

<span data-t="day"></span>

<strong id="dayHours">—</strong>

</div>

<div class="row">

<span data-t="night"></span>

<strong id="nightHours">—</strong>

</div>

<div class="row">

<span data-t="sriLankaTime"></span>

<strong id="sriLankaTime">—</strong>

</div>

<div class="row">

<span data-t="currentPeriod"></span>

<strong id="currentPeriod"
class="yellow">—</strong>

</div>

</section>

<section class="panel">

<h3 data-t="additionalCharges"></h3>

<div class="stats">

<div class="stat">

<strong id="rainCharge">—</strong>

<span data-t="rainPerKm"></span>

</div>

<div class="stat">

<strong id="roadCharge">—</strong>

<span data-t="roadPerKm"></span>

</div>

<div class="stat">

<strong id="combinedCharge">—</strong>

<span data-t="combinedPerKm"></span>

</div>

<div class="stat">

<strong id="commissionRate">—</strong>

<span data-t="commission"></span>

</div>

</div>

</section>

<section class="panel">

<h3 data-t="selectVehicle"></h3>

<div id="vehicleFilters"
class="filters">

<button type="button"
class="filterButton selected"
data-vehicle="all"
data-t="allVehicles"
aria-pressed="true"></button>

<button type="button"
class="filterButton"
data-vehicle="bike"
data-t="bike"
aria-pressed="false"></button>

<button type="button"
class="filterButton"
data-vehicle="tuk"
data-t="tuk"
aria-pressed="false"></button>

<button type="button"
class="filterButton"
data-vehicle="car"
data-t="car"
aria-pressed="false"></button>

<button type="button"
class="filterButton"
data-vehicle="van"
data-t="van"
aria-pressed="false"></button>

</div>

</section>

<p id="fareStatus"
role="status"
aria-live="polite"></p>

<div id="fareCharts"></div>

<section class="panel">

<h3 data-t="discountHeading"></h3>

<div class="tableWrap">

<table>

<thead>

<tr>

<th data-t="distance"></th>

<th data-t="bike"></th>

<th data-t="tuk"></th>

<th data-t="car"></th>

<th data-t="van"></th>

</tr>

</thead>

<tbody id="discountTable"></tbody>

</table>

</div>

<div class="notice"
data-t="discountNotice"></div>

</section>

<section class="panel">

<h3 data-t="minimumFares"></h3>

<div class="row">

<span data-t="bike"></span>

<strong id="bikeMinimum">—</strong>

</div>

<div class="row">

<span data-t="tuk"></span>

<strong id="tukMinimum">—</strong>

</div>

<div class="row">

<span data-t="car"></span>

<strong id="carMinimum">—</strong>

</div>

<div class="row">

<span data-t="van"></span>

<strong id="vanMinimum">—</strong>

</div>

</section>

<section class="panel">

<h3 data-t="commissionHeading"></h3>

<div class="stats">

<div class="stat">

<strong id="companyShare">—</strong>

<span>MY RIDE</span>

</div>

<div class="stat">

<strong id="driverShare"
class="green">—</strong>

<span data-t="driverIncome"></span>

</div>

</div>

<p class="note"
data-t="commissionNote"></p>

<a id="commissionLink"
class="action secondary"
data-t="commissionReport"></a>

</section>

<section class="panel">

<h3 data-t="extraCharges"></h3>

<div class="row">

<span data-t="highway"></span>

<strong data-t="separate"></strong>

</div>

<div class="row">

<span data-t="parking"></span>

<strong data-t="separate"></strong>

</div>

<p class="note"
data-t="extraNote"></p>

</section>

<section class="panel">

<h3 data-t="fareRules"></h3>

<p data-t="rule1"></p>
<p data-t="rule2"></p>
<p data-t="rule3"></p>
<p data-t="rule4"></p>
<p data-t="rule5"></p>
<p data-t="rule6"></p>
<p data-t="rule7"></p>
<p data-t="rule8"></p>
<p data-t="rule9"></p>
<p data-t="rule10"></p>

</section>

<section class="panel">

<h3 data-t="fareInformation"></h3>

<div class="row">

<span data-t="fareVersion"></span>

<strong id="fareVersion">—</strong>

</div>

<div class="row">

<span data-t="lastUpdate"></span>

<strong id="lastUpdate">—</strong>

</div>

<div class="row">

<span data-t="dataSource"></span>

<strong>MY RIDE Admin</strong>

</div>

<div class="row">

<span data-t="updateStatus"></span>

<strong id="updateStatus">—</strong>

</div>

<button id="refreshButton"
class="action"
data-t="refresh"></button>

<p class="note"
data-t="updateNote"></p>

</section>

<a id="weatherLink"
class="action secondary"
data-t="weatherRoad"></a>

<a id="termsLink"
class="action secondary"
data-t="driverTerms"></a>

<a id="feedbackLink"
class="action secondary"
data-t="feedback"></a>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){

return authorized
&&uid!==null
&&auth?.currentUser?.uid===uid
&&navigator.onLine;

}

function validId(value){

return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,min,max){

return typeof value==="string"
&&value.trim().length>=min
&&value.length<=max;

}

function validNumber(value,min,max){

return typeof value==="number"
&&Number.isFinite(value)
&&value>=min
&&value<=max;

}

function validMoney(value){

return validNumber(value,0,1000000)
&&Math.abs(
value*100-Math.round(value*100)
)<0.001;

}

function cents(value){

return Math.round(value*100);

}

function validTime(value){

return validNumber(
value,
1,
8640000000000000
);

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(
functions,name
)(data);

if(!validSession()
||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncServerTime(){

const currentGeneration=generation;

const start=Date.now();

const result=await serverCall(
"getDriverServerTime"
);

const end=Date.now();

if(currentGeneration!==generation)return;

if(!validTime(result?.serverTimeMs)
||end-start>10000){

throw new Error("Invalid server time");

}

serverOffset=
result.serverTimeMs-(start+end)/2;

serverSyncAt=end;

}

function serverNow(){

if(serverOffset===null
||Date.now()-serverSyncAt>120000){

return null;

}

return Date.now()+serverOffset;

}

}

function rateNumber(value){

return new Intl.NumberFormat("en-LK",{

maximumFractionDigits:2

}).format(value);

}

function formatMinutes(minutes){

const hours=Math.floor(minutes/60);

const mins=minutes%60;

return String(hours).padStart(2,"0")
+":"
+String(mins).padStart(2,"0");

}

function getPeriod(){

const now=serverNow();

if(now===null||!fareSettings){

return null;

}

const date=new Date(
now+330*60000
);

const minutes=
date.getUTCHours()*60
+date.getUTCMinutes();

const dayStart=
fareSettings.dayStartMinutes;

const nightStart=
fareSettings.nightStartMinutes;

const isDay=

dayStart<nightStart

?minutes>=dayStart
&&minutes<nightStart

:minutes>=dayStart
||minutes<nightStart;

return isDay?"day":"night";

}

function renderClock(){

const now=serverNow();

$("sriLankaTime").textContent=

now===null
?"—"
:formatDate(now);

const period=getPeriod();

$("currentPeriod").textContent=

period?t[period]:"—";

}

// GPS CONTINUITY

function startGps(){

if(gpsWatch!==null
||!navigator.geolocation
||!validSession()){

return;

}

const currentGeneration=generation;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const c=position.coords;

if(

currentGeneration!==generation

||!validSession()

||!driver

||driver.documentsValid!==true

||!["online","busy"]
.includes(driver.availability)

||!validNumber(c.latitude,5.85,9.9)

||!validNumber(c.longitude,79.5,82)

||!validNumber(c.accuracy,0,100)

||!validTime(position.timestamp)

||Date.now()-position.timestamp>30000

||position.timestamp>Date.now()+5000

||gpsSending

||Date.now()-lastGpsSent<10000

){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

const result=await serverCall(

"updateDriverLocation",

{

lat:c.latitude,

lon:c.longitude,

accuracy:c.accuracy,

capturedAtMs:position.timestamp

}

);

if(result?.accepted!==true){

throw new Error("GPS rejected");

}

}catch(e){

// Backend must expire stale GPS data.

}finally{

if(currentGeneration===generation){

gpsSending=false;

}

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(
gpsWatch
);

gpsWatch=null;

}

}

// SAFE DOM

function element(tag,className,text){

const node=document.createElement(tag);

if(className){

node.className=className;

}

if(text!==undefined){

node.textContent=text;

}

return node;

}

function addRow(container,label,value){

const row=element("div","row");

row.append(

element("span","",label),

element("strong","",value)

);

container.appendChild(row);

}

// ADMIN FARE VALIDATION

function validFareSettings(data){

if(

!data

||data.published!==true

||!validId(data.version)

||!Number.isInteger(data.dayStartMinutes)

||!Number.isInteger(data.nightStartMinutes)

||!validNumber(
data.dayStartMinutes,0,1439
)

||!validNumber(
data.nightStartMinutes,0,1439
)

||data.dayStartMinutes
===data.nightStartMinutes

||!validNumber(
data.commissionRate,0,100
)

||!validMoney(
data.rainSurchargePerKm
)

||!validMoney(
data.difficultRoadSurchargePerKm
)

||!data.vehicles

){

return false;

}

if(data.updatedAt!==undefined){

if(

!data.updatedAt

||typeof data.updatedAt.toMillis
!=="function"

||!validTime(data.updatedAt.toMillis())

){

return false;

}

}

return VEHICLES.every(type=>{

const vehicle=data.vehicles[type];

if(

!vehicle

||!validMoney(vehicle.minimumFare)

||!Array.isArray(vehicle.bands)

||vehicle.bands.length!==5

){

return false;

}

const first=vehicle.bands[0];

if(

!first

||!validMoney(first.dayRate)

||!validMoney(first.nightRate)

||first.discountPerKm!==0

){

return false;

}

return vehicle.bands.every(
(band,index)=>{

if(

!band

||band.upToKm!==DISTANCE_LIMITS[index]

||!validMoney(band.dayRate)

||!validMoney(band.nightRate)

||!validMoney(band.discountPerKm)

){

return false;

}

if(

cents(band.dayRate)
+cents(band.discountPerKm)
!==cents(first.dayRate)

||

cents(band.nightRate)
+cents(band.discountPerKm)
!==cents(first.nightRate)

){

return false;

}

if(

index>0

&&band.discountPerKm
<vehicle.bands[index-1].discountPerKm

){

return false;

}

return true;

});

});

}

// CONDITION SURCHARGES

function getSurcharge(condition){

if(!fareSettings){

return null;

}

const rain=
fareSettings.rainSurchargePerKm;

const road=
fareSettings.difficultRoadSurchargePerKm;

switch(condition){

case "normal":

return 0;

case "rain":

return rain;

case "difficult":

return road;

case "combined":

return Math.round(
(rain+road)*100
)/100;

default:

return null;

}

}

:[selectedVehicle];

// RENDER FARE SETTINGS

function renderFareSettings(){

if(!fareSettings
||!validSession()
||!driver){

clearFareDisplay();

$("fareStatus").textContent=
t.unavailable;

return;

}

const data=fareSettings;

$("dayHours").textContent=

formatMinutes(data.dayStartMinutes)

+" – "+

formatMinutes(data.nightStartMinutes);

$("nightHours").textContent=

formatMinutes(data.nightStartMinutes)

+" – "+

formatMinutes(data.dayStartMinutes);

$("rainCharge").textContent=

money(data.rainSurchargePerKm);

$("roadCharge").textContent=

money(data.difficultRoadSurchargePerKm);

$("combinedCharge").textContent=

money(

Math.round(

(
data.rainSurchargePerKm

+data.difficultRoadSurchargePerKm
)*100

)/100

);

$("commissionRate").textContent=

rateNumber(data.commissionRate)+"%";

$("companyShare").textContent=

rateNumber(data.commissionRate)+"%";

$("driverShare").textContent=

rateNumber(

Math.round(
(100-data.commissionRate)*100
)/100

)+"%";

VEHICLES.forEach(type=>{

$(type+"Minimum").textContent=

money(

data.vehicles[type].minimumFare

);

});

$("fareVersion").textContent=

data.version;

$("lastUpdate").textContent=

data.updatedAt

?formatDate(data.updatedAt.toMillis())

:"—";

$("updateStatus").textContent=t.live;

$("updateStatus").className="green";

$("fareStatus").textContent="";

renderCharts();

renderDiscountTable();

renderClock();

}

// CLEAR FARE DATA

function clearFareDisplay(){

const fields=[

"dayHours",

"nightHours",

"currentPeriod",

"rainCharge",

"roadCharge",

"combinedCharge",

"commissionRate",

"companyShare",

"driverShare",

"bikeMinimum",

"tukMinimum",

"carMinimum",

"vanMinimum",

"fareVersion",

"lastUpdate"

];

fields.forEach(id=>{

$(id).textContent="—";

});

$("updateStatus").textContent=
t.unknown;

$("updateStatus").className="yellow";

$("fareCharts").replaceChildren();

$("discountTable").replaceChildren();

}

// PROCESS SERVER SNAPSHOT

function applyFareSnapshot(snapshot){

if(

snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites

||!snapshot.exists()

||!validFareSettings(snapshot.data())

){

fareSettings=null;

clearFareDisplay();

$("fareStatus").textContent=

t.unavailable;

return;

}

fareSettings=snapshot.data();

renderFareSettings();

}

// REALTIME ADMIN FARE SETTINGS

function subscribeFareSettings(){

if(fareUnsubscribe){

fareUnsubscribe();

fareUnsubscribe=null;

}

if(!validSession()||!driver){

return;

}

const currentGeneration=generation;

$("fareStatus").textContent=t.loading;

fareUnsubscribe=onSnapshot(

doc(

db,

"publicSettings",

"fares"

),

{

includeMetadataChanges:true

},

snapshot=>{

if(

currentGeneration!==generation

||!validSession()

||!driver

){

return;

}

fareRevision++;

applyFareSnapshot(snapshot);

},

()=>{

if(currentGeneration!==generation){

return;

}

fareRevision++;

fareSettings=null;

clearFareDisplay();

$("fareStatus").textContent=t.error;

}

);

}

// VEHICLE FILTER BUTTONS

document.querySelectorAll(
"[data-vehicle]"
).forEach(button=>{

button.onclick=()=>{

if(!validSession()||!driver){

return;

}

const type=button.dataset.vehicle;

if(

type!=="all"

&&!VEHICLES.includes(type)

){

return;

}

selectedVehicle=type;

document.querySelectorAll(
"[data-vehicle]"
).forEach(item=>{

const selected=

item.dataset.vehicle===type;

item.classList.toggle(

"selected",

selected

);

item.setAttribute(

"aria-pressed",

String(selected)

);

});

renderCharts();

};

});

// MANUAL REFRESH

$("refreshButton").onclick=async()=>{

if(

!validSession()

||!driver

||refreshing

){

return;

}

const currentGeneration=generation;

const startingRevision=fareRevision;

refreshing=true;

updateControls();

$("fareStatus").textContent=t.loading;

try{

await syncServerTime();

if(currentGeneration!==generation){

return;

}

const snapshot=await getDocFromServer(

doc(

db,

"publicSettings",

"fares"

)

);

if(

currentGeneration!==generation

||!validSession()

||!driver

){

return;

}

if(startingRevision===fareRevision){

applyFareSnapshot(snapshot);

}else{

renderFareSettings();

}

}catch(e){

if(currentGeneration!==generation){

return;

}

$("fareStatus").textContent=t.error;

}finally{

if(currentGeneration===generation){

refreshing=false;

updateControls();

}

}

};

// CONTROL SECURITY

function updateControls(){

const enabled=

validSession()

&&driver!==null;

$("refreshButton").disabled=

!enabled||refreshing;

document.querySelectorAll(
"[data-vehicle]"
).forEach(button=>{

button.disabled=!enabled;

});

}

// CLEAR SESSION

function disconnect(){

generation++;

fareRevision++;

authorized=false;

uid=null;

driver=null;

fareSettings=null;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

if(fareUnsubscribe){

fareUnsubscribe();

fareUnsubscribe=null;

}

stopGps();

gpsSending=false;

lastGpsSent=0;

serverOffset=null;

serverSyncAt=0;

checkingSession=false;

refreshing=false;

selectedVehicle="all";

document.querySelectorAll(
"[data-vehicle]"
).forEach(button=>{

const selected=

button.dataset.vehicle==="all";

button.classList.toggle(

"selected",

selected

);

button.setAttribute(

"aria-pressed",

String(selected)

);

});

clearFareDisplay();

$("driverName").textContent="—";

$("driverId").textContent="—";

$("registeredVehicle").textContent="—";

$("sriLankaTime").textContent="—";

$("fareStatus").textContent="";

$("content").hidden=true;

$("accessPanel").hidden=true;

updateControls();

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// DRIVER ACCOUNT MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(

db,

"drivers",

uid

),

{

includeMetadataChanges:true

},

snapshot=>{

if(

currentGeneration!==generation

||!validSession()

){

return;

}

if(

snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites

){

driver=null;

fareSettings=null;

fareRevision++;

stopGps();

if(fareUnsubscribe){

fareUnsubscribe();

fareUnsubscribe=null;

}

clearFareDisplay();

$("content").hidden=true;

status(t.checking);

return;

}

const data=snapshot.data();

if(

!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true

||!validText(data.fullName,1,150)

||!validId(data.driverId)

||!VEHICLES.includes(data.vehicleType)

||!["online","offline","busy"]
.includes(data.availability)

){

denyAccess();

return;

}

const firstLoad=driver===null;

const vehicleChanged=

driver!==null

&&driver.vehicleType!==data.vehicleType;

driver=data;

$("driverName").textContent=

data.fullName;

$("driverId").textContent=

data.driverId;

$("registeredVehicle").textContent=

t[data.vehicleType];

$("content").hidden=false;

$("accessPanel").hidden=true;

if(

["online","busy"]

.includes(data.availability)

){

startGps();

}else{

stopGps();

}

if(firstLoad){

subscribeFareSettings();

syncServerTime()

.then(()=>{

if(currentGeneration===generation){

renderClock();

}

})

.catch(()=>{

if(currentGeneration===generation){

serverOffset=null;

renderClock();

}

});

}else if(vehicleChanged){

renderCharts();

}

status("");

updateControls();

},

()=>{

if(currentGeneration!==generation){

return;

}

denyAccess();

}

);

}

// APPROVED DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!db||!functions){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.connectionLost);

return;

}

status(t.checking);

try{

const token=

await user.getIdTokenResult(true);

if(

token.claims.driver!==true

||token.signInProvider!=="custom"

){

throw new Error(
"Driver login required"
);

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(

currentGeneration!==generation

||auth.currentUser?.uid!==user.uid

){

return;

}

const account=response.data;

if(

account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true

){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation){

return;

}

denyAccess();

}

}

if(auth){

onAuthStateChanged(

auth,

verifyDriver

);

}

// AUTOMATIC SRI LANKA CLOCK

setInterval(()=>{

if(!validSession()||!driver){

return;

}

renderClock();

},1000);

// AUTOMATIC SESSION VERIFICATION

setInterval(async()=>{

if(

!validSession()

||!driver

||checkingSession

){

return;

}

const currentGeneration=generation;

checkingSession=true;

try{

const result=await serverCall(

"verifyDriverSession"

);

if(currentGeneration!==generation){

return;

}

if(

result?.authorized!==true

||result.uid!==uid

||result.status!=="approved"

||result.activationComplete!==true

||result.documentsValid!==true

){

denyAccess();

return;

}

try{

await syncServerTime();

}catch(e){

if(currentGeneration===generation){

serverOffset=null;

}

}

if(currentGeneration!==generation){

return;

}

renderClock();

}catch(e){

if(currentGeneration!==generation){

return;

}

denyAccess();

}finally{

if(currentGeneration===generation){

checkingSession=false;

}

}

},60000);

// INTERNET CONNECTION MONITORING

window.addEventListener(

"offline",

()=>{

disconnect();

status(t.connectionLost);

}

);

window.addEventListener(

"online",

()=>{

if(auth){

verifyDriver(auth.currentUser);

}

}

);

// PAGE VISIBILITY

document.addEventListener(

"visibilitychange",

()=>{

if(

document.hidden

||!validSession()

||!driver

){

return;

}

if(serverNow()===null){

const currentGeneration=generation;

syncServerTime()

.then(()=>{

if(currentGeneration===generation){

renderClock();

}

})

.catch(()=>{});

}

}

);

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

updateControls();

</script>


<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Driver Account Status</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.accountIcon{
width:90px;
height:90px;
background:#FFD600;
color:#111;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:20px auto;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.8;
}

.row span{
color:#CCC;
}

.row strong{
max-width:60%;
text-align:right;
overflow-wrap:anywhere;
}

.statusCard{
background:#292929;
border:1px solid #555;
border-radius:12px;
padding:22px 12px;
text-align:center;
}

.statusCard strong{
display:block;
font-size:25px;
margin:10px 0;
overflow-wrap:anywhere;
}

.green{
color:#4ADE80!important;
}

.red{
color:#FF6464!important;
}

.yellow{
color:#FFD600!important;
}

.blue{
color:#60A5FA!important;
}

.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.notice{
background:#302C17;
border:1px solid #FFD600;
border-radius:10px;
padding:14px;
line-height:1.9;
margin:15px 0;
overflow-wrap:anywhere;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:14px;
line-height:1.9;
margin:15px 0;
overflow-wrap:anywhere;
}

.documentCard{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:12px;
margin:12px 0;
}

.documentCard h4{
color:#FFD600;
line-height:1.8;
}

label{
display:block;
margin:14px 0 8px;
line-height:1.8;
font-size:14px;
}

textarea,select{
width:100%;
background:#292929;
color:#fff;
border:1px solid #666;
border-radius:8px;
padding:13px;
font-size:16px;
font-family:inherit;
}

textarea{
min-height:130px;
resize:vertical;
}

.checkboxRow{
display:flex;
align-items:flex-start;
gap:10px;
margin:15px 0;
line-height:1.8;
}

.checkboxRow input{
width:20px;
height:20px;
accent-color:#FFD600;
flex-shrink:0;
}

.checkboxRow label{
margin:0;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.9;
}

.message{
background:#292929;
border:1px solid #555;
border-radius:9px;
padding:14px;
line-height:1.9;
white-space:pre-wrap;
overflow-wrap:anywhere;
}

#status,
#reviewStatus,
#refreshStatus{
text-align:center;
color:#FFD600;
line-height:1.8;
overflow-wrap:anywhere;
}

button:disabled,
textarea:disabled,
select:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<div class="accountIcon">

<svg width="55" height="55"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.7"
stroke-linecap="round"
stroke-linejoin="round">

<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11"/>

<path d="m9 12 2 2 4-4"/>

</svg>

</div>

<h2 data-t="heading">
Driver Account Status
</h2>

<p id="status"
role="status"
aria-live="polite">
Checking account...
</p>

<section id="accessPanel"
class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="content" hidden>

<section class="panel">

<h3 data-t="accountDetails"></h3>

<div class="row">
<span data-t="driverName"></span>
<strong id="driverName">—</strong>
</div>

<div class="row">
<span>Driver ID</span>
<strong id="driverId"
class="yellow">—</strong>
</div>

<div class="row">
<span data-t="vehicleType"></span>
<strong id="vehicleType">—</strong>
</div>

<div class="row">
<span data-t="vehicleNumber"></span>
<strong id="vehicleNumber">—</strong>
</div>

<div class="row">
<span data-t="registrationDate"></span>
<strong id="registrationDate">—</strong>
</div>

</section>

<section class="panel">

<h3 data-t="accountStatus"></h3>

<div class="statusCard">

<span data-t="currentStatus"></span>

<strong id="accountStatus">—</strong>

<p id="statusDescription"></p>

</div>

<div class="row">
<span data-t="adminApproval"></span>
<strong id="adminApproval">—</strong>
</div>

<div class="row">
<span data-t="activation"></span>
<strong id="activationStatus">—</strong>
</div>

<div class="row">
<span data-t="serviceStatus"></span>
<strong id="serviceStatus">—</strong>
</div>

<div class="row">
<span data-t="statusUpdated"></span>
<strong id="statusUpdated">—</strong>
</div>

<div id="restrictionPanel"
class="warning" hidden>

<h4 data-t="restrictionReason"></h4>

<p id="restrictionReason"></p>

</div>

</section>

<section class="panel">

<h3 data-t="hirePermission"></h3>

<div class="statusCard">

<strong id="hirePermission">—</strong>

<p id="hireDescription"></p>

</div>

<div class="row">
<span data-t="documentsValid"></span>
<strong id="documentsValid">—</strong>
</div>

<div class="row">
<span data-t="commissionClearance"></span>
<strong id="commissionClearance">—</strong>
</div>

<div class="row">
<span data-t="termsAccepted"></span>
<strong id="termsAccepted">—</strong>
</div>

<div class="row">
<span data-t="gpsStatus"></span>
<strong id="gpsStatus">—</strong>
</div>

<div class="row">
<span data-t="adminRestriction"></span>
<strong id="adminRestriction">—</strong>
</div>

<div id="hireReasons"
class="notice" hidden></div>

</section>

<section class="panel">

<h3 data-t="documentStatus"></h3>

<div class="documentCard">

<h4 data-t="drivingLicence"></h4>

<div class="row">
<span data-t="expiryDate"></span>
<strong id="licenceExpiry">—</strong>
</div>

<div class="row">
<span data-t="remainingDays"></span>
<strong id="licenceDays">—</strong>
</div>

<div class="row">
<span data-t="validity"></span>
<strong id="licenceStatus">—</strong>
</div>

</div>

<div class="documentCard">

<h4 data-t="insurance"></h4>

<div class="row">
<span data-t="expiryDate"></span>
<strong id="insuranceExpiry">—</strong>
</div>

<div class="row">
<span data-t="remainingDays"></span>
<strong id="insuranceDays">—</strong>
</div>

<div class="row">
<span data-t="validity"></span>
<strong id="insuranceStatus">—</strong>
</div>

</div>

<div class="documentCard">

<h4 data-t="revenueLicence"></h4>

<div class="row">
<span data-t="expiryDate"></span>
<strong id="revenueExpiry">—</strong>
</div>

<div class="row">
<span data-t="remainingDays"></span>
<strong id="revenueDays">—</strong>
</div>

<div class="row">
<span data-t="validity"></span>
<strong id="revenueStatus">—</strong>
</div>

</div>

<a id="renewalLink"
class="action"
data-t="renewDocuments"></a>

<p class="note"
data-t="renewalNote"></p>

</section>

<section class="panel">

<h3 data-t="commissionStatus"></h3>

<div class="row">
<span data-t="outstandingCommission"></span>
<strong id="outstandingCommission">—</strong>
</div>

<div class="row">
<span data-t="overdueCommission"></span>
<strong id="overdueCommission">—</strong>
</div>

<div class="row">
<span data-t="nextDueDate"></span>
<strong id="nextDueDate">—</strong>
</div>

<div class="row">
<span data-t="paymentRestriction"></span>
<strong id="paymentRestriction">—</strong>
</div>

<a id="commissionLink"
class="action secondary"
data-t="commissionReport"></a>

<a id="payCommissionLink"
class="action secondary"
data-t="payCommission"></a>

</section>

<section class="panel">

<h3 data-t="adminMessage"></h3>

<div id="adminMessage"
class="message">—</div>

<div class="row">
<span data-t="messageDate"></span>
<strong id="messageDate">—</strong>
</div>

<a id="notificationLink"
class="action secondary"
data-t="notifications"></a>

</section>

<section id="reviewPanel"
class="panel" hidden>

<h3 data-t="requestReview"></h3>

<p class="note"
data-t="reviewNote"></p>

<form id="reviewForm">

<label for="reviewCategory"
data-t="reviewCategory"></label>

<select id="reviewCategory" required>

<option value=""
data-t="selectReason"></option>

<option value="account_status"
data-t="accountStatus"></option>

<option value="documents"
data-t="documentStatus"></option>

<option value="commission"
data-t="commissionStatus"></option>

<option value="incorrect_restriction"
data-t="incorrectRestriction"></option>

<option value="other"
data-t="other"></option>

</select>

<label for="reviewMessage"
data-t="reviewMessage"></label>

<textarea id="reviewMessage"
minlength="10"
maxlength="2000"
required></textarea>

<p class="note">
<span id="characterCount">0</span>
/ 2000
</p>

<div class="checkboxRow">

<input type="checkbox"
id="declaration" required>

<label for="declaration"
data-t="declaration"></label>

</div>

<button type="submit"
id="submitReview"
class="action"
data-t="sendReview"></button>

</form>

<p id="reviewStatus"
role="status"
aria-live="polite"></p>

<div id="reviewRecord"
class="documentCard" hidden>

<div class="row">
<span data-t="reference"></span>
<strong id="reviewReference">—</strong>
</div>

<div class="row">
<span data-t="reviewState"></span>
<strong id="reviewState">—</strong>
</div>

<div class="row">
<span data-t="submittedDate"></span>
<strong id="reviewDate">—</strong>
</div>

<div class="row">
<span data-t="adminReply"></span>
<strong id="reviewReply">—</strong>
</div>

</div>

</section>

<section class="panel">

<h3 data-t="securityRules"></h3>

<p data-t="rule1"></p>
<p data-t="rule2"></p>
<p data-t="rule3"></p>
<p data-t="rule4"></p>
<p data-t="rule5"></p>
<p data-t="rule6"></p>

</section>

<section class="panel">

<h3 data-t="updateDetails"></h3>

<div class="row">
<span data-t="lastUpdate"></span>
<strong id="lastUpdate">—</strong>
</div>

<div class="row">
<span data-t="serverConnection"></span>
<strong id="serverConnection">—</strong>
</div>

<button id="refreshButton"
class="action"
data-t="refresh"></button>

<p id="refreshStatus"
role="status"></p>

</section>

<a id="helpLink"
class="action secondary"
data-t="help"></a>

<a id="feedbackLink"
class="action secondary"
data-t="feedback"></a>

<a id="termsLink"
class="action secondary"
data-t="driverTerms"></a>

<a id="dashboardLink"
class="action secondary"
data-t="back"
hidden></a>

</div>

<a id="mainMenuLink"
class="action secondary"
data-t="mainMenu"></a>

<button id="logoutButton"
class="action secondary"
data-t="logout"
hidden></button>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){

return authorized
&&uid!==null
&&auth?.currentUser?.uid===uid
&&navigator.onLine;

}

function validId(value){

return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,min,max){

return typeof value==="string"
&&value.trim().length>=min
&&value.length<=max;

}

function validNumber(value,min,max){

return typeof value==="number"
&&Number.isFinite(value)
&&value>=min
&&value<=max;

}

function validMoney(value){

return validNumber(value,0,100000000)
&&Math.abs(
value*100-Math.round(value*100)
)<0.001;

}

function validTime(value){

return validNumber(
value,1,8640000000000000
);

}

function timestampMs(value){

if(!value
||typeof value.toMillis!=="function"){

return null;

}

const ms=value.toMillis();

return validTime(ms)?ms:null;

}

function validDate(value){

if(typeof value!=="string"
||!/^\d{4}-\d{2}-\d{2}$/.test(value)){

return false;

}

const date=new Date(value+"T00:00:00Z");

return Number.isFinite(date.getTime())
&&date.toISOString().slice(0,10)===value;

}

function validTranslations(value){

return value
&&LANGUAGES.every(language=>

typeof value[language]==="string"
&&value[language].length<=3000

);

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(
functions,name
)(data);

if(!validSession()
||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncServerTime(){

const currentGeneration=generation;

const start=Date.now();

const result=await serverCall(
"getDriverAccountStatusTime"
);

const end=Date.now();

if(currentGeneration!==generation)return;

if(!validTime(result?.serverTimeMs)
||end-start>10000){

throw new Error("Invalid server time");

}

serverOffset=
result.serverTimeMs-(start+end)/2;

serverSyncAt=end;

}

function serverNow(){

if(serverOffset===null
||Date.now()-serverSyncAt>120000){

return null;

}

return Date.now()+serverOffset;

}

function sriLankaToday(){

const now=serverNow();

if(now===null)return null;

return new Date(now+330*60000)
.toISOString().slice(0,10);

}

function formatDate(ms){

if(!validTime(ms))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":
lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",
dateStyle:"medium",
timeStyle:"medium"

}

).format(new Date(ms));

}

function money(value){

if(!validMoney(value))return "—";

return "LKR "+
new Intl.NumberFormat("en-LK",{

minimumFractionDigits:2,
maximumFractionDigits:2

}).format(value);

}

// ACCOUNT DATA VALIDATION

function validAccount(data){

if(

!data

||data.driverUid!==uid

||!validId(data.driverId)

||!validText(data.fullName,1,150)

||!ACCOUNT_STATES.includes(data.status)

||!["bike","tuk","car","van"]
.includes(data.vehicleType)

||!validText(data.vehicleNumber,1,30)

||!["online","offline","busy"]
.includes(data.availability)

||typeof data.activationComplete!=="boolean"

||typeof data.documentsValid!=="boolean"

||typeof data.commissionRestricted!=="boolean"

||typeof data.termsAccepted!=="boolean"

||typeof data.gpsActive!=="boolean"

||typeof data.adminRestricted!=="boolean"

||typeof data.canReceiveHires!=="boolean"

||typeof data.canRequestReview!=="boolean"

||!validMoney(data.outstandingCommission)

||!validMoney(data.overdueCommission)

||data.overdueCommission>
data.outstandingCommission

||!Array.isArray(data.restrictionCodes)

||data.restrictionCodes.length>20

||!data.restrictionCodes.every(
code=>RESTRICTION_CODES.includes(code)
)

||timestampMs(data.createdAt)===null

||timestampMs(data.updatedAt)===null

||timestampMs(data.statusUpdatedAt)===null

){

return false;

}

for(const key of [

"licenceExpiry",
"insuranceExpiry",
"revenueExpiry"

]){

if(data[key]!==null
&&!validDate(data[key])){

return false;

}

}

for(const key of [

"licenceVerified",
"insuranceVerified",
"revenueVerified"

]){

if(typeof data[key]!=="boolean"){

return false;

}

}

if(data.nextDueAt!==null
&&timestampMs(data.nextDueAt)===null){

return false;

}

if(data.restrictionReason!==null
&&!validTranslations(
data.restrictionReason
)){

return false;

}

if(data.adminMessage!==null){

if(!validTranslations(
data.adminMessage.translations
)

||timestampMs(
data.adminMessage.createdAt
)===null){

return false;

}

}

// Reject contradictory eligibility data.

if(data.canReceiveHires===true){

if(

data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true

||data.commissionRestricted===true

||data.termsAccepted!==true

||data.gpsActive!==true

||data.adminRestricted===true

||data.availability!=="online"

||data.restrictionCodes.length>0

){

return false;

}

}

return true;

}

// DOCUMENT EXPIRY CALCULATION

function documentDays(expiry){

const today=sriLankaToday();

if(!today||!validDate(expiry)){

return null;

}

const expiryMs=
Date.parse(expiry+"T00:00:00Z");

const todayMs=
Date.parse(today+"T00:00:00Z");

return Math.round(

(expiryMs-todayMs)/86400000

);

}

function renderDocument(
prefix,expiry,verified
){

setValue(
prefix+"Expiry",
expiry||"—"
);

const days=documentDays(expiry);

if(days===null){

setValue(prefix+"Days","—");

setValue(
prefix+"Status",
t.unknown,
"yellow"
);

return;

}

setValue(

prefix+"Days",

Math.max(0,days)+" "+t.days,

days<0?"red":
days<=30?"yellow":"green"

);

if(days<0){

setValue(
prefix+"Status",
t.expired,
"red"
);

}else if(!verified){

setValue(
prefix+"Status",
t.unknown,
"yellow"
);

}else if(days<=30){

setValue(
prefix+"Status",
t.expiring,
"yellow"
);

}else{

setValue(
prefix+"Status",
t.valid,
"green"
);

}

}

}

// GPS CONTINUITY

function startGps(){

if(gpsWatch!==null
||!navigator.geolocation
||!validSession())return;

const currentGeneration=generation;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const c=position.coords;

if(

currentGeneration!==generation

||!validSession()

||!account

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true

||!["online","busy"]
.includes(account.availability)

||!validNumber(c.latitude,5.85,9.9)

||!validNumber(c.longitude,79.5,82)

||!validNumber(c.accuracy,0,100)

||!validTime(position.timestamp)

||Date.now()-position.timestamp>30000

||position.timestamp>Date.now()+5000

||gpsSending

||Date.now()-lastGpsSent<10000

){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

const result=await serverCall(

"updateDriverLocation",

{

lat:c.latitude,
lon:c.longitude,
accuracy:c.accuracy,
capturedAtMs:position.timestamp

}

);

if(result?.accepted!==true){

throw new Error("GPS rejected");

}

}catch(e){

// Server must expire stale GPS data.

}finally{

if(currentGeneration===generation){

gpsSending=false;

}

}

},

()=>{},

{

enableHighAccuracy:true,
maximumAge:5000,
timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(
gpsWatch
);

gpsWatch=null;

}

}

setBoolean(

"paymentRestriction",

!data.commissionRestricted,

"clear",

"restricted"

);

setValue(

"adminMessage",

data.adminMessage?.translations?.[lang]
||t.none

);

setValue(

"messageDate",

data.adminMessage
?formatDate(
timestampMs(data.adminMessage.createdAt)
)
:"—"

);

setValue(

"lastUpdate",

formatDate(timestampMs(data.updatedAt))

);

setValue(

"serverConnection",

t.connected,

"green"

);

const dashboardAllowed=

data.status==="approved"

&&data.activationComplete===true

&&data.documentsValid===true;

$("dashboardLink").hidden=

!dashboardAllowed;

$("renewalLink").hidden=

!(data.status==="approved"
&&data.activationComplete===true);

$("commissionLink").hidden=

!dashboardAllowed;

$("payCommissionLink").hidden=

!dashboardAllowed;

$("feedbackLink").hidden=

!dashboardAllowed;

$("helpLink").hidden=

!dashboardAllowed;

$("termsLink").hidden=

!(data.status==="approved"
&&data.activationComplete===true);

$("notificationLink").hidden=

!data.activationComplete;

$("reviewPanel").hidden=

!data.canRequestReview;

$("content").hidden=false;

$("accessPanel").hidden=true;

$("logoutButton").hidden=false;

if(

dashboardAllowed

&&["online","busy"]
.includes(data.availability)

){

startGps();

}else{

stopGps();

}

status("");

updateControls();

}

// REVIEW RECORD VALIDATION

function validReview(data){

return data

&&data.driverUid===uid

&&validId(data.referenceId)

&&[
"pending",
"in_progress",
"resolved",
"closed"
].includes(data.status)

&&timestampMs(data.createdAt)!==null

&&(

data.adminReply===null

||validTranslations(data.adminReply)

);

}

function renderReview(){

if(!reviewRecord){

$("reviewRecord").hidden=true;

updateControls();

return;

}

const data=reviewRecord;

const labels={

pending:"reviewPending",

in_progress:"inProgress",

resolved:"resolved",

closed:"closed"

};

$("reviewRecord").hidden=false;

setValue(

"reviewReference",

data.referenceId,

"yellow"

);

setValue(

"reviewState",

t[labels[data.status]],

["pending","in_progress"]
.includes(data.status)
?"yellow":"green"

);

setValue(

"reviewDate",

formatDate(
timestampMs(data.createdAt)
)

);

setValue(

"reviewReply",

data.adminReply?.[lang]||t.none

);

updateControls();

}

// REALTIME REVIEW MONITORING

function subscribeReview(){

if(reviewUnsubscribe){

reviewUnsubscribe();

reviewUnsubscribe=null;

}

const currentGeneration=generation;

reviewUnsubscribe=onSnapshot(

doc(

db,

"drivers",

uid,

"accountReviews",

"latest"

),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation
||!validSession())return;

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites){

reviewRecord=null;

reviewStateKnown=false;

renderReview();

return;

}

if(!snapshot.exists()){

reviewRecord=null;

reviewStateKnown=true;

renderReview();

return;

}

if(!validReview(snapshot.data())){

reviewRecord=null;

reviewStateKnown=false;

renderReview();

return;

}

reviewRecord=snapshot.data();

reviewStateKnown=true;

renderReview();

},

()=>{

if(currentGeneration!==generation)return;

reviewRecord=null;

reviewStateKnown=false;

renderReview();

}

);

}

let reviewStateKnown=false;

// ACCOUNT STATUS MONITORING

function subscribeAccount(){

if(accountUnsubscribe){

accountUnsubscribe();

accountUnsubscribe=null;

}

const currentGeneration=generation;

accountUnsubscribe=onSnapshot(

doc(

db,

"drivers",

uid,

"accountStatus",

"current"

),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation
||!validSession())return;

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites){

account=null;

stopGps();

$("content").hidden=true;

status(t.checking);

updateControls();

return;

}

if(!snapshot.exists()
||!validAccount(snapshot.data())){

account=null;

stopGps();

$("content").hidden=true;

status(t.error);

updateControls();

return;

}

account=snapshot.data();

renderAccount();

},

()=>{

if(currentGeneration!==generation)return;

account=null;

stopGps();

$("content").hidden=true;

status(t.error);

updateControls();

}

);

}

// REVIEW REQUEST CONTROLS

function updateControls(){

const enabled=

validSession()&&account!==null;

const openReview=

reviewRecord

&&["pending","in_progress"]
.includes(reviewRecord.status);

const canSubmit=

enabled

&&account.canRequestReview===true

&&reviewStateKnown

&&!openReview

&&!submitting;

$("reviewCategory").disabled=!canSubmit;

$("reviewMessage").disabled=!canSubmit;

$("declaration").disabled=!canSubmit;

$("submitReview").disabled=!canSubmit;

$("refreshButton").disabled=

!enabled||refreshing;

$("logoutButton").disabled=

loggingOut

||!enabled

||account?.availability==="busy";

}

$("reviewMessage").addEventListener(

"input",

()=>{

$("characterCount").textContent=

String(
$("reviewMessage").value.length
);

}

);

// SUBMIT ACCOUNT REVIEW

$("reviewForm").onsubmit=async event=>{

event.preventDefault();

if(

!validSession()

||!account

||!account.canRequestReview

||!reviewStateKnown

||submitting

||(

reviewRecord

&&["pending","in_progress"]
.includes(reviewRecord.status)

)

){

return;

}

const category=

$("reviewCategory").value;

const message=

$("reviewMessage").value.trim();

if(

!REVIEW_CATEGORIES.includes(category)

||!validText(message,10,2000)

||!$("declaration").checked

){

return;

}

if(!window.confirm(t.confirmReview)){

return;

}

const signature=

JSON.stringify([category,message,lang]);

if(!pendingReview
||pendingReview.signature!==signature){

pendingReview={

signature,

requestId:crypto.randomUUID()

};

}

const currentGeneration=generation;

submitting=true;

updateControls();

$("reviewStatus").textContent=t.loading;

try{

const result=await serverCall(

"submitDriverAccountReview",

{

requestId:pendingReview.requestId,

category,

message,

language:lang,

declarationAccepted:true

}

);

if(currentGeneration!==generation)return;

if(

result?.accepted!==true

||result.driverUid!==uid

||!validId(result.referenceId)

){

throw new Error("Request rejected");

}

pendingReview=null;

// Wait for authoritative review record.

reviewStateKnown=false;

$("reviewForm").reset();

$("characterCount").textContent="0";

$("reviewStatus").textContent=

t.reviewSent+" "+result.referenceId;

subscribeReview();

}catch(e){

if(currentGeneration!==generation)return;

$("reviewStatus").textContent=t.error;

}finally{

if(currentGeneration===generation){

submitting=false;

updateControls();

}

}

};

// MANUAL REFRESH

$("refreshButton").onclick=async()=>{

if(!validSession()
||!account
||refreshing)return;

const currentGeneration=generation;

refreshing=true;

updateControls();

$("refreshStatus").textContent=t.loading;

try{

const result=await serverCall(

"getDriverAccountStatus"

);

if(currentGeneration!==generation)return;

if(result?.success!==true
||result.driverUid!==uid){

throw new Error("Refresh rejected");

}

await syncServerTime();

if(currentGeneration!==generation)return;

subscribeAccount();

subscribeReview();

$("refreshStatus").textContent="";

}catch(e){

if(currentGeneration!==generation)return;

$("refreshStatus").textContent=t.error;

}finally{

if(currentGeneration===generation){

refreshing=false;

updateControls();

}

}

};

// CLEAR SESSION

function disconnect(){

generation++;

authorized=false;

uid=null;

account=null;

reviewRecord=null;

reviewStateKnown=false;

if(accountUnsubscribe){

accountUnsubscribe();

accountUnsubscribe=null;

}

if(reviewUnsubscribe){

reviewUnsubscribe();

reviewUnsubscribe=null;

}

stopGps();

gpsSending=false;

lastGpsSent=0;

serverOffset=null;

serverSyncAt=0;

refreshing=false;

checkingSession=false;

submitting=false;

loggingOut=false;

pendingReview=null;

$("content").hidden=true;

$("accessPanel").hidden=true;

$("logoutButton").hidden=true;

$("reviewRecord").hidden=true;

$("reviewPanel").hidden=true;

$("dashboardLink").hidden=true;

$("reviewForm").reset();

$("characterCount").textContent="0";

$("reviewStatus").textContent="";

$("refreshStatus").textContent="";

document.querySelectorAll(

"#content strong[id]"

).forEach(el=>{

el.textContent="—";

});

$("adminMessage").textContent="—";

$("restrictionReason").textContent="";

$("statusDescription").textContent="";

$("hireDescription").textContent="";

$("hireReasons").textContent="";

updateControls();

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// LIMITED ACCOUNT STATUS AUTHORIZATION

async function verifyAccount(user){

disconnect();

const currentGeneration=generation;

if(!user||!db||!functions){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.connectionLost);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(currentGeneration!==generation)return;

const provider=token.signInProvider;

// A verified phone session can only access
// limited registration/account-status data.

const driverLogin=

provider==="custom"

&&token.claims.driver===true;

const phoneSession=

provider==="phone"

&&typeof user.phoneNumber==="string"

&&user.phoneNumber.length>0;

if(!driverLogin&&!phoneSession){

throw new Error("Invalid authentication");

}

const response=await httpsCallable(

functions,

"verifyDriverAccountStatusSession"

)({});

if(

currentGeneration!==generation

||auth.currentUser?.uid!==user.uid

){

return;

}

const result=response.data;

if(

result?.authorized!==true

||result.uid!==user.uid

||!ACCOUNT_STATES.includes(result.status)

||result.scope!=="account_status"

){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

subscribeAccount();

subscribeReview();

syncServerTime()

.then(()=>{

if(currentGeneration===generation){

renderDocuments();

}

})

.catch(()=>{});

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyAccount);

}

// LOGOUT

$("logoutButton").onclick=async()=>{

if(!validSession()
||!account
||loggingOut)return;

if(account.availability==="busy"){

status(t.busyLogout);

return;

}

if(!window.confirm(t.confirmLogout)){

return;

}

const currentGeneration=generation;

loggingOut=true;

updateControls();

try{

const result=await serverCall(

"endDriverAccountStatusSession"

);

if(currentGeneration!==generation)return;

if(result?.accepted!==true){

throw new Error("Logout rejected");

}

await signOut(auth);

location.replace(

"./driver-login.html?lang="+lang

);

}catch(e){

if(currentGeneration!==generation)return;

status(t.error);

}finally{

if(currentGeneration===generation){

loggingOut=false;

updateControls();

}

}

};

// AUTOMATIC DOCUMENT EXPIRY DISPLAY

setInterval(()=>{

if(!validSession()||!account)return;

renderDocuments();

},10000);

// AUTOMATIC SESSION VERIFICATION

setInterval(async()=>{

if(!validSession()
||checkingSession)return;

const currentGeneration=generation;

checkingSession=true;

try{

const result=await serverCall(

"verifyDriverAccountStatusSession"

);

if(currentGeneration!==generation)return;

if(

result?.authorized!==true

||result.uid!==uid

||result.scope!=="account_status"

||!ACCOUNT_STATES.includes(result.status)

){

denyAccess();

return;

}

try{

await syncServerTime();

}catch(e){

serverOffset=null;

}

if(currentGeneration!==generation)return;

renderDocuments();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

if(currentGeneration===generation){

checkingSession=false;

}

}

},60000);

// INTERNET MONITORING

window.addEventListener("offline",()=>{

disconnect();

status(t.connectionLost);

});

window.addEventListener("online",()=>{

if(auth){

verifyAccount(auth.currentUser);

}

});

// PAGE VISIBILITY

document.addEventListener(

"visibilitychange",

()=>{

if(document.hidden
||!validSession())return;

if(serverNow()===null){

const currentGeneration=generation;

syncServerTime()

.then(()=>{

if(currentGeneration===generation){

renderDocuments();

}

})

.catch(()=>{});

}

}

);

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyAccount(auth.currentUser);

}

}

);

updateControls();

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">

<title>MY RIDE - Booking</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#111111;
color:white;
font-family:Arial,sans-serif;
}

main{
max-width:550px;
margin:auto;
padding:20px;
}

h1{
color:#FFD600;
text-align:center;
margin-bottom:5px;
}

.country{
text-align:center;
color:#FFD600;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.5;
}

label{
display:block;
margin:20px 0 8px;
font-weight:bold;
line-height:1.5;
}

input,select{
width:100%;
padding:15px;
background:#252525;
color:white;
border:1px solid #666;
border-radius:9px;
font-size:16px;
min-width:0;
color-scheme:dark;
}

button{
width:100%;
padding:16px;
margin:10px 0;
border:0;
border-radius:10px;
background:#FFD600;
color:#111111;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.5;
cursor:not-allowed;
}

#map{
height:330px;
width:100%;
border-radius:12px;
margin:15px 0;
color:#111;
}

.map-buttons{
display:flex;
gap:8px;
}

.map-buttons button{
font-size:13px;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin-top:20px;
}

.result-row{
display:flex;
justify-content:space-between;
gap:10px;
padding:12px 0;
border-bottom:1px solid #444;
}

.result-row strong{
color:#FFD600;
text-align:right;
}

#status{
color:#FFD600;
line-height:1.6;
overflow-wrap:anywhere;
}

#mapHint{
font-size:14px;
line-height:1.6;
}

a{
color:#FFD600;
text-decoration:none;
}

.back{
display:block;
text-align:center;
padding:25px;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">SRI LANKA</div>

<h2 data-t="heading"></h2>

<form id="bookingForm">

<label for="name" data-t="name"></label>

<input id="name"
type="text"
autocomplete="name"
maxlength="100"
required>

<label for="phone" data-t="phone"></label>

<input id="phone"
type="tel"
autocomplete="tel"
placeholder="07XXXXXXXX"
maxlength="16"
required>

<label for="pickup" data-t="pickup"></label>

<input id="pickup"
type="text"
maxlength="200"
required>

<label data-t="gps"></label>

<button type="button"
id="gpsButton"
data-t="getGPS"></button>

<input id="coordinates"
type="text"
readonly>

<label for="destination"
data-t="destination"></label>

<input id="destination"
type="text"
maxlength="200"
required>

<div class="map-buttons">

<button type="button"
id="pickupMode"
data-t="pinPickup"></button>

<button type="button"
id="destinationMode"
data-t="pinDestination"></button>

</div>

<p id="mapHint" data-t="mapHint"></p>

<div id="map"></div>

<label for="date" data-t="date"></label>

<input id="date" type="date" required>

<label for="time" data-t="time"></label>

<input id="time" type="time" required>

<label for="passengers"
data-t="passengers"></label>

<select id="passengers" required></select>

<label for="vehicle"
data-t="vehicle"></label>

<select id="vehicle" required></select>

<button type="submit"
id="calculateButton"
data-t="calculate"></button>

</form>

<p id="status" role="status"
aria-live="polite"></p>

<section id="result"
class="panel" hidden>

<h2 data-t="estimate"></h2>

<div class="result-row">
<span data-t="distance"></span>
<strong id="distanceResult"></strong>
</div>

<div class="result-row">
<span data-t="duration"></span>
<strong id="durationResult"></strong>
</div>

<div class="result-row">
<span data-t="period"></span>
<strong id="periodResult"></strong>
</div>

<div class="result-row">
<span data-t="weather"></span>
<strong id="weatherResult"></strong>
</div>

<div class="result-row">
<span data-t="road"></span>
<strong id="roadResult"></strong>
</div>

<div class="result-row">
<span data-t="discount"></span>
<strong id="discountResult"></strong>
</div>

<div class="result-row">
<span data-t="fare"></span>
<strong id="fareResult"></strong>
</div>

<p data-t="estimateNote"></p>

<button type="button"
id="continueButton"
data-t="continue"></button>

</section>

<a id="backButton"
class="back"
href="./customer.html"
data-t="back"></a>

<footer>© MY RIDE SRI LANKA</footer>

</main>

savedLanguage =
localStorage.getItem("myride_language");
}catch(e){}

new URLSearchParams(location.search).get("lang");

const lang = languages.includes(urlLanguage)
? urlLanguage
: languages.includes(savedLanguage)
? savedLanguage
: "si";

document.documentElement.lang = lang;

try{
localStorage.setItem("myride_language",lang);

const t = translations[lang];

document.querySelectorAll("[data-t]")
.forEach(element=>{

element.textContent =
t[element.dataset.t];

});

document.title = "MY RIDE - "+t.heading;

$("backButton").href =
"./customer.html?lang="+lang;


// SRI LANKA DATE AND TIME

function sriLankaNow(){

return new Date(
Date.now()+330*60000
).toISOString();

}

$("date").min =
sriLankaNow().slice(0,10);

$("date").value =
sriLankaNow().slice(0,10);

$("time").value =
sriLankaNow().slice(11,16);


// AUTOMATIC VEHICLE FILTER

const vehicles = {

bike:{capacity:1,min:100,day:60,night:75},

tuk:{capacity:3,min:150,day:90,night:110},

car:{capacity:4,min:200,day:120,night:150},

van:{capacity:10,min:300,day:160,night:200}

};

for(let i=1;i<=10;i++){

$("passengers").add(
new Option(i,i)
);

}

function filterVehicles(){

const passengers =
Number($("passengers").value);

const previous = $("vehicle").value;

$("vehicle").replaceChildren();

$("vehicle").add(
new Option(t.choose,"")
);

Object.entries(vehicles)
.forEach(([key,vehicle])=>{

if(passengers<=vehicle.capacity){

$("vehicle").add(
new Option(t[key],key)
);

}

});

if([...$("vehicle").options]
.some(o=>o.value===previous)){

$("vehicle").value=previous;

}

}

$("passengers").addEventListener(
"change",filterVehicles
);

filterVehicles();


// MAP AND GPS

let map=null;

let pickupPoint=null;

let destinationPoint=null;

let pickupMarker=null;

let destinationMarker=null;

let routeLine=null;

let mode="pickup";

let bookingDraft=null;

let revision=0;

function status(message){

$("status").textContent=message;

}

function invalidate(){

revision++;

bookingDraft=null;

$("result").hidden=true;

if(map&&routeLine){

map.removeLayer(routeLine);

routeLine=null;

}

}

$("bookingForm").addEventListener(
"input",invalidate
);

function inSriLanka(lat,lon){

return lat>=5.85&&lat<=9.9
&&lon>=79.5&&lon<=82.0;

}

function setPoint(type,lat,lon){

if(!inSriLanka(lat,lon)){

status(t.outside);

return false;

}

invalidate();

const point={lat,lon};

const coordinates =
lat.toFixed(6)+", "+lon.toFixed(6);

if(type==="pickup"){

pickupPoint=point;

$("coordinates").value=coordinates;

if(!$("pickup").value.trim()){

$("pickup").value=coordinates;

}

if(pickupMarker){

pickupMarker.setLatLng([lat,lon]);

}else{

pickupMarker=L.marker([lat,lon])
.addTo(map);

}

pickupMarker.bindTooltip(t.pickup);

}else{

destinationPoint=point;

if(!$("destination").value.trim()){

$("destination").value=coordinates;

}

if(destinationMarker){

destinationMarker.setLatLng([lat,lon]);

}else{

destinationMarker=L.marker([lat,lon])
.addTo(map);

}

destinationMarker.bindTooltip(
t.destination
);

}

return true;

}

if(typeof L!=="undefined"){

map=L.map("map")
.setView([7.8731,80.7718],7);

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}
).addTo(map);

map.on("click",event=>{

if(setPoint(
mode,
event.latlng.lat,
event.latlng.lng
)){

status(mode==="pickup"
?t.pickup:t.destination);

if(mode==="pickup"){

mode="destination";

}

}

});

}else{

status(t.mapError);

$("calculateButton").disabled=true;

}

$("pickupMode").onclick=()=>{

mode="pickup";

status(t.pinPickup);

};

$("destinationMode").onclick=()=>{

mode="destination";

status(t.pinDestination);

};


// GPS LOCATION

$("gpsButton").onclick=()=>{

if(!navigator.geolocation||!map){

status(t.gpsError);

return;

}

status(t.gpsLoading);

$("gpsButton").disabled=true;

navigator.geolocation.getCurrentPosition(

position=>{

$("gpsButton").disabled=false;

const lat=position.coords.latitude;

const lon=position.coords.longitude;

if(setPoint("pickup",lat,lon)){

map.setView([lat,lon],16);

mode="destination";

status(t.gpsSuccess);

}

},

()=>{

$("gpsButton").disabled=false;

status(t.gpsError);

},

{
enableHighAccuracy:true,
timeout:20000,
maximumAge:0
}

);

};


// AUTOMATIC FARE CALCULATION

function calculateFare(
distance,
vehicleType,
night,
rain
){

const vehicle=vehicles[vehicleType];

const base=night
?vehicle.night:vehicle.day;

const rainExtra=rain?15:0;

const limits=[10,25,50,100,Infinity];

let remaining=distance;

let previousLimit=0;

let total=0;

let discount=0;

for(let i=0;i<limits.length;i++){

const width=limits[i]-previousLimit;

const km=Math.min(remaining,width);

if(km<=0)break;

const reduction=i*10;

total+=km*(base-reduction+rainExtra);

discount+=km*reduction;

remaining-=km;

previousLimit=limits[i];

}

return {

fare:Math.ceil(
Math.max(total,vehicle.min)
),

discount:Math.round(discount)

};

}


// NETWORK REQUEST WITH TIMEOUT

async function getJSON(url){

const controller=new AbortController();

const timeout=setTimeout(
()=>controller.abort(),15000
);

try{

const response=await fetch(url,{
signal:controller.signal
});

if(!response.ok){

throw new Error("Network error");

}

return await response.json();

}finally{

clearTimeout(timeout);

}

}


// WEATHER FORECAST

async function getWeather(point,date,time){

try{

const url=new URL(
"https://api.open-meteo.com/v1/forecast"
);

url.searchParams.set(
"latitude",point.lat
);

url.searchParams.set(
"longitude",point.lon
);

url.searchParams.set(
"hourly","precipitation"
);

url.searchParams.set(
"timezone","Asia/Colombo"
);

url.searchParams.set("start_date",date);

url.searchParams.set("end_date",date);

const data=await getJSON(url);

const hour=date+"T"+time.slice(0,2)+":00";

const index=data.hourly.time.indexOf(hour);

const amount=data.hourly.precipitation[index];

if(!Number.isFinite(amount)){

return null;

}

return amount>0;

}catch(error){

return null;

}

}


// VALIDATE AND CALCULATE ROUTE

$("bookingForm").addEventListener(
"submit",
async event=>{

event.preventDefault();

invalidate();

if(!pickupPoint||!destinationPoint){

status(t.pinError);

return;

}

const phone=$("phone").value
.replace(/[\s-]/g,"");

if(!/^(?:\+94|94|0)7\d{8}$/.test(phone)){

status(t.phoneError);

return;

}

const date=$("date").value;

const time=$("time").value;

const travelTime=new Date(
date+"T"+time+":00+05:30"
).getTime();

if(!Number.isFinite(travelTime)
||travelTime<Date.now()-60000){

status(t.dateError);

return;

}

const vehicleType=$("vehicle").value;

const passengers=Number(
$("passengers").value
);

if(!vehicles[vehicleType]
||passengers>vehicles[vehicleType].capacity){

return;

}

const pickup={...pickupPoint};

const destination={...destinationPoint};

const currentRevision=revision;

$("calculateButton").disabled=true;

status(t.loading);

try{

const routeURL=
"https://router.project-osrm.org/route/v1/driving/"
+pickup.lon+","+pickup.lat+";"
+destination.lon+","+destination.lat
+"?overview=full&geometries=geojson";

const [routeData,rain]=await Promise.all([

getJSON(routeURL),

getWeather(pickup,date,time)

]);

if(currentRevision!==revision)return;

if(routeData.code!=="Ok"
||!routeData.routes?.length){

throw new Error("No route");

}

const route=routeData.routes[0];

const distance=route.distance/1000;

const duration=Math.ceil(
route.duration/60
);

if(!Number.isFinite(distance)
||distance<=0
||!Number.isFinite(duration)){

throw new Error("Invalid route");

}

const hour=Number(time.slice(0,2));

const night=hour>=20||hour<8;

const result=calculateFare(
distance,
vehicleType,
night,
rain===true
);

routeLine=L.geoJSON(
route.geometry,
{
style:{
color:"#1677FF",
weight:5
}
}
).addTo(map);

map.fitBounds(
routeLine.getBounds(),
{padding:[25,25]}
);

$("distanceResult").textContent=
distance.toFixed(2)+" KM";

$("durationResult").textContent=
duration+" min";

$("periodResult").textContent=
night?t.night:t.day;

$("weatherResult").textContent=
rain===null?t.unknown:
rain?t.rain:t.dry;

$("roadResult").textContent=
t.unknown;

$("discountResult").textContent=
"LKR "+result.discount.toLocaleString();

$("fareResult").textContent=
"LKR "+result.fare.toLocaleString();

bookingDraft={

language:lang,

name:$("name").value.trim(),

phone,

pickupName:$("pickup").value.trim(),

pickup,

destinationName:
$("destination").value.trim(),

destination,

date,

time,

passengers,

vehicle:vehicleType,

estimatedDistance:distance,

estimatedDuration:duration,

night,

rainForecast:rain,

difficultRoadVerified:false,

discount:result.discount,

estimatedFare:result.fare,

status:"draft"

};

$("result").hidden=false;

status("");

$("result").scrollIntoView({
behavior:"smooth"
});

}catch(error){

if(currentRevision===revision){

status(t.routeError);

}

}finally{

$("calculateButton").disabled=false;

}

});


// CONTINUE TO CONFIRMATION PAGE

$("continueButton").onclick=()=>{

if(!bookingDraft)return;

try{

sessionStorage.setItem(
"myride_booking_draft",
JSON.stringify(bookingDraft)
);

}catch(error){

status(t.storageError);

return;

}

location.href=
"./booking-confirm.html?lang="+lang;

};

</script>

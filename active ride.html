}

.row strong{
color:#FFD600;
text-align:right;

button,.action{

width:100%;
padding:16px;
margin:12px 0;
border:0;
border-radius:10px;
background:#FFD600;
color:#111;
font-size:16px;
font-weight:bold;

}

.back{

text-align:center;

text-decoration:none;
}

text-align:center;
color:#4ADE80;
font-weight:bold;
padding:12px;
}

.note{
text-align:center;
color:#AAA;
font-size:13px;
line-height:1.7;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA

</div>

</div>

<div class="row">

</div>

<div class="row">

<span data-t="weather"></span>

<strong id="weather">—</strong>

<div class="row">

<span data-t="road"></span>

<div class="row">

<span data-t="discount"></span>

</div>

function validBookingId(id){

&& /^[A-Za-z0-9_-]{1,128}$/.test(id);

// LIVE METER STATE

// FORMAT FARE

function money(amount){

if(!Number.isFinite(amount)
||amount<0){

return "—";

}

return "LKR "+amount.toLocaleString(

"en-LK",

{

minimumFractionDigits:2,

maximumFractionDigits:2

}

);

}


// FORMAT DISTANCE

function formatDistance(metres){

if(!Number.isFinite(metres)
||metres<0){

return "—";

}

return (metres/1000).toFixed(2)+" KM";

}


// FORMAT DURATION

function formatDuration(seconds){

if(!Number.isFinite(seconds)
||seconds<0){

return "—";

}

const total=Math.floor(seconds);

const hours=Math.floor(total/3600);

const minutes=Math.floor(
(total%3600)/60
);

const secs=total%60;

return [

hours,

minutes,

secs

].map(value=>

String(value).padStart(2,"0")

).join(":");

}


// VALIDATE SERVER METER

function validMeter(data){

return data

&& Number.isFinite(data.distanceMeters)

&& data.distanceMeters>=0

&& Number.isFinite(data.durationSeconds)

&& data.durationSeconds>=0

&& Number.isFinite(data.currentFare)

&& data.currentFare>=0;

}


// CLEAR METER

function clearMeter(){

currentMeter=null;

lastUpdated=0;

$("meterPanel").hidden=true;

$("liveIndicator").hidden=true;

$("paymentButton").hidden=true;

$("thanks").hidden=true;

$("fare").textContent="—";

$("distance").textContent="—";

$("duration").textContent="—";

$("period").textContent="—";

$("weather").textContent="—";

$("road").textContent="—";

$("discount").textContent="—";

$("gps").textContent="—";

$("updated").textContent="";

}


// STOP LIVE METER

function stopMeter(){

meterGeneration++;

if(meterUnsubscribe){

meterUnsubscribe();

meterUnsubscribe=null;

}

if(freshnessTimer){

clearInterval(freshnessTimer);

freshnessTimer=null;

}

currentMeter=null;

lastUpdated=0;

}


// DISPLAY WEATHER

function weatherText(value){

if(value==="rain")return t.rain;

if(value==="dry")return t.dry;

if(value==="mixed")return t.mixed;

return t.unknown;

}


// DISPLAY ROAD CONDITION

function roadText(value){

if(value==="normal")return t.normal;

if(value==="difficult")return t.difficult;

if(value==="mixed")return t.mixed;

return t.unknown;

}


// DISPLAY SERVER METER

function displayMeter(data){

if(rideStatus!=="active")return;

if(!validMeter(data)){

clearMeter();

status(t.meterWaiting);

return;

}

const updatedAt=

data.updatedAt?.toMillis?.();

if(!Number.isFinite(updatedAt)

||updatedAt>Date.now()+30000){

clearMeter();

status(t.stale);

return;

}

currentMeter=data;

lastUpdated=updatedAt;

$("heading").textContent=t.heading;

$("fareLabel").textContent=t.fare;

$("fare").textContent=

money(data.currentFare);

$("distance").textContent=

formatDistance(data.distanceMeters);

$("duration").textContent=

formatDuration(data.durationSeconds);

$("period").textContent=

data.period==="night"?t.night:

data.period==="day"?t.day:t.unknown;

$("weather").textContent=

weatherText(data.weatherStatus);

$("road").textContent=

roadText(data.roadStatus);

$("discount").textContent=

money(data.distanceDiscount);

$("gps").textContent=

data.gpsActive===true?t.gpsActive:

data.gpsActive===false?t.gpsInactive:

t.unknown;

$("updated").textContent=

t.updated+": "+

new Date(updatedAt).toLocaleTimeString(

"en-GB",

{

timeZone:"Asia/Colombo"

}

);

$("meterPanel").hidden=false;

$("detailsPanel").hidden=false;

$("thanks").hidden=true;

$("paymentButton").hidden=true;

checkFreshness();

}


// GPS AND METER FRESHNESS

function checkFreshness(){

if(!currentMeter

||rideStatus!=="active")return;

const age=Date.now()-lastUpdated;

if(age>30000||!navigator.onLine){

$("liveIndicator").hidden=true;

$("gps").textContent=t.unknown;

status(

navigator.onLine

?t.stale

:t.offline

);

return;

}

$("liveIndicator").hidden=false;

status(t.active);

}


// LIVE FIREBASE METER

function subscribeMeter(){

if(meterUnsubscribe)return;

const generation=++meterGeneration;

const meterRef=doc(

db,

"bookings",

bookingId,

"meter",

"current"

);

meterUnsubscribe=onSnapshot(

meterRef,

{

includeMetadataChanges:true

},

snapshot=>{

if(generation!==meterGeneration

||rideStatus!=="active")return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

clearMeter();

status(t.meterWaiting);

return;

}

if(!snapshot.exists()){

clearMeter();

status(t.meterWaiting);

return;

}

displayMeter(snapshot.data());

},

error=>{

if(generation!==meterGeneration)return;

stopMeter();

clearMeter();

status(

error.code==="permission-denied"

?t.denied:t.error

);

$("retryButton").hidden=false;

}

);

freshnessTimer=setInterval(

checkFreshness,

1000

);

}


// FINAL RIDE RESULT

function displayFinalRide(data){

stopMeter();

clearMeter();

const final=data.finalMeter;

if(!final

||!Number.isFinite(final.finalFare)

||final.finalFare<0

||!Number.isFinite(final.distanceMeters)

||final.distanceMeters<0

||!Number.isFinite(final.durationSeconds)

||final.durationSeconds<0){

status(t.meterWaiting);

return;

}

$("heading").textContent=t.completed;

$("fareLabel").textContent=t.finalFare;

$("fare").textContent=

money(final.finalFare);

$("distance").textContent=

formatDistance(final.distanceMeters);

$("duration").textContent=

formatDuration(final.durationSeconds);

$("meterPanel").hidden=false;

$("detailsPanel").hidden=true;

$("liveIndicator").hidden=true;

$("updated").textContent="";

$("thanks").hidden=false;

$("paymentButton").href=

"./payments.html?lang="+lang

+"&booking="+encodeURIComponent(bookingId);

$("paymentButton").hidden=false;

status(t.completed);

}


// BOOKING STATUS SYSTEM

function displayBooking(data){

rideStatus=data.status;

$("trackingButton").hidden=true;

$("retryButton").hidden=true;

switch(data.status){

case "active":

$("heading").textContent=t.heading;

if(!currentMeter){

status(t.meterWaiting);

}

subscribeMeter();

break;

case "accepted":

case "arrived":

stopMeter();

clearMeter();

status(t.waiting);

$("trackingButton").href=

"./tracking.html?lang="+lang

+"&booking="+encodeURIComponent(bookingId);

$("trackingButton").hidden=false;

break;

case "completed":

displayFinalRide(data);

break;

case "cancelled":

stopMeter();

clearMeter();

status(t.cancelled);

break;

default:

stopMeter();

clearMeter();

status(t.waiting);

}

}


// DISCONNECT

function disconnect(){

if(bookingUnsubscribe){

bookingUnsubscribe();

bookingUnsubscribe=null;

}

rideStatus=null;

stopMeter();

clearMeter();

$("trackingButton").hidden=true;

}


// SECURE BOOKING CONNECTION

function connect(){

disconnect();

$("heading").textContent=t.heading;

$("retryButton").hidden=true;

if(!validBookingId(bookingId)){

status(t.missing);

return;

}

if(!auth||!db){

status(t.error);

return;

}

if(!currentUser){

status(t.auth);

return;

}

if(!navigator.onLine){

status(t.offline);

$("retryButton").hidden=false;

return;

}

status(t.connecting);

const bookingRef=doc(

db,

"bookings",

bookingId

);

bookingUnsubscribe=onSnapshot(

bookingRef,

{

includeMetadataChanges:true

},

snapshot=>{

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

rideStatus=null;

stopMeter();

clearMeter();

$("trackingButton").hidden=true;

status(t.connecting);

return;

}

if(!snapshot.exists()){

rideStatus=null;

stopMeter();

clearMeter();

$("trackingButton").hidden=true;

status(t.missing);

return;

}

const data=snapshot.data();

if(data.customerUid!==currentUser?.uid){

disconnect();

status(t.denied);

return;

}

displayBooking(data);

},

error=>{

disconnect();

status(

error.code==="permission-denied"

?t.denied:t.error

);

$("retryButton").hidden=false;

}

);

}


// AUTHENTICATION CHECK

if(auth&&db){

onAuthStateChanged(

auth,

user=>{

currentUser=user;

connect();

},

()=>{

disconnect();

status(t.auth);

}

);

}


// NETWORK RECOVERY

$("retryButton").onclick=connect;

window.addEventListener(

"offline",

()=>{

disconnect();

status(t.offline);

$("retryButton").hidden=false;

}

);

window.addEventListener(

"online",

connect

);

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted){

connect();

}

}

);

</script>

</body>

<!DOCTYPE html>

<head>

<meta charset="UTF-8">
<meta name="viewport"

<meta name="robots"

<title>MY RIDE - Income & Reports</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1100px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:20px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
}

.tableWrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:550px;
font-size:13px;
}

th,td{
border:1px solid #555;
padding:11px;
text-align:left;
overflow-wrap:anywhere;
}

th{
background:#FFD600;
color:#111;
}

td{
background:#292929;
}

.barRow{
margin:16px 0;
}

.barLabel{
display:flex;
justify-content:space-between;
gap:10px;
font-size:13px;
margin-bottom:6px;
}

.barTrack{
height:22px;
background:#444;
border-radius:5px;
overflow:hidden;
}

.barFill{
height:100%;
background:#FFD600;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

@media(max-width:420px){

.stat{
padding:10px;
}

.stat strong{
font-size:16px;
}

}

@media print{

body{
background:white;
color:black;
}

main{
max-width:none;
padding:0;
}

button,.action,.languages,
.noPrint,#status,#result,
#accessPanel,footer{
display:none!important;
}

.panel,.stat,.record{
background:white;
color:black;
border:1px solid #aaa;
break-inside:avoid;
}

h1,h2,h3,h4,
.country,.stat strong,.note{
color:black;
}

th,td{
background:white;
color:black;
border:1px solid #aaa;
}

table{
min-width:0;
}

.barFill{
background:#777;
print-color-adjust:exact;
}

}

</style>

</head>

<main>

<h1>MY RIDE</h1>

<div class="country">

<h2 data-t="heading">

<section class="panel noPrint">

<label for="period"

<select id="period">

<option value="today"

<option value="week"
data-t="week"></option>

<option value="month"
data-t="month"></option>

<option value="year"
data-t="year"></option>

<option value="custom"

</select>

<label for="fromDate"

<input id="fromDate"
type="date">

<label for="toDate"
data-t="toDate"></label>

<input id="toDate"
type="date">

<label for="vehicle"
data-t="vehicle"></label>

<select id="vehicle">

<option value="all"
data-t="all"></option>

<option value="bike"
data-t="bike"></option>

<option value="tuk"
data-t="tuk"></option>

<option value="car"
data-t="car"></option>

<option value="van"
data-t="van"></option>

</select>

<label for="district"
data-t="district"></label>

<select id="district"></select>

<button id="generateReport"
data-t="generate"></button>

</section>

<div id="reportContent" hidden>

<section class="panel">

<h3 data-t="reportSummary"></h3>

<div id="reportPeriod"
class="record"></div>

<div id="reportSummary"
class="grid"></div>

</section>

<section class="panel">

<h3 data-t="bookingReport"></h3>

<div id="bookingSummary"
class="grid"></div>

</section>

<section class="panel">

<h3 data-t="paymentReport"></h3>

<div id="paymentSummary"
class="grid"></div>

</section>

<section class="panel">

<h3 data-t="vehicleReport"></h3>

<div id="vehicleReport"
class="tableWrap"></div>

</section>

<section class="panel">

<h3 data-t="districtReport"></h3>

<div id="districtReport"
class="tableWrap"></div>

</section>

<section class="panel">

<h3 data-t="incomeChart"></h3>

<div id="incomeChart"></div>

</section>

<section class="panel">

<h3 data-t="dailyReport"></h3>

<div id="dailyReport"
class="tableWrap"></div>

</section>

<section class="panel noPrint">

<h3 data-t="exportReport"></h3>

<button id="downloadCSV"
data-t="csv"></button>

<button id="printReport"
data-t="print"></button>

</section>

</div>

<section class="panel noPrint">

<h3 data-t="relatedPages"></h3>

<a id="commissionLink"
class="action"
data-t="commissionPage"></a>

<a id="paymentsLink"
class="action"
data-t="paymentsPage"></a>

<a id="bookingsLink"
class="action"
data-t="bookingsPage"></a>

</section>

<p id="result"
class="message"
role="status"
aria-live="polite"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

function validCount(value){

return Number.isSafeInteger(value)

&&value>=0;

}

function validAmount(value){

return Number.isSafeInteger(value)

&&value>=0

&&value<=1000000000000000;

}

function validTime(value){

return Number.isFinite(value)

&&value>0

&&value<=8640000000000000;

}

function validDate(value){

if(typeof value!=="string"

||!/^\d{4}-\d{2}-\d{2}$/.test(value)){

return false;

}

const date=new Date(value+"T00:00:00Z");

return Number.isFinite(date.getTime())

&&date.toISOString().slice(0,10)===value;

}

function sriLankaToday(){

const parts=new Intl.DateTimeFormat("en-GB",{

timeZone:"Asia/Colombo",

year:"numeric",

month:"2-digit",

day:"2-digit"

}).formatToParts(new Date());

const get=type=>

parts.find(part=>part.type===type)?.value;

return get("year")+"-"+get("month")+"-"+get("day");

}

function money(cents){

if(!validAmount(cents))return "—";

return new Intl.NumberFormat("en-LK",{

style:"currency",

currency:"LKR",

minimumFractionDigits:2

}).format(cents/100);

}

function formatDate(value){

if(!validTime(value))return "—";

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(value));

}

function distance(meters){

return (meters/1000).toLocaleString("en-LK",{

}

+data.extraChargesCents;

data.totalPaidCents+data.totalUnpaidCents

&&["today","week","month","year"]

.every(key=>validAmount(data.receipts?.[key]));

}

function validSummary(data){

return validFinancial(data)

&&bookingFields.every(([,key])=>

validCount(data[key]))

&&data.totalBookings===

data.completedBookings

+data.cancelledBookings

+data.activeBookings

+data.noDriverBookings

+data.otherBookings

&&validAmount(data.totalPaidCents)

&&validAmount(data.cashPaidCents)

&&validAmount(data.bankPaidCents)

&&validCount(data.pendingPaymentCount)

&&data.totalPaidCents===

data.cashPaidCents+data.bankPaidCents;

}

function validReportRow(row){

return row

&&validCount(row.completedBookings)

&&validAmount(row.totalFareCents)

&&validAmount(row.commissionEarnedCents)

&&validAmount(row.commissionReceivedCents)

&&validAmount(row.driverNetCents)

&&validAmount(row.extraChargesCents)

&&row.totalFareCents===

row.commissionEarnedCents

+row.driverNetCents

+row.extraChargesCents;

}

function uniqueRows(rows,key){

return new Set(rows.map(row=>row[key])).size

===rows.length;

}

function sumMatches(rows,summary){

return [

"completedBookings",

"totalFareCents",

"commissionEarnedCents",

"commissionReceivedCents",

"driverNetCents",

"extraChargesCents"

].every(key=>{

let total=0;

for(const row of rows){

total+=row[key];

if(!Number.isSafeInteger(total))return false;

}

return total===summary[key];

});

}

function validReport(data,query){

if(!data

||!validDate(data.fromDate)

||!validDate(data.toDate)

||data.fromDate>data.toDate

||!validTime(data.generatedAtMs)

||data.vehicle!==query.vehicle

||data.district!==query.district

||data.period!==query.period

||!validSummary(data.summary)){

return false;

}

if(query.period==="custom"

&&(data.fromDate!==query.fromDate

||data.toDate!==query.toDate)){

return false;

}

const days=

(Date.parse(data.toDate+"T00:00:00Z")

-Date.parse(data.fromDate+"T00:00:00Z"))

/86400000+1;

if(days<1||days>366)return false;

if(!Array.isArray(data.byVehicle)

||data.byVehicle.length>4

||!data.byVehicle.every(row=>

validReportRow(row)

&&vehicles.includes(row.vehicle)

&&(query.vehicle==="all"

||row.vehicle===query.vehicle))

||!uniqueRows(data.byVehicle,"vehicle")){

return false;

}

if(!Array.isArray(data.byDistrict)

||data.byDistrict.length>26

||!data.byDistrict.every(row=>

validReportRow(row)

&&(row.district==="unassigned"

||districts.some(item=>item[0]===row.district))

&&(query.district==="all"

||row.district===query.district))

||!uniqueRows(data.byDistrict,"district")){

return false;

}

if(!Array.isArray(data.daily)

||data.daily.length>366

||!data.daily.every(row=>

validReportRow(row)

&&validDate(row.date)

&&row.date>=data.fromDate

&&row.date<=data.toDate)

||!uniqueRows(data.daily,"date")){

return false;

}

return sumMatches(data.byVehicle,data.summary)

&&sumMatches(data.byDistrict,data.summary)

&&sumMatches(data.daily,data.summary);

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,

name,

{timeout:60000}

)(data);

if(currentGeneration!==generation

||!isOwner()){

throw new Error("Session changed");

}

if(response.data?.success!==true

||response.data.ownerUid!==ownerUid){

throw new Error("Invalid server response");

}

return response.data;

}

reportRow(districtName(row.district),row))

);

makeTable(

"dailyReport",

["date",...headers],

sortedDaily().map(row=>

reportRow(row.date,row))

);

renderChart();

}

function readQuery(){

const period=$("period").value;

const vehicle=$("vehicle").value;

const district=$("district").value;

if(!periods.includes(period)

||!["all",...vehicles].includes(vehicle)

||!(district==="all"

||districts.some(row=>row[0]===district))){

throw new Error("invalid");

}

let fromDate=null;

let toDate=null;

if(period==="custom"){

fromDate=$("fromDate").value;

toDate=$("toDate").value;

if(!validDate(fromDate)

||!validDate(toDate)

||fromDate>toDate

||toDate>sriLankaToday()){

throw new Error("invalid");

}

const days=

(Date.parse(toDate+"T00:00:00Z")

-Date.parse(fromDate+"T00:00:00Z"))

/86400000+1;

if(days>366){

throw new Error("rangeLimit");

}

}

return {

period,

vehicle,

district,

fromDate,

toDate,

timeZone:"Asia/Colombo"

};

}

async function loadReport(query){

const response=await serverCall(

"getAdminIncomeReport",

query

);

if(!validReport(response.report,query)){

throw new Error("Invalid report");

}

report=response.report;

lastQuery={...query};

renderReport();

}

async function runRead(callback){

if(!isOwner()||busy)return;

const currentGeneration=generation;

busy=true;

updateControls();

result("loading");

try{

await callback();

if(currentGeneration===generation){

result("ready");

}

}catch(e){

if(currentGeneration===generation){

result("error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

}

$("generateReport").onclick=()=>{

let query;

try{

query=readQuery();

}catch(e){

result(e.message==="rangeLimit"

?"rangeLimit":"invalid");

return;

}

runRead(async()=>{

report=null;

lastQuery=null;

renderReport();

await loadReport(query);

});

};

$("refreshButton").onclick=()=>{

runRead(async()=>{

const query=lastQuery;

overview=null;

report=null;

renderOverview();

renderReport();

await loadOverview();

if(query){

await loadReport(query);

}

});

};

function updateControls(){

const locked=busy||!isOwner();

[

"refreshButton",

"period",

"vehicle",

"district",

"generateReport"

].forEach(id=>{

$(id).disabled=locked;

});

const custom=$("period").value==="custom";

$("fromDate").disabled=locked||!custom;

$("toDate").disabled=locked||!custom;

$("downloadCSV").disabled=locked||!report;

$("printReport").disabled=locked||!report;

}

$("period").onchange=updateControls;

function csvCell(value){

let text=String(value??"");

if(/^[\s]*[=+\-@]/.test(text)

||/^[\t\r\n]/.test(text)){

text="'"+text;

}

return '"'+text.replace(/"/g,'""')+'"';

}

function rawMoney(cents){

return (cents/100).toFixed(2);

}

function exportRow(label,row){

return [

label,

row.completedBookings,

rawMoney(row.totalFareCents),

rawMoney(row.commissionEarnedCents),

rawMoney(row.commissionReceivedCents),

rawMoney(row.driverNetCents),

rawMoney(row.extraChargesCents)

];

}

async function verifyBeforeExport(){

const response=await serverCall(

"getAdminReportExportAuthorization",

{

generatedAtMs:report.generatedAtMs,

fromDate:report.fromDate,

toDate:report.toDate,

vehicle:report.vehicle,

district:report.district

}

);

if(response.authorized!==true){

throw new Error("Export denied");

}

}

$("downloadCSV").onclick=()=>{

if(!isOwner()||!report||busy)return;

runRead(async()=>{

await verifyBeforeExport();

const rows=[

["MY RIDE SRI LANKA"],

[t("heading")],

[t("fromDate"),report.fromDate],

[t("toDate"),report.toDate],

[t("vehicle"),t(report.vehicle)],

[t("district"),districtName(report.district)],

["Currency","LKR"],

["Time Zone","Asia/Colombo"],

[t("generated"),formatDate(report.generatedAtMs)],

[],

[t("reportSummary")]

];

financialFields.forEach(([label,key])=>{

rows.push([

t(label),

rawMoney(report.summary[key])

]);

});

rows.push([], [t("bookingReport")]);

bookingFields.forEach(([label,key,type])=>{

rows.push([

t(label),

type==="distance"

?report.summary[key]/1000

:report.summary[key]

]);

});

rows.push([], [t("paymentReport")]);

paymentFields.forEach(([label,key,type])=>{

rows.push([

t(label),

type==="money"

?rawMoney(report.summary[key])

:report.summary[key]

]);

});

const headers=[

t("completed"),

t("totalFare"),

t("commissionEarned"),

t("commissionReceived"),

t("driverNet"),

t("extraCharges")

];

rows.push(

[],

[t("vehicleReport")],

[t("vehicle"),...headers]

);

report.byVehicle.forEach(row=>{

rows.push(exportRow(t(row.vehicle),row));

});

rows.push(

[],

[t("districtReport")],

[t("district"),...headers]

);

report.byDistrict.forEach(row=>{

rows.push(

exportRow(districtName(row.district),row)

);

});

rows.push(

[],

[t("dailyReport")],

[t("date"),...headers]

);

sortedDaily().forEach(row=>{

rows.push(exportRow(row.date,row));

});

const csv="\uFEFF"+rows.map(row=>

row.map(csvCell).join(",")

).join("\r\n");

const blob=new Blob([csv],{

type:"text/csv;charset=utf-8;"

});

const url=URL.createObjectURL(blob);

const link=document.createElement("a");

link.href=url;

link.download=

"MY-RIDE-REPORT-"

+report.fromDate

+"-"

+report.toDate

+".csv";

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(()=>URL.revokeObjectURL(url),1000);

});

};

$("printReport").onclick=()=>{

if(!isOwner()||!report||busy)return;

runRead(async()=>{

await verifyBeforeExport();

if(isOwner()&&report){

window.print();

}

});

};

document.documentElement.lang=lang;

document.querySelectorAll("[data-t]")

.forEach(element=>{

element.textContent=t(element.dataset.t);

});

$("loginLink").href=

pageLink("admin-login.html");

$("dashboardLink").href=

pageLink("admin-dashboard.html");

$("backLink").href=

pageLink("admin-dashboard.html");

$("commissionLink").href=

pageLink("admin-commission.html");

$("paymentsLink").href=

pageLink("admin-payments.html");

$("bookingsLink").href=

pageLink("admin-bookings.html");

populateDistricts();

}

document.querySelectorAll("[data-lang]")

.forEach(button=>{

button.onclick=()=>{

if(!languages.includes(button.dataset.lang))return;

lang=button.dataset.lang;

try{

localStorage.setItem(

"myride_admin_language",

lang

);

const url=new URL(location.href);

url.searchParams.set("lang",lang);

history.replaceState(null,"",url);

}catch(e){}

};

});

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

overview=null;

report=null;

lastQuery=null;

lastSync=null;

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("reportContent").hidden=true;

$("period").value="today";

$("vehicle").value="all";

$("district").value="all";

$("fromDate").value=sriLankaToday();

$("toDate").value=sriLankaToday();

renderOverview();

renderReport();

result("");

updateControls();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

status("denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

status("offline");

return;

}

status("checking");

try{

const appToken=await getToken(appCheck,false);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

status("verified");

updateControls();

await runRead(()=>loadOverview());

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

setInterval(async()=>{

if(!isOwner()||checking)return;

const currentGeneration=generation;

checking=true;

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation)return;

if(!validOwner(response.data,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||document.hidden)return;

runRead(async()=>{

await loadOverview();

if(lastQuery){

await loadReport(lastQuery);

}

});

},60000);

window.addEventListener("offline",()=>{

clearSession();

status("offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

$("fromDate").value=sriLankaToday();

$("toDate").value=sriLankaToday();

$("fromDate").max=sriLankaToday();

$("toDate").max=sriLankaToday();

renderLanguage();

updateControls();

initializeSecurity();

</script>

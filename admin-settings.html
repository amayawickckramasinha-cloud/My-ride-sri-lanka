<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="robots"
content="noindex,nofollow,noarchive">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - System Settings</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:#fff;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.checkRow{
display:flex;
align-items:center;
gap:12px;
background:#292929;
padding:12px;
border-radius:8px;
margin:8px 0;
}

.checkRow input{
width:22px;
height:22px;
flex-shrink:0;
accent-color:#FFD600;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
padding:14px;
border-radius:9px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
margin-top:10px;
color:#FFD600;
font-size:18px;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.good{
color:#55E68A!important;
}

.bad{
color:#FF7777!important;
}

.warning{
color:#FFB347;
line-height:1.8;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
overflow-wrap:anywhere;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

@media(max-width:450px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
System Settings
</h2>

<div class="languages">
<button data-lang="si">සිංහල</button>
<button data-lang="en">English</button>
<button data-lang="ta">தமிழ்</button>
</div>

<p id="status"
class="message"
role="status"
aria-live="polite">
Checking security...
</p>

<section id="accessPanel"
class="panel"
hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="systemOverview"
class="grid"></div>

<p id="lastUpdate"
class="note"></p>

<p id="settingsVersion"
class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<form id="settingsForm">

<fieldset id="settingsFields"
disabled
style="border:0;padding:0;margin:0">

<section class="panel">

<h3 data-t="generalSettings"></h3>

<label for="appName"
data-t="appName"></label>

<input id="appName"
value="MY RIDE"
readonly>

<label for="country"
data-t="country"></label>

<input id="country"
value="Sri Lanka"
readonly>

<label for="currency"
data-t="currency"></label>

<input id="currency"
value="LKR"
readonly>

<label for="timeZone"
data-t="timeZone"></label>

<input id="timeZone"
value="Asia/Colombo"
readonly>

<label for="defaultLanguage"
data-t="defaultLanguage"></label>

<select id="defaultLanguage">
<option value="si">සිංහල</option>
<option value="en">English</option>
<option value="ta">தமிழ்</option>
</select>

</section>

<section class="panel">

<h3 data-t="serviceSettings"></h3>

<label class="checkRow">
<input id="customerBooking"
type="checkbox">
<span data-t="customerBooking"></span>
</label>

<label class="checkRow">
<input id="driverRegistration"
type="checkbox">
<span data-t="driverRegistration"></span>
</label>

<label class="checkRow">
<input id="driverLogin"
type="checkbox">
<span data-t="driverLogin"></span>
</label>

<label class="checkRow">
<input id="automaticMatching"
type="checkbox">
<span data-t="automaticMatching"></span>
</label>

<label class="checkRow">
<input id="scheduledBooking"
type="checkbox">
<span data-t="scheduledBooking"></span>
</label>

<p class="note"
data-t="serviceNotice"></p>

</section>

<section class="panel">

<h3 data-t="matchingSettings"></h3>

<label for="searchRadius"
data-t="searchRadius"></label>

<select id="searchRadius">
<option value="1">1 KM</option>
<option value="2">2 KM</option>
<option value="3">3 KM</option>
<option value="5">5 KM</option>
<option value="10">10 KM</option>
<option value="15">15 KM</option>
<option value="20">20 KM</option>
<option value="25">25 KM</option>
</select>

<label for="offerTimeout"
data-t="offerTimeout"></label>

<select id="offerTimeout">
<option value="30">30 Seconds</option>
<option value="45">45 Seconds</option>
<option value="60">60 Seconds</option>
<option value="90">90 Seconds</option>
<option value="120">120 Seconds</option>
</select>

<label for="maximumAttempts"
data-t="maximumAttempts"></label>

<select id="maximumAttempts">
<option value="3">3</option>
<option value="5">5</option>
<option value="10">10</option>
<option value="15">15</option>
<option value="20">20</option>
</select>

<p class="note"
data-t="matchingNotice"></p>

</section>

<section class="panel">

<h3 data-t="gpsSettings"></h3>

<label for="gpsInterval"
data-t="gpsInterval"></label>

<select id="gpsInterval">
<option value="5">5 Seconds</option>
<option value="10">10 Seconds</option>
<option value="15">15 Seconds</option>
<option value="20">20 Seconds</option>
<option value="30">30 Seconds</option>
</select>

<label for="gpsMaxAge"
data-t="gpsMaxAge"></label>

<select id="gpsMaxAge">
<option value="30">30 Seconds</option>
<option value="60">60 Seconds</option>
<option value="90">90 Seconds</option>
<option value="120">120 Seconds</option>
</select>

<label for="gpsAccuracy"
data-t="gpsAccuracy"></label>

<select id="gpsAccuracy">
<option value="20">20 Meters</option>
<option value="30">30 Meters</option>
<option value="50">50 Meters</option>
<option value="100">100 Meters</option>
</select>

<p class="note"
data-t="gpsNotice"></p>

</section>

<section class="panel">

<h3 data-t="scheduleSettings"></h3>

<label for="minimumAdvance"
data-t="minimumAdvance"></label>

<select id="minimumAdvance">
<option value="15">15 Minutes</option>
<option value="30">30 Minutes</option>
<option value="60">60 Minutes</option>
<option value="120">120 Minutes</option>
</select>

<label for="maximumAdvance"
data-t="maximumAdvance"></label>

<select id="maximumAdvance">
<option value="1">1 Day</option>
<option value="3">3 Days</option>
<option value="7">7 Days</option>
<option value="14">14 Days</option>
<option value="30">30 Days</option>
</select>

<label for="scheduledReminder"
data-t="scheduledReminder"></label>

<select id="scheduledReminder">
<option value="15">15 Minutes</option>
<option value="30">30 Minutes</option>
<option value="60">60 Minutes</option>
</select>

</section>

<section class="panel">

<h3 data-t="vehicleSettings"></h3>

<label class="checkRow">
<input id="vehicleBike"
type="checkbox">
<span data-t="bike"></span>
</label>

<label class="checkRow">
<input id="vehicleTuk"
type="checkbox">
<span data-t="tuk"></span>
</label>

<label class="checkRow">
<input id="vehicleCar"
type="checkbox">
<span data-t="car"></span>
</label>

<label class="checkRow">
<input id="vehicleVan"
type="checkbox">
<span data-t="van"></span>
</label>

<p class="note"
data-t="vehicleNotice"></p>

</section>

<section class="panel">

<h3 data-t="districtSettings"></h3>

<button id="selectAllDistricts"
type="button"

<button id="clearDistricts"
type="button"
class="back"
data-t="clearAll"></button>

<div id="districtList"
class="grid"></div>

<p id="districtCount"
class="note"></p>

</section>

<section class="panel">

<h3 data-t="supportSettings"></h3>

<label for="customerSupportPhone"
data-t="customerSupportPhone"></label>

<input id="customerSupportPhone"
type="tel"
maxlength="16"
placeholder="+94XXXXXXXXX">

<label for="driverSupportPhone"
data-t="driverSupportPhone"></label>

<input id="driverSupportPhone"
type="tel"
maxlength="16"
placeholder="+94XXXXXXXXX">

<label for="supportWhatsapp"
data-t="supportWhatsapp"></label>

<input id="supportWhatsapp"
type="tel"
maxlength="16"
placeholder="+94XXXXXXXXX">

<label for="supportEmail"
data-t="supportEmail"></label>

<input id="supportEmail"
type="email"
maxlength="254">

<p class="note"
data-t="supportNotice"></p>

</section>

<section class="panel">

<h3 data-t="maintenanceSettings"></h3>

<label class="checkRow">

<input id="maintenanceMode"
type="checkbox">

<span data-t="maintenanceMode"></span>

</label>

<p class="warning"
data-t="maintenanceNotice"></p>

<label for="maintenanceSi">
සිංහල
</label>

<textarea id="maintenanceSi"
maxlength="500"></textarea>

<label for="maintenanceEn">
English
</label>

<textarea id="maintenanceEn"
maxlength="500"></textarea>

<label for="maintenanceTa">
தமிழ்
</label>

<textarea id="maintenanceTa"
maxlength="500"></textarea>

</section>

<section class="panel">

<h3 data-t="saveSection"></h3>

<label for="changeReason"
data-t="reason"></label>

<textarea id="changeReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="confirmSettings"
type="checkbox">

<span data-t="confirmSettings"></span>

</label>

<p class="warning"
data-t="futureNotice"></p>

<button id="saveSettings"
type="submit"
data-t="saveSettings"></button>

<button id="discardSettings"
type="button"
class="back"
data-t="discardSettings"></button>

</section>

</fieldset>

</form>

<section class="panel">

<h3 data-t="history"></h3>

<button id="loadHistory"
data-t="viewHistory"></button>

<div id="historyList"></div>

<button id="moreHistory"
data-t="more"
hidden></button>

</section>

<section id="historyDetailsPanel"
class="panel"
hidden>

<h3 data-t="historyDetails"></h3>

<div id="historyDetails"></div>

<button id="closeHistory"
class="back"
data-t="close"></button>

</section>

<section class="panel">

<h3 data-t="relatedPages"></h3>

<a id="fareLink"
class="action"
data-t="farePage"></a>

<a id="weatherLink"
class="action"
data-t="weatherPage"></a>

<a id="commissionLink"
class="action"
data-t="commissionPage"></a>

<a id="paymentLink"
class="action"
data-t="paymentPage"></a>

<a id="notificationLink"
class="action"
data-t="notificationPage"></a>

<a id="securityLink"
class="action"
data-t="securityPage"></a>

<a id="databaseLink"
class="action"
data-t="databasePage"></a>

<a id="termsLink"
class="action"
data-t="termsPage"></a>

<a id="accountLink"
class="action"
data-t="accountPage"></a>

</section>

<p id="result"
class="message"
role="status"
aria-live="polite"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

const values={

if(!numberKeys.every(key=>

if(data.gps.gpsMaxAge

if(data.schedule.scheduledReminder

function equalData(a,b){

if(a===b)return true;

if(Array.isArray(a)

||Array.isArray(b)){

&&Array.isArray(b)

&&a.length===b.length

&&a.every((item,index)=>

equalData(item,b[index]));

}

if(a&&b

&&typeof a==="object"

&&typeof b==="object"){

const keys=Object.keys(a);

return keys.length===Object.keys(b).length

&&keys.every(key=>

Object.prototype.hasOwnProperty.call(b,key)

&&equalData(a[key],b[key]));

}

return false;

}

runRead(async()=>{

await loadSettings(true);

await loadOverview();

});

};

function validHistory(record){

return record

&&validId(record.recordId)

&&validCount(record.version)

&&validText(record.reason,500)

&&validTime(record.createdAtMs)

&&Array.isArray(record.changedSections)

&&record.changedSections.length<=20

&&record.changedSections.every(section=>

validText(section,100));

}

function renderHistory(){

const container=$("historyList");

container.replaceChildren();

$("moreHistory").hidden=

historyCursor===null;

historyRecords.forEach(record=>{

const box=makeRecord();

addLine(box,"version",record.version);

addLine(box,"reason",record.reason);

addLine(

box,

"created",

formatDate(record.createdAtMs)

);

const button=document.createElement("button");

button.textContent=t("viewDetails");

button.dataset.dynamic="true";

button.onclick=()=>{

openHistory(record.version);

};

button.disabled=

busy||mutationBusy||!!pendingMutation;

box.appendChild(button);

container.appendChild(box);

});

}

async function loadHistory(reset=true){

const response=await serverCall(

"getAdminSystemSettingsHistory",

{

limit:30,

cursor:reset?null:historyCursor

}

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validHistory)

||!validCursor(response.nextCursor)){

throw new Error("Invalid history");

}

const records=new Map(

(reset?[]:historyRecords)

.map(record=>[record.recordId,record])

);

response.records.forEach(record=>{

records.set(record.recordId,record);

});

historyRecords=[...records.values()];

historyCursor=response.nextCursor;

renderHistory();

if(!historyRecords.length){

$("historyList").textContent=t("noRecords");

}

}

$("loadHistory").onclick=()=>{

runRead(()=>loadHistory(true));

};

$("moreHistory").onclick=()=>{

if(historyCursor!==null){

runRead(()=>loadHistory(false));

}

};

function renderHistoryDetails(){

const container=$("historyDetails");

container.replaceChildren();

$("historyDetailsPanel").hidden=

!selectedHistory||!isOwner();

if(!selectedHistory)return;

const data=selectedHistory;

addLine(container,"version",data.version);

addLine(

container,

"updated",

formatDate(data.updatedAtMs)

);

addLine(

container,

"defaultLanguage",

data.defaultLanguage

);

serviceKeys.forEach(key=>{

addLine(

container,

key,

t(data.services[key]

?"enabled":"disabled")

);

});

numberKeys.forEach(key=>{

const values={

...data.matching,

...data.gps,

...data.schedule

};

addLine(container,key,values[key]);

});

vehicleKeys.forEach(key=>{

addLine(

container,

key,

t(data.vehicles[key]

?"enabled":"disabled")

);

});

addLine(

container,

"selectedDistricts",

data.districts.map(districtLabel).join(", ")

);

addLine(

container,

"customerSupportPhone",

data.support.customerPhone||"—"

);

addLine(

container,

"driverSupportPhone",

data.support.driverPhone||"—"

);

addLine(

container,

"supportWhatsapp",

data.support.whatsapp||"—"

);

addLine(

container,

"supportEmail",

data.support.email||"—"

);

addLine(

container,

"maintenanceMode",

t(data.maintenance.enabled

?"enabled":"disabled")

);

languages.forEach(language=>{

const paragraph=document.createElement("p");

paragraph.textContent=

language.toUpperCase()+": "

+data.maintenance.messages[language];

container.appendChild(paragraph);

});

}

function openHistory(version){

runRead(async()=>{

const response=await serverCall(

"getAdminSystemSettingsVersion",

{version}

);

if(!validSettings(response.settings)

||response.settings.version!==version){

throw new Error("Invalid version");

}

selectedHistory=response.settings;

renderHistoryDetails();

$("historyDetailsPanel").scrollIntoView({

behavior:"smooth"

});

});

}

$("closeHistory").onclick=()=>{

selectedHistory=null;

renderHistoryDetails();

};

function updateControls(){

const locked=

!isOwner()

||busy

||mutationBusy;

const pending=!!pendingMutation;

$("settingsFields").disabled=

locked||!settings;

$("settingsFields")

.querySelectorAll("input,select,textarea,button")

.forEach(element=>{

element.disabled=

locked||pending||!settings;

});

$("saveSettings").disabled=

locked

||!settings

||(

!pending

&&!readSettings()

);

$("discardSettings").disabled=

locked||pending||!settings;

[

"refreshButton",

"loadHistory",

"moreHistory",

"closeHistory"

].forEach(id=>{

$(id).disabled=locked||pending;

});

document.querySelectorAll(

"[data-dynamic]"

).forEach(button=>{

button.disabled=locked||pending;

});

}

function renderLanguage(){

document.documentElement.lang=lang;

document.querySelectorAll("[data-t]")

.forEach(element=>{

element.textContent=t(element.dataset.t);

});

document.querySelectorAll(

"[data-district-name]"

).forEach(element=>{

element.textContent=

districtLabel(element.dataset.districtName);

});

const links={

loginLink:"admin-login.html",

dashboardLink:"admin-dashboard.html",

backLink:"admin-dashboard.html",

fareLink:"admin-fares.html",

weatherLink:"admin-weather-road.html",

commissionLink:"admin-commission.html",

paymentLink:"admin-payments.html",

notificationLink:"admin-notifications.html",

securityLink:"admin-security.html",

databaseLink:"admin-database.html",

termsLink:"admin-terms.html",

accountLink:"admin-account.html"

};

Object.entries(links).forEach(([id,page])=>{

$(id).href=pageLink(page);

});

Object.keys(messages).forEach(id=>{

message(id,messages[id]);

});

$("settingsVersion").textContent=

settings

?t("version")+": "+settings.version

:"—";

renderOverview();

updateDistrictCount();

renderHistory();

renderHistoryDetails();

updateControls();

}

document.querySelectorAll("[data-lang]")

.forEach(button=>{

button.onclick=()=>{

if(!languages.includes(button.dataset.lang)){

return;

}

lang=button.dataset.lang;

try{

localStorage.setItem(

"myride_admin_language",

lang

);

const url=new URL(location.href);

url.searchParams.set("lang",lang);

history.replaceState(null,"",url);

}catch(e){}

renderLanguage();

};

});

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

overview=null;

settings=null;

latestVersion=null;

dirty=false;

conflict=false;

pendingMutation=null;

historyRecords=[];

historyCursor=null;

selectedHistory=null;

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("historyDetailsPanel").hidden=true;

$("settingsForm").reset();

$("settingsFields")

.querySelectorAll("input,textarea,select")

.forEach(element=>{

if(element.readOnly)return;

if(element.type==="checkbox"){

element.checked=false;

}else{

element.value="";

}

});

message("result","");

renderLanguage();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

message("status","denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

message("status","offline");

return;

}

message("status","checking");

try{

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

message("status","verified");

updateControls();

await runRead(async()=>{

await loadSettings(true);

await loadOverview();

});

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

setInterval(async()=>{

if(!isOwner()

||checking

||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation)return;

if(!validOwner(response.data,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||pendingMutation

||document.hidden)return;

runRead(async()=>{

await loadOverview();

if(!dirty

&&latestVersion!==settings?.version){

await loadSettings(true);

}

});

},60000);

window.addEventListener("offline",()=>{

clearSession();

message("status","offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(dirty

||mutationBusy

||pendingMutation){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderDistricts();

renderLanguage();

updateControls();

initializeSecurity();

</script>

</body>
</html>

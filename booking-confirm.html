<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">

<meta name="viewport"

<meta name="robots"
content="noindex,nofollow,noarchive">

<title>MY RIDE - Booking Confirmation</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:38px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:15px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:15px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:16px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.row{
padding:12px 0;
border-bottom:1px solid #444;
overflow-wrap:anywhere;
}

.row span{
display:block;
color:#BBB;
font-size:13px;
margin-bottom:6px;
}

.row strong{
font-size:17px;
}

.fare{
background:#FFD600;
color:#111;
padding:20px;
border-radius:12px;
text-align:center;
margin:15px 0;
}

.fare strong{
display:block;
font-size:32px;
margin-top:10px;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:12px;
margin:15px 0;
line-height:1.8;
}

.checkRow input{
width:23px;
height:23px;
flex-shrink:0;
accent-color:#FFD600;
}

.terms{
background:#292929;
padding:15px;
border-radius:8px;
max-height:300px;
overflow:auto;
white-space:pre-wrap;
line-height:1.9;
font-size:14px;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.warning{
color:#FFB347;
line-height:1.8;
}

.message{
color:#FFD600;
text-align:center;
line-height:1.8;
overflow-wrap:anywhere;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading"></h2>

<div class="languages">

<button data-lang="si">සිංහල</button>

<button data-lang="en">English</button>

<button data-lang="ta">தமிழ்</button>

</div>

<p id="status"
class="message"
role="status"

<section id="errorPanel"
class="panel"
hidden>

<p data-t="missingDraft"
class="warning"></p>

<a id="errorBack"
class="action"
data-t="editBooking"></a>

</section>

<div id="bookingContent" hidden>

<section class="panel">

<h3 data-t="customerDetails"></h3>

<div class="row">

<span data-t="customerName"></span>

<strong id="customerName"></strong>

</div>

<div class="row">

<span data-t="phone"></span>

<strong id="customerPhone"></strong>

</div>

</section>

<section class="panel">

<h3 data-t="tripDetails"></h3>

<div class="row">

<span data-t="pickup"></span>

<strong id="pickup"></strong>

</div>

<div class="row">

<span data-t="destination"></span>

<strong id="destination"></strong>

</div>

<div class="row">

<span data-t="date"></span>

<strong id="bookingDate"></strong>

</div>

<div class="row">

<span data-t="time"></span>

<strong id="bookingTime"></strong>

</div>

<div class="row">

<span data-t="vehicle"></span>

<strong id="vehicleType"></strong>

</div>

<div class="row">

<span data-t="passengers"></span>

<strong id="passengerCount"></strong>

</div>

<div class="row">

<span data-t="distance"></span>

<strong id="tripDistance"></strong>

</div>

<div class="row">

<span data-t="duration"></span>

<strong id="tripDuration"></strong>

</div>

<div class="row">

<span data-t="period"></span>

<strong id="tripPeriod"></strong>

</div>

<div class="row">

<span data-t="weather"></span>

<strong id="weatherStatus"></strong>

</div>

<div class="row">

<span data-t="road"></span>

<strong id="roadStatus"></strong>

</div>

</section>

<div class="fare">

<span data-t="estimatedFare"></span>

<strong id="estimatedFare">—</strong>

</div>

<p class="note"
data-t="fareNotice"></p>

<section class="panel">

<h3 data-t="termsHeading"></h3>

<div id="termsText"
class="terms"></div>

<p id="termsVersion"
class="note"></p>

<label class="checkRow">

<input id="acceptTerms"
type="checkbox"
disabled>

<span data-t="acceptTerms"></span>

</label>

<label class="checkRow">

<input id="whatsappConsent"
type="checkbox">

<span data-t="whatsappConsent"></span>

</label>

<p class="warning"
data-t="cancelNotice"></p>

</section>

<button id="confirmBooking"
disabled
data-t="confirmBooking"></button>

<button id="refreshQuote"
class="back"
data-t="refreshQuote"></button>

<a id="editBooking"
class="action back"
data-t="editBooking"></a>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<p id="result"
class="message"
role="status"
aria-live="polite"></p>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

function message(id,key){

messages[id]=key;

$(id).textContent=key?t(key):"";

function validText(value,min,max){

return typeof value==="string"

&&value.trim().length>=min

&&value.length<=max;

}

function validNumber(value,min,max){

return typeof value==="number"

&&Number.isFinite(value)

&&value>=min

&&value<=max;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function normalizePhone(value){

let phone=String(value??"")

.replace(/[\s()-]/g,"");

if(/^0\d{9}$/.test(phone)){

phone="+94"+phone.slice(1);

}else if(/^94\d{9}$/.test(phone)){

phone="+"+phone;

}

return /^\+94\d{9}$/.test(phone)

?phone:null;

}

function normalizeVehicle(value){

const type=String(value??"")

.toLowerCase().trim()

.replace(/[\s_/-]+/g,"");

const map={

bike:"bike",

scooter:"bike",

scooterbike:"bike",

motorbike:"bike",

tuk:"tuk",

tuktuk:"tuk",

threewheeler:"tuk",

car:"car",

van:"van"

};

return map[type]||null;

}

function normalizePoint(value){

if(!value||typeof value!=="object"){

return null;

}

const rawLat=value.lat??value.latitude;

const rawLon=

value.lon??value.lng??value.longitude;

if(rawLat===null

||rawLat===undefined

||rawLat===""

||rawLon===null

||rawLon===undefined

||rawLon===""){

return null;

}

const lat=Number(rawLat);

const lon=Number(rawLon);

if(!validNumber(lat,5.8,10)

||!validNumber(lon,79.4,82)){

return null;

}

return {lat,lon};

}

function normalizeDraft(data){

if(!data||typeof data!=="object"){

return null;

}

const name=String(

data.customerName??data.name??data.fullName??""

).trim();

const phone=normalizePhone(

data.customerPhone

??data.phone

??data.phoneNumber

??data.whatsapp

);

const pickupName=String(

data.pickupName

??data.pickupAddress

??data.pickup?.name

??data.pickup?.address

??(

typeof data.pickup==="string"

?data.pickup:""

)

).trim();

const destinationName=String(

data.destinationName

??data.destinationAddress

??data.dropoffAddress

??data.destination?.name

??data.destination?.address

??(

typeof data.destination==="string"

?data.destination:""

)

).trim();

const pickup=normalizePoint(

data.pickupCoordinates

??data.pickupLocation

??(

typeof data.pickup==="object"

?data.pickup:null

)

??{

lat:data.pickupLat,

lon:data.pickupLon??data.pickupLng

}

);

const destination=normalizePoint(

data.destinationCoordinates

??data.dropoffCoordinates

??data.destinationLocation

??(

typeof data.destination==="object"

?data.destination:null

)

??{

lat:data.destinationLat??data.dropoffLat,

lon:data.destinationLon

??data.destinationLng

??data.dropoffLon

??data.dropoffLng

}

);

const date=String(

data.date??data.bookingDate??""

);

const time=String(

data.time??data.bookingTime??""

);

const vehicleType=normalizeVehicle(

data.vehicleType??data.vehicle

);

const passengers=Number(

data.passengers??data.passengerCount

);

const capacities={

bike:1,

tuk:3,

car:4,

van:10

};

if(!validText(name,2,150)

||!phone

||!validText(pickupName,1,500)

||!validText(destinationName,1,500)

||!pickup

||!destination

||!/^\d{4}-\d{2}-\d{2}$/.test(date)

||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)

||!vehicleType

||!Number.isInteger(passengers)

||passengers<1

||passengers>capacities[vehicleType]){

return null;

}

const parsedDate=new Date(date+"T00:00:00Z");

if(!Number.isFinite(parsedDate.getTime())

||parsedDate.toISOString().slice(0,10)!==date){

return null;

}

return {

customerName:name,

customerPhone:phone,

pickupName,

destinationName,

pickup,

destination,

date,

time,

vehicleType,

passengers,

timeZone:"Asia/Colombo"

};

}

function pageLink(page){

return "./"+page+"?lang="

+encodeURIComponent(lang);

}

function serverNow(){

return Date.now()+serverClockOffset;

}

function formatMoney(cents){

if(!Number.isSafeInteger(cents)

||cents<0)return "—";

return "LKR "+new Intl.NumberFormat(

"en-LK",

{

minimumFractionDigits:2,

maximumFractionDigits:2

}

).format(cents/100);

}

function validQuote(data){

return data

&&validId(data.quoteId)

&&Number.isSafeInteger(data.fareVersion)

&&data.fareVersion>=0

&&Number.isSafeInteger(data.estimatedFareCents)

&&data.estimatedFareCents>=0

&&validNumber(data.distanceMeters,1,2000000)

&&validNumber(data.durationSeconds,1,172800)

&&["day","night"].includes(data.period)

&&["normal","rain","unknown"]

.includes(data.weatherStatus)

&&["normal","difficult","unknown"]

.includes(data.roadStatus)

&&Number.isFinite(data.expiresAtMs)

&&data.expiresAtMs>serverNow();

}

function validTerms(data){

return data

&&Number.isSafeInteger(data.version)

&&data.version>=0

&&data.translations

&&languages.every(language=>

validText(

data.translations[language],

1,

100000

));

}

function renderBooking(){

if(!booking)return;

$("customerName").textContent=

booking.customerName;

$("customerPhone").textContent=

booking.customerPhone;

$("pickup").textContent=

booking.pickupName;

$("destination").textContent=

booking.destinationName;

$("bookingDate").textContent=

booking.date;

$("bookingTime").textContent=

booking.time;

$("vehicleType").textContent=

t(booking.vehicleType);

$("passengerCount").textContent=

booking.passengers;

$("tripDistance").textContent=

quote

?(quote.distanceMeters/1000).toFixed(2)+" KM"

:"—";

$("tripDuration").textContent=

quote

?Math.ceil(quote.durationSeconds/60)+" min"

:"—";

$("tripPeriod").textContent=

quote?t(quote.period):"—";

$("weatherStatus").textContent=

quote?t(quote.weatherStatus):"—";

$("roadStatus").textContent=

quote?t(quote.roadStatus):"—";

$("estimatedFare").textContent=

quote

?formatMoney(quote.estimatedFareCents)

:"—";

$("termsText").textContent=

terms

?terms.translations[lang]

:t("termsUnavailable");

$("termsVersion").textContent=

terms

?t("version")+": "+terms.version

:"";

}

function updateControls(){

const expired=

!quote||quote.expiresAtMs<=serverNow();

$("acceptTerms").disabled=

busy||!!pending||!terms||!ready;

$("whatsappConsent").disabled=

busy||!!pending||completed;

$("confirmBooking").disabled=

busy

||completed

||!navigator.onLine

||!auth?.currentUser

||(

!pending

&&(

!ready

||expired

||!terms

||!$("acceptTerms").checked

)

);

$("confirmBooking").textContent=

t(pending?"retry":"confirmBooking");

$("refreshQuote").disabled=

busy||!!pending||completed

||!navigator.onLine

||!auth?.currentUser;

["editBooking","dashboardLink"]

.forEach(id=>{

const link=$(id);

const locked=busy||!!pending||completed;

link.setAttribute(

"aria-disabled",

String(locked)

);

link.style.opacity=locked?".45":"1";

});

}

function renderLanguage(){

document.documentElement.lang=lang;

document.querySelectorAll("[data-t]")

element.textContent=t(element.dataset.t);

$("editBooking").href=

$("dashboardLink").href=

Object.keys(messages).forEach(id=>{

}

document.querySelectorAll("[data-lang]")

.forEach(button=>{

button.onclick=()=>{

if(busy||pending)return;

const selected=button.dataset.lang;

if(!languages.includes(selected))return;

lang=selected;

$("acceptTerms").checked=false;

try{

localStorage.setItem(

"myride_language",

lang

);

const url=new URL(location.href);

url.searchParams.set("lang",lang);

history.replaceState(null,"",url);

}catch(e){}

renderLanguage();

};

});

["editBooking","dashboardLink"]

.forEach(id=>{

$(id).addEventListener("click",event=>{

if(busy||pending||completed){

event.preventDefault();

}

});

});

$("acceptTerms").onchange=updateControls;

$("whatsappConsent").onchange=updateControls;

async function serverCall(name,data){

const user=auth?.currentUser;

if(!user||!navigator.onLine){

throw new Error("Unavailable");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,

name,

{timeout:30000}

)(data);

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

throw new Error("Session changed");

}

if(response.data?.success!==true

||response.data.customerUid!==user.uid){

throw new Error("Invalid response");

}

return response.data;

}

async function loadQuote(){

if(busy

||pending

||completed

||!booking

||!auth?.currentUser)return;

const currentGeneration=generation;

busy=true;

ready=false;

quote=null;

terms=null;

$("acceptTerms").checked=false;

message("status","loadingQuote");

message("result","");

renderBooking();

updateControls();

try{

const response=await serverCall(

"prepareCustomerBooking",

{

booking,

language:lang

}

);

if(!Number.isFinite(response.serverTimeMs)){

throw new Error("Invalid server time");

}

serverClockOffset=

response.serverTimeMs-Date.now();

if(!validQuote(response.quote)

||!validTerms(response.terms)){

throw new Error("Invalid quote or terms");

}

quote=response.quote;

terms=response.terms;

ready=true;

message("status","ready");

}catch(e){

if(currentGeneration===generation){

quote=null;

terms=null;

ready=false;

message("status","serverError");

}

}finally{

if(currentGeneration===generation){

busy=false;

renderBooking();

updateControls();

}

}

}

$("refreshQuote").onclick=loadQuote;

function validPending(data){

return data

&&validId(data.requestId)

&&validId(data.customerUid)

&&data.payload

&&validId(data.payload.quoteId)

&&Number.isSafeInteger(data.payload.termsVersion)

&&data.payload.acceptedTerms===true

&&typeof data.payload.whatsappConsent==="boolean"

&&languages.includes(data.payload.language);

}

$("confirmBooking").onclick=async()=>{

if(busy

||completed

||!navigator.onLine

||!auth?.currentUser)return;

if(!pending){

if(!ready

||!quote

||!terms

||!$("acceptTerms").checked){

return;

}

if(quote.expiresAtMs<=serverNow()){

message("result","expired");

updateControls();

return;

}

pending={

requestId:crypto.randomUUID(),

customerUid:auth.currentUser.uid,

payload:{

quoteId:quote.quoteId,

termsVersion:terms.version,

acceptedTerms:true,

whatsappConsent:

$("whatsappConsent").checked,

language:lang

}

};

try{

sessionStorage.setItem(

pendingKey,

JSON.stringify(pending)

);

}catch(e){

pending=null;

message("result","serverError");

updateControls();

return;

}

}

if(!validPending(pending)

||pending.customerUid!==auth.currentUser.uid){

message("result","unconfirmed");

return;

}

const currentGeneration=generation;

busy=true;

message("result","submitting");

updateControls();

try{

const response=await serverCall(

"confirmCustomerBooking",

{

...pending.payload,

requestId:pending.requestId

}

);

if(!validId(response.bookingId)

||response.requestId!==pending.requestId

||![

"confirmed",

"searching",

"offered",

"accepted",

"scheduled"

].includes(response.status)){

throw new Error("Booking not confirmed");

}

sessionStorage.setItem(

confirmedKey,

response.bookingId

);

sessionStorage.removeItem(pendingKey);

sessionStorage.removeItem(draftKey);

pending=null;

completed=true;

message("result","confirmed");

location.replace(

"./driver-search.html?booking="

+encodeURIComponent(response.bookingId)

+"&lang="+encodeURIComponent(lang)

);

}catch(e){

if(currentGeneration===generation){

message("result","unconfirmed");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

};

async function initializeSecurity(){

try{

const app=initializeApp(firebaseConfig);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

const appToken=await getToken(

appCheck,

false

);

if(!appToken?.token){

throw new Error("App Check failed");

}

await auth.authStateReady();

if(!auth.currentUser){

if(pending){

throw new Error("Previous session missing");

}

await signInAnonymously(auth);

}

if(!auth.currentUser){

throw new Error("Authentication failed");

}

if(pending){

if(pending.customerUid!==auth.currentUser.uid){

throw new Error("Customer changed");

}

message("status","unconfirmed");

updateControls();

}else{

await loadQuote();

}

onAuthStateChanged(auth,user=>{

if(!user

||(pending&&pending.customerUid!==user.uid)){

generation++;

busy=false;

ready=false;

quote=null;

terms=null;

$("acceptTerms").checked=false;

message("status","serverError");

renderBooking();

updateControls();

}

});

}catch(e){

ready=false;

message("status","serverError");

updateControls();

}

}

window.addEventListener("offline",()=>{

message("status","offline");

updateControls();

});

window.addEventListener("online",()=>{

if(pending){

message("status","unconfirmed");

updateControls();

}else if(auth?.currentUser){

loadQuote();

}else{

location.reload();

}

});

window.addEventListener("beforeunload",event=>{

if(busy||pending){

event.preventDefault();

event.returnValue="";

}

});

setInterval(()=>{

if(ready

&&quote

&&!pending

&&!completed

&&quote.expiresAtMs<=serverNow()){

ready=false;

$("acceptTerms").checked=false;

message("status","expired");

updateControls();

}

},1000);

function start(){

try{

const saved=sessionStorage.getItem(draftKey);

draft=saved?JSON.parse(saved):null;

booking=normalizeDraft(draft);

const savedPending=

sessionStorage.getItem(pendingKey);

if(savedPending){

pending=JSON.parse(savedPending);

if(!validPending(pending)){

throw new Error("Invalid pending request");

}

}

}catch(e){

message("status","serverError");

return;

}

renderLanguage();

if(!booking&&!pending){

$("errorPanel").hidden=false;

$("bookingContent").hidden=true;

message("status","missingDraft");

return;

}

$("bookingContent").hidden=false;

if(!navigator.onLine){

message("status","offline");

return;

}

initializeSecurity();

}

start();

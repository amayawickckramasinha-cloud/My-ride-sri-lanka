
<!DOCTYPE html>
<html lang="si" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Driver Notifications</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.notificationIcon{
width:90px;
height:90px;
background:#FFD600;
color:#111;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:20px auto;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.8;
}

.row span{
color:#CCC;
}

.row strong{
text-align:right;
max-width:60%;
overflow-wrap:anywhere;
}

.stats{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:8px;
margin:16px 0;
}

.stat{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px 5px;
text-align:center;
}

.stat strong{
display:block;
font-size:25px;
color:#FFD600;
margin-bottom:8px;
}

.stat span{
font-size:12px;
line-height:1.6;
}

.notification{
background:#252525;
border:1px solid #555;
border-left:4px solid #777;
border-radius:10px;
padding:15px;
margin:12px 0;
overflow-wrap:anywhere;
}

.notification.unread{
border-left-color:#FFD600;
background:#302C17;
}

.notification.urgent{
border-left-color:#FF6464;
}

.notificationTitle{
font-size:16px;
font-weight:bold;
line-height:1.7;
color:#FFD600;
}

.notificationMessage{
font-size:14px;
line-height:1.9;
white-space:pre-wrap;
margin:10px 0;
}

.notificationTime{
font-size:12px;
color:#BBB;
line-height:1.7;
}

.notificationCategory{
font-size:12px;
color:#CCC;
margin-bottom:8px;
}

.notificationState{
font-size:12px;
color:#FFD600;
margin-top:8px;
}

.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.smallButton{
padding:10px;
font-size:13px;
}

select{
width:100%;
padding:14px;
background:#292929;
color:#fff;
border:1px solid #555;
border-radius:9px;
font-size:16px;
margin:8px 0 15px;
}

label{
font-size:14px;
font-weight:bold;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.9;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:15px;
color:#FFB4B4;
line-height:1.8;
}

.yellow{
color:#FFD600;
}

.green{
color:#4ADE80;
}

.red{
color:#FF6464;
}

#status,
#notificationStatus,
#browserStatus{
text-align:center;
line-height:1.8;
color:#FFD600;
overflow-wrap:anywhere;
}

button:disabled,
select:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}
</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>
<div class="country">SRI LANKA</div>

<div class="notificationIcon">
<svg width="50" height="50"
viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="1.8"
stroke-linecap="round"
stroke-linejoin="round">
<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
<path d="M10 21h4"/>
</svg>
</div>

<h2 data-t="heading"></h2>

<p id="status" role="status"
aria-live="polite"></p>

<section id="accessPanel" class="panel" hidden>
<p data-t="denied"></p>
<a id="loginLink" class="action"
data-t="login"></a>
</section>

<div id="content" hidden>

<section class="panel">

<h3 data-t="driverDetails"></h3>

<div class="row">
<span data-t="driverName"></span>
<strong id="driverName">—</strong>
</div>

<div class="row">
<span>Driver ID</span>
<strong id="driverId" class="yellow">—</strong>
</div>

<div class="row">
<span data-t="accountStatus"></span>
<strong id="accountStatus">—</strong>
</div>

</section>

<div class="stats">

<div class="stat">
<strong id="totalCount">—</strong>
<span data-t="total"></span>
</div>

<div class="stat">
<strong id="unreadCount">—</strong>
<span data-t="unread"></span>
</div>

<div class="stat">
<strong id="urgentCount">—</strong>
<span data-t="urgent"></span>
</div>

</div>

<section class="panel">

<h3 data-t="notificationSettings"></h3>

<div class="row">
<span data-t="browserPermission"></span>
<strong id="permissionState">—</strong>
</div>

<button id="enableBrowser"
class="action"
data-t="enableBrowser"></button>

<p id="browserStatus" role="status"></p>

<p class="note"
data-t="browserNote"></p>

</section>

<section class="panel">

<h3 data-t="notificationList"></h3>

<label for="readFilter"
data-t="filterStatus"></label>

<select id="readFilter">
<option value="all" data-t="all"></option>
<option value="unread" data-t="unread"></option>
<option value="read" data-t="read"></option>
<option value="urgent" data-t="urgent"></option>
</select>

<label for="categoryFilter"
data-t="filterCategory"></label>

<select id="categoryFilter">
<option value="all" data-t="all"></option>
<option value="new_hire" data-t="newHire"></option>
<option value="scheduled_ride" data-t="scheduledRide"></option>
<option value="admin_message" data-t="adminMessage"></option>
<option value="commission_due" data-t="commissionDue"></option>
<option value="commission_overdue" data-t="commissionOverdue"></option>
<option value="licence_expiry" data-t="licenceExpiry"></option>
<option value="insurance_expiry" data-t="insuranceExpiry"></option>
<option value="revenue_expiry" data-t="revenueExpiry"></option>
<option value="account_status" data-t="accountUpdate"></option>
<option value="terms_update" data-t="termsUpdate"></option>
<option value="payment_update" data-t="paymentUpdate"></option>
<option value="emergency" data-t="emergency"></option>
<option value="system" data-t="system"></option>
</select>

<button id="markAllButton"
class="action"
data-t="markAll"
disabled></button>

<button id="refreshButton"
class="action secondary"
data-t="refresh"></button>

<p id="notificationStatus"
role="status"
aria-live="polite"></p>

<div id="notificationList"></div>

<button id="loadMoreButton"
class="action secondary"
data-t="loadMore"
hidden></button>

</section>

<a id="helpLink"
class="action secondary"
data-t="help"></a>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){
return authorized
&&uid!==null
&&auth?.currentUser?.uid===uid
&&navigator.onLine;
}

function validId(value){
return typeof value==="string"
&&/^[A-Za-z0-9_-]{1,128}$/.test(value);
}

function validText(value,min,max){
return typeof value==="string"
&&value.trim().length>=min
&&value.length<=max;
}

function validCount(value){
return Number.isSafeInteger(value)&&value>=0;
}

function restricted(){
return driver!==null
&&driver.status!=="approved";
}

function formatDate(ms){
if(!Number.isFinite(ms)
||ms<=0
||ms>8640000000000000){
return "—";
}

return new Intl.DateTimeFormat(
lang==="si"?"si-LK":
lang==="ta"?"ta-LK":"en-LK",
{
timeZone:"Asia/Colombo",
dateStyle:"medium",
timeStyle:"short"
}
).format(new Date(ms));
}

async function serverCall(name,data={}){
if(!validSession()){
throw new Error("Unauthorized");
}

const currentGeneration=generation;

const response=await httpsCallable(
functions,name
)(data);

if(!validSession()
||currentGeneration!==generation){
throw new Error("Session changed");
}

return response.data;
}

// GPS CONTINUITY

function startGps(){
if(gpsWatch!==null
||!navigator.geolocation
||!validSession()
||restricted())return;

gpsWatch=navigator.geolocation.watchPosition(
async position=>{

const c=position.coords;

if(!validSession()
||!driver
||restricted()
||driver.documentsValid!==true
||!["online","busy"].includes(driver.availability)
||!Number.isFinite(c.latitude)
||!Number.isFinite(c.longitude)
||!Number.isFinite(c.accuracy)
||c.accuracy<0
||c.accuracy>100
||c.latitude<5.85
||c.latitude>9.9
||c.longitude<79.5
||c.longitude>82
||Date.now()-position.timestamp>30000
||position.timestamp>Date.now()+5000
||gpsSending
||Date.now()-lastGpsSent<10000){
return;
}

gpsSending=true;
lastGpsSent=Date.now();

try{
await serverCall(
"updateDriverLocation",
{
lat:c.latitude,
lon:c.longitude,
accuracy:c.accuracy,
capturedAtMs:position.timestamp
}
);
}catch(e){
// Backend must expire stale GPS data.
}finally{
gpsSending=false;
}

},
()=>{},
{
enableHighAccuracy:true,
maximumAge:5000,
timeout:15000
}
);
}

function stopGps(){
if(gpsWatch!==null){
navigator.geolocation.clearWatch(gpsWatch);
gpsWatch=null;
}
}

// NOTIFICATION DATA VALIDATION

function validRecord(data){

if(!data
||data.driverUid!==uid
||!validId(data.notificationId)
||!Object.hasOwn(CATEGORIES,data.category)
||!["normal","urgent"].includes(data.priority)
||typeof data.read!=="boolean"
||!Number.isFinite(data.createdAtMs)
||data.createdAtMs<=0
||data.createdAtMs>8640000000000000
||!data.translations){
return false;
}

if(restricted()
&&!RESTRICTED_CATEGORIES.includes(data.category)){
return false;
}

return LANGUAGES.every(language=>{

const text=data.translations[language];

return text
&&validText(text.title,1,200)
&&validText(text.message,1,5000);

});
}

function validSummary(data){
return data
&&data.driverUid===uid
&&validCount(data.totalCount)
&&validCount(data.unreadCount)
&&validCount(data.urgentUnreadCount)
&&validCount(data.revision)
&&data.unreadCount<=data.totalCount
&&data.urgentUnreadCount<=data.unreadCount;
}

function relatedPage(record){

}

// LOAD NOTIFICATIONS FROM SERVER

async function loadNotifications(append=false){

if(!validSession()||!driver)return;

if(append&&(loading||!nextCursor))return;

const currentGeneration=generation;
const currentListGeneration=++listGeneration;

const cursor=append?nextCursor:null;

if(!append){
records=[];
nextCursor=null;
}

loading=true;

$("notificationStatus").textContent=t.loading;

renderNotifications();

try{

const result=await serverCall(
"getDriverNotifications",
{
readFilter:$("readFilter").value,
category:$("categoryFilter").value,
limit:20,
cursor
}
);

if(currentGeneration!==generation
||currentListGeneration!==listGeneration
||!driver)return;

if(result?.success!==true
||result.driverUid!==uid
||!Array.isArray(result.records)
||result.records.length>20
||!result.records.every(validRecord)
||!(result.nextCursor===null
||validText(result.nextCursor,1,2048))){
throw new Error("Invalid notification response");
}

if(result.nextCursor!==null
&&result.nextCursor===cursor){
throw new Error("Invalid pagination");
}

const combined=new Map();

if(append){
records.forEach(record=>{
combined.set(record.notificationId,record);
});
}

result.records.forEach(record=>{
combined.set(record.notificationId,record);
});

records=Array.from(combined.values())
.sort((a,b)=>b.createdAtMs-a.createdAtMs);

nextCursor=result.nextCursor;

$("notificationStatus").textContent=
records.length===0?t.empty:"";

renderNotifications();

}catch(e){

if(currentGeneration!==generation
||currentListGeneration!==listGeneration)return;

$("notificationStatus").textContent=t.error;

}finally{

if(currentGeneration===generation
&&currentListGeneration===listGeneration){

loading=false;
updateControls();

if(refreshPending&&!saving){
refreshPending=false;
loadNotifications(false);
}

}

}

}

// MARK SINGLE NOTIFICATION AS READ

async function markNotificationRead(notificationId){

if(!validSession()
||!driver
||saving
||!validId(notificationId))return;

const record=records.find(
item=>item.notificationId===notificationId
);

if(!record||record.read)return;

const currentGeneration=generation;

if(!pendingReadRequests.has(notificationId)){
pendingReadRequests.set(
notificationId,
crypto.randomUUID()
);
}

saving=true;

$("notificationStatus").textContent=t.saving;

renderNotifications();

try{

const result=await serverCall(
"markDriverNotificationRead",
{
notificationId,
requestId:pendingReadRequests.get(notificationId)
}
);

if(currentGeneration!==generation)return;

if(result?.updated!==true
||result.driverUid!==uid
||result.notificationId!==notificationId){
throw new Error("Read status not confirmed");
}

pendingReadRequests.delete(notificationId);

$("notificationStatus").textContent=t.saved;

refreshPending=false;

await loadNotifications(false);

}catch(e){

if(currentGeneration!==generation)return;

$("notificationStatus").textContent=t.failed;

}finally{

if(currentGeneration===generation){

saving=false;
renderNotifications();

if(refreshPending){
refreshPending=false;
loadNotifications(false);
}

}

}

}

||result.driverUid!==uid){

}

pendingMarkAll=null;

$("notificationStatus").textContent=t.saved;

refreshPending=false;

await loadNotifications(false);

}catch(e){

if(currentGeneration!==generation)return;

$("notificationStatus").textContent=t.failed;

}finally{

if(currentGeneration===generation){

saving=false;
renderNotifications();

if(refreshPending){
refreshPending=false;

}

}

// LIVE NOTIFICATION SUMMARY

function clearSummary(){

summary=null;

$("totalCount").textContent="—";
$("unreadCount").textContent="—";
$("urgentCount").textContent="—";

updateControls();
}

function subscribeSummary(){

if(summaryUnsubscribe){
summaryUnsubscribe();
summaryUnsubscribe=null;
}

clearSummary();

if(!validSession()||!driver)return;

const currentGeneration=generation;

summaryUnsubscribe=onSnapshot(

doc(
db,
"drivers",
uid,
"notificationState",
"summary"
),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation
||!validSession()
||!driver)return;

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites
||!snapshot.exists()
||!validSummary(snapshot.data())){

clearSummary();
return;
}

const data=snapshot.data();

const changed=previousRevision!==null
&&data.revision!==previousRevision;

const newUnread=previousUnread!==null
&&data.unreadCount>previousUnread;

summary=data;

$("totalCount").textContent=data.totalCount;
$("unreadCount").textContent=data.unreadCount;
$("urgentCount").textContent=data.urgentUnreadCount;

previousRevision=data.revision;
previousUnread=data.unreadCount;

if(newUnread){
showBrowserNotification();
}

if(changed){

if(loading||saving){
refreshPending=true;
}else{
loadNotifications(false);
}

}

updateControls();

},

()=>{

if(currentGeneration!==generation)return;

clearSummary();

$("notificationStatus").textContent=t.error;

}

);

}

// CLEAR PRIVATE INFORMATION

function clearNotificationData(){

listGeneration++;

if(summaryUnsubscribe){
summaryUnsubscribe();
summaryUnsubscribe=null;
}

records=[];
nextCursor=null;
loading=false;
saving=false;
refreshPending=false;

previousRevision=null;
previousUnread=null;

pendingMarkAll=null;
pendingReadRequests.clear();

$("notificationList").replaceChildren();
$("notificationStatus").textContent="";
$("loadMoreButton").hidden=true;

clearSummary();
}

function disconnect(){

generation++;

authorized=false;
uid=null;
driver=null;

if(driverUnsubscribe){
driverUnsubscribe();
driverUnsubscribe=null;
}

stopGps();
clearNotificationData();

$("driverName").textContent="—";
$("driverId").textContent="—";
$("accountStatus").textContent="—";
$("browserStatus").textContent="";
$("content").hidden=true;

updateControls();
}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);
}

// DRIVER ACCOUNT MONITORING

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation
||!validSession())return;

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites){

driver=null;
stopGps();
clearNotificationData();

$("content").hidden=true;

status(t.checking);

return;
}

const data=snapshot.data();

if(!snapshot.exists()
||data.uid!==uid
||!["approved","suspended","blocked"].includes(data.status)
||data.activationComplete!==true
||!validText(data.fullName,1,150)
||!validId(data.driverId)){

denyAccess();
return;
}

const firstLoad=driver===null;

const statusChanged=driver!==null
&&driver.status!==data.status;

driver=data;

$("driverName").textContent=data.fullName;
$("driverId").textContent=data.driverId;

$("accountStatus").textContent=t[data.status];

$("accountStatus").className=
data.status==="approved"?"green":"red";

$("content").hidden=false;
$("accessPanel").hidden=true;

if(data.status==="approved"
&&data.documentsValid===true
&&["online","busy"].includes(data.availability)){

startGps();

}else{

stopGps();

}

if(firstLoad||statusChanged){

clearNotificationData();

$("readFilter").value="all";
$("categoryFilter").value="all";

subscribeSummary();
loadNotifications(false);

}

status(restricted()?t.restricted:"");

updateControls();

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// APPROVED DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!db||!functions){
denyAccess();
return;
}

if(!navigator.onLine){
status(t.offline);
return;
}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true
||token.signInProvider!=="custom"){
throw new Error("Driver login required");
}

const response=await httpsCallable(
functions,
"verifyDriverNotificationSession"
)({});

if(currentGeneration!==generation
||auth.currentUser?.uid!==user.uid){
return;
}

const account=response.data;

if(account?.authorized!==true
||account.uid!==user.uid
||account.activationComplete!==true
||!["approved","suspended","blocked"].includes(account.status)){
throw new Error("Access denied");
}

authorized=true;
uid=user.uid;

$("accessPanel").hidden=true;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){
onAuthStateChanged(auth,verifyDriver);
}

// AUTOMATIC SESSION VERIFICATION

setInterval(async()=>{

if(!validSession()
||!driver
||checkingSession)return;

const currentGeneration=generation;

checkingSession=true;

try{

const result=await serverCall(
"verifyDriverNotificationSession"
);

if(currentGeneration!==generation)return;

if(result?.authorized!==true
||result.uid!==uid
||result.activationComplete!==true
||!["approved","suspended","blocked"].includes(result.status)){

denyAccess();

}

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

checkingSession=false;

}

},60000);

// INTERNET CONNECTION MONITORING

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){
verifyDriver(auth.currentUser);
}

});

// PAGE LIFECYCLE

window.addEventListener(
"pagehide",
disconnect
);

window.addEventListener(
"pageshow",
event=>{

if(event.persisted&&auth){
verifyDriver(auth.currentUser);
}

}
);

document.addEventListener(
"visibilitychange",
()=>{

if(document.visibilityState==="visible"){
updatePermission();
}

}
);

</script>

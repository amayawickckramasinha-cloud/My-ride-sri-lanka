
<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Driver Feedback</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:650px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

h3{
color:#FFD600;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:16px;
margin:15px 0;
}

.row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
padding:13px 0;
border-bottom:1px solid #444;
font-size:14px;
line-height:1.7;
}

.row span{
color:#CCC;
}

.row strong{
text-align:right;
max-width:60%;
overflow-wrap:anywhere;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-size:14px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:14px;
background:#292929;
color:#fff;
border:1px solid #555;
border-radius:9px;
font-size:16px;
}

textarea{
min-height:160px;
resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
outline:2px solid #FFD600;
}

input[readonly]{
color:#CCC;
background:#181818;
}

input[type="checkbox"]{
width:22px;
height:22px;
accent-color:#FFD600;
flex-shrink:0;
}

.checkboxRow{
display:flex;
align-items:flex-start;
gap:10px;
margin:18px 0;
}

.checkboxRow label{
margin:0;
font-weight:normal;
line-height:1.8;
}

.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
border:0;
border-radius:9px;
background:#FFD600;
color:#111;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.8;
}

.warning{
background:#351919;
border:1px solid #FF6464;
border-radius:10px;
padding:15px;
color:#FFB4B4;
line-height:1.8;
margin:15px 0;
}

.success{
background:#163322;
border:1px solid #4ADE80;
border-radius:10px;
padding:15px;
color:#4ADE80;
line-height:1.8;
}

.yellow{color:#FFD600}
.green{color:#4ADE80}
.red{color:#FF6464}

.ticket{
background:#202020;
border:1px solid #555;
border-radius:12px;
margin:14px 0;
overflow:hidden;
}

.ticket summary{
padding:16px;
cursor:pointer;
line-height:1.8;
overflow-wrap:anywhere;
}

.ticketContent{
padding:0 16px 16px;
}

.messageBox{
background:#292929;
border:1px solid #444;
border-radius:8px;
padding:14px;
margin:12px 0;
line-height:1.8;
white-space:pre-wrap;
overflow-wrap:anywhere;
}

.adminReply{
border-left:3px solid #FFD600;
}

.badge{
display:inline-block;
padding:7px 12px;
border-radius:6px;
font-size:12px;
font-weight:bold;
margin:8px 0;
}

.new{
background:#39320D;
color:#FFD600;
}

.in_progress{
background:#172D48;
color:#93C5FD;
}

.resolved{
background:#163322;
color:#4ADE80;
}

.closed{
background:#333;
color:#CCC;
}

#status,
#historyStatus{
text-align:center;
line-height:1.8;
color:#FFD600;
}

#characterCount{
text-align:right;
color:#AAA;
font-size:12px;
margin-top:6px;
}

button:disabled,
input:disabled,
select:disabled,
textarea:disabled{
opacity:.5;
cursor:not-allowed;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:25px;
}

[hidden]{
display:none!important;
}

</style>
</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading"></h2>

<p id="status"
role="status"
aria-live="polite"></p>

<section id="accessPanel"
class="panel" hidden>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="content" hidden>

<section class="panel">

<div class="row">

<span data-t="driverName"></span>

<strong id="driverName">—</strong>

</div>

<div class="row">

<span>Driver ID</span>

<strong id="driverId"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="accountStatus"></span>

<strong class="green"
data-t="approved"></strong>

</div>

</section>

<div class="warning"
data-t="emergencyNote"></div>

<a id="sosLink"
class="action secondary"
data-t="emergencyHelp"></a>

<section class="panel">

<h3 data-t="newFeedback"></h3>

<form id="feedbackForm">

<label for="name"
data-t="driverName"></label>

<input
id="name"
type="text"
readonly>

<label for="driverIdInput">
Driver ID
</label>

<input
id="driverIdInput"
type="text"
readonly>

<label for="type"
data-t="type"></label>

<select id="type" required>

<option value=""
data-t="select"></option>

<option value="complaint"
data-t="complaint"></option>

<option value="feedback"
data-t="feedback"></option>

<option value="suggestion"
data-t="suggestion"></option>

<option value="question"
data-t="question"></option>

</select>

<label for="category"
data-t="category"></label>

<select id="category" required>

<option value=""
data-t="select"></option>

<option value="customer"
data-t="customerIssue"></option>

<option value="payment"
data-t="paymentIssue"></option>

<option value="commission"
data-t="commissionIssue"></option>

<option value="booking"
data-t="bookingIssue"></option>

<option value="technical"
data-t="technicalIssue"></option>

<option value="gps"
data-t="gpsIssue"></option>

<option value="fare"
data-t="fareIssue"></option>

<option value="safety"
data-t="safetyIssue"></option>

<option value="account"
data-t="accountIssue"></option>

<option value="other"
data-t="other"></option>

</select>

<label for="bookingId"
data-t="bookingId"></label>

<input
id="bookingId"
type="text"
maxlength="128"
autocomplete="off">

<p class="note"
data-t="bookingNote"></p>

<label for="subject"
data-t="subject"></label>

<input
id="subject"
type="text"
minlength="3"
maxlength="100"
required>

<label for="message"
data-t="message"></label>

<textarea
id="message"
minlength="10"
maxlength="2000"
required></textarea>

<div id="characterCount">
0 / 2000
</div>

<p class="note"
data-t="privacyNote"></p>

<div class="checkboxRow">

<input
id="declaration"
type="checkbox"
required>

<label for="declaration"
data-t="declaration"></label>

</div>

<button
id="submitButton"
type="submit"
class="action"
data-t="submit"></button>

</form>

<p id="submitStatus"
role="status"
aria-live="polite"
class="note"></p>

</section>

<section id="successPanel"
class="panel" hidden>

<div class="success"
data-t="submitted"></div>

<div class="row">

<span data-t="referenceId"></span>

<strong id="referenceId"
class="yellow">—</strong>

</div>

<div class="row">

<span data-t="ticketStatus"></span>

<strong data-t="new"
class="yellow"></strong>

</div>

<button
id="copyReference"
class="action secondary"
data-t="copyReference"></button>

<p id="copyStatus"
class="note"
role="status"></p>

</section>

<section class="panel">

<h3 data-t="myTickets"></h3>

<label for="statusFilter"
data-t="filterStatus"></label>

<select id="statusFilter">

<option value=""
data-t="all"></option>

<option value="new"
data-t="new"></option>

<option value="in_progress"
data-t="in_progress"></option>

<option value="resolved"
data-t="resolved"></option>

<option value="closed"
data-t="closed"></option>

</select>

<button
id="refreshButton"
class="action secondary"
data-t="refresh"></button>

<p id="historyStatus"
role="status"
aria-live="polite"></p>

<div id="ticketList"></div>

<button
id="loadMoreButton"
class="action secondary"
data-t="loadMore" hidden></button>

</section>

<a id="helpLink"
class="action"
data-t="help"></a>

</div>

<a id="backButton"
class="action secondary"
data-t="back"></a>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

// SECURITY VALIDATION

function validSession(){

return authorized

&&uid!==null

&&auth?.currentUser?.uid===uid

&&navigator.onLine;

}

function validId(value){

return typeof value==="string"

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

}

function validText(value,min,max){

return typeof value==="string"

&&value.trim().length>=min

&&value.length<=max;

}

function validCategory(value){

return typeof value==="string"

&&Object.prototype.hasOwnProperty.call(

CATEGORIES,value

);

}

function formatDate(ms){

if(!Number.isFinite(ms)

||ms<=0

||ms>8640000000000000){

return "—";

}

return new Intl.DateTimeFormat(

lang==="si"?"si-LK":

lang==="ta"?"ta-LK":"en-LK",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(ms));

}

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||currentGeneration!==generation){

throw new Error("Session changed");

}

return response.data;

}

// GPS CONTINUITY

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

const c=position.coords;

if(!validSession()

||!driver

||!["online","busy"].includes(

driver.availability

)

||!Number.isFinite(c.latitude)

||!Number.isFinite(c.longitude)

||!Number.isFinite(c.accuracy)

||c.accuracy<0

||c.accuracy>100

||c.latitude<5.85

||c.latitude>9.9

||c.longitude<79.5

||c.longitude>82

||Date.now()-position.timestamp>30000

||position.timestamp>Date.now()+5000

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

{

lat:c.latitude,

lon:c.longitude,

accuracy:c.accuracy,

capturedAtMs:position.timestamp

}

);

}catch(e){

// Backend must expire stale GPS records.

}finally{

gpsSending=false;

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// VALIDATE SERVER TICKET RECORD

function validTicket(data){

if(!data

||data.driverUid!==uid

||!validId(data.referenceId)

||!TYPES.includes(data.type)

||!validCategory(data.category)

||!STATUSES.includes(data.status)

||!validText(data.subject,3,100)

||!validText(data.message,10,2000)){

return false;

}

if(data.bookingId!==null

&&data.bookingId!==undefined

&&!validId(data.bookingId)){

return false;

}

if(!Number.isFinite(data.createdAtMs)

||data.createdAtMs<=0

||data.createdAtMs>8640000000000000){

return false;

}

if(!Number.isFinite(data.updatedAtMs)

||data.updatedAtMs<data.createdAtMs

||data.updatedAtMs>8640000000000000){

return false;

}

if(data.adminReply!==null

&&data.adminReply!==undefined

&&(

typeof data.adminReply!=="string"

||data.adminReply.length>4000

)){

return false;

}

return true;

}

async function loadHistory(){

if(!validSession()

||!driver

||historyLoading)return;

historyLoading=true;

$("loadMoreButton").disabled=true;

$("refreshButton").disabled=true;

$("historyStatus").textContent=t.loading;

const currentGeneration=generation;

const currentHistoryGeneration=

historyGeneration;

const requestedCursor=cursor;

try{

const result=await serverCall(

"getDriverFeedbackHistory",

{

status:selectedStatus||null,

limit:PAGE_SIZE,

cursor:requestedCursor

}

);

if(currentGeneration!==generation

||currentHistoryGeneration!==historyGeneration

||!driver)return;

if(result?.success!==true

||result.driverUid!==uid

||!Array.isArray(result.records)

||result.records.length>PAGE_SIZE

||!result.records.every(validTicket)){

throw new Error("Invalid records");

}

const next=result.nextCursor;

if(next!==null

&&(

typeof next!=="string"

||next.length===0

||next.length>2048

||next===requestedCursor

)){

throw new Error("Invalid cursor");

}

result.records.forEach(ticket=>{

if(!selectedStatus

||ticket.status===selectedStatus){

records.set(

ticket.referenceId,

ticket

);

}

});

cursor=next;

renderHistory();

$("loadMoreButton").hidden=

cursor===null;

}catch(e){

if(currentGeneration!==generation

||currentHistoryGeneration!==historyGeneration){

return;

}

$("historyStatus").textContent=

t.historyError;

$("loadMoreButton").hidden=

requestedCursor===null;

}finally{

if(currentGeneration===generation

&&currentHistoryGeneration===historyGeneration){

historyLoading=false;

$("loadMoreButton").disabled=false;

$("refreshButton").disabled=false;

}

}

}

snapshot=>{

clearHistory();

clearSuccess();

clearForm();

pendingRequest=null;

$("content").hidden=true;

status(t.checking);

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true

||!validText(data.fullName,1,150)

||!validId(data.driverId)){

}

const firstLoad=driver===null;

driver=data;

$("driverName").textContent=

data.fullName;

$("driverId").textContent=

data.driverId;

$("name").value=data.fullName;

$("driverIdInput").value=data.driverId;

$("content").hidden=false;

$("accessPanel").hidden=true;

if(["online","busy"].includes(

data.availability

)){

startGps();

}else{

stopGps();

}

if(firstLoad){

refreshHistory();

}

updateControls();

status("");

},

()=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// APPROVED DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!db||!functions){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true

||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// AUTOMATIC SESSION VERIFICATION
// AND COMPLAINT STATUS REFRESH

let checkingSession=false;

setInterval(async()=>{

if(!validSession()

||!driver

||checkingSession)return;

const currentGeneration=generation;

checkingSession=true;

try{

const result=await serverCall(

"verifyDriverSession"

);

if(currentGeneration!==generation)return;

if(result?.authorized!==true

||result.uid!==uid

||result.status!=="approved"

||result.activationComplete!==true

||result.documentsValid!==true){

denyAccess();

return;

}

if(!historyLoading

&&!submitting

&&records.size<=PAGE_SIZE

&&document.visibilityState==="visible"

&&!$("ticketList").querySelector("details[open]")){

refreshHistory();

}

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}finally{

checkingSession=false;

}

},60000);

// INTERNET CONNECTION MONITORING

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>

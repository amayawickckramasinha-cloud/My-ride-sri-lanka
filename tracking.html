function validPoint(point){

return point
&&Number.isFinite(point.lat)
&&Number.isFinite(point.lon)
&&point.lat>=5.85
&&point.lat<=9.9
&&point.lon>=79.5
&&point.lon<=82;

}

function initializeMap(){

if(map){

map.invalidateSize();
return true;

}

if(typeof L==="undefined"){

status(t.mapError);
return false;

}

map=L.map("map")
.setView([7.8731,80.7718],7);

L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}

).addTo(map);

return true;

}

function centerMap(){

if(!map)return;

const points=[];

if(pickupPoint){

points.push([
pickupPoint.lat,
pickupPoint.lon
]);

}

if(driverPoint){

points.push([
driverPoint.lat,
driverPoint.lon
]);

}

if(points.length===2){

map.fitBounds(points,{
padding:[35,35],
maxZoom:16
});

}else if(points.length===1){

map.setView(points[0],16);

}

}

$("centerMap").onclick=centerMap;

// REMOVE OLD ROUTE

function clearRoute(){

routeRevision++;

if(routeController){

routeController.abort();
routeController=null;

}

if(map&&routeLine){

map.removeLayer(routeLine);
routeLine=null;

}

}

function clearDriverLocation(){

clearRoute();

if(map&&driverMarker){

map.removeLayer(driverMarker);
driverMarker=null;

}

driverPoint=null;
latestGpsTime=0;
lastRouteTime=0;

$("distance").textContent=t.unknown;
$("eta").textContent=t.unknown;

}


// AUTOMATIC ROUTE AND ETA

async function updateRoute(){

if(!driverPoint||!pickupPoint)return;

if(Date.now()-latestGpsTime>60000)return;

if(Date.now()-lastRouteTime<15000)return;

lastRouteTime=Date.now();

clearRoute();

const revision=routeRevision;

const controller=new AbortController();

routeController=controller;

const timeout=setTimeout(

()=>controller.abort(),15000

);

const driver={...driverPoint};
const pickup={...pickupPoint};

$("distance").textContent=t.routeLoading;
$("eta").textContent=t.routeLoading;

try{

const url=

"https://router.project-osrm.org/route/v1/driving/"

+driver.lon+","+driver.lat+";"

+pickup.lon+","+pickup.lat

+"?overview=full&geometries=geojson";

const response=await fetch(url,{

signal:controller.signal

});

if(!response.ok){

throw new Error("Route unavailable");

}

const data=await response.json();

if(revision!==routeRevision)return;

if(data.code!=="Ok"
||!data.routes?.length){

throw new Error("No route");

}

const route=data.routes[0];

if(!Number.isFinite(route.distance)
||!Number.isFinite(route.duration)
||route.distance<0
||route.duration<0){

throw new Error("Invalid route");

}

routeLine=L.geoJSON(

route.geometry,

{
style:{
color:"#1677FF",
weight:6,
opacity:.9
}
}

).addTo(map);

$("distance").textContent=

(route.distance/1000).toFixed(2)+" KM";

$("eta").textContent=

Math.ceil(route.duration/60)+" min";

}catch(error){

if(revision===routeRevision){

$("distance").textContent=t.routeError;
$("eta").textContent=t.unknown;

}

}finally{

clearTimeout(timeout);

if(routeController===controller){

routeController=null;

}

}

}


// STOP GPS TRACKING

function stopGPS(){

if(gpsUnsubscribe){

gpsUnsubscribe();
gpsUnsubscribe=null;

}

if(gpsTimer){

clearInterval(gpsTimer);
gpsTimer=null;

}

assignedDriverUid=null;

clearDriverLocation();

}


// LIVE GPS SUBSCRIPTION

function subscribeGPS(driverUid){

if(assignedDriverUid===driverUid
&&gpsUnsubscribe){

return;

}

stopGPS();

assignedDriverUid=driverUid;

$("gpsStatus").textContent=t.gpsWaiting;

const locationRef=doc(

db,

"bookings",

bookingId,

"tracking",

"driver"

);

gpsUnsubscribe=onSnapshot(

locationRef,

{includeMetadataChanges:true},

snapshot=>{

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites){

clearDriverLocation();

$("gpsStatus").textContent=t.gpsWaiting;

return;

}

if(!snapshot.exists()){

clearDriverLocation();

$("gpsStatus").textContent=t.gpsWaiting;

return;

}

const data=snapshot.data();

if(data.driverUid!==assignedDriverUid
||!validPoint(data)
||data.active!==true){

clearDriverLocation();

$("gpsStatus").textContent=t.gpsWaiting;

return;

}

const updatedAt=
data.updatedAt?.toMillis?.();

if(!Number.isFinite(updatedAt)
||Date.now()-updatedAt>60000
||updatedAt>Date.now()+30000){

clearDriverLocation();

$("gpsStatus").textContent=t.gpsStale;

return;

}

latestGpsTime=updatedAt;

$("gpsStatus").textContent=t.gpsActive;

showDriver({

lat:data.lat,

lon:data.lon

});

updateRoute();

},

error=>{

clearDriverLocation();

$("gpsStatus").textContent=t.unknown;

status(

error.code==="permission-denied"
?t.denied:t.error

);

$("retryButton").hidden=false;

}

);

gpsTimer=setInterval(()=>{

if(latestGpsTime
&&Date.now()-latestGpsTime>60000){

clearDriverLocation();

$("gpsStatus").textContent=t.gpsStale;

}else if(driverPoint){

updateRoute();

}

},5000);

}

function displayBooking(data){

bookingStatus=data.status;

if(data.status==="completed"){

clearDisplay();
status(t.completed);
return;

}

if(data.status==="cancelled"){

clearDisplay();
status(t.cancelled);
return;

}

if(data.status==="active"){

clearDisplay();

status(t.started);

$("trackingPanel").hidden=false;
$("map").hidden=true;

$("driverName").textContent=t.unknown;
$("driverPhone").textContent=t.unknown;
$("gpsStatus").textContent=t.unknown;

$("activeRide").href=

"./active-ride.html?lang="+lang
+"&booking="+encodeURIComponent(bookingId);

$("activeRide").hidden=false;

return;

}

if(!["accepted","arrived"]
.includes(data.status)){

clearDisplay();
status(t.waiting);
return;

}

const driver=data.assignedDriver;

if(!driver
||typeof driver.uid!=="string"
||typeof driver.name!=="string"
||typeof driver.phone!=="string"
||!validPoint(data.pickup)){

clearDisplay();
status(t.error);
return;

}

const phone=driver.phone
.replace(/[\s-]/g,"");

if(!/^(?:\+94|94|0)7\d{8}$/.test(phone)){

clearDisplay();
status(t.error);
return;

}

$("trackingPanel").hidden=false;
$("map").hidden=false;

$("activeRide").hidden=true;

$("driverName").textContent=driver.name;

$("driverPhone").textContent=phone;

$("callDriver").href="tel:"+phone;

$("callDriver").hidden=false;

if(!initializeMap())return;

showPickup(data.pickup);

if(data.status==="arrived"){

stopGPS();

status(t.arrived);

$("gpsStatus").textContent=t.unknown;

centerMap();

return;

}

status(t.coming);

subscribeGPS(driver.uid);

if(!driverPoint){

centerMap();

}

}


// AUTHORIZED BOOKING LISTENER

function disconnect(){

if(bookingUnsubscribe){

bookingUnsubscribe();
bookingUnsubscribe=null;

}

clearDisplay();

}

function connect(){

disconnect();

$("retryButton").hidden=true;

if(!validBookingId(bookingId)){

status(t.missing);
return;

}

if(!auth||!db){

status(t.error);
return;

}

if(!currentUser){

status(t.auth);
return;

}

if(!navigator.onLine){

status(t.offline);

$("retryButton").hidden=false;

return;

}

status(t.connecting);

const bookingRef=doc(

db,

"bookings",

bookingId

);

bookingUnsubscribe=onSnapshot(

bookingRef,

{includeMetadataChanges:true},

snapshot=>{

if(snapshot.metadata.fromCache
||snapshot.metadata.hasPendingWrites){

clearDisplay();

status(t.connecting);

return;

}

if(!snapshot.exists()){

clearDisplay();
status(t.missing);
return;

}

const data=snapshot.data();

if(data.customerUid!==currentUser?.uid){

disconnect();
status(t.denied);
return;

}

displayBooking(data);

},

error=>{

disconnect();

status(

error.code==="permission-denied"
?t.denied:t.error

);

$("retryButton").hidden=false;

}

);

}


// AUTHENTICATION SYSTEM

if(auth&&db){

onAuthStateChanged(

auth,

user=>{

currentUser=user;

connect();

},

()=>{

disconnect();

status(t.auth);

}

);

}


// INTERNET AND SESSION RECOVERY

$("retryButton").onclick=connect;

window.addEventListener(

"offline",

()=>{

disconnect();

status(t.offline);

$("retryButton").hidden=false;

}

);

window.addEventListener(

"online",

connect

);

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted){

connect();

}

}

);

</script>

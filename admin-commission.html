<!DOCTYPE html>
<html lang="si" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<meta name="robots"
content="noindex,nofollow,noarchive">
<meta name="google" content="notranslate">
<meta name="referrer" content="no-referrer">

<title>MY RIDE - Commission Management</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

main{
max-width:1000px;
margin:auto;
padding:16px;
}

h1{
color:#FFD600;
text-align:center;
font-size:38px;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
}

h3,h4{
color:#FFD600;
}

.panel{
background:#202020;
border:1px solid #555;
border-radius:12px;
padding:16px;
margin:16px 0;
}

.languages{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

button,.action{
display:block;
width:100%;
padding:14px;
margin:10px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:15px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

button:disabled{
opacity:.45;
cursor:not-allowed;
}

input,select,textarea{
width:100%;
padding:13px;
margin:8px 0;
background:#292929;
color:white;
border:1px solid #666;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:90px;
resize:vertical;
}

label{
display:block;
margin-top:12px;
line-height:1.7;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.stat{
background:#292929;
border-radius:9px;
padding:15px;
overflow-wrap:anywhere;
}

.stat strong{
display:block;
font-size:21px;
margin-top:10px;
color:#FFD600;
}

.record{
background:#292929;
border:1px solid #555;
border-radius:10px;
padding:15px;
margin:12px 0;
line-height:1.9;
overflow-wrap:anywhere;
}

.good{
color:#55E68A;
}

.warning{
color:#FFB347;
}

.bad{
color:#FF7777;
}

.danger{
background:#C62828;
color:white;
}

.back{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.note{
color:#CCC;
font-size:13px;
line-height:1.8;
}

.checkRow{
display:flex;
align-items:flex-start;
gap:10px;
}

.checkRow input{
width:20px;
height:20px;
flex-shrink:0;
}

#status,#result,#actionResult{
color:#FFD600;
text-align:center;
line-height:1.8;
}

#proofImage{
max-width:100%;
max-height:650px;
object-fit:contain;
border-radius:8px;
}

footer{
text-align:center;
color:#AAA;
font-size:12px;
padding:20px;
}

[hidden]{
display:none!important;
}

</style>

</head>

<body>

<main>

<h1>MY RIDE</h1>

<div class="country">
SRI LANKA
</div>

<h2 data-t="heading">
Commission Management
</h2>

<div class="languages">

<button data-lang="si">සිංහල</button>
<button data-lang="en">English</button>
<button data-lang="ta">தமிழ்</button>

</div>

<p id="status" role="status"
aria-live="polite">
Checking security...
</p>

<section id="accessPanel"
class="panel" hidden>

<h3>🔒 Owner Admin Only</h3>

<p data-t="denied"></p>

<a id="loginLink"
class="action"
data-t="login"></a>

</section>

<div id="adminContent" hidden>

<a id="dashboardLink"
class="action back"
data-t="back"></a>

<section class="panel">

<h3 data-t="overview"></h3>

<div id="overview" class="grid"></div>

<p id="lastUpdate" class="note"></p>

<button id="refreshButton"
data-t="refresh"></button>

</section>

<section class="panel">

<h3 data-t="income"></h3>

<div id="incomeSummary"
class="grid"></div>

<p class="note"
data-t="incomeNotice"></p>

</section>

<section class="panel">

<h3 data-t="commissionSettings"></h3>

<div id="commissionSettings"
class="grid"></div>

<p class="note"
data-t="rateNotice"></p>

<a id="fareLink"
class="action"
data-t="fareManagement"></a>

<label for="deadlineDays"
data-t="deadline"></label>

<input id="deadlineDays"
type="number"
min="1"
max="30"
step="1">

<label for="settingsReason"
data-t="reason"></label>

<textarea id="settingsReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="settingsConsent"
type="checkbox">

<span data-t="confirmSettings"></span>

</label>

<button id="saveSettings"
data-t="save"
disabled></button>

</section>

<section class="panel">

<h3 data-t="driverAccounts"></h3>

<label for="driverSearch"
data-t="search"></label>

<input id="driverSearch"
type="search"
maxlength="100"
autocomplete="off">

<label for="driverFilter"
data-t="accountStatus"></label>

<select id="driverFilter">

<option value="all"
data-t="all"></option>

<option value="paid"
data-t="paid"></option>

<option value="unpaid"
data-t="unpaid"></option>

<option value="overdue"
data-t="overdue"></option>

</select>

<button id="searchDrivers"
data-t="searchButton"></button>

<div id="driverList"></div>

<button id="moreDrivers"
data-t="more"
hidden></button>

</section>

<section id="driverDetailsPanel"
class="panel"
hidden>

<h3 data-t="driverDetails"></h3>

<div id="driverDetails"></div>

<h4 data-t="commissionLedger"></h4>

<div id="ledgerList"></div>

<button id="moreLedger"
data-t="more"
hidden></button>

<button id="sendReminder"
data-t="reminder"></button>

<button id="closeDriver"
class="back"
data-t="close"></button>

</section>

<section class="panel">

<h3 data-t="paymentRequests"></h3>

<label for="paymentFilter"
data-t="paymentStatus"></label>

<select id="paymentFilter">

<option value="pending"
data-t="pending"></option>

<option value="approved"
data-t="approved"></option>

<option value="rejected"
data-t="rejected"></option>

<option value="all"
data-t="all"></option>

</select>

<button id="loadPayments"
data-t="loadPayments"></button>

<div id="paymentList"></div>

<button id="morePayments"
data-t="more"
hidden></button>

</section>

<section id="reviewPanel"
class="panel"
hidden>

<h3 data-t="reviewPayment"></h3>

<div id="reviewDetails"></div>

<button id="viewProof"
data-t="viewProof"></button>

<img id="proofImage"
alt="Payment proof"
hidden>

<p class="note"
data-t="proofNotice"></p>

<label for="reviewDecision"
data-t="decision"></label>

<select id="reviewDecision">

<option value="approved"
data-t="approved"></option>

<option value="rejected"
data-t="rejected"></option>

</select>

<label for="bankTransaction"
data-t="bankTransaction"></label>

<input id="bankTransaction"
maxlength="150"
autocomplete="off">

<label for="reviewReason"
data-t="reason"></label>

<textarea id="reviewReason"
maxlength="500"></textarea>

<label class="checkRow">

<input id="reviewConsent"
type="checkbox">

<span data-t="confirmReview"></span>

</label>

<button id="submitReview"
data-t="confirm"
disabled></button>

<button id="closeReview"
class="back"
data-t="close"></button>

</section>

<section class="panel">

<h3 data-t="history"></h3>

<div id="historyList"></div>

<button id="loadHistory"
data-t="loadHistory"></button>

<button id="moreHistory"
data-t="more"
hidden></button>

</section>

<p id="actionResult"
role="status"
aria-live="polite"></p>

<p id="result"
role="status"
aria-live="polite"></p>

<a id="backLink"
class="action back"
data-t="back"></a>

</div>

<footer>
© MY RIDE SRI LANKA
</footer>

</main>

&&/^[A-Za-z0-9_-]{1,128}$/.test(value);

&&value>0
&&value<=8640000000000000;

}

||validText(value,4000);

async function serverCall(name,data={}){

if(!isOwner()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,
name,
{timeout:30000}

)(data);

if(currentGeneration!==generation
||!isOwner()){

throw new Error("Session changed");

}

return response.data;

}

function requireSuccess(response){

if(response?.success!==true
||response.ownerUid!==ownerUid){

throw new Error("Invalid server response");

}

return response;

}

function validSettings(data){

return data
&&validCount(data.version)
&&Number.isInteger(data.deadlineDays)
&&data.deadlineDays>=1
&&data.deadlineDays<=30
&&typeof data.commissionRate==="number"
&&Number.isFinite(data.commissionRate)
&&data.commissionRate>=0
&&data.commissionRate<=100;

}

function validOverview(data){

return data

&&[

"totalCommissionCents",
"totalPaidCents",
"totalUnpaidCents",
"totalOverdueCents",
"todayReceivedCents",
"weekReceivedCents",
"monthReceivedCents"

].every(key=>validAmount(data[key]))

&&data.totalCommissionCents===

data.totalPaidCents+data.totalUnpaidCents

&&data.totalOverdueCents<=data.totalUnpaidCents

&&validCount(data.pendingPayments)

&&validCount(data.overdueDrivers);

}

async function loadOverview(preserveDraft=false){

const response=requireSuccess(

await serverCall("getAdminCommissionOverview")

);

if(!validOverview(response.overview)

||!validSettings(response.settings)

||!validTime(response.serverTimeMs)){

throw new Error("Invalid overview");

}

overview=response.overview;

lastSync=response.serverTimeMs;

if(!preserveDraft||!dirty){

settings=response.settings;

$("deadlineDays").value=settings.deadlineDays;

$("settingsReason").value="";

$("settingsConsent").checked=false;

dirty=false;

}else if(settings.version!==response.settings.version){

actionResult("saveError");

}

renderOverview();

}

async function runRead(callback){

if(!isOwner()||busy||mutationBusy)return;

const currentGeneration=generation;

busy=true;

updateControls();

result("loading");

try{

await callback();

if(currentGeneration===generation){

result("");

}

}catch(e){

if(currentGeneration===generation){

result("error");

}

}finally{

if(currentGeneration===generation){

busy=false;

updateControls();

}

}

}

if(!isOwner()){

throw new Error("Unauthorized");

}

const user=auth.currentUser;

const uid=user.uid;

const provider=new GoogleAuthProvider();

provider.setCustomParameters({

prompt:"select_account"

});

const credential=

await reauthenticateWithPopup(user,provider);

if(credential.user.uid!==uid

||auth.currentUser?.uid!==uid

||!isOwner()){

throw new Error("Owner changed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Invalid owner");

}

const response=await serverCall("verifyOwnerAdmin");

if(!validOwner(response,uid)){

throw new Error("Owner verification failed");

}

}

async function runMutation(name,payload,onSuccess){

if(!isOwner()||busy||mutationBusy)return;

const currentGeneration=generation;

const fingerprint=JSON.stringify([name,payload]);

if(pendingMutation

&&pendingMutation.fingerprint!==fingerprint){

actionResult("saveError");

return;

}

if(!pendingMutation){

pendingMutation={

fingerprint,

requestId:crypto.randomUUID()

};

}

const requestId=pendingMutation.requestId;

mutationBusy=true;

updateControls();

actionResult("saving");

try{

await freshOwnerAuthentication();

const response=requireSuccess(

await serverCall(name,{

...payload,

requestId

})

);

await onSuccess(response);

pendingMutation=null;

}catch(e){

if(currentGeneration===generation){

actionResult("saveError");

}

}finally{

if(currentGeneration===generation){

mutationBusy=false;

updateControls();

}

}

}

$("saveSettings").onclick=()=>{

if(!settings||!dirty

||!$("settingsConsent").checked)return;

const deadlineDays=Number($("deadlineDays").value);

const reason=$("settingsReason").value.trim();

if(!Number.isInteger(deadlineDays)

||deadlineDays<1

||deadlineDays>30

||reason.length<10

||reason.length>500){

actionResult("invalid");

return;

}

const expectedVersion=settings.version;

runMutation(

"saveAdminCommissionSettings",

{

deadlineDays,

reason,

expectedVersion,

applyTo:"future_confirmed_bookings"

},

async response=>{

if(!validSettings(response.settings)

||response.settings.version<=expectedVersion

||response.settings.deadlineDays!==deadlineDays){

throw new Error("Save not confirmed");

}

settings=response.settings;

dirty=false;

$("settingsConsent").checked=false;

$("settingsReason").value="";

renderOverview();

actionResult("saved");

}

);

};

function validDriver(record){

return record

&&validId(record.uid)

&&validId(record.driverId)

&&validText(record.fullName,200)

&&validText(record.phone,30)

&&validAmount(record.totalCommissionCents)

&&validAmount(record.totalPaidCents)

&&validAmount(record.totalUnpaidCents)

&&validAmount(record.totalOverdueCents)

&&record.totalCommissionCents===

record.totalPaidCents+record.totalUnpaidCents

&&record.totalOverdueCents<=record.totalUnpaidCents

&&validCount(record.revision)

&&(record.nextDueAtMs===null

||validTime(record.nextDueAtMs));

}

$("moreDrivers").hidden=driverCursor===null;

money(record.totalUnpaidCents));

createButton("details",()=>openDriver(record.uid))

function mergeRecords(oldRecords,newRecords,key){

const unique=new Map(

oldRecords.map(record=>[record[key],record])

);

newRecords.forEach(record=>{

unique.set(record[key],record);

});

return [...unique.values()];

}

async function loadDrivers(reset=true){

await runRead(async()=>{

if(reset){

driverQuery={

search:$("driverSearch").value.trim(),

status:$("driverFilter").value

};

drivers=[];

driverCursor=null;

renderDrivers();

}

const response=requireSuccess(

await serverCall("getAdminCommissionDrivers",{

...driverQuery,

limit:30,

cursor:reset?null:driverCursor

})

);

if(!Array.isArray(response.records)

||response.records.length>30

||!response.records.every(validDriver)

||!validCursor(response.nextCursor)){

throw new Error("Invalid driver records");

}

drivers=mergeRecords(

drivers,

response.records,

"uid"

);

driverCursor=response.nextCursor;

renderDrivers();

});

}

$("searchDrivers").onclick=()=>loadDrivers(true);

$("moreDrivers").onclick=()=>{

loadDrivers(false);

};

function validLedger(record){

return record

&&validId(record.recordId)

&&validId(record.bookingId)

&&validAmount(record.grossFareCents)

&&validAmount(record.commissionCents)

&&validAmount(record.driverNetCents)

&&validAmount(record.outstandingCents)

&&record.grossFareCents===

record.commissionCents+record.driverNetCents

&&record.outstandingCents<=record.commissionCents

&&typeof record.commissionRate==="number"

&&Number.isFinite(record.commissionRate)

&&record.commissionRate>=0

&&record.commissionRate<=100

&&validTime(record.createdAtMs)

&&validTime(record.dueAtMs)

&&["paid","unpaid","overdue"].includes(record.status);

}

async function loadDriverLedger(uid,reset=true){

const response=requireSuccess(

await serverCall("getAdminDriverCommissionLedger",{

driverUid:uid,

limit:30,

cursor:reset?null:ledgerCursor

})

);

if(!validDriver(response.driver)

||response.driver.uid!==uid

||response.records.length>30

||!validCursor(response.nextCursor)){

}

reset?[]:ledger,

response.records,

"recordId"

);

ledgerCursor=response.nextCursor;

renderDriverDetails();

&&record.amountCents>0

&&validText(record.reference,150)

&&["pending","approved","rejected"].includes(record.status)

&&typeof record.hasProof==="boolean"

&&validCount(record.revision)

&&validTime(record.createdAtMs)

&&(record.receiptId===null

||validId(record.receiptId));

}

function clearProof(){

if(proofUrl){

URL.revokeObjectURL(proofUrl);

proofUrl=null;

}

$("proofImage").removeAttribute("src");

$("proofImage").hidden=true;

}

function renderReview(){

const container=$("reviewDetails");

container.replaceChildren();

$("reviewPanel").hidden=

!selectedPayment||!isOwner();

if(!selectedPayment||!isOwner())return;

addLine(container,"paymentId",

selectedPayment.paymentId);

addLine(container,"driverName",

selectedPayment.driverName);

addLine(container,"driverId",

selectedPayment.driverId);

addLine(container,"amount",

money(selectedPayment.amountCents));

addLine(container,"reference",

selectedPayment.reference);

addLine(container,"paymentStatus",

t(selectedPayment.status));

$("viewProof").hidden=!selectedPayment.hasProof;

}

function openReview(record){

if(!isOwner()||busy||mutationBusy

||record.status!=="pending")return;

clearProof();

selectedPayment=record;

$("reviewDecision").value="approved";

$("reviewReason").value="";

$("bankTransaction").value="";

$("reviewConsent").checked=false;

renderReview();

updateControls();

$("reviewPanel").scrollIntoView({

behavior:"smooth"

});

}

function closeReview(){

clearProof();

selectedPayment=null;

$("reviewReason").value="";

$("bankTransaction").value="";

$("reviewConsent").checked=false;

renderReview();

updateControls();

}

$("closeReview").onclick=closeReview;

$("viewProof").onclick=async()=>{

if(!selectedPayment||!selectedPayment.hasProof)return;

const paymentId=selectedPayment.paymentId;

await runRead(async()=>{

clearProof();

const response=requireSuccess(

await serverCall("getAdminCommissionPaymentProof",{

paymentId

})

);

if(response.paymentId!==paymentId

||!["image/jpeg","image/png","image/webp"]

.includes(response.contentType)

||typeof response.base64!=="string"

||response.base64.length>7000000

||!selectedPayment

||selectedPayment.paymentId!==paymentId){

throw new Error("Invalid proof");

}

const decoded=atob(response.base64);

if(decoded.length>5000000){

throw new Error("Proof too large");

}

const bytes=Uint8Array.from(

decoded,

character=>character.charCodeAt(0)

);

const blob=new Blob([bytes],{

type:response.contentType

});

proofUrl=URL.createObjectURL(blob);

$("proofImage").src=proofUrl;

$("proofImage").hidden=false;

});

};

$("submitReview").onclick=()=>{

if(!selectedPayment

||selectedPayment.status!=="pending"

||!$("reviewConsent").checked)return;

const decision=$("reviewDecision").value;

const reason=$("reviewReason").value.trim();

const bankTransactionId=

decision==="approved"

?$("bankTransaction").value.trim()

:null;

if(!["approved","rejected"].includes(decision)

||reason.length<10

||reason.length>500

||(decision==="approved"

&&(!bankTransactionId

||bankTransactionId.length<3

||bankTransactionId.length>150))){

actionResult("invalid");

return;

}

const paymentId=selectedPayment.paymentId;

const expectedRevision=selectedPayment.revision;

runMutation(

"reviewAdminCommissionPayment",

{

paymentId,

expectedRevision,

decision,

reason,

bankTransactionId

},

async response=>{

if(!validPayment(response.payment)

||response.payment.paymentId!==paymentId

||response.payment.status!==decision

||response.payment.revision<=expectedRevision

||(decision==="approved"

&&!response.payment.receiptId)){

throw new Error("Review not confirmed");

}

payments=payments.map(record=>

record.paymentId===paymentId

?response.payment

:record

);

if(paymentQuery?.status!=="all"){

payments=payments.filter(record=>

record.status===paymentQuery?.status

);

}

closeReview();

renderPayments();

drivers=[];

driverCursor=null;

driverQuery=null;

selectedDriver=null;

ledger=[];

ledgerCursor=null;

renderDrivers();

renderDriverDetails();

overview=null;

renderOverview();

actionResult("saved");

try{

await loadOverview(true);

}catch(e){

result("error");

}

}

);

};

&&validText(record.reason,500)

&&validTime(record.createdAtMs)

&&(record.driverId===null

||validId(record.driverId))

&&(record.paymentId===null

||validId(record.paymentId))

&&(record.amountCents===null

||validAmount(record.amountCents));

}

function clearSession(){

generation++;

authorized=false;

ownerUid=null;

busy=false;

mutationBusy=false;

overview=null;

settings=null;

lastSync=null;

drivers=[];

payments=[];

ledger=[];

historyRecords=[];

driverCursor=null;

paymentCursor=null;

ledgerCursor=null;

historyCursor=null;

selectedDriver=null;

selectedPayment=null;

driverQuery=null;

paymentQuery=null;

pendingMutation=null;

dirty=false;

clearProof();

$("adminContent").hidden=true;

$("accessPanel").hidden=true;

$("driverDetailsPanel").hidden=true;

$("reviewPanel").hidden=true;

[

"driverSearch",
"deadlineDays",
"settingsReason",
"reviewReason",
"bankTransaction"

].forEach(id=>{

$(id).value="";

});

$("settingsConsent").checked=false;

$("reviewConsent").checked=false;

result("");

actionResult("");

renderOverview();

renderDrivers();

renderDriverDetails();

renderPayments();

renderReview();

renderHistory();

updateControls();

}

function denyAccess(){

clearSession();

$("accessPanel").hidden=false;

status("denied");

}

async function verifyOwner(user){

clearSession();

const currentGeneration=generation;

if(!user){

denyAccess();

return;

}

if(!navigator.onLine){

status("offline");

return;

}

status("checking");

try{

const appToken=await getToken(appCheck,false);

if(!appToken?.token){

throw new Error("App Check failed");

}

const token=await user.getIdTokenResult(true);

if(token.claims.ownerAdmin!==true

||token.claims.email_verified!==true

||token.signInProvider!=="google.com"){

throw new Error("Access denied");

}

const response=await httpsCallable(

functions,

"verifyOwnerAdmin",

{timeout:15000}

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid)return;

if(!validOwner(response.data,user.uid)){

throw new Error("Owner verification failed");

}

ownerUid=user.uid;

authorized=true;

$("adminContent").hidden=false;

status("verified");

await runRead(()=>loadOverview(false));

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}

}

async function initializeSecurity(){

try{

const app=initializeApp(

firebaseConfig,

"myride-owner-admin"

);

appCheck=initializeAppCheck(app,{

provider:new ReCaptchaEnterpriseProvider(

"6LchbTEuAAAAAGB1TGOyiRljtmY9oxMhBpo2dBAa"

),

isTokenAutoRefreshEnabled:true

});

auth=getAuth(app);

functions=getFunctions(app);

await setPersistence(

auth,

browserSessionPersistence

);

onAuthStateChanged(auth,verifyOwner);

}catch(e){

denyAccess();

}

}

let checking=false;

setInterval(async()=>{

if(!isOwner()||checking||mutationBusy)return;

const currentGeneration=generation;

checking=true;

try{

const response=await serverCall(

"verifyOwnerAdmin"

);

if(!validOwner(response,ownerUid)){

throw new Error("Access revoked");

}

}catch(e){

if(currentGeneration===generation){

denyAccess();

}

}finally{

checking=false;

}

},60000);

setInterval(()=>{

if(!isOwner()

||busy

||mutationBusy

||document.hidden)return;

runRead(()=>loadOverview(true));

},60000);

window.addEventListener("offline",()=>{

clearSession();

status("offline");

});

window.addEventListener("online",()=>{

if(auth){

verifyOwner(auth.currentUser);

}

});

window.addEventListener("beforeunload",event=>{

if(dirty||mutationBusy||pendingMutation){

event.preventDefault();

event.returnValue="";

}

});

window.addEventListener(

"pagehide",

clearSession

);

window.addEventListener("pageshow",event=>{

if(event.persisted&&auth){

verifyOwner(auth.currentUser);

}

});

renderLanguage();

updateControls();

initializeSecurity();

</script>

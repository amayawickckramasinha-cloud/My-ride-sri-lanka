<style>

*{box-sizing:border-box}

body{
margin:0;
background:#111;
color:#fff;

}

main{
max-width:650px;
margin:auto;
padding:18px;
}

h1{
color:#FFD600;
font-size:36px;
text-align:center;
margin-bottom:5px;
}

.country{
color:#FFD600;
text-align:center;
letter-spacing:5px;
}

h2{
text-align:center;
line-height:1.7;
}

.panel{
background:#202020;
border:1px solid #444;
border-radius:14px;
padding:18px;
margin:15px 0;
}

.incomePanel{
text-align:center;
border-color:#FFD600;
}

.tabs{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin:20px 0;
}

.tabs button{
background:#292929;
color:#FFD600;
border:1px solid #FFD600;
padding:12px 4px;
font-size:13px;
border-radius:8px;
cursor:pointer;
}

.tabs button.selected{
background:#FFD600;
color:#111;
}

.label{
color:#CCC;
font-size:14px;
line-height:1.8;
}

.amount{
font-size:30px;
font-weight:bold;
margin:12px 0;
overflow-wrap:anywhere;
}

.yellow{color:#FFD600}
.green{color:#4ADE80}
.red{color:#FF6464}

hr{
border:0;
border-top:1px solid #444;
margin:20px 0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.stat{
background:#202020;
border:1px solid #444;
border-radius:12px;
padding:16px;
}

.statValue{
font-size:23px;
font-weight:bold;
color:#FFD600;
margin-top:10px;
overflow-wrap:anywhere;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
padding:14px 0;
border-bottom:1px solid #444;
}

.row strong{
text-align:right;
overflow-wrap:anywhere;
}

.action{
display:block;
width:100%;
padding:15px;
margin:12px 0;
background:#FFD600;
color:#111;
border:0;
border-radius:9px;
font-size:16px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
}

.secondary{
background:transparent;
color:#FFD600;
border:1px solid #FFD600;
}

.note{
font-size:13px;
color:#BBB;
line-height:1.8;
}

#status{
color:#FFD600;
text-align:center;
line-height:1.8;
}

#periodText{

color:#CCC;

#driverBar{
background:#22C55E;
width:0;
}

#commissionBar{
background:#EF4444;
width:0;
}

footer{
text-align:center;
font-size:12px;
color:#AAA;
padding:25px;

button:disabled{
opacity:.5;
cursor:not-allowed;
}

[hidden]{
display:none!important;

async function serverCall(name,data={}){

if(!validSession()){

throw new Error("Unauthorized");

}

const currentGeneration=generation;

const response=await httpsCallable(

functions,name

)(data);

if(!validSession()

||generation!==currentGeneration){

throw new Error("Session changed");

}

return response.data;

}

// SERVER TIME

async function syncClock(){

const started=Date.now();

const result=await serverCall(

"getDriverServerTime"

);

const ended=Date.now();

if(!Number.isFinite(result?.serverTimeMs)

||ended-started>10000){

throw new Error("Server time unavailable");

}

serverOffset=

result.serverTimeMs-(started+ended)/2;

clockCheckedAt=ended;

}

function clockValid(){

return clockCheckedAt>0

&&Date.now()-clockCheckedAt<120000;

}

// SRI LANKA DATE SYSTEM

function sriLankaDate(){

const time=

Date.now()+serverOffset

+330*60000;

return new Date(time);

}

function dateKey(date){

return date.toISOString().slice(0,10);

}

function periodInfo(){

const now=sriLankaDate();

const day=new Date(Date.UTC(

now.getUTCFullYear(),

now.getUTCMonth(),

now.getUTCDate()

));

if(selectedPeriod==="day"){

const key=dateKey(day);

return{

id:"day_"+key,

label:key

};

}

if(selectedPeriod==="week"){

const monday=new Date(day);

const offset=

(monday.getUTCDay()+6)%7;

monday.setUTCDate(

monday.getUTCDate()-offset

);

const sunday=new Date(monday);

sunday.setUTCDate(

sunday.getUTCDate()+6

);

return{

id:"week_"+dateKey(monday),

label:dateKey(monday)

+" — "+dateKey(sunday)

};

}

if(selectedPeriod==="month"){

const key=dateKey(day).slice(0,7);

return{

id:"month_"+key,

label:key

};

}

return{

id:"all",

label:t.allTime

};

}

// CLEAR INCOME INFORMATION

const reportFields=[

"grossIncome",

"commission",

"netIncome",

"completedRides",

"distance",

"duration",

"averageIncome",

"cash",

"bank",

"totalReceived",

"outstanding",

"tollParking",

"totalCommission",

"paidCommission",

"unpaidCommission"

];

function clearIncome(){

reportFields.forEach(id=>{

$(id).textContent="—";

});

$("updatedAt").textContent="";

$("driverBar").style.width="0%";

$("commissionBar").style.width="0%";

}

function stopIncomeListener(){

reportGeneration++;

if(incomeUnsubscribe){

incomeUnsubscribe();

incomeUnsubscribe=null;

}

activeReportKey=null;

clearIncome();

}

// GPS CONTINUITY

function validPosition(position){

const c=position.coords;

return Number.isFinite(c.latitude)

&&Number.isFinite(c.longitude)

&&Number.isFinite(c.accuracy)

&&c.latitude>=5.85

&&c.latitude<=9.9

&&c.longitude>=79.5

&&c.longitude<=82

&&c.accuracy>=0

&&c.accuracy<=100

&&Date.now()-position.timestamp<30000

&&position.timestamp<=Date.now()+5000;

}

function startGps(){

if(gpsWatch!==null

||!navigator.geolocation

||!validSession())return;

gpsWatch=navigator.geolocation.watchPosition(

async position=>{

if(!validSession()

||!driver

||!["online","busy"].includes(

driver.availability

)

||!validPosition(position)

||gpsSending

||Date.now()-lastGpsSent<10000){

return;

}

gpsSending=true;

lastGpsSent=Date.now();

try{

await serverCall(

"updateDriverLocation",

{

lat:position.coords.latitude,

lon:position.coords.longitude,

accuracy:position.coords.accuracy,

capturedAtMs:position.timestamp

}

);

}catch(e){

// Server must expire stale GPS data.

}finally{

gpsSending=false;

}

},

()=>{},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

);

}

function stopGps(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(gpsWatch);

gpsWatch=null;

}

}

// DISCONNECT SESSION

function disconnect(){

generation++;

authorized=false;

uid=null;

driver=null;

clockCheckedAt=0;

if(driverUnsubscribe){

driverUnsubscribe();

driverUnsubscribe=null;

}

stopIncomeListener();

stopGps();

$("driverName").textContent="—";

$("driverId").textContent="—";

$("periodText").textContent="—";

$("content").hidden=true;

}

function denyAccess(){

disconnect();

$("accessPanel").hidden=false;

status(t.denied);

}

// REPORT VALIDATION

function validReport(data,reportId){

if(!data

||data.driverUid!==uid

||data.periodKey!==reportId){

return false;

}

const fields=[

"grossIncome",

"commission",

"netIncome",

"completedRides",

"distanceKm",

"durationSeconds",

"cashReceived",

"bankReceived",

"outstandingPayments",

"tollParking",

"paidCommission",

"unpaidCommission"

];

if(!fields.every(key=>number(data[key]))){

return false;

}

if(!Number.isInteger(data.completedRides)){

return false;

}

if(Math.abs(

data.grossIncome

-data.commission

-data.netIncome

)>0.02){

return false;

}

if(Math.abs(

data.commission

-data.paidCommission

-data.unpaidCommission

)>0.02){

return false;

}

if(Math.abs(

data.grossIncome

+data.tollParking

-data.cashReceived

-data.bankReceived

-data.outstandingPayments

)>0.02){

return false;

}

const updated=data.updatedAt?.toMillis?.();

if(!Number.isFinite(updated)

||updated>Date.now()+serverOffset+30000){

return false;

}

return true;

}

// DISPLAY INCOME REPORT

function displayReport(data){

$("grossIncome").textContent=

money(data.grossIncome);

$("commission").textContent=

money(data.commission);

$("netIncome").textContent=

money(data.netIncome);

$("completedRides").textContent=

data.completedRides.toLocaleString();

$("distance").textContent=

data.distanceKm.toFixed(2)+" KM";

const hours=Math.floor(

data.durationSeconds/3600

);

const minutes=Math.floor(

(data.durationSeconds%3600)/60

);

$("duration").textContent=

hours+"h "+minutes+"m";

const average=

data.completedRides>0

?data.netIncome/data.completedRides

:0;

$("averageIncome").textContent=

money(average);

$("cash").textContent=

money(data.cashReceived);

$("bank").textContent=

money(data.bankReceived);

$("totalReceived").textContent=

money(

data.cashReceived+data.bankReceived

);

$("outstanding").textContent=

money(data.outstandingPayments);

$("tollParking").textContent=

money(data.tollParking);

$("totalCommission").textContent=

money(data.commission);

$("paidCommission").textContent=

money(data.paidCommission);

$("unpaidCommission").textContent=

money(data.unpaidCommission);

const commissionPercent=

data.grossIncome>0

?data.commission/data.grossIncome*100

:0;

const driverPercent=

data.grossIncome>0

?data.netIncome/data.grossIncome*100

:0;

$("driverBar").style.width=

driverPercent+"%";

$("commissionBar").style.width=

commissionPercent+"%";

const updated=

data.updatedAt.toMillis();

$("updatedAt").textContent=

t.updated+": "+

new Intl.DateTimeFormat(

"en-GB",

{

timeZone:"Asia/Colombo",

dateStyle:"medium",

timeStyle:"short"

}

).format(new Date(updated));

status("");

}

// LIVE FIRESTORE INCOME REPORT

function subscribeIncome(){

stopIncomeListener();

if(!validSession()||!driver)return;

if(!clockValid()){

status(t.loading);

return;

}

const period=periodInfo();

activeReportKey=period.id;

$("periodText").textContent=

period.label;

status(t.loading);

const currentGeneration=generation;

const currentReportGeneration=

reportGeneration;

const ref=doc(

db,

"drivers",

uid,

"incomeReports",

period.id

);

incomeUnsubscribe=onSnapshot(

ref,

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||currentReportGeneration!==reportGeneration

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

clearIncome();

status(t.loading);

return;

}

if(!snapshot.exists()){

clearIncome();

status(t.noData);

return;

}

const data=snapshot.data();

if(!validReport(data,period.id)){

clearIncome();

status(t.error);

return;

}

displayReport(data);

},

error=>{

if(currentGeneration!==generation

||currentReportGeneration!==reportGeneration){

return;

}

clearIncome();

status(t.error);

}

);

}

// SELECT REPORT PERIOD

function updateTabs(){

document.querySelectorAll("[data-period]")

.forEach(button=>{

const selected=

button.dataset.period===selectedPeriod;

button.classList.toggle(

"selected",

selected

);

button.setAttribute(

"aria-pressed",

String(selected)

);

});

}

document.querySelectorAll("[data-period]")

.forEach(button=>{

button.onclick=()=>{

if(!validSession()||!driver)return;

const period=button.dataset.period;

if(!["day","week","month","all"]

.includes(period))return;

selectedPeriod=period;

updateTabs();

subscribeIncome();

};

});

updateTabs();

// LIVE DRIVER STATUS

function subscribeDriver(){

const currentGeneration=generation;

driverUnsubscribe=onSnapshot(

doc(db,"drivers",uid),

{includeMetadataChanges:true},

snapshot=>{

if(currentGeneration!==generation

||!validSession())return;

if(snapshot.metadata.fromCache

||snapshot.metadata.hasPendingWrites){

driver=null;

stopIncomeListener();

stopGps();

$("content").hidden=true;

status(t.checking);

return;

}

const data=snapshot.data();

if(!snapshot.exists()

||data.uid!==uid

||data.status!=="approved"

||data.activationComplete!==true

||data.documentsValid!==true){

denyAccess();

return;

}

driver=data;

$("driverName").textContent=

typeof data.fullName==="string"

?data.fullName:"—";

$("driverId").textContent=

typeof data.driverId==="string"

?data.driverId:"—";

$("content").hidden=false;

$("accessPanel").hidden=true;

if(["online","busy"].includes(

data.availability

)){

startGps();

}else{

stopGps();

}

if(!incomeUnsubscribe){

subscribeIncome();

}

},

error=>{

if(currentGeneration!==generation)return;

denyAccess();

}

);

}

// DRIVER AUTHORIZATION

async function verifyDriver(user){

disconnect();

const currentGeneration=generation;

if(!user||!functions||!db){

denyAccess();

return;

}

if(!navigator.onLine){

status(t.offline);

return;

}

status(t.checking);

try{

const token=await user.getIdTokenResult(true);

if(token.claims.driver!==true

||token.signInProvider!=="custom"){

throw new Error("Driver login required");

}

const response=await httpsCallable(

functions,

"verifyDriverSession"

)({});

if(currentGeneration!==generation

||auth.currentUser?.uid!==user.uid){

return;

}

const account=response.data;

if(account?.authorized!==true

||account.uid!==user.uid

||account.status!=="approved"

||account.activationComplete!==true

||account.documentsValid!==true){

throw new Error("Access denied");

}

authorized=true;

uid=user.uid;

$("accessPanel").hidden=true;

await syncClock();

if(currentGeneration!==generation)return;

subscribeDriver();

}catch(e){

if(currentGeneration!==generation)return;

denyAccess();

}

}

if(auth){

onAuthStateChanged(auth,verifyDriver);

}

// AUTOMATIC DATE AND REPORT UPDATE

setInterval(async()=>{

if(!validSession()||!driver)return;

const currentGeneration=generation;

try{

await syncClock();

if(currentGeneration!==generation

||!validSession())return;

const period=periodInfo();

if(activeReportKey!==period.id

||!incomeUnsubscribe){

subscribeIncome();

}

}catch(e){

if(currentGeneration!==generation)return;

clockCheckedAt=0;

stopIncomeListener();

status(t.error);

}

},60000);

// REFRESH BUTTON

$("refreshButton").onclick=()=>{

if(auth){

verifyDriver(auth.currentUser);

}

};

// INTERNET CONNECTION

window.addEventListener("offline",()=>{

disconnect();

status(t.offline);

});

window.addEventListener("online",()=>{

if(auth){

verifyDriver(auth.currentUser);

}

});

// PAGE LIFECYCLE

window.addEventListener(

"pagehide",

disconnect

);

window.addEventListener(

"pageshow",

event=>{

if(event.persisted&&auth){

verifyDriver(auth.currentUser);

}

}

);

</script>
